          </div>
        )}
      </div>

      {/* Add new location form */}
      {isAdmin&&xdropAddMode&&(
        <div style={{background:"#f5f3ff",border:"1px solid #ddd6fe",borderRadius:"10px",padding:"14px",marginBottom:"16px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:"#5b21b6",marginBottom:"10px"}}>New Partner Location</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"8px"}}>
            <input placeholder="City / Name (e.g. Jacksonville, FL)" value={xdropNewVal.city} onChange={e=>setXdropNewVal(v=>({...v,city:e.target.value}))} style={{border:"1px solid #ddd6fe",borderRadius:"6px",padding:"7px 10px",fontSize:"12px",outline:"none",fontFamily:"inherit"}}/>
            <input placeholder="Contact (name / phone)" value={xdropNewVal.contact} onChange={e=>setXdropNewVal(v=>({...v,contact:e.target.value}))} style={{border:"1px solid #ddd6fe",borderRadius:"6px",padding:"7px 10px",fontSize:"12px",outline:"none",fontFamily:"inherit"}}/>
            <input placeholder="Address" value={xdropNewVal.addr} onChange={e=>setXdropNewVal(v=>({...v,addr:e.target.value}))} style={{border:"1px solid #ddd6fe",borderRadius:"6px",padding:"7px 10px",fontSize:"12px",outline:"none",fontFamily:"inherit",gridColumn:"1/-1"}}/>
            <input placeholder="Pricing (e.g. $10/pallet, $100 afterhours)" value={xdropNewVal.price} onChange={e=>setXdropNewVal(v=>({...v,price:e.target.value}))} style={{border:"1px solid #ddd6fe",borderRadius:"6px",padding:"7px 10px",fontSize:"12px",outline:"none",fontFamily:"inherit",gridColumn:"1/-1"}}/>
          </div>
          <div style={{display:"flex",gap:"6px"}}>
            <button onClick={()=>{if(!xdropNewVal.city.trim())return;saveXdropPartners([...xdropPartners,{...xdropNewVal}]);setXdropAddMode(false);setXdropNewVal({city:"",addr:"",contact:"",price:""}); }} style={{background:"#7c3aed",color:"#fff",border:"none",borderRadius:"6px",padding:"6px 16px",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>Save</button>
            <button onClick={()=>{setXdropAddMode(false);setXdropNewVal({city:"",addr:"",contact:"",price:""});}} style={{background:"transparent",color:"#64748b",border:"1px solid #e2e8f0",borderRadius:"6px",padding:"6px 12px",fontSize:"12px",cursor:"pointer"}}>Cancel</button>
          </div>
        </div>
      )}

      {/* Locations grid */}
      {xdropPartners.length===0&&(
        <div style={{textAlign:"center",padding:"40px",color:"#9ca3af",fontSize:"13px",border:"2px dashed #e2e8f0",borderRadius:"10px"}}>No partner locations yet. Click + Add Location to get started.</div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:"10px"}}>
        {xdropPartners.map((x,i)=>(
          <div key={i} style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:"10px",padding:"12px 14px",position:"relative"}}>
            {xdropEditIdx===i?(
              <div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px",marginBottom:"8px"}}>
                  <input value={xdropEditVal.city} onChange={e=>setXdropEditVal(v=>({...v,city:e.target.value}))} placeholder="City / Name" style={{border:"1px solid #c4b5fd",borderRadius:"5px",padding:"5px 8px",fontSize:"12px",outline:"none",fontFamily:"inherit"}}/>
                  <input value={xdropEditVal.contact} onChange={e=>setXdropEditVal(v=>({...v,contact:e.target.value}))} placeholder="Contact" style={{border:"1px solid #c4b5fd",borderRadius:"5px",padding:"5px 8px",fontSize:"12px",outline:"none",fontFamily:"inherit"}}/>
                  <input value={xdropEditVal.addr} onChange={e=>setXdropEditVal(v=>({...v,addr:e.target.value}))} placeholder="Address" style={{border:"1px solid #c4b5fd",borderRadius:"5px",padding:"5px 8px",fontSize:"12px",outline:"none",fontFamily:"inherit",gridColumn:"1/-1"}}/>
                  <input value={xdropEditVal.price} onChange={e=>setXdropEditVal(v=>({...v,price:e.target.value}))} placeholder="Pricing" style={{border:"1px solid #c4b5fd",borderRadius:"5px",padding:"5px 8px",fontSize:"12px",outline:"none",fontFamily:"inherit",gridColumn:"1/-1"}}/>
                </div>
                <div style={{display:"flex",gap:"6px"}}>
                  <button onClick={()=>{const next=[...xdropPartners];next[i]={...xdropEditVal};saveXdropPartners(next);setXdropEditIdx(null);}} style={{background:"#7c3aed",color:"#fff",border:"none",borderRadius:"5px",padding:"4px 12px",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>Save</button>
                  <button onClick={()=>setXdropEditIdx(null)} style={{background:"transparent",color:"#64748b",border:"1px solid #e2e8f0",borderRadius:"5px",padding:"4px 10px",fontSize:"11px",cursor:"pointer"}}>Cancel</button>
                </div>
              </div>
            ):(
              <>
                <div style={{fontWeight:"700",color:"#1a2e50",fontSize:"13px",marginBottom:"4px",paddingRight:isAdmin?"52px":"0"}}>{x.city}</div>
                <div style={{color:"#475569",fontSize:"11px",marginBottom:"3px"}}>{x.addr}</div>
                <div style={{color:"#059669",fontWeight:"600",fontSize:"11px"}}>{x.contact}</div>
                {x.price&&<div style={{color:"#d97706",fontWeight:"600",fontSize:"10px",marginTop:"3px"}}>{x.price}</div>}
                {isAdmin&&(
                  <div style={{position:"absolute",top:"10px",right:"10px",display:"flex",gap:"4px"}}>
                    <button onClick={()=>{setXdropEditIdx(i);setXdropEditVal({...x});}} style={{background:"transparent",color:"#7c3aed",border:"1px solid #ddd6fe",borderRadius:"4px",padding:"2px 7px",fontSize:"10px",fontWeight:"600",cursor:"pointer"}}>Edit</button>
                    <button onClick={()=>{if(window.confirm("Remove "+x.city+"?"))saveXdropPartners(xdropPartners.filter((_,j)=>j!==i));}} style={{background:"transparent",color:"#ef4444",border:"1px solid #fecaca",borderRadius:"4px",padding:"2px 6px",fontSize:"10px",cursor:"pointer"}}>✕</button>
                  </div>
                )}
              </>
            )}
          </div>
        ))}
      </div>
    </div>
  )}

    {/* ARCHIVE TAB */}
    {activeTab==="archive"&&isAdmin&&(<div style={{background:"#fff",border:"1px solid #d1d5db",borderTop:"none",borderRadius:"0 0 8px 8px",padding:"20px"}}><div style={{fontWeight:"700",fontSize:"14px",color:"#4c1d95",marginBottom:"4px"}}>📦 Archived Weeks</div><div style={{fontSize:"11px",color:"#64748b",marginBottom:"14px"}}>Weeks moved here from the main board.</div>{archivedWeeks.length===0?<div style={{textAlign:"center",padding:"40px",color:"#94a3b8",fontSize:"12px",border:"2px dashed #e2e8f0",borderRadius:"8px"}}>No archived weeks yet. Click 📦 on a week tab to archive it.</div>:archivedWeeks.map((w,i)=>(<div key={i} style={{border:"1px solid #e9d5ff",borderRadius:"10px",padding:"14px",marginBottom:"12px",background:"#faf5ff"}}><div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px"}}><span style={{fontWeight:"700",fontSize:"13px",color:"#4c1d95",flex:1}}>{w.label}</span><span style={{fontSize:"10px",color:"#94a3b8"}}>{w.archivedAt}</span><button onClick={()=>{if(!confirm("Restore?"))return;restoreArchivedWeek(i);setActiveTab("weeks");}} style={{background:"#eff6ff",color:"#2563eb",border:"1px solid #bfdbfe",borderRadius:"6px",padding:"4px 10px",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>Restore</button><button onClick={()=>{if(!confirm("Permanently delete?"))return;deleteArchivedWeek(i);}} style={{background:"#fee2e2",color:"#dc2626",border:"1px solid #fca5a5",borderRadius:"6px",padding:"4px 10px",fontSize:"11px",fontWeight:"600",cursor:"pointer"}}>Delete</button></div><div style={{display:"flex",gap:"12px",flexWrap:"wrap",fontSize:"11px",color:"#6b7280"}}><span>{(w.groups||[]).length} trailers</span><span>{(w.groups||[]).flatMap(g=>g.loads||[]).length} loads</span><span style={{fontWeight:"700",color:"#059669"}}>${(w.groups||[]).flatMap(g=>g.loads||[]).reduce((s,l)=>s+(parseFloat(l.rate)||0),0).toLocaleString()} gross</span></div></div>))}</div>)}

    {/* INSIGHTS TAB */}
    {activeTab==="insights"&&isAdmin&&(
      <div style={{background:"#fff",border:"1px solid #d1d5db",borderTop:"none",borderRadius:"0 0 8px 8px",padding:"0"}}>
        {/* Sub-tab navigation */}
        <div style={{display:"flex",borderBottom:"1px solid #e2e8f0",background:"#f8fafc"}}>
          {[
            {id:"shippers",label:"📍 Shippers",color:"#059669"},
            {id:"brokers", label:"🏢 Brokers", color:"#7c3aed"},
            {id:"receivers",label:"📦 Receivers",color:"#0891b2"}
          ].map(t=>(
            <button key={t.id} onClick={()=>setInsightsTab(t.id)}
              style={{flex:1,padding:"12px 16px",background:insightsTab===t.id?"#fff":"transparent",color:insightsTab===t.id?t.color:"#64748b",border:"none",borderBottom:insightsTab===t.id?`3px solid ${t.color}`:"3px solid transparent",fontSize:"13px",fontWeight:"700",cursor:"pointer"}}>{t.label}</button>
          ))}
        </div>

        {/* ─────────────── SHIPPER DIRECTORY ─────────────── */}
        {insightsTab==="shippers"&&(()=>{
          // Aggregate: for each unique shipper address, collect stats across allTimeWeeks.
          // Key = shipper street address (primary) — falls back to "City, ST (no address)" when missing.
          // Combined = trailer with 2+ loads. Single = trailer with 1 load.
          const shippers={};
          allTimeWeeks.forEach((w,wIdx)=>{
            // Live week = first `weeks.length` entries; the rest are archived
            const isLive=wIdx<weeks.length;
            (w.groups||[]).forEach(g=>{
              const isCombined=(g.loads||[]).length>=2;
              (g.loads||[]).forEach(l=>{
                const sr=parseSR(l.sr||"");
                const addr=(l.shipperAddr||"").trim();
                // Build key: prefer address. If missing, use city+state with a tag so user knows to fill.
                const key=addr?addr:(sr.s?sr.s+" (no address)":null);
                if(!key)return;
                if(!shippers[key]){
                  shippers[key]={
                    addr:addr,
                    city:sr.s||"",
                    company:l.shipperCo||"",
                    combined:0,
                    single:0,
                    totalLoads:0,
                    totalRate:0,
                    pallets:[],
                    receiverStates:{},
                    hasAddress:!!addr,
                    members:[]  // {gid, lid, broker, pickup, rate, isLive} — used by no-addr buckets
                  };
                }
                const s=shippers[key];
                if(isCombined)s.combined++;else s.single++;
                s.totalLoads++;
                const rate=parseFloat(l.rate)||0;
                if(rate>0)s.totalRate+=rate;
                const p=parseInt(l.pallets,10);
                if(p>0&&p<=100)s.pallets.push(p);
                const rState=(sr.r||"").split(",").map(x=>x.trim()).pop();
                if(rState&&rState.length===2){s.receiverStates[rState]=(s.receiverStates[rState]||0)+1;}
                if(!s.company&&l.shipperCo)s.company=l.shipperCo;
                s.members.push({gid:g.id,lid:l.id,broker:l.broker||"",pickup:l.pickup||"",rate:rate,isLive,weekLabel:w.label||""});
              });
            });
          });
          const fullList=Object.entries(shippers).sort((a,b)=>{
            // Shippers WITHOUT an address sink to the bottom of the list
            if(a[1].hasAddress!==b[1].hasAddress)return a[1].hasAddress?-1:1;
            return b[1].totalLoads-a[1].totalLoads;
          });
          if(!fullList.length)return(<div style={{padding:"40px 20px",textAlign:"center",color:"#94a3b8",fontSize:"13px"}}>No shipper data yet. Drop rate-cons onto loads to start tracking.</div>);
          // Live filter — matches address, city, or company name (case-insensitive substring)
          const searchTerm=shipperSearch.trim().toLowerCase();
          const list=searchTerm
            ? fullList.filter(([key,s])=>{
                if(key.toLowerCase().includes(searchTerm))return true;
                if(s.addr&&s.addr.toLowerCase().includes(searchTerm))return true;
                if(s.city&&s.city.toLowerCase().includes(searchTerm))return true;
                if(s.company&&s.company.toLowerCase().includes(searchTerm))return true;
                return false;
              })
            : fullList;
          return(
            <div style={{padding:"20px"}}>
              {/* Search + summary line */}
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"12px",marginBottom:"16px",flexWrap:"wrap"}}>
                <div style={{position:"relative",flex:"1 1 240px",maxWidth:"380px"}}>
                  <input
                    type="text"
                    value={shipperSearch}
                    onChange={e=>setShipperSearch(e.target.value)}
                    placeholder="🔍 Search by address, city, or company..."
                    style={{width:"100%",padding:"8px 32px 8px 12px",border:"1px solid #cbd5e1",borderRadius:"6px",fontSize:"12px",fontFamily:"inherit",outline:"none"}}
                  />
                  {shipperSearch&&<button onClick={()=>setShipperSearch("")}
                    title="Clear search"
                    style={{position:"absolute",right:"6px",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#94a3b8",cursor:"pointer",fontSize:"14px",padding:"0 4px",lineHeight:1}}>×</button>}
                </div>
                <div style={{fontSize:"12px",color:"#64748b"}}>
                  {searchTerm
                    ? <><strong>{list.length}</strong> of <strong>{fullList.length}</strong> shipper{fullList.length===1?"":"s"} match</>
                    : <><strong>{fullList.length}</strong> unique shipper{fullList.length===1?"":"s"} across <strong>{fullList.reduce((s,[,v])=>s+v.totalLoads,0)}</strong> loads</>
                  }
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:"4px"}}>
                {/* Column header for the collapsed rows */}
                <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) 70px 70px 80px 24px",gap:"12px",padding:"6px 12px",fontSize:"9px",fontWeight:"700",color:"#94a3b8",textTransform:"uppercase",letterSpacing:".06em",borderBottom:"1px solid #e2e8f0"}}>
                  <span>Shipper address · city</span>
                  <span style={{textAlign:"center"}}>Combined</span>
                  <span style={{textAlign:"center"}}>Single</span>
                  <span style={{textAlign:"center"}}>Combine %</span>
                  <span/>
                </div>
                {list.length===0&&(<div style={{padding:"30px",textAlign:"center",color:"#94a3b8",fontSize:"12px"}}>No shippers match "{shipperSearch}"</div>)}
                {list.map(([key,s],idx)=>{
                  const total=s.totalLoads;
                  const combinePct=total>0?Math.round(s.combined/total*100):0;
                  const avgRate=total>0?Math.round(s.totalRate/total):0;
                  const isExp=expandedShipper===key;
                  const pallets=s.pallets.slice().sort((a,b)=>a-b);
                  // Divider where the "missing address" section begins (only when
                  // there are addressed shippers above it)
                  const prev=idx>0?list[idx-1][1]:null;
                  const showNoAddrDivider=!s.hasAddress&&prev&&prev.hasAddress;
                  const palletMin=pallets[0]||0;
                  const palletMax=pallets[pallets.length-1]||0;
                  const palletAvg=pallets.length>0?Math.round(pallets.reduce((a,b)=>a+b,0)/pallets.length):0;
                  const buckets={"1-5":0,"6-10":0,"11-15":0,"16-20":0,"21+":0};
                  pallets.forEach(p=>{
                    if(p<=5)buckets["1-5"]++;
                    else if(p<=10)buckets["6-10"]++;
                    else if(p<=15)buckets["11-15"]++;
                    else if(p<=20)buckets["16-20"]++;
                    else buckets["21+"]++;
                  });
                  const topStates=Object.entries(s.receiverStates).sort((a,b)=>b[1]-a[1]).slice(0,5);
                  // Combine % color: green if mostly combined, red if mostly single, amber in middle
                  const pctColor=combinePct>=60?"#059669":combinePct>=30?"#b45309":"#b91c1c";
                  return(
                    <Fragment key={key}>
                    {showNoAddrDivider&&(
                      <div style={{display:"flex",alignItems:"center",gap:"8px",padding:"10px 4px 4px"}}>
                        <div style={{flex:1,borderTop:"1px dashed #fbbf24"}}/>
                        <span style={{fontSize:"9px",fontWeight:"700",color:"#b45309",textTransform:"uppercase",letterSpacing:".06em",whiteSpace:"nowrap"}}>⚠️ Missing address</span>
                        <div style={{flex:1,borderTop:"1px dashed #fbbf24"}}/>
                      </div>
                    )}
                    <div style={{background:"#fff",border:"1px solid #e2e8f0",borderLeft:s.hasAddress?"3px solid #059669":"3px solid #f59e0b",borderRadius:"6px",overflow:"hidden",boxShadow:isExp?"0 2px 6px rgba(0,0,0,.08)":"0 1px 2px rgba(0,0,0,.03)"}}>
                      {/* COLLAPSED ROW — click anywhere to toggle */}
                      <div onClick={()=>setExpandedShipper(isExp?null:key)} style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) 70px 70px 80px 24px",gap:"12px",padding:"9px 12px",alignItems:"center",cursor:"pointer",background:isExp?"#f8fafc":"transparent",transition:"background .1s"}}>
                        <div style={{minWidth:0,overflow:"hidden"}}>
                          <div style={{fontSize:"12px",fontWeight:"700",color:s.hasAddress?"#0f1f3d":"#b45309",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                            {s.hasAddress?<>📍 {s.addr}</>:<>⚠️ No address</>}
                          </div>
                          {s.city&&<div style={{fontSize:"10px",color:"#64748b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.city}{s.company?" · "+s.company:""}</div>}
                        </div>
                        <div style={{textAlign:"center",fontSize:"14px",fontWeight:"800",color:"#15803d"}}>{s.combined}</div>
                        <div style={{textAlign:"center",fontSize:"14px",fontWeight:"800",color:"#b91c1c"}}>{s.single}</div>
                        <div style={{textAlign:"center",fontSize:"14px",fontWeight:"800",color:pctColor}}>{combinePct}%</div>
                        <div style={{textAlign:"center",fontSize:"12px",color:"#94a3b8",transition:"transform .15s",transform:isExp?"rotate(180deg)":"rotate(0deg)"}}>▾</div>
                      </div>
                      {/* EXPANDED DETAIL */}
                      {isExp&&(
                        <div style={{padding:"12px 14px 14px",borderTop:"1px solid #e2e8f0",background:"#fafbfc"}}>
                          {/* No-address bucket: show member loads with fill buttons.
                              Editing only allowed on live-week loads. */}
                          {!s.hasAddress&&(
                            <div style={{marginBottom:"12px",background:"#fffbeb",border:"1px solid #fcd34d",borderRadius:"6px",padding:"10px 12px"}}>
                              <div style={{fontSize:"11px",fontWeight:"700",color:"#92400e",marginBottom:"8px"}}>
                                ⚠️ {s.members.length} load{s.members.length===1?"":"s"} in this group {s.members.length===1?"is":"are"} missing a shipper address.
                              </div>
                              <div style={{display:"flex",flexDirection:"column",gap:"4px",maxHeight:"200px",overflowY:"auto"}}>
                                {s.members.map((m,mi)=>(
                                  <div key={mi} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"8px",background:"#fff",border:"1px solid #fde68a",borderRadius:"4px",padding:"5px 8px",fontSize:"11px"}}>
                                    <div style={{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                                      <span style={{fontWeight:"600",color:"#0f1f3d"}}>{m.broker||"(no broker)"}</span>
                                      {m.pickup&&<span style={{color:"#64748b",marginLeft:"6px"}}>· PU {m.pickup}</span>}
                                      {!m.isLive&&<span style={{marginLeft:"6px",fontSize:"9px",color:"#94a3b8",fontWeight:"700"}}>(archived)</span>}
                                    </div>
                                    <button onClick={e=>{e.stopPropagation();setAddrEntryFor({gid:m.gid,lid:m.lid});}}
                                      style={{background:m.isLive?"#059669":"#7c3aed",color:"#fff",border:"none",borderRadius:"4px",padding:"3px 9px",fontSize:"10px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>+ Add address</button>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}
                          {/* Pallet distribution */}
                          {pallets.length>0&&(
                            <div style={{marginBottom:"12px"}}>
                              <div style={{fontSize:"10px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",marginBottom:"6px"}}>
                                Pallets · min {palletMin} / max {palletMax} / avg {palletAvg}
                              </div>
                              <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:"3px",fontSize:"9px"}}>
                                {Object.entries(buckets).map(([range,count])=>(
                                  <div key={range} style={{background:count>0?"#f1f5f9":"#fff",border:"1px solid #e2e8f0",borderRadius:"4px",padding:"4px 2px",textAlign:"center"}}>
                                    <div style={{fontWeight:"700",color:count>0?"#0f1f3d":"#cbd5e1"}}>{count}</div>
                                    <div style={{color:"#94a3b8"}}>{range}</div>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}
                          {/* Top destinations + avg rate */}
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"12px"}}>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:"9px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",marginBottom:"3px"}}>Top destinations</div>
                              {topStates.length>0?<div style={{display:"flex",flexWrap:"wrap",gap:"3px"}}>{topStates.map(([st,c])=>(<span key={st} style={{fontSize:"10px",background:"#f1f5f9",color:"#475569",padding:"2px 6px",borderRadius:"3px",fontWeight:"600"}}>{st} <span style={{color:"#94a3b8"}}>×{c}</span></span>))}</div>:<span style={{fontSize:"10px",color:"#cbd5e1"}}>—</span>}
                            </div>
                            <div style={{textAlign:"right",flexShrink:0}}>
                              <div style={{fontSize:"9px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",marginBottom:"3px"}}>Avg rate</div>
                              <div style={{fontSize:"14px",fontWeight:"800",color:avgRate>0?"#059669":"#cbd5e1"}}>{avgRate>0?"$"+avgRate.toLocaleString():"—"}</div>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                    </Fragment>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {/* ─────────────── BROKER SUMMARY ─────────────── */}
        {insightsTab==="brokers"&&(()=>{
          // Aggregate per-broker: total loads, then per-receiver-state avg rate
          const brokers={};
          allTimeWeeks.forEach(w=>{
            (w.groups||[]).forEach(g=>{
              (g.loads||[]).forEach(l=>{
                // brokerShort handles "Echo Global & 12345" → "Echo Global"
                const bShort=brokerShort(l.broker)||"";
                if(!bShort)return;
                if(!brokers[bShort])brokers[bShort]={totalLoads:0,totalRate:0,states:{}};
                const b=brokers[bShort];
                b.totalLoads++;
                const rate=parseFloat(l.rate)||0;
                if(rate>0)b.totalRate+=rate;
                const sr=parseSR(l.sr||"");
                const rState=(sr.r||"").split(",").map(x=>x.trim()).pop();
                if(rState&&rState.length===2){
                  if(!b.states[rState])b.states[rState]={count:0,totalRate:0};
                  b.states[rState].count++;
                  if(rate>0)b.states[rState].totalRate+=rate;
                }
              });
            });
          });

                          <div>
                            <div style={{fontSize:"9px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:".04em"}}>Overall Avg</div>

                        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:"6px"}}>

                            const stAvg=d.count>0?Math.round(d.totalRate/d.count):0;
                            return(
                              <div key={st} style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:"6px",padding:"8px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:"8px"}}>
                                <div>
                                  <div style={{fontSize:"13px",fontWeight:"800",color:"#1d4ed8"}}>{st}</div>
                                  <div style={{fontSize:"10px",color:"#64748b"}}>{d.count} load{d.count===1?"":"s"}</div>

                                <div style={{textAlign:"right"}}>
                                  <div style={{fontSize:"13px",fontWeight:"700",color:stAvg>0?"#059669":"#cbd5e1"}}>{stAvg>0?"$"+stAvg.toLocaleString():"—"}</div>
                                  <div style={{fontSize:"9px",color:"#94a3b8",fontWeight:"600",textTransform:"uppercase"}}>avg</div>
                                </div>
                              </div>
                            );

                      ):<div style={{fontSize:"11px",color:"#94a3b8"}}>No state data — cities not parsed yet</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {/* ─────────────── RECEIVERS ─────────────── */}
        {insightsTab==="receivers"&&(()=>{
          // Aggregate top receiver cities + states across allTimeWeeks
          const cities={};
          const states={};
          allTimeWeeks.forEach(w=>{
            (w.groups||[]).forEach(g=>{
              (g.loads||[]).forEach(l=>{
                const sr=parseSR(l.sr||"");
                if(!sr.r)return;
                cities[sr.r]=(cities[sr.r]||0)+1;
                const st=sr.r.split(",").map(x=>x.trim()).pop();
                if(st&&st.length===2)states[st]=(states[st]||0)+1;
              });
            });
          });
          const cityList=Object.entries(cities).sort((a,b)=>b[1]-a[1]);
          const stateList=Object.entries(states).sort((a,b)=>b[1]-a[1]);
          if(!cityList.length)return(<div style={{padding:"40px 20px",textAlign:"center",color:"#94a3b8",fontSize:"13px"}}>No receiver data yet.</div>);
          return(
            <div style={{padding:"20px"}}>
              <div style={{fontSize:"12px",color:"#64748b",marginBottom:"16px"}}>
                <strong>{cityList.length}</strong> unique destination cit{cityList.length===1?"y":"ies"} across <strong>{stateList.length}</strong> states.
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"20px"}}>
                {/* Top states */}
                <div>
                  <div style={{fontSize:"12px",fontWeight:"700",color:"#0891b2",marginBottom:"10px"}}>Top destination states</div>
                  <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
                    {stateList.slice(0,20).map(([st,c])=>{
                      const pct=Math.round(c/stateList[0][1]*100);
                      return(
                        <div key={st} style={{display:"flex",alignItems:"center",gap:"8px",fontSize:"12px"}}>
                          <div style={{width:"30px",fontWeight:"800",color:"#1d4ed8"}}>{st}</div>
                          <div style={{flex:1,height:"18px",background:"#f1f5f9",borderRadius:"4px",overflow:"hidden",position:"relative"}}>
                            <div style={{height:"100%",width:pct+"%",background:"linear-gradient(90deg,#06b6d4,#0891b2)",borderRadius:"4px"}}/>
                          </div>
                          <div style={{minWidth:"40px",textAlign:"right",fontWeight:"700",color:"#1f2937"}}>{c}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
                {/* Top cities */}
                <div>
                  <div style={{fontSize:"12px",fontWeight:"700",color:"#0891b2",marginBottom:"10px"}}>Top destination cities</div>
                  <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
                    {cityList.slice(0,20).map(([city,c])=>(
                      <div key={city} style={{display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:"12px",padding:"4px 8px",background:"#f8fafc",borderRadius:"4px"}}>
                        <span style={{color:"#1f2937"}}>{city}</span>

      </div>
    )}


    {/* ═══ PAYROLL TAB ═══ */}
    {activeTab==="payroll"&&isAdmin&&(
      <div style={{background:"#fff",border:"1px solid #d1d5db",borderTop:"none",borderRadius:"0 0 8px 8px",padding:"20px"}}>
        {(()=>{
          // Pick which Main Board import to use. Sort newest week first — prefers
          // the parsed weekKey (ISO date "2026-06-29"); falls back to importedAt
          // for entries created before we tracked weekKey.
          const boardKeys=Object.keys(mainBoards).sort((a,b)=>{
            const ka=mainBoards[a].weekKey||mainBoards[a].importedAt||a;
            const kb=mainBoards[b].weekKey||mainBoards[b].importedAt||b;
            return kb.localeCompare(ka); // desc
          });
          const activeBoardKey=selectedMainBoardKey||boardKeys[0]||null;
          const activeBoard=activeBoardKey?mainBoards[activeBoardKey]:null;
          // Freight Board week for Zygis 10%: MANUAL PICK always wins (saved per Main Board week).
          // If no manual pick yet, suggest the date-overlapping Freight week (max overlap), else null.
          let freightWeekForBoard=null;
          if(activeBoard){
            const picked=manualFreightKey[activeBoardKey];
            if(picked){
              freightWeekForBoard=allTimeWeeks.find(w=>w.id===picked)||null;
            }else{
              const overlapping=freightWeeksOverlapping(activeBoard.label,allTimeWeeks);
              if(overlapping.length===1){freightWeekForBoard=overlapping[0];}
              else if(overlapping.length>1){
                const br=weekDateRange(activeBoard.label);
                freightWeekForBoard=overlapping.slice().sort((a,b)=>{
                  const ra=weekDateRange(a.label),rb=weekDateRange(b.label);
                  const ov=r=>Math.max(0,Math.min(br.end,r.end)-Math.max(br.start,r.start));
                  return ov(rb)-ov(ra);
                })[0];
              }
            }
          }
          const payroll=activeBoard?computePayroll(activeBoard,freightWeekForBoard):{dispatchers:[],combinedTrailers:[]};
          const grandTotal=payroll.dispatchers.reduce((s,d)=>s+d.total,0);
          const zygisEntry=payroll.dispatchers.find(d=>d.isZygis);

          // File-drop handler for Main Board HTML import
          const handleMainBoardImport=async(files)=>{
            for(const file of files){
              if(!file.name.endsWith(".html")&&!file.name.endsWith(".htm")){
                alert("Please upload a .html or .htm file (Google Sheets export).");
                continue;
              }
              const text=await file.text();
              const parsed=parseMainBoardHTML(text);
              if(!parsed.ok){
                alert("Failed to parse "+file.name+":\n"+parsed.error);
                continue;
              }
              // Key = parsed weekKey (e.g. "2026-06-29" for Monday of that week).
              // Falls back to filename if the parser couldn't find dates in the sheet.
              // Label = human-friendly range like "6-29-2026 → 7-5-2026".
              const key=parsed.weekKey||file.name.replace(/\.html?$/i,"")||"unlabeled-"+Date.now();
              const label=parsed.weekLabel||file.name.replace(/\.html?$/i,"")||"unlabeled";
              const existing=mainBoards[key];
              const next={...mainBoards,[key]:{
                label,
                weekKey:key,
                originalFilename:file.name,
                importedAt:new Date().toISOString(),
                previousImportAt:existing?existing.importedAt:null,
                importCount:(existing?.importCount||0)+1,
                dispatchers:parsed.dispatchers
              }};
              saveMainBoards(next);
              setSelectedMainBoardKey(key);
            }
          };

          return(<>
            {/* Header */}
            <div style={{marginBottom:"18px"}}>
              <div style={{fontSize:"20px",fontWeight:"800",color:"#0f1f3d"}}>💰 Payroll</div>
              <div style={{fontSize:"12px",color:"#64748b",marginTop:"3px"}}>

              </div>
            </div>

            {/* Import + Board selector */}
            <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:"10px",marginBottom:"18px",padding:"12px",background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:"8px"}}>

                  onChange={e=>{if(e.target.files&&e.target.files.length){handleMainBoardImport(Array.from(e.target.files));e.target.value="";}}}/>

                </>

              {activeBoard&&(
                <span style={{fontSize:"10px",color:"#94a3b8",marginLeft:"auto"}}>
                  Imported {new Date(activeBoard.importedAt).toLocaleString()}
                  {activeBoard.importCount>1&&<span> · <strong>refresh #{activeBoard.importCount}</strong></span>}
                  {" · "}{activeBoard.dispatchers.length} dispatchers · {activeBoard.dispatchers.reduce((s,d)=>s+d.drivers.length,0)} drivers
                </span>
              )}
            </div>

            {/* No board loaded */}
            {!activeBoard&&(
              <div style={{padding:"60px 20px",textAlign:"center",background:"#f8fafc",border:"2px dashed #cbd5e1",borderRadius:"10px"}}>
                <div style={{fontSize:"40px",marginBottom:"10px"}}>📊</div>
                <div style={{fontSize:"14px",fontWeight:"700",color:"#0f1f3d",marginBottom:"6px"}}>No Main Board imported yet</div>
                <div style={{fontSize:"12px",color:"#64748b",maxWidth:"420px",margin:"0 auto",lineHeight:"1.5"}}>
                  From Google Sheets: File → Download → Web Page (.html). Then click the green "Import Main Board" button above.
                </div>
              </div>
            )}

            {/* Grand totals */}
            {activeBoard&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:"12px",marginBottom:"20px"}}>
                {zygisEntry&&(
                  <div style={{background:"linear-gradient(135deg,#059669,#047857)",color:"#fff",padding:"14px 16px",borderRadius:"8px",boxShadow:"0 2px 6px rgba(5,150,105,.25)"}}>
                    <div style={{fontSize:"10px",fontWeight:"700",textTransform:"uppercase",letterSpacing:".04em",opacity:.9}}>Your payroll</div>
                    <div style={{fontSize:"26px",fontWeight:"800",marginTop:"2px"}}>${zygisEntry.total.toLocaleString(undefined,{maximumFractionDigits:2})}</div>
                    <div style={{fontSize:"10px",opacity:.85,marginTop:"2px"}}>{zygisEntry.driverCount} driver{zygisEntry.driverCount===1?"":"s"} · {zygisEntry.combinedTenPercent.trailers.length} combined trailer{zygisEntry.combinedTenPercent.trailers.length===1?"":"s"}</div>
                  </div>
                )}
                <div style={{background:"#f8fafc",border:"1px solid #e2e8f0",padding:"14px 16px",borderRadius:"8px"}}>
                  <div style={{fontSize:"10px",fontWeight:"700",textTransform:"uppercase",letterSpacing:".04em",color:"#64748b"}}>All dispatchers</div>
                  <div style={{fontSize:"26px",fontWeight:"800",color:"#0f1f3d",marginTop:"2px"}}>${grandTotal.toLocaleString(undefined,{maximumFractionDigits:2})}</div>
                  <div style={{fontSize:"10px",color:"#94a3b8",marginTop:"2px"}}>{payroll.dispatchers.length} dispatcher{payroll.dispatchers.length===1?"":"s"} · {payroll.dispatchers.reduce((s,d)=>s+d.driverCount,0)} driver{payroll.dispatchers.reduce((s,d)=>s+d.driverCount,0)===1?"":"s"}</div>
                </div>
                <div style={{background:"#f8fafc",border:"1px solid #e2e8f0",padding:"14px 16px",borderRadius:"8px"}}>
                  <div style={{fontSize:"10px",fontWeight:"700",textTransform:"uppercase",letterSpacing:".04em",color:"#64748b"}}>Bonus pool</div>
                  <div style={{fontSize:"26px",fontWeight:"800",color:"#0f1f3d",marginTop:"2px"}}>${payroll.dispatchers.reduce((s,d)=>s+d.bonusTotal,0).toLocaleString()}</div>
                  <div style={{fontSize:"10px",color:"#94a3b8",marginTop:"2px"}}>drivers ≥$8k gross earn bonus</div>
                </div>
              </div>
            )}

            {/* Freight Board week match indicator (for Zygis 10%) */}
            {activeBoard&&(
              <div style={{marginBottom:"14px",padding:"8px 12px",background:freightWeekForBoard?"#f0fdf4":"#fef3c7",border:`1px solid ${freightWeekForBoard?"#bbf7d0":"#fcd34d"}`,borderRadius:"6px",fontSize:"11px",color:freightWeekForBoard?"#166534":"#92400e"}}>
                <strong>Zygis 10% source:</strong>{" "}
                <select value={manualFreightKey[activeBoardKey]||(freightWeekForBoard?freightWeekForBoard.id:"")} onChange={e=>{const v=e.target.value;setManualFreightKey(prev=>{const n={...prev};if(v)n[activeBoardKey]=v;else delete n[activeBoardKey];localStorage.setItem("fcbv2_manualfreight",JSON.stringify(n));return n;});}} style={{fontSize:"11px",padding:"2px 6px",border:`1px solid ${freightWeekForBoard?"#bbf7d0":"#fcd34d"}`,borderRadius:"4px",fontWeight:"600",marginRight:"6px"}}>
                  <option value="">— pick Freight Board week —</option>
                  {allTimeWeeks.map(w=><option key={w.id} value={w.id}>{w.label||"(unlabeled)"}</option>)}

                  ?<>{payroll.combinedTrailers.length} combined trailer{payroll.combinedTrailers.length===1?"":"s"}{manualFreightKey[activeBoardKey]?"":" (auto-suggested — pick to lock)"}</>

            {/* Per-dispatcher breakdowns */}
            {activeBoard&&payroll.dispatchers.length===0&&(
              <div style={{padding:"40px 20px",textAlign:"center",color:"#94a3b8",fontSize:"13px"}}>

              </div>

            {activeBoard&&payroll.dispatchers.length>0&&(
              <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
                {payroll.dispatchers.map(disp=>{
                  const isExp=expandedPayrollDisp===disp.name;

                    <div key={disp.name} style={{background:"#fff",border:"1px solid #e2e8f0",borderLeft:disp.isZygis?"4px solid #059669":"4px solid #64748b",borderRadius:"8px",overflow:"hidden"}}>
                      {/* Collapsed header */}
                      <div onClick={()=>setExpandedPayrollDisp(isExp?null:disp.name)}
                        style={{display:"grid",gridTemplateColumns:"minmax(0,1.4fr) 80px 100px 100px 110px 24px",gap:"12px",padding:"12px 16px",alignItems:"center",cursor:"pointer",background:isExp?"#f8fafc":"transparent"}}>
                        <div style={{minWidth:0}}>
                          <div style={{fontSize:"14px",fontWeight:"800",color:disp.isZygis?"#059669":"#0f1f3d"}}>
                            {disp.name}
                            {disp.isZygis&&<span style={{marginLeft:"6px",fontSize:"9px",background:"#dcfce7",color:"#15803d",padding:"1px 6px",borderRadius:"3px",fontWeight:"700",letterSpacing:".04em"}}>YOU</span>}
                          </div>
                          <div style={{fontSize:"11px",color:"#64748b",marginTop:"2px"}}>{disp.driverCount} driver{disp.driverCount===1?"":"s"}</div>
                        </div>
                        <div style={{textAlign:"center"}}>
                          <div style={{fontSize:"9px",color:"#94a3b8",fontWeight:"700",textTransform:"uppercase"}}>Base</div>
                          <div style={{fontSize:"12px",fontWeight:"700",color:"#0f1f3d"}}>${disp.base.toLocaleString()}</div>
                        </div>
                        <div style={{textAlign:"center"}}>
                          <div style={{fontSize:"9px",color:"#94a3b8",fontWeight:"700",textTransform:"uppercase"}}>10% Comb.</div>
                          <div style={{fontSize:"12px",fontWeight:"700",color:disp.combinedTenPercent.total>0?"#059669":"#cbd5e1"}}>{disp.combinedTenPercent.total>0?"$"+disp.combinedTenPercent.total.toLocaleString(undefined,{maximumFractionDigits:2}):"—"}</div>
                        </div>
                        <div style={{textAlign:"center"}}>
                          <div style={{fontSize:"9px",color:"#94a3b8",fontWeight:"700",textTransform:"uppercase"}}>Bonuses</div>
                          <div style={{fontSize:"12px",fontWeight:"700",color:disp.bonusTotal>0?"#059669":"#cbd5e1"}}>{disp.bonusTotal>0?"$"+disp.bonusTotal.toLocaleString():"—"}</div>
                        </div>
                        <div style={{textAlign:"right"}}>
                          <div style={{fontSize:"9px",color:"#94a3b8",fontWeight:"700",textTransform:"uppercase"}}>Total</div>
                          <div style={{fontSize:"18px",fontWeight:"800",color:disp.isZygis?"#059669":"#0f1f3d"}}>${disp.total.toLocaleString(undefined,{maximumFractionDigits:2})}</div>
                          {disp.override&&<div style={{fontSize:"9px",color:"#b45309",fontWeight:"700"}}>OVERRIDE</div>}
                        </div>
                        <div style={{textAlign:"center",fontSize:"14px",color:"#94a3b8",transform:isExp?"rotate(180deg)":"rotate(0deg)"}}>▾</div>
                      </div>
                      {/* Expanded */}
                      {isExp&&(
                        <div style={{padding:"14px 16px",borderTop:"1px solid #e2e8f0",background:"#fafbfc"}}>
                          <div style={{fontSize:"11px",color:"#475569",marginBottom:"10px"}}>
                            <strong>Base:</strong> {disp.baseNote} = <span style={{color:"#0f1f3d",fontWeight:"700"}}>${disp.base.toLocaleString()}</span>
                          </div>
                          {/* 10% combined (Zygis only) */}
                          {disp.isZygis&&disp.combinedTenPercent.trailers.length>0&&(
                            <div style={{marginBottom:"12px"}}>
                              <div style={{fontSize:"11px",fontWeight:"700",color:"#059669",marginBottom:"6px"}}>10% on combined trailers (from Freight Board)</div>
                              {(()=>{
                                // Sanity check: sum of all "contributing" rates ×10% should equal disp.combinedTenPercent.total
                                // and should also equal the Dashboard's Extra Added × 10%.
                                const extraAdded=disp.combinedTenPercent.trailers.reduce((s,t)=>s+t.contributing.reduce((x,l)=>x+l.rate,0),0);
                                return(
                                  <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:"6px",padding:"6px 10px",marginBottom:"6px",fontSize:"11px",color:"#166534"}}>
                                    10% × <strong>${extraAdded.toLocaleString()}</strong> Extra Added = <strong>${disp.combinedTenPercent.total.toLocaleString(undefined,{maximumFractionDigits:2})}</strong>
                                    <div style={{fontSize:"9px",color:"#166534",opacity:.75,marginTop:"2px"}}>Reconciles with your Dashboard's "Extra Added" figure — if they differ, the Freight Board week may not match.</div>
                                  </div>
                                );
                              })()}
                              <div style={{background:"#fff",border:"1px solid #d1fae5",borderRadius:"6px",padding:"8px 10px"}}>
                                {disp.combinedTenPercent.trailers.map((t,ti)=>(
                                  <div key={ti} style={{borderBottom:ti<disp.combinedTenPercent.trailers.length-1?"1px solid #f1f5f9":"none",padding:"4px 0",fontSize:"11px"}}>
                                    <div style={{display:"flex",justifyContent:"space-between",gap:"8px"}}>
                                      <span style={{color:"#475569"}}>
                                        <strong>{t.groupDriver||"(no driver)"}</strong> — {t.contributing.length+1} loads
                                      </span>
                                      <span style={{fontWeight:"700",color:"#059669"}}>+${t.share.toLocaleString(undefined,{maximumFractionDigits:2})}</span>
                                    </div>
                                    <div style={{fontSize:"10px",color:"#94a3b8",marginTop:"2px"}}>
                                      Dropped top: ${t.dropped.rate.toLocaleString()} · 10% × ({t.contributing.map(l=>"$"+l.rate.toLocaleString()).join(" + ")})
                                    </div>
                                  </div>
                                ))}
                                <div style={{marginTop:"6px",paddingTop:"6px",borderTop:"2px solid #d1fae5",fontSize:"12px",fontWeight:"800",color:"#059669",textAlign:"right"}}>
                                  Subtotal: ${disp.combinedTenPercent.total.toLocaleString(undefined,{maximumFractionDigits:2})}
                                </div>
                              </div>
                            </div>
                          )}

                    <div><div style={{fontSize:"22px",fontWeight:"900",color:card.numColors[1]}}>{card.data.loads}</div><div style={{fontSize:"11px",color:card.subColor,fontWeight:"600"}}>Loads</div></div>
                    <div><div style={{fontSize:"22px",fontWeight:"900",color:card.numColors[2]}}>{card.data.trailers}</div><div style={{fontSize:"11px",color:card.subColor,fontWeight:"600"}}>Trailers</div></div>
                    <div><div style={{fontSize:"22px",fontWeight:"900",color:card.numColors[3]}}>{card.data.rpm?("$"+card.data.rpm+"/mi"):"—"}</div><div style={{fontSize:"11px",color:card.subColor,fontWeight:"600"}}>RPM</div></div>
                  </div>
                </div>
              ))}</div>

              {/* Stat Cards */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:"12px",marginBottom:"24px"}}>
                {statCards.map((sc)=>(
                  <div key={sc.label} style={{background:"#fff",borderRadius:"12px",padding:"14px",boxShadow:"0 1px 4px rgba(0,0,0,0.07)",border:"1px solid #e2e8f0"}}>
                    <div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"8px"}}>
                      <span style={{fontSize:"18px"}}>{sc.icon}</span>
                      <span style={{fontSize:"10px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",letterSpacing:".04em"}}>{sc.label}</span>
                    </div>
                    <div style={{fontSize:"22px",fontWeight:"800",color:sc.color}}>{sc.fmt(sc.cur)}<Arrow a={sc.cur} b={sc.prev} rev={sc.rev}/></div>
                    <div style={{fontSize:"10px",color:"#94a3b8",marginTop:"4px"}}>prev: {sc.fmt(sc.prev)}</div>
                    {/* Mini comparison bar */}
                    {sc.cur>0&&sc.prev>0&&(<div style={{display:"flex",gap:"2px",marginTop:"8px",alignItems:"flex-end",height:"24px"}}>
                      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"2px"}}>
                        <div style={{width:"100%",background:sc.color,borderRadius:"2px",height:Math.round(sc.prev/Math.max(sc.cur,sc.prev)*20)+"px",opacity:.4}}/>
                        <span style={{fontSize:"8px",color:"#94a3b8"}}>prev</span>
                      </div>
                      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"2px"}}>
                        <div style={{width:"100%",background:sc.color,borderRadius:"2px",height:Math.round(sc.cur/Math.max(sc.cur,sc.prev)*20)+"px"}}/>
                        <span style={{fontSize:"8px",color:sc.color,fontWeight:"700"}}>now</span>
                      </div>
                    </div>)}
                  </div>
                ))}
              </div>

              {/* Date Range Picker for Drivers/Dispatchers */}
              <div style={{background:"#fff",borderRadius:"12px",padding:"14px 16px",boxShadow:"0 1px 4px rgba(0,0,0,0.07)",border:"1px solid #e2e8f0",marginBottom:"16px",display:"flex",alignItems:"center",gap:"12px",flexWrap:"wrap"}}>
                <span style={{fontSize:"12px",fontWeight:"700",color:"#374151"}}>📅 Driver & Dispatcher stats period:</span>
                <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
                  <span style={{fontSize:"11px",color:"#64748b"}}>From</span>
                  <input type="date" value={driverDateFrom} onChange={e=>setDriverDateFrom(e.target.value)} style={{border:"1px solid #e2e8f0",borderRadius:"6px",padding:"4px 8px",fontSize:"11px",color:"#0f1f3d",fontFamily:"inherit",outline:"none"}}/>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
                  <span style={{fontSize:"11px",color:"#64748b"}}>To</span>
                  <input type="date" value={driverDateTo} onChange={e=>setDriverDateTo(e.target.value)} style={{border:"1px solid #e2e8f0",borderRadius:"6px",padding:"4px 8px",fontSize:"11px",color:"#0f1f3d",fontFamily:"inherit",outline:"none"}}/>
                </div>
                {(driverDateFrom||driverDateTo)&&<button onClick={()=>{setDriverDateFrom("");setDriverDateTo("");}} style={{background:"#f1f5f9",border:"none",borderRadius:"6px",padding:"4px 10px",fontSize:"11px",color:"#64748b",cursor:"pointer",fontWeight:"600"}}>Clear</button>}
                <span style={{fontSize:"11px",color:"#94a3b8",marginLeft:"auto"}}>{driverDateFrom||driverDateTo?"Custom range":"All time (all weeks)"}</span>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"16px",marginBottom:"16px"}}>
                {/* Top Drivers */}
                <div style={{background:"#fff",borderRadius:"12px",padding:"16px",boxShadow:"0 1px 4px rgba(0,0,0,0.07)",border:"1px solid #e2e8f0"}}>
                  <div style={{fontWeight:"700",fontSize:"14px",color:"#0f1f3d",marginBottom:"2px"}}>🧑 Top Drivers{driverDateFrom||driverDateTo?" — Custom Range":" — All Time"}</div>
                  <div style={{fontSize:"10px",color:"#94a3b8",marginBottom:"12px"}}>Delivered + In Transit loads · includes archived weeks</div>
                  {topDrivers.length===0?(<div style={{color:"#94a3b8",fontSize:"12px",textAlign:"center",padding:"20px"}}>No driver data yet</div>):(
                    <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
                      {topDrivers.map((dr,i)=>(
                        <div key={dr[0]} style={{display:"flex",alignItems:"center",gap:"8px"}}>
                          <span style={{fontSize:"13px",fontWeight:"800",color:i===0?"#f59e0b":i===1?"#94a3b8":i===2?"#d97706":"#cbd5e1",minWidth:"20px"}}>{i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1)}</span>
                          <span style={{fontSize:"12px",fontWeight:"600",color:"#374151",minWidth:"100px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{(()=>{const firstName=dr[0].split(" ")[0];const trk=Object.entries(truckAssignments||{}).find(([t,d])=>d===dr[0]);return trk?"#"+trk[0]+" "+firstName:firstName;})()}</span>
                          <div style={{flex:1,height:"8px",background:"#f1f5f9",borderRadius:"4px",overflow:"hidden"}}>
                            <div style={{height:"100%",width:Math.round(dr[1]/maxDriverGross*100)+"%",background:i===0?"#f59e0b":i===1?"#94a3b8":"#2563eb",borderRadius:"4px"}}/>
                          </div>
                          <span style={{fontSize:"11px",fontWeight:"700",color:"#059669",minWidth:"60px",textAlign:"right"}}>${dr[1].toLocaleString()}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Top Dispatchers */}
                <div style={{background:"#fff",borderRadius:"12px",padding:"16px",boxShadow:"0 1px 4px rgba(0,0,0,0.07)",border:"1px solid #e2e8f0"}}>
                  <div style={{fontWeight:"700",fontSize:"14px",color:"#0f1f3d",marginBottom:"2px"}}>🎯 Top Dispatchers{driverDateFrom||driverDateTo?" — Custom Range":" — All Time"}</div>
                  <div style={{fontSize:"10px",color:"#94a3b8",marginBottom:"12px"}}>Delivered + In Transit loads · includes archived weeks</div>
                  {topDispatchers.length===0?(<div style={{color:"#94a3b8",fontSize:"12px",textAlign:"center",padding:"20px"}}>No dispatcher data yet — assign drivers to dispatchers in the Dispatchers tab</div>):(
                    <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
                      {topDispatchers.map((dp,i)=>{
                        const isUnassigned=dp[0]==="⚠ Unassigned drivers";
                        return(
                        <div key={dp[0]} style={{display:"flex",alignItems:"center",gap:"8px"}}>
                          <span style={{fontSize:"13px",fontWeight:"800",color:isUnassigned?"#d97706":i===0?"#f59e0b":i===1?"#94a3b8":i===2?"#d97706":"#cbd5e1",minWidth:"20px"}}>{isUnassigned?"⚠":i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1)}</span>
                          <span style={{fontSize:"12px",fontWeight:"600",color:isUnassigned?"#b45309":"#5b21b6",minWidth:"100px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{isUnassigned?"Unassigned":dp[0]}</span>
                          <div style={{flex:1,height:"8px",background:"#f1f5f9",borderRadius:"4px",overflow:"hidden"}}>
                            <div style={{height:"100%",width:Math.round(dp[1]/maxDispGross*100)+"%",background:isUnassigned?"#f59e0b":i===0?"#f59e0b":"#7c3aed",borderRadius:"4px"}}/>
                          </div>
                          <span style={{fontSize:"11px",fontWeight:"700",color:isUnassigned?"#b45309":"#7c3aed",minWidth:"60px",textAlign:"right"}}>${dp[1].toLocaleString()}</span>
                        </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>

              {/* Weekly comparison bar chart */}
              <div style={{background:"#fff",borderRadius:"12px",padding:"20px",boxShadow:"0 1px 4px rgba(0,0,0,0.07)",border:"1px solid #e2e8f0",marginBottom:"16px"}}>
                <div style={{fontWeight:"800",fontSize:"18px",color:"#0f1f3d",marginBottom:"20px"}}>📈 All Weeks — Revenue Overview</div>
                <div style={{display:"flex",alignItems:"flex-end",gap:"8px",minHeight:"200px",overflowX:"auto",paddingBottom:"0",paddingTop:"20px"}}>
                  {(()=>{
                    const sliced=[...weeks].slice(-12);
                    const allGross=sliced.map(w=>(w.groups||[]).flatMap(g=>g.loads||[]).reduce((s,l)=>s+(parseFloat(l.rate)||0),0));
                    const maxG=Math.max(...allGross,1);
                    const BAR_H=160;
                    return sliced.map((w)=>{
                      const wg=w.groups||[];
                      const wl=wg.flatMap(g=>g.loads||[]);
                      const wGross=wl.reduce((s,l)=>s+(parseFloat(l.rate)||0),0);
                      const wLoc=wl.reduce((s,l)=>{
                        if(l.manualLocalCharge!==""&&l.manualLocalCharge!=null)return s+(parseFloat(l.manualLocalCharge)||0);
                        const sh=parseSR(l.sr||"").s;const am=cityMiles(sh);
                        const um=(l.manualPickupMi!==""&&l.manualPickupMi!=null)?parseFloat(l.manualPickupMi):am;
                        return s+(um!=null?localCharge(um):0);
                      },0);
                      const wNet=wGross-wLoc;
                      const barPx=wGross>0?Math.max(Math.round(wGross/maxG*BAR_H),6):0;
                      const locPx=wGross>0?Math.round(wLoc/wGross*barPx):0;
                      const isLast=w.id===weeks[weeks.length-1]?.id;
                      const wLabel=(w.label||"").replace(/\d{4}/g,"").replace(/\s+/g," ").trim();
                      const parts=wLabel.split("-");
                      const shortLabel=parts[0]?parts[0].trim().slice(0,6):"";
                      return(
                        <div key={w.id} style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:"56px",flex:1}}>
                          <div style={{fontSize:"11px",fontWeight:"800",color:isLast?"#2563eb":"#374151",whiteSpace:"nowrap",marginBottom:"4px",minHeight:"16px",textAlign:"center"}}>{wGross>0?"$"+Math.round(wNet/1000)+"k":""}</div>
                          <div style={{width:"80%",height:barPx+"px",background:isLast?"#2563eb":"#93c5fd",borderRadius:"5px 5px 0 0",position:"relative",overflow:"hidden",minHeight:wGross>0?"6px":"0"}}>
                            {locPx>0&&<div style={{position:"absolute",bottom:0,width:"100%",height:locPx+"px",background:isLast?"#1d4ed8":"#60a5fa"}}/>}
                          </div>
                          <div style={{fontSize:"10px",color:isLast?"#2563eb":"#64748b",fontWeight:isLast?"800":"500",textAlign:"center",marginTop:"4px",lineHeight:"1.2",maxWidth:"56px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{shortLabel}</div>
                        </div>
                      );
                    });
                  })()}
                </div>
                <div style={{display:"flex",gap:"20px",marginTop:"14px",paddingTop:"12px",borderTop:"1px solid #f1f5f9",flexWrap:"wrap"}}>
                  <div style={{display:"flex",alignItems:"center",gap:"5px"}}><div style={{width:"12px",height:"12px",background:"#93c5fd",borderRadius:"3px"}}/><span style={{fontSize:"11px",color:"#475569",fontWeight:"600"}}>Gross (other weeks)</span></div>
                  <div style={{display:"flex",alignItems:"center",gap:"5px"}}><div style={{width:"12px",height:"12px",background:"#2563eb",borderRadius:"3px"}}/><span style={{fontSize:"11px",color:"#2563eb",fontWeight:"700"}}>Gross (current week)</span></div>
                  <div style={{display:"flex",alignItems:"center",gap:"5px"}}><div style={{width:"12px",height:"12px",background:"#1d4ed8",borderRadius:"3px"}}/><span style={{fontSize:"11px",color:"#475569",fontWeight:"600"}}>Local charges deducted</span></div>
                </div>
              </div>

            </div>
          );
        })()}
      </div>
    )}
      {/* STATS TAB */}
    {activeTab==="stats"&&(isAdmin||isDispatcher)&&(
      <div style={{background:"#fff",border:"1px solid #d1d5db",borderTop:"none",borderRadius:"0 0 8px 8px",padding:"20px"}}>
        <div style={{fontWeight:"700",fontSize:"14px",color:"#1a2e50",marginBottom:"16px"}}>📊 Statistics — All Weeks</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:"12px"}}>
          {[{label:"Total Trailers",value:allTimeWeeks.reduce((s,w)=>s+(w.groups||[]).length,0),color:"#2563eb"},
            {label:"Total Loads",value:allTimeWeeks.reduce((s,w)=>s+(w.groups||[]).flatMap(g=>g.loads||[]).length,0),color:"#7c3aed"},
            {label:"Total Gross",value:"$"+allTimeWeeks.reduce((s,w)=>s+(w.groups||[]).flatMap(g=>g.loads||[]).reduce((s2,l)=>s2+(parseFloat(l.rate)||0),0),0).toLocaleString(),color:"#059669"}
          ].map((statItem)=>{
            const lbl=statItem.label; const val=statItem.value; const clr=statItem.color;
            return(
              <div key={lbl} style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:"10px",padding:"16px",textAlign:"center"}}>
                <div style={{fontSize:"11px",color:"#64748b",fontWeight:"600",marginBottom:"6px"}}>{lbl}</div>
                <div style={{fontSize:"22px",fontWeight:"800",color:clr}}>{val}</div>
              </div>
            );
          })}
        </div>
        <div style={{marginTop:"20px"}}>
          <table style={{borderCollapse:"collapse",width:"100%"}}>
            <thead>
              <tr>
                <th style={{padding:"8px",background:"#1a2e50",color:"#fff",fontSize:"11px",fontWeight:"600",textAlign:"left"}}>Week</th>
                <th style={{padding:"8px",background:"#1a2e50",color:"#fff",fontSize:"11px",fontWeight:"600",textAlign:"left"}}>Trailers</th>
                <th style={{padding:"8px",background:"#1a2e50",color:"#fff",fontSize:"11px",fontWeight:"600",textAlign:"left"}}>Loads</th>
                <th style={{padding:"8px",background:"#1a2e50",color:"#fff",fontSize:"11px",fontWeight:"600",textAlign:"left"}}>Gross</th>
              </tr>
            </thead>
            <tbody>
              {allTimeWeeks.map((w,i)=>{
                const grps=w.groups||[];
                const loads=grps.flatMap(g=>g.loads||[]);
                const gross=loads.reduce((s,l)=>s+(parseFloat(l.rate)||0),0);
                const rowBg=i%2===0?"#fff":"#f8fafc";
                const isArchived=i>=weeks.length;
                return(
                  <tr key={w.id} style={{background:rowBg,borderBottom:"1px solid #e2e8f0",opacity:isArchived?0.75:1}}>
                    <td style={{padding:"8px",fontSize:"12px",fontWeight:"600",color:"#1a2e50"}}>
                      {w.label}
                      {isArchived&&<span style={{marginLeft:"8px",fontSize:"9px",background:"#fef3c7",color:"#92400e",padding:"1px 6px",borderRadius:"3px",fontWeight:"700"}}>ARCHIVED</span>}
                    </td>
                    <td style={{padding:"8px",fontSize:"12px"}}>{grps.length}</td>
                    <td style={{padding:"8px",fontSize:"12px"}}>{loads.length}</td>
                    <td style={{padding:"8px",fontSize:"12px",fontWeight:"700",color:"#059669"}}>${gross.toLocaleString()}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    )}

  </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);

</script>
</body>
</html>
