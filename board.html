      setWeeksAndSave(p=>p.map(w=>({...w,groups:(w.groups||[]).map(g=>g.id!==groupId?g:{...g,loads:(g.loads||[]).map(l=>l.id!==loadId?l:{...l,rateConUrl:j.file.url,rateConName:j.file.name,rateConUploadFailed:false,rateConUploading:false})})})));
    }catch(e){
      // Mark failed so the UI can offer "retry"; data is still safe locally.
      setWeeksAndSave(p=>p.map(w=>({...w,groups:(w.groups||[]).map(g=>g.id!==groupId?g:{...g,loads:(g.loads||[]).map(l=>l.id!==loadId?l:{...l,rateConUploadFailed:true,rateConUploading:false,rateConUploadError:String(e.message||e).slice(0,200)})})})));
    }
  };

  const handleRateCon=async(file,groupId)=>{
    setRcLoading(p=>({...p,[groupId]:true}));
    let fields=null;
    let usedSource="";

    // ---- 1. Try LOCAL PDF.js + regex parser first (free, no API) ----
    if(/pdf$/i.test(file.type)||/\.pdf$/i.test(file.name||"")){
      try{
        const{text,items}=await extractPdfText(file);
        const parsed=parseRateCon(text);
        // Positional (coordinate-based) extraction wins for shipper/receiver
        // when a known layout is recognized — it reconstructs table columns
        // exactly, so no column-tail junk regardless of spacing.
        const pos=extractStopsPositional(items);
        if(pos){
          if(pos.shipperCo)parsed.shipperCo=pos.shipperCo;
          if(pos.shipperAddr)parsed.shipperAddr=pos.shipperAddr;
          if(pos.receiverCo)parsed.receiverCo=pos.receiverCo;
          if(pos.receiverAddr)parsed.receiverAddr=pos.receiverAddr;
        }
        const candidate=rateConToLoadFields(parsed);
        // Use the local result only if we got SOMETHING meaningful out of it.
        const meaningful=(candidate.sr&&candidate.sr.length>3)||candidate.broker||candidate.rate||candidate.pickup;
        if(meaningful){fields=candidate;usedSource="local";}
      }catch(e){/* local parse failed — fall through to AI / no-op */}
    }

    // ---- 2. Fall back to AI API only if local got nothing AND a key is set ----
    if(!fields){
      const key=apiKeyRef.current;
      const proxyUrl=localStorage.getItem("fcbv2_proxyUrl")||"";
      if(!key&&!proxyUrl){
        // Local parse couldn't read this PDF (probably scanned/image-only) and no AI configured.
        // Don't block — still upload the PDF to Drive so it's saved, just no fields filled.
        const placeholder=mkLoad({});
        setWeeksAndSave(p=>p.map((w,i)=>i!==activeWeek?w:{...w,groups:w.groups.map(g=>g.id!==groupId?g:{...g,loads:[...g.loads,{...placeholder,rateConUploading:true}]})}));
        uploadRateConToDrive(file,groupId,placeholder.id);
        setRcLoading(p=>({...p,[groupId]:false}));
        alert("Couldn't read fields from this PDF (it may be a scanned image).\n\nThe PDF is being uploaded to Drive so the link is saved on the load — you can fill the fields manually.");
        return;
      }
      try{
        const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=()=>rej(new Error("Could not read the file"));r.readAsDataURL(file);});
        const mediaType=file.type||"application/pdf";
        let response;
        if(proxyUrl){
          response=await fetch(proxyUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mediaType,base64,prompt:`Extract from this rate confirmation: shipper city+state, receiver city+state, pickup date/time, delivery date/time, product/commodity, pallets, weight, rate amount, broker name, load number. Return JSON only: {"shipper":"","receiver":"","pickup":"","delivery":"","product":"","pallets":"","weight":"","rate":"","broker":"","loadNum":""}`})});
        } else {
          response=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:[{type:mediaType==="application/pdf"?"document":"image",source:{type:"base64",media_type:mediaType,data:base64}},{type:"text",text:`Extract from this rate confirmation: shipper city+state, receiver city+state, pickup date/time, delivery date/time, product/commodity, pallets, weight, rate amount, broker name, load number. Return JSON only: {"shipper":"","receiver":"","pickup":"","delivery":"","product":"","pallets":"","weight":"","rate":"","broker":"","loadNum":""}`}]}]})});
        }
        if(!response.ok){const errTxt=await response.text().catch(()=>"");throw new Error("Server returned "+response.status+(errTxt?" — "+errTxt.slice(0,200):""));}
        const data=await response.json();
        const text=data.content?.[0]?.text||data.text||"";
        const match=text.match(/\{[\s\S]*\}/);
        if(!match)throw new Error("The AI reply had no readable data. Raw reply: "+(text||"(empty)").slice(0,200));
        const parsed=JSON.parse(match[0]);
        fields={
          sr:`${parsed.shipper||""} - ${parsed.receiver||""}`.trim().replace(/^-\s*|-\s*$/g,""),
          broker:parsed.broker&&parsed.loadNum?`${parsed.broker} & ${parsed.loadNum}`:parsed.broker||parsed.loadNum||"",
          pickup:parsed.pickup||"",delivery:parsed.delivery||"",product:parsed.product||"",
          pallets:parsed.pallets||"",weight:parsed.weight||"",rate:parsed.rate||""
        };
        usedSource="ai";
      } catch(e){
        alert("Couldn't read the rate confirmation.\n\n"+(e.message||e));
        setRcLoading(p=>({...p,[groupId]:false}));
        return;
      }
    }

    // ---- 3. Check for an existing load with the same broker + load number ----
    // Match across ALL weeks and archived weeks so duplicates from previous
    // weeks are caught too — not just same-week (which is the render-time check).
    if(fields&&fields.broker&&fields.broker.indexOf("&")>=0){
      const key=fields.broker.toLowerCase().trim();
      let foundIn=null;
      const scan=(list,kind)=>{
        for(const w of(list||[])){
          for(const g of(w.groups||[])){
            for(const l of(g.loads||[])){
              if(((l.broker||"")+"").toLowerCase().trim()===key){
                foundIn={weekLabel:w.label||"(no label)",kind:kind,loadSr:l.sr||"(no route)"};
                return true;
              }
            }
          }
        }
        return false;
      };
      scan(weeks,"week")||scan(archivedWeeks,"archived week");
      if(foundIn){
        const ok=confirm(
          "This load already exists.\n\n"+
          "Broker + load #: "+fields.broker+"\n"+
          "Route on existing load: "+foundIn.loadSr+"\n"+
          "Found in "+foundIn.kind+": "+foundIn.weekLabel+"\n\n"+
          "Add this rate-con as a NEW load anyway?"
        );
        if(!ok){
          setRcLoading(p=>({...p,[groupId]:false}));
          return; // cancelled — nothing added, no PDF uploaded
        }
      }
    }

    // ---- 4. Create the load with the extracted fields + upload mark ----
    // Before creating, try to LEARN the address from existing loads:
    // if same city + same broker was seen before with a unique address, auto-apply.
    let effectiveFields={...fields};
    let autoFilled=false;
    if(!effectiveFields.shipperAddr||String(effectiveFields.shipperAddr).trim()===""){
      const{s:sCity}=parseSR(effectiveFields.sr||"");
      const known=lookupKnownShipperAddr(sCity,effectiveFields.broker);
      if(known){
        effectiveFields.shipperAddr=known;
        autoFilled=true;
      }
    }
    const newLoad=mkLoad({...effectiveFields,rateConUploading:true});
    setWeeksAndSave(p=>p.map((w,i)=>i!==activeWeek?w:{...w,groups:w.groups.map(g=>g.id!==groupId?g:{...g,loads:[...g.loads,newLoad]})}));
    setRcLoading(p=>({...p,[groupId]:false}));

    // ---- 4b. Notify user of address handling ----
    if(autoFilled){
      // Silent confirmation via a green toast — user knows we filled from memory
      const{s:sCity}=parseSR(effectiveFields.sr||"");
      const tId="addrfill-"+newLoad.id;
      setToasts(t=>[...t,{id:tId,kind:"addr-fill",gid:groupId,lid:newLoad.id,msg:"Address auto-filled for "+(sCity||"this load")+" from previous loads."}]);
      setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==tId)),6000);
    } else if(!effectiveFields.shipperAddr||String(effectiveFields.shipperAddr).trim()===""){
      // Still missing and we don't know it — fire the standard warning toast
      const sCity=(()=>{const{s}=parseSR(effectiveFields.sr||"");return s||"this load";})();
      const tId="addrmiss-"+newLoad.id;
      setToasts(t=>[...t,{id:tId,kind:"addr-miss",gid:groupId,lid:newLoad.id,msg:"Couldn't read shipper address for "+sCity+". Click to enter manually."}]);
      setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==tId)),12000);
    }

    // ---- 5. Kick off Drive upload in the background (non-blocking) ----
    uploadRateConToDrive(file,groupId,newLoad.id);
  };

  const archiveWeek=(weekIdx)=>{
    if(!confirm("Archive this week?"))return;
    const w=weeks[weekIdx];const entry={...w,archivedAt:new Date().toLocaleString()};
    const newArchive=[entry,...archivedWeeks];
    setArchivedWeeks(newArchive);localStorage.setItem("fcbv2_archive",JSON.stringify(newArchive));
    const remaining=weeks.filter((_,i)=>i!==weekIdx);
    setWeeks(remaining);setActiveWeek(0);
    // Save weeks AND archive together so the archive syncs to Sheets immediately.
    saveToSheets({weeks:remaining,archive:newArchive});
  };

  // Batch-archive several old weeks at once (used by the auto-archive prompt)
  const archiveOldWeeks=(cands)=>{
    if(!cands||!cands.length)return;
    const ids=new Set(cands.map(c=>c.id));
    const stamped=cands.map(c=>({...c,archivedAt:new Date().toLocaleString()}));
    const newArchive=[...stamped,...archivedWeeks];
    setArchivedWeeks(newArchive);
    localStorage.setItem("fcbv2_archive",JSON.stringify(newArchive));
    const remaining=weeks.filter(w=>!ids.has(w.id));
    const finalWeeks=remaining.length?remaining:weeks;
    setWeeks(finalWeeks);setActiveWeek(0);
    setShowArchivePrompt(false);
    saveToSheets({weeks:finalWeeks,archive:newArchive});
  };

  // Restore an archived week back to the live board — syncs both arrays.
  const restoreArchivedWeek=(archIdx)=>{
    const w=archivedWeeks[archIdx];
    if(!w)return;
    const newArchive=archivedWeeks.filter((_,j)=>j!==archIdx);
    const newWeeks=[w,...weeks];
    setArchivedWeeks(newArchive);localStorage.setItem("fcbv2_archive",JSON.stringify(newArchive));
    setWeeks(newWeeks);setActiveWeek(0);
    saveToSheets({weeks:newWeeks,archive:newArchive});
  };
  // Permanently delete an archived week — syncs the archive.
  const deleteArchivedWeek=(archIdx)=>{
    const newArchive=archivedWeeks.filter((_,j)=>j!==archIdx);
    setArchivedWeeks(newArchive);localStorage.setItem("fcbv2_archive",JSON.stringify(newArchive));
    saveToSheets({archive:newArchive});
  };

  const LS_KEY="fcbv2_localdata";
  // Keep a ref with latest state so saveToSheets never has stale closure
  const latestState=useRef({});
  const weeksSnapshot=useRef([]); // tracks weeks for undo capture
  useEffect(()=>{latestState.current={weeks,customDrivers,customTrucks,customTrailers,dispatchers,truckAssignments,dispatcherEmails,archivedWeeks};weeksSnapshot.current=weeks;},[weeks,customDrivers,customTrucks,customTrailers,dispatchers,truckAssignments,dispatcherEmails,archivedWeeks]);

  // ── Live tracking — fetch from Apps Script every 60 seconds ──────────────
  useEffect(()=>{
    let cancelled=false;
    const fetchLive=async()=>{
      const url=(localStorage.getItem("fcbv2_sheetsUrl")||SHEETS_URL)+"?action=samsaraLocations";
      setLiveStatus("loading");
      try{
        const r=await fetch(url,{redirect:"follow"});
        if(!r.ok)throw new Error("HTTP "+r.status);
        const data=await r.json();
        if(cancelled)return;
        if(!data.ok){
          setLiveStatus("err");
          setLiveError(data.message||data.error||"Unknown error");
          return;
        }
        // Index by bare number — that's how the board references trucks/trailers.
        const tMap={},trMap={};
        (data.trucks||[]).forEach(t=>{if(t.number)tMap[t.number]={address:t.address,asOf:t.asOf,lat:t.lat,lng:t.lng,name:t.name};});
        (data.trailers||[]).forEach(t=>{if(t.number)trMap[t.number]={address:t.address,asOf:t.asOf,lat:t.lat,lng:t.lng,name:t.name};});
        setLiveTrucks(tMap);
        setLiveTrailers(trMap);
        setLiveStatus("ok");
        setLiveError("");
        setLiveFetchedAt(data.fetchedAt||new Date().toISOString());
      }catch(e){
        if(cancelled)return;
        setLiveStatus("err");
        setLiveError(e.message||String(e));
      }
    };
    fetchLive();
    const id=setInterval(fetchLive,60000);
    return()=>{cancelled=true;clearInterval(id);};
  },[]);

  // Helper: format "as of" → "2m ago" / "1h ago" / "5/22 10:06"
  const liveAgo=(iso)=>{
    if(!iso)return"";
    const t=new Date(iso).getTime();
    if(isNaN(t))return"";
    const diff=Date.now()-t;
    if(diff<0)return"just now";
    const m=Math.floor(diff/60000);
    if(m<1)return"just now";
    if(m<60)return m+"m ago";
    const h=Math.floor(m/60);
    if(h<24)return h+"h ago";
    const d=new Date(iso);
    return(d.getMonth()+1)+"/"+d.getDate();
  };

  // Helper: pick just the first name. "John Smith" → "John"; "Mary-Anne O'Brien" → "Mary-Anne"
  const firstName=(full)=>{
    const s=String(full||"").trim();
    if(!s)return"";
    return s.split(/\s+/)[0];
  };

  // Strip generic broker suffixes (Logistics, Solutions, Inc, LLC, Corp, Group)
  // so display is compact. "Arrive Logistics" → "Arrive", "Echo Global" → "Echo",
  // "RXO Capacity Solutions" → "RXO".
  const brokerShort=(b)=>{
    let s=String(b||"").trim();
    if(!s)return"";
    // If broker is "Name & LoadNum", drop the suffix at this stage
    if(s.indexOf("&")>=0)s=s.split("&")[0].trim();
    // Drop generic words that don't help identify the broker
    s=s.replace(/\b(Logistics?|Solutions?|Group|Inc\.?|LLC|Corp\.?|Corporation|Global|Capacity|Services?)\b/gi,"").trim();
    // Clean up double spaces / trailing punctuation
    s=s.replace(/\s+/g," ").replace(/[,\.\-\s]+$/,"").trim();
    return s;
  };

  // Statuses where we hide the live location pill — load is already at the
  // yard/dock/being-handled-internally, the local driver is no longer relevant.
  const STATUS_HIDE_PILL={"Yard":1,"Dock":1,"Loaded":1,"Delivered":1};

  const saveToSheets=useCallback((data)=>{
    const isArr=Array.isArray(data);
    const ls=latestState.current;
    const w=isArr?data:(data.weeks!==undefined?data.weeks:(ls.weeks||[]));
    const cd=isArr?(ls.customDrivers||[]):(data.customDrivers!==undefined?data.customDrivers:(ls.customDrivers||[]));
    const ct=isArr?(ls.customTrucks||[]):(data.customTrucks!==undefined?data.customTrucks:(ls.customTrucks||[]));
    const ctr=isArr?(ls.customTrailers||[]):(data.customTrailers!==undefined?data.customTrailers:(ls.customTrailers||[]));
    const disp=isArr?(ls.dispatchers||[]):(data.dispatchers!==undefined?data.dispatchers:(ls.dispatchers||[]));
    const ta=isArr?(ls.truckAssignments||{}):(data.truckAssignments!==undefined?data.truckAssignments:(ls.truckAssignments||{}));
    // archive syncs too — never silently lost, and consistent across devices
    const arch=isArr?(ls.archivedWeeks||[]):(data.archive!==undefined?data.archive:(ls.archivedWeeks||[]));
    clearTimeout(saveTimer.current);setSaveStatus("saving");
    // F1: Quick check — has server been updated since we last loaded?
    // We check by re-loading savedAt only (fast, no-cors so we can't read response directly)
    // Instead we track: if sheetsSave was called by someone else our next sheetsLoad will catch it
    // The practical guard: if local savedAt < lastLoadedServerTs+5s something is wrong, warn
    saveTimer.current=setTimeout(async()=>{
      // Always save localStorage first — data is safe regardless of Sheets result
      try{
        // Save real photos to a separate localStorage key (photos are too big for Sheets)
        const photoStore={};
        const wNoPhotos=w.map(function(wk){
          return {...wk,groups:(wk.groups||[]).map(function(g){
            return {...g,loads:(g.loads||[]).map(function(l){
              // Keep URL photos in data (they're tiny strings); only cache base64 to separate key
              var urlPh=(l.photos||[]).filter(function(p){return p&&typeof p==="object"&&p.url;});
              var dataPh=(l.photos||[]).filter(function(p){return p&&typeof p==="object"&&p.data;});
              if(dataPh.length>0)photoStore[l.id]=dataPh;
              // Store URL photos inline (just the url string is small); strip base64 data
              var storedPhotos=urlPh.concat(dataPh.length>0?[{"__has_":dataPh.length}]:[]);
              return {...l,photos:storedPhotos.length>0?storedPhotos:[]};
            })};
          })};
        });
        try{localStorage.setItem("fcbv2_photos",JSON.stringify(photoStore));}catch(e){}
        localStorage.setItem(LS_KEY,JSON.stringify({weeks:wNoPhotos,customDrivers:cd,customTrucks:ct,customTrailers:ctr,dispatchers:disp,truckAssignments:ta,archive:arch,savedAt:Date.now()}));
        localStorage.setItem("fcbv2_truckassign",JSON.stringify(ta));
      }catch(e){}
      // Sheets save — no-cors fetch always throws TypeError on redirect but data still saves
      try{
        await sheetsSave({weeks:w,customDrivers:cd,customTrucks:ct,customTrailers:ctr,dispatchers:disp,truckAssignments:ta,archive:arch,dispatcherEmails:(ls.dispatcherEmails&&ls.dispatcherEmails.length?ls.dispatcherEmails:(()=>{try{return JSON.parse(localStorage.getItem("fcbv2_disp_emails")||"[]");}catch(e){return[];}})()),
        adminPin:localStorage.getItem(ADMIN_PIN_KEY)||"",viewerPin:localStorage.getItem(VIEWER_PIN_KEY)||""});
        setSaveStatus("saved");setTimeout(()=>setSaveStatus("idle"),3000);
      }catch(err){
        // TypeError = no-cors redirect quirk — data already in localStorage, treat as saved
        setSaveStatus("saved");setTimeout(()=>setSaveStatus("idle"),3000);
      }
    },1000);
  },[]);

  const setWeeksAndSave=useCallback((updater)=>{
    // Capture current weeks BEFORE update for undo (using ref to avoid stale closure)
    const snapshot=weeksSnapshot.current;
    setUndoStack(stk=>[snapshot,...stk].slice(0,10));
    setWeeks(prev=>{
      const next=typeof updater==="function"?updater(prev):updater;
      saveToSheets(next);
      return next;
    });
  },[saveToSheets]);

  const week=weeks[Math.min(activeWeek,weeks.length-1)];
  // Merged set: live + archived weeks. Used by statistics, driver scores, top
  // dispatchers, and the Stats tab — anywhere that asks "what's the lifetime
  // performance?". Archiving a week must NEVER erase its contribution to history.
  // For editing/saving/active operations, keep using `weeks` (live only).
  const allTimeWeeks=React.useMemo(()=>[...weeks,...archivedWeeks],[weeks,archivedWeeks]);

  // ─── MAIN BOARD PARSER ───────────────────────────────────────────────────
  // Parses a Google Sheets HTML export of the weekly Main Board and extracts
  // per-dispatcher, per-driver data. Structure of the sheet (constants that
  // apply for the OTR sections we care about):
  //
  //   - One <table> containing all rows for the week
  //   - Dispatcher sections are stacked vertically
  //   - Each section is 8-11 drivers × 4 rows each (name+truck, phone, MILES, GROSS)
  //   - Section ends with a summary row: "Dispatcher | $RPM | Gross: | $totalGross | /truck | ..."
  //   - Local section starts around row 393 (after the last OTR section)
  //   - We ONLY read OTR sections. Locals are ignored per user spec.
  //
  // We do NOT hardcode row numbers because they may vary. Instead we walk the
  // rows and use structural signals: summary rows terminate a section; driver
  // header rows have a numeric position index in col 1 (1-11).
  const parseMainBoardHTML=(htmlText)=>{
    const parser=new DOMParser();
    const doc=parser.parseFromString(htmlText,"text/html");
    const table=doc.querySelector("table");
    if(!table)return{ok:false,error:"No <table> found in the HTML. Is this a Google Sheets export?"};
    // Turn table into a 2D grid of trimmed cell text
    const trs=Array.from(table.querySelectorAll("tr"));
    const grid=trs.map(tr=>Array.from(tr.querySelectorAll("td,th")).map(td=>(td.textContent||"").trim()));
    // Identify summary rows: contain "Gross:" AND "/truck". The cell BEFORE "$RPM" is the dispatcher name.
    // Row format: [rowNum, dispName, "$RPM", "Gross:", "$totalGross", "/truck", ...]
    const summaryIdxs=[];
    grid.forEach((row,i)=>{
      const rt=row.join(" ");
      if(rt.includes("Gross:")&&rt.includes("/truck")){
        // Skip the Zygis/Laura LOCALS summary — we don't process locals
        if(rt.toLowerCase().includes("zygis/laura"))return;
        // Skip the master totals row if any
        summaryIdxs.push(i);
      }
    });
    if(!summaryIdxs.length)return{ok:false,error:"No dispatcher summary rows found. Sheet layout may have changed."};
    // Sections span from previous section end (or top) to just before current summary
    const sections=[];
    let prevEnd=0;
    summaryIdxs.forEach(sumIdx=>{
      const row=grid[sumIdx];
      // Find dispatcher name — it's the first cell after the row-number that isn't blank
      // and isn't a $ figure. Usually col 1 or 2.
      let dispName="";
      for(let c=1;c<row.length;c++){
        const v=row[c];
        if(!v)continue;
        if(v.startsWith("$"))continue;
        if(/^Gross:$|^\/truck$|^miles$/i.test(v))continue;
        // Skip pure numbers
        if(/^-?\d[\d,]*(\.\d+)?$/.test(v))continue;
        dispName=v;
        break;
      }
      if(!dispName){prevEnd=sumIdx+1;return;}
      // Skip local section entirely — its summary is Zygis/Laura, which we already excluded above.
      // But we also want to skip if we've already crossed into the local section area.
      // Heuristic: locals have very different structure (single-column load rows). If most rows
      // in the range look like "Broker & 12345" style, skip. Simpler: skip anything after row 380.
      if(sumIdx>=500){prevEnd=sumIdx+1;return;}
      sections.push({dispName,startRow:prevEnd,endRow:sumIdx-1,summaryRow:sumIdx});
      prevEnd=sumIdx+1;
    });
    // For each section, walk 4-row driver blocks and pull name/truck/phone/gross
    const dispatchersOut=[];
    sections.forEach(sec=>{
      const drivers=[];
      let i=sec.startRow;
      while(i<=sec.endRow-3){ // need at least 4 rows for a driver block
        const r1=grid[i]||[];  // driver header: # | # | name+co | truck# | day1 pickup | ...
        const r2=grid[i+1]||[]; // phone + deliveries
        const r3=grid[i+2]||[]; // "MILES" + total + per-day
        const r4=grid[i+3]||[]; // "GROSS" + total + per-day
        // A driver block starts when col 1 is a small integer (driver slot 1-11) AND col 3 is MILES-like row below
        const isDriverHeader=r1[1]&&/^\d{1,2}$/.test(r1[1])&&r3[1]==="MILES"&&r4[1]==="GROSS";
        if(!isDriverHeader){i++;continue;}
        // Extract driver info
        const rawName=(r1[2]||"").replace(/\*+\s*Co[- ]?driver.*/i,"").replace(/\*+/g,"").trim();
        const truck=(r1[3]||"").trim();
        const phone=(r2[2]||"").trim();
        // Gross = col 2 of GROSS row, format "$1,234" or "$1,234.56"
        const grossStr=(r4[2]||"").replace(/[$,\s]/g,"");
        const gross=parseFloat(grossStr);
        // Skip empty driver slots (no name, no gross)
        if(rawName&&isFinite(gross)&&gross>0){
          drivers.push({name:rawName,truck,phone,gross:Math.round(gross)});
        }
        i+=4;
      }
      if(drivers.length>0){
        dispatchersOut.push({name:sec.dispName,drivers});
      }
    });
    if(!dispatchersOut.length)return{ok:false,error:"Parsed the file but found no drivers with gross > 0."};
    // Try to detect the week label from filename or first row
    // Detect the week's date range from the top of the sheet. The Main Board has
    // date cells for Monday through Sunday in row 2 (or thereabouts). We collect
    // ALL dates from the first 10 rows, sort chronologically, and take the first
    // (Monday) and last (Sunday) — these form the canonical week key and label.
    const parseSheetDate=(s)=>{
      const m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
      if(!m)return null;
      const mm=parseInt(m[1],10),dd=parseInt(m[2],10),yy=parseInt(m[3],10);
      if(mm<1||mm>12||dd<1||dd>31)return null;
      return new Date(yy,mm-1,dd);
    };
    const foundDates=new Set();
    for(let r=0;r<Math.min(10,grid.length);r++){
      for(const cell of (grid[r]||[])){
        const d=parseSheetDate(cell);
        if(d)foundDates.add(d.getTime());
      }
    }
    const sortedDates=Array.from(foundDates).sort((a,b)=>a-b).map(t=>new Date(t));
    let weekKey="",weekLabel="";
    if(sortedDates.length>0){
      const mon=sortedDates[0];
      const sun=sortedDates.length>=2?sortedDates[sortedDates.length-1]:mon;
      const fmt=d=>(d.getMonth()+1)+"-"+d.getDate()+"-"+d.getFullYear();
      // weekKey = ISO-like format of Monday date, used to detect same-week uploads
      // even when filenames differ (browser adds "(1)", user renames, etc.)
      weekKey=mon.getFullYear()+"-"+String(mon.getMonth()+1).padStart(2,"0")+"-"+String(mon.getDate()).padStart(2,"0");
      // weekLabel = human-friendly "6-29-2026 → 7-5-2026"
      weekLabel=fmt(mon)+" → "+fmt(sun);
    }
    return{ok:true,weekKey,weekLabel,dispatchers:dispatchersOut};
  };

  // Bonus tier lookup: NET gross → dollar bonus. Rounds DOWN to nearest $1k.
  // Caps at $600 for $20k+.
  const bonusForGross=(netGross)=>{
    if(netGross<8000)return{amount:0,tier:0};
    const tier=Math.min(Math.floor(netGross/1000),20);
    const table={8:50,9:75,10:100,11:150,12:200,13:250,14:300,15:350,16:400,17:450,18:500,19:550,20:600};
    return{amount:table[tier]||0,tier:tier*1000};
  };

  // Payroll calculator. Main Board is source of truth for dispatchers/drivers/gross.
  // Freight Board is used ONLY for the Zygis 10%-on-combined-trailers piece, since
  // that requires knowing which trailers had 2+ loads.
  const computePayroll=(mainBoardData,freightWeek)=>{
    if(!mainBoardData||!mainBoardData.dispatchers||!mainBoardData.dispatchers.length){
      return{dispatchers:[],combinedTrailers:[]};
    }
    // Pre-compute Zygis combined trailers from Freight Board (used only for Zygis's slice).
    // MUST match the Dashboard's `extraAdded` formula exactly so the two numbers
    // always reconcile: Dashboard extraAdded × 10% = Zygis's 10% payroll.
    // Formula: every trailer with 2+ loads counts (no delivery-status filter),
    // sort loads by rate desc, drop top, sum the rest, take 10%.
    const combinedTrailers=[];
    if(freightWeek&&(freightWeek.groups||[]).length){
      (freightWeek.groups||[]).forEach(g=>{
        const loads=g.loads||[];
        if(loads.length<2)return;
        combinedTrailers.push({
          gid:g.id,
          groupDriver:g.groupDriver||"",
          loads:loads.map(l=>({id:l.id,rate:parseFloat(l.rate)||0,broker:l.broker||"",sr:l.sr||""}))
        });
      });
    }
    const results=[];
    mainBoardData.dispatchers.forEach(disp=>{
      const isZygis=/(zygis|ziggy)/i.test(String(disp.name||""));
      const activeDrivers=disp.drivers.filter(d=>d.gross>0);
      const driverCount=activeDrivers.length;
      // Base compensation
      let base=0,baseNote="";
      if(isZygis){
        base=200*driverCount;
        baseNote=`$200 × ${driverCount} driver${driverCount===1?"":"s"}`;
      } else {
        base=1500;
        baseNote="$1,500 flat (up to 8 drivers)";
        if(driverCount>8){
          const over=driverCount-8;
          base+=over*200;
          baseNote=`$1,500 base + $200 × ${over} driver${over===1?"":"s"} over 8`;
        }
      }
      // 10% combined trailers — Zygis only
      const ten={total:0,trailers:[]};
      if(isZygis){
        combinedTrailers.forEach(t=>{
          const sorted=t.loads.slice().sort((a,b)=>b.rate-a.rate);
          const dropped=sorted[0];
          const contributing=sorted.slice(1);
          const share=contributing.reduce((s,l)=>s+l.rate,0)*0.10;
          ten.trailers.push({gid:t.gid,groupDriver:t.groupDriver,dropped,contributing,share:Math.round(share*100)/100});
          ten.total+=share;
        });
        ten.total=Math.round(ten.total*100)/100;
      }
      // Per-driver bonuses — Main Board gross is already NET, use as-is
      const driversWithBonuses=activeDrivers.map(d=>{
        const b=bonusForGross(d.gross);
        return{...d,bonus:b.amount,tier:b.tier};
      }).sort((a,b)=>b.gross-a.gross);
      const bonusTotal=driversWithBonuses.reduce((s,d)=>s+d.bonus,0);
      const computed=base+ten.total+bonusTotal;
      // Manual override — keyed by freight week id (or "noweek" if none)
      const ovKey=freightWeek?.id||"noweek";
      const ov=payrollOverrides[ovKey]?.[disp.name];
      const total=ov&&ov.amount!==""&&ov.amount!=null?parseFloat(ov.amount):computed;
      results.push({
        name:disp.name,
        isZygis,
        driverCount,
        drivers:driversWithBonuses,
        base,baseNote,
        combinedTenPercent:ten,
        bonusTotal,
        computed:Math.round(computed*100)/100,
        override:ov||null,
        total:Math.round(total*100)/100
      });
    });
    // Sort: Zygis first, others by total desc
    results.sort((a,b)=>{
      if(a.isZygis&&!b.isZygis)return -1;
      if(!a.isZygis&&b.isZygis)return 1;
      return b.total-a.total;
    });
    return{dispatchers:results,combinedTrailers};
  };
  const computed=useMemo(()=>(week?.groups||[]).map(calcGroup),[week?.groups]);
  const allLoads=computed.flatMap(g=>g.loads);
  const totGross=computed.reduce((s,g)=>s+g.gross,0);
  const totLocal=computed.reduce((s,g)=>s+g.loc,0);
  const totAcc=(week?.accessorials||[]).reduce((s,a)=>s+(parseFloat(a.amount)||0),0);
  const tomorrowDay=useMemo(()=>{const d=new Date(today);d.setDate(d.getDate()+1);return d;},[today]);
  const allPendingGroups=(()=>{
    const todayT=today.getTime();
    const base=computed.filter(g=>g.groupStatus!=="In Transit"&&g.groupStatus!=="Delivered");
    const earliestPU=g=>Math.min(...(g.loads||[]).map(l=>parseTS(l.pickup)));
    const isToday=g=>(g.loads||[]).some(l=>{const d=parsePickupDate(l.pickup);return d&&d.getTime()===todayT;});
    const isSingle=g=>(g.loads||[]).length===1;
    // Bucket: 0=single+today, 1=multi+today, 2=single+future, 3=multi+future
    const bucket=g=>{const t=isToday(g),s=isSingle(g);return t&&s?0:t&&!s?1:!t&&s?2:3;};
    // planSort override: sort by clicked column using first stop only
    if(planSort==="pickup"){
      return [...base].sort((a,b)=>{
        const fa=(a.loads||[])[0],fb=(b.loads||[])[0];
        // Compare by date only (strip time) for grouping
        const da=parsePickupDate(fa?.pickup),db=parsePickupDate(fb?.pickup);
        const dtA=da?da.getTime():Infinity,dtB=db?db.getTime():Infinity;
        if(dtA!==dtB)return dtA-dtB; // different dates → sort by date
        // Same date → singles before doubles
        const sa=(a.loads||[]).length===1,sb=(b.loads||[]).length===1;
        if(sa!==sb)return sa?-1:1;
        // Same date + same type → sort by time
        return parseTS(fa?.pickup)-parseTS(fb?.pickup);
      });
    }
    if(planSort==="delivery"){
      return [...base].sort((a,b)=>{
        const fa=(a.loads||[])[0],fb=(b.loads||[])[0];
        const da=parsePickupDate(fa?.delivery),db=parsePickupDate(fb?.delivery);
        const dtA=da?da.getTime():Infinity,dtB=db?db.getTime():Infinity;
        if(dtA!==dtB)return dtA-dtB;
        const sa=(a.loads||[]).length===1,sb=(b.loads||[]).length===1;
        if(sa!==sb)return sa?-1:1;
        return parseTS(fa?.delivery)-parseTS(fb?.delivery);
      });
    }
    return [...base].sort((a,b)=>{
      const ba=bucket(a),bb=bucket(b);
      if(ba!==bb)return ba-bb;
      return earliestPU(a)-earliestPU(b);
    });
  })();
  const pendingGroups=boardFilter==="all"?allPendingGroups:boardFilter==="today"?computed.filter(g=>g.loads.some(l=>{const d=parsePickupDate(l.pickup);return d&&d.getTime()===today.getTime();})||g.loads.some(l=>{const d=parsePickupDate(l.delivery);return d&&d.getTime()===today.getTime();})):boardFilter==="tomorrow"?computed.filter(g=>g.loads.some(l=>{const d=parsePickupDate(l.pickup);return d&&d.getTime()===tomorrowDay.getTime();})):boardFilter==="active"?computed.filter(g=>g.groupStatus==="In Transit"||g.groupStatus==="Dispatched"||g.groupStatus==="Driver assigned"):boardFilter==="pending"?computed.filter(g=>g.groupStatus==="Pending"||g.groupStatus==="Loaded"):boardFilter==="done"?computed.filter(g=>g.groupStatus==="Delivered"):allPendingGroups;
  const otrGroups=boardFilter==="all"?computed.filter(g=>g.groupStatus==="In Transit"||g.groupStatus==="Delivered"):[];
  const cToday=allLoads.filter(l=>{const pd=parsePickupDate(l.pickup);const done=["Picked Up","In Transit","Loaded","Delivered"].includes(l.status||"");return pd&&pd.getTime()===today.getTime()&&!done;}).length;
  const cTomorrow=allLoads.filter(l=>{const pd=parsePickupDate(l.pickup);const done=["Picked Up","In Transit","Loaded","Delivered"].includes(l.status||"");return pd&&pd.getTime()===tomorrow.getTime()&&!done;}).length;
  const cFuture=allLoads.filter(l=>{const pd=parsePickupDate(l.pickup);const done=["Picked Up","In Transit","Loaded","Delivered"].includes(l.status||"");return pd&&pd.getTime()>tomorrow.getTime()&&pd.getTime()<new Date("2100-01-01").getTime()&&!done;}).length;
  const cDelToday=allLoads.filter(l=>{const pd=parsePickupDate(l.delivery);return pd&&pd.getTime()===today.getTime();}).length;
  const cDelTomorrow=allLoads.filter(l=>{const pd=parsePickupDate(l.delivery);return pd&&pd.getTime()===tomorrow.getTime();}).length;
  const cDelivered=allLoads.filter(l=>l.status==="Delivered").length;
  const cLocalToday=(week?.localDeliveries||[]).filter(r=>{const pd=parsePickupDate(r.datetime);return pd&&pd.getTime()===today.getTime();}).length;
  const cLocalTomorrow=(week?.localDeliveries||[]).filter(r=>{const pd=parsePickupDate(r.datetime);return pd&&pd.getTime()===tomorrow.getTime();}).length;
  const cCrossdock=(week?.crossdockDrops||[]).filter(r=>r.status!=="Delivered").length;
  const wagesBase=computed.filter(g=>g.loads.length>1).reduce((s,g)=>{const rates=g.loads.map(l=>l.tripPrice).sort((a,b)=>b-a);return s+rates.slice(1).reduce((x,r)=>x+r,0);},0);
  const overallRPM=(()=>{const totalMi=computed.reduce((s,g)=>s+(g.calcTripMi||0),0);const net=totGross-totLocal;return totalMi>0?+((net/totalMi).toFixed(2)):null;})();

  const setW=(f,v)=>setWeeksAndSave(p=>p.map((w,i)=>i!==activeWeek?w:{...w,[f]:v}));
  const toggleSection=k=>setW("openSections",{...week.openSections,[k]:!week.openSections?.[k]});
  const setLoad=(gid,lid,f,v)=>setW("groups",week.groups.map(g=>g.id!==gid?g:{...g,loads:g.loads.map(l=>l.id!==lid?l:{...l,[f]:v})}));
  // Upload photo to Supabase Storage, returns public URL or null
  const uploadPhotoToSupabase=async(file,loadId)=>{
    if(!supabaseUrl||!supabaseKey)return null;
    try{
      const bucket=supabaseBucket||"freight-photos";
      const ext=file.name.split(".").pop()||"jpg";
      const path=`loads/${loadId}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const resp=await fetch(`${supabaseUrl}/storage/v1/object/${bucket}/${path}`,{
        method:"POST",
        headers:{"Authorization":`Bearer ${supabaseKey}`,"Content-Type":file.type||"image/jpeg","x-upsert":"true"},
        body:file,
      });
      if(!resp.ok){const e=await resp.text();console.error("Supabase upload failed:",e);return null;}
      return `${supabaseUrl}/storage/v1/object/public/${bucket}/${path}`;
    }catch(err){console.error("Supabase upload error:",err);return null;}
  };

  const setLoadFields=(gid,lid,fields)=>setW("groups",week.groups.map(g=>g.id!==gid?g:{...g,loads:g.loads.map(l=>l.id!==lid?l:{...l,...fields})}));

  // Auto-set load status based on pickup date when status is empty
  // Today/Tomorrow/Overdue → "Need to pickup" | future → stays empty
  // Auto-advance status. Runs only when switching weeks (week.id dep).
  // IMPORTANT: a load is only auto-Dispatched if THAT LOAD has its own
  // driver field set. Inheriting from g.groupDriver here was incorrect —
  // it caused brand-new loads added to an existing trailer to be silently
  // flipped to Dispatched even though they had no driver of their own.
  React.useEffect(()=>{
    if(!isAdmin||!week)return;
    const todayTs=today.getTime();
    const tomorrowTs=tomorrowDay.getTime();
    let changed=false;
    const updated=(week.groups||[]).map(g=>{
      if(g.isCombined||g.groupStatus==="In Transit"||g.groupStatus==="Delivered")return g;
      const newLoads=(g.loads||[]).map(l=>{
        const ownDriver=((l.driver||"")+"").trim();   // ONLY the load's own driver
        const st=l.status||"";
        // Auto-advance: load has its OWN driver but no dispatched-or-later status

          changed=true;
          return{...l,status:"Dispatched"};
        }
        if(st)return l; // already has a status — don't override

        if(pt&&(pt===todayTs||pt===tomorrowTs||pt<todayTs)){

          return{...l,status:"Need to pickup"};
        }

      });
      return newLoads===g.loads?g:{...g,loads:newLoads};
    });
    if(changed)setW("groups",updated);
  },[week?.id]);

  // ── NEEDS ATTENTION + DUPLICATE DETECTION ─────────────────────────
  const attention=useMemo(()=>{
    const PROGRESS_ST=["Dispatched","Dock","Yard","Picked Up","In Transit","Loaded"];
    const items=[],dups=[];
    const todayT=today.getTime();
    (weeks||[]).forEach((w,wi)=>{
      // problem scan
      (w.groups||[]).forEach(g=>{
        if(g.groupStatus==="Delivered")return;
        (g.loads||[]).forEach(l=>{
          const driver=((l.driver||g.groupDriver||"")+"").trim();
          const st=((l.status||"")+"").trim();
          const pd=parsePickupDate(l.pickup);
          const dd=parsePickupDate(l.delivery);
          const pt=pd?pd.getTime():null;
          const dt=dd?dd.getTime():null;
          const inProg=PROGRESS_ST.indexOf(st)>=0;
          let reason=null,sev=0;
          if(pt&&pt<=todayT&&!driver&&st!=="Delivered"&&!inProg){
            reason=pt<todayT?"No driver — pickup overdue":"No driver — pickup is today";sev=3;
          } else if(dt&&dt<todayT&&st!=="Delivered"){
            reason="Delivery date passed — mark delivered?";sev=2;
          } else if(pt&&pt<todayT&&st===""){
            reason="Pickup date passed — no status set";sev=1;
          }
          if(reason){
            // key includes a reason code so a genuinely DIFFERENT problem on the same load resurfaces after dismissal
            const rk="s"+sev;
            items.push({key:w.id+"_"+l.id+"_"+rk,weekId:w.id,weekIdx:wi,weekLabel:w.label||"Week",loadId:l.id,sr:l.sr||"\u2014",pickup:l.pickup||"",delivery:l.delivery||"",reason,sev});
          }
        });
      });
      // duplicate scan — within this week only; broker + load # exact match only
      const bm={},seen={};
      (w.groups||[]).forEach(g=>(g.loads||[]).forEach(l=>{
        const bk=((l.broker||"")+"").trim().toLowerCase();
        // require BOTH a broker name and a load # (the "&" separator) — bare broker alone is normal business
        if(bk&&bk.indexOf("&")>=0){
          const parts=bk.split("&");
          if(parts[0].trim()&&parts[1]&&parts[1].trim())(bm[bk]=bm[bk]||[]).push(l);
        }
      }));
      const flag=(map,kind)=>{Object.keys(map).forEach(k=>{const arr=map[k];if(arr.length>1)arr.forEach(l=>{if(seen[l.id])return;seen[l.id]=1;dups.push({key:w.id+"_d_"+l.id,weekId:w.id,weekIdx:wi,weekLabel:w.label||"Week",loadId:l.id,sr:l.sr||"\u2014",broker:l.broker||"",kind});});});};
      flag(bm,"broker / load #");
    });
    items.sort((a,b)=>b.sev-a.sev||a.weekIdx-b.weekIdx);
    const visItems=items.filter(it=>!dismissedNotifs.has(it.key));
    const visDups=dups.filter(d=>!dismissedNotifs.has(d.key));
    return {items:visItems,dups:visDups,count:visItems.length+visDups.length,hiddenCount:(items.length-visItems.length)+(dups.length-visDups.length)};
  },[weeks,today,dismissedNotifs]);
  const dupLoadIds=useMemo(()=>{
    const s=new Set();
    if(week){
      const bm={};
      (week.groups||[]).forEach(g=>(g.loads||[]).forEach(l=>{
        const bk=((l.broker||"")+"").trim().toLowerCase();
        if(bk&&bk.indexOf("&")>=0){
          const parts=bk.split("&");
          if(parts[0].trim()&&parts[1]&&parts[1].trim())(bm[bk]=bm[bk]||[]).push(l.id);
        }
      }));
      Object.keys(bm).forEach(k=>{if(bm[k].length>1)bm[k].forEach(id=>s.add(id));});
    }
    return s;
  },[week]);

  // ── SUGGESTIONS SCANNER: audits the current week for data-quality issues ──
  // Severity: 3=error (red), 2=warning (orange), 1=tip (yellow).
  const suggestionScan=useMemo(()=>{
    const issues=[];
    const w=week;
    if(!w)return {issues:[],total:0,bySev:{3:0,2:0,1:0}};
    const todayT=today.getTime();
    const add=(sev,cat,code,refId,title,detail,jump)=>issues.push({sev,cat,code,refId,title,detail,jump});

    const groups=w.groups||[];
    const allLoads=[];
    groups.forEach(g=>(g.loads||[]).forEach(l=>allLoads.push({l,g})));

    allLoads.forEach(({l,g})=>{

      const st=((l.status||"")+"").trim();
      const pd=parsePickupDate(l.pickup);
      if(!sr) add(2,"OTR","noroute",l.id,"Load missing route","A load has no shipper/receiver filled in.",{loadId:l.id,weekId:w.id});
      if(!l.pickup||!(l.pickup+"").trim()) add(3,"OTR","nopickup",l.id,"No pickup date — "+label,"This load has no pickup date set.",{loadId:l.id,weekId:w.id});
      if(!l.delivery||!(l.delivery+"").trim()) add(2,"OTR","nodelivery",l.id,"No delivery date — "+label,"This load has no delivery date set.",{loadId:l.id,weekId:w.id});
      if((!l.rate||!(l.rate+"").trim()||parseFloat(l.rate)===0)&&st!=="Delivered") add(2,"OTR","norate",l.id,"No rate — "+label,"This load has no rate entered.",{loadId:l.id,weekId:w.id});
      if(!driver&&st!=="Delivered") add(2,"OTR","nodriver",l.id,"No driver — "+label,"This load has no driver assigned.",{loadId:l.id,weekId:w.id});
      if(!l.broker||!(l.broker+"").trim()) add(1,"OTR","nobroker",l.id,"No broker/load # — "+label,"Broker and load number are blank.",{loadId:l.id,weekId:w.id});
      if(pd&&pd.getTime()<todayT-3*86400000&&st!=="Delivered") add(2,"OTR","stale",l.id,"Stale load — "+label,"Pickup was over 3 days ago and it is not marked Delivered.",{loadId:l.id,weekId:w.id});
    });

    // ---- empty trailers ----
    groups.forEach(g=>{
      const loads=g.loads||[];
      const real=loads.filter(l=>(l.sr||"").trim()||(l.broker||"").trim());
      if(loads.length===0||real.length===0) add(1,"OTR","emptytrailer",g.id,"Empty trailer","A trailer group has no real loads in it — consider removing it.",null);
    });

    // ---- duplicates (reuse the same broker+load# logic) ----
    const bm={};
    allLoads.forEach(({l})=>{
      const bk=((l.broker||"")+"").trim().toLowerCase();
      if(bk&&bk.indexOf("&")>=0){const p=bk.split("&");if(p[0].trim()&&p[1]&&p[1].trim())(bm[bk]=bm[bk]||[]).push(l);}

    // ---- local deliveries ----
    (w.localDeliveries||[]).forEach(r=>{

      if(!r.location||!(r.location+"").trim()) add(2,"Crossdock","noloc",r.id,"Crossdock drop missing location","A crossdock drop row has no location.",null);
      if(!r.datetime||!(r.datetime+"").trim()) add(1,"Crossdock","nodate",r.id,"Crossdock drop missing date","A crossdock drop has no date/time.",null);
    });

    // ---- accessorials ----
    (w.accessorials||[]).forEach(r=>{
      const amt=parseFloat(r.amount);
      if(!r.amount||isNaN(amt)||amt===0) add(2,"Accessorial","noamount",r.id,"Accessorial has no amount","An accessorial ("+(r.type||"item")+") has no dollar amount.",null);
      if(!r.broker||!(r.broker+"").trim()) add(1,"Accessorial","nobroker",r.id,"Accessorial missing broker","An accessorial has no broker filled in.",null);
    });

    // ---- week-level ----
    if(!w.label||/new week/i.test(w.label||"")) add(1,"Week","genericlabel","wk","Week has a generic label","This week is still labelled \u201CNew Week\u201D \u2014 set a proper date range.",null);

  // Helper: is THIS load flagged? Returns truthy when there's any flag.
  const isLoadFlagged=(load,group)=>!!getLoadFlag(load,group);

  // Close flag picker on any outside click. The picker buttons stop propagation,
  // so a click that bubbles up to the document means user clicked elsewhere.
  //
  // SUBTLE BUG WE'RE GUARDING AGAINST: when the user clicks the ⏳ button to OPEN
  // the picker, that same click event is still propagating up the DOM. If we install
  // the document listener synchronously, it catches that opening click and
  // immediately closes the picker. Defer the listener install to the next tick
  // so the opening click finishes first.
  React.useEffect(()=>{
    if(!flagPickerFor)return;
    let cancelled=false;
    const handler=()=>setFlagPickerFor(null);
    const t=setTimeout(()=>{
      if(!cancelled)document.addEventListener("click",handler);
    },0);
    return()=>{
      cancelled=true;
      clearTimeout(t);
      document.removeEventListener("click",handler);
    };
  },[flagPickerFor]);

  // Popup menu shown when user clicks the ⏳ button. Anchored to the button via
  // absolute positioning. Three options: Waiting new appt, Important, Clear.
  // Open the flag picker, anchoring its popup below the button that was clicked.
  // We capture the button's screen position so the picker can render as
  // position:fixed at the document root, escaping all overflow:hidden parents
  // (the compact view's # cell clips a normally-positioned popup).
  const openFlagPicker=(e,gid,lid)=>{
    e.stopPropagation();
    const key=gid+":"+lid;
    if(flagPickerFor&&flagPickerFor.key===key){
      setFlagPickerFor(null);
      return;
    }
    const rect=e.currentTarget.getBoundingClientRect();
    setFlagPickerFor({
      key,gid,lid,
      x:rect.left,
      y:rect.bottom+4
    });
  };

  // Popup menu shown when user clicks the ⏳ button. Rendered as a
  // position:fixed overlay anchored to the button's coordinates so it can't
  // be clipped by parent overflow:hidden.
  const renderFlagPickerOverlay=()=>{
    if(!flagPickerFor)return null;
    const{gid,lid,x,y}=flagPickerFor;
    // Find the load and current flag
    const g=week.groups.find(g=>g.id===gid);
    const l=g&&g.loads.find(l=>l.id===lid);
    if(!l)return null;
    const currentFlag=getLoadFlag(l,g);
    // Keep popup on-screen if near the right edge
    const viewportW=typeof window!=="undefined"?window.innerWidth:1200;
    const finalX=Math.min(x,viewportW-200);
    return(
      <div onClick={e=>e.stopPropagation()}
        style={{position:"fixed",top:y+"px",left:finalX+"px",background:"#fff",border:"1px solid #cbd5e1",borderRadius:"6px",boxShadow:"0 4px 14px rgba(0,0,0,.22)",zIndex:9999,minWidth:"180px",padding:"4px",fontSize:"12px"}}>
        <button onClick={e=>{e.stopPropagation();setLoadFlag(gid,lid,"reschedule");setFlagPickerFor(null);}}
          style={{display:"flex",alignItems:"center",gap:"8px",width:"100%",padding:"6px 8px",background:currentFlag==="reschedule"?"#fef3c7":"transparent",border:"none",borderRadius:"4px",cursor:"pointer",textAlign:"left",fontSize:"12px",fontWeight:"600",color:"#92400e"}}>
          <span style={{width:"10px",height:"10px",borderRadius:"50%",background:"#eab308",flexShrink:0}}/>
          Waiting new appt
          {currentFlag==="reschedule"&&<span style={{marginLeft:"auto",color:"#059669"}}>✓</span>}
        </button>
        <button onClick={e=>{e.stopPropagation();setLoadFlag(gid,lid,"important");setFlagPickerFor(null);}}
          style={{display:"flex",alignItems:"center",gap:"8px",width:"100%",padding:"6px 8px",background:currentFlag==="important"?"#fee2e2":"transparent",border:"none",borderRadius:"4px",cursor:"pointer",textAlign:"left",fontSize:"12px",fontWeight:"600",color:"#991b1b"}}>
          <span style={{width:"10px",height:"10px",borderRadius:"50%",background:"#ef4444",flexShrink:0}}/>
          Important — pick first
          {currentFlag==="important"&&<span style={{marginLeft:"auto",color:"#059669"}}>✓</span>}
        </button>
        {currentFlag&&(
          <button onClick={e=>{e.stopPropagation();setLoadFlag(gid,lid,null);setFlagPickerFor(null);}}
            style={{display:"flex",alignItems:"center",gap:"8px",width:"100%",padding:"6px 8px",background:"transparent",border:"none",borderTop:"1px solid #e2e8f0",borderRadius:"4px",cursor:"pointer",textAlign:"left",fontSize:"11px",fontWeight:"600",color:"#64748b",marginTop:"2px"}}>
            <span style={{width:"10px",height:"10px",borderRadius:"50%",background:"#cbd5e1",flexShrink:0}}/>
            Clear flag
          </button>
        )}
      </div>
    );
  };

  // Old inline-positioned picker kept for any callers I might've missed.
  const renderFlagPicker=(gid,lid,currentFlag)=>(
    <div onClick={e=>e.stopPropagation()}
      style={{position:"absolute",top:"100%",left:0,marginTop:"4px",background:"#fff",border:"1px solid #cbd5e1",borderRadius:"6px",boxShadow:"0 4px 12px rgba(0,0,0,.18)",zIndex:50,minWidth:"180px",padding:"4px",fontSize:"12px"}}>
      <button onClick={e=>{e.stopPropagation();setLoadFlag(gid,lid,"reschedule");setFlagPickerFor(null);}}
        style={{display:"flex",alignItems:"center",gap:"8px",width:"100%",padding:"6px 8px",background:currentFlag==="reschedule"?"#fef3c7":"transparent",border:"none",borderRadius:"4px",cursor:"pointer",textAlign:"left",fontSize:"12px",fontWeight:"600",color:"#92400e"}}>
        <span style={{width:"10px",height:"10px",borderRadius:"50%",background:"#eab308",flexShrink:0}}/>
        Waiting new appt
        {currentFlag==="reschedule"&&<span style={{marginLeft:"auto",color:"#059669"}}>✓</span>}
      </button>
      <button onClick={e=>{e.stopPropagation();setLoadFlag(gid,lid,"important");setFlagPickerFor(null);}}
        style={{display:"flex",alignItems:"center",gap:"8px",width:"100%",padding:"6px 8px",background:currentFlag==="important"?"#fee2e2":"transparent",border:"none",borderRadius:"4px",cursor:"pointer",textAlign:"left",fontSize:"12px",fontWeight:"600",color:"#991b1b"}}>
        <span style={{width:"10px",height:"10px",borderRadius:"50%",background:"#ef4444",flexShrink:0}}/>
        Important — pick first
        {currentFlag==="important"&&<span style={{marginLeft:"auto",color:"#059669"}}>✓</span>}
      </button>
      {currentFlag&&(
        <button onClick={e=>{e.stopPropagation();setLoadFlag(gid,lid,null);setFlagPickerFor(null);}}
          style={{display:"flex",alignItems:"center",gap:"8px",width:"100%",padding:"6px 8px",background:"transparent",border:"none",borderTop:"1px solid #e2e8f0",borderRadius:"4px",cursor:"pointer",textAlign:"left",fontSize:"11px",fontWeight:"600",color:"#64748b",marginTop:"2px"}}>
          <span style={{width:"10px",height:"10px",borderRadius:"50%",background:"#cbd5e1",flexShrink:0}}/>
          Clear flag
        </button>
      )}
    </div>
  );

  // Move a trailer up or down in the Planned list. The first arrow click flips the
  // section to manual-order mode, freezing the current visible order, then nudges
  // the target trailer by one position. Subsequent clicks just nudge within that
  // saved order.
  const movePlannedTrailer=(currentVisibleOrder, gid, direction)=>{
    // Always reconcile the saved manual order against what's actually visible right now:
    //   1. Take saved IDs but filter out any that no longer exist (deleted trailers).
    //   2. Append any visible trailers that aren't in the saved list yet (new trailers
    //      added since the last reorder).
    //
    // Without this, the function silently no-ops on any trailer that isn't in the
    // saved snapshot (e.g. a trailer added after the user clicked an arrow once),
    // because indexOf returns -1 and we return early.
    const visibleIds=currentVisibleOrder.map(g=>g.id);
    const visibleSet=new Set(visibleIds);
    const savedIds=(manualPlannedOrder[week.id]||[]).filter(id=>visibleSet.has(id));
    const seedOrder=savedIds.slice();
    for(const id of visibleIds){
      if(!seedOrder.includes(id))seedOrder.push(id);
    }
    const idx=seedOrder.indexOf(gid);
    if(idx<0)return; // shouldn't happen now — every visible trailer is in seedOrder
    const newIdx=direction==="up"?Math.max(0,idx-1):Math.min(seedOrder.length-1,idx+1);
    if(newIdx===idx)return; // already at edge
    const next=seedOrder.slice();
    next.splice(idx,1);
    next.splice(newIdx,0,gid);
    setManualPlannedOrder({...manualPlannedOrder,[week.id]:next});
    if(!manualOrderActive)setManualOrderActive(true);
  };

  const addLoad=gid=>setW("groups",week.groups.map(g=>g.id!==gid?g:{...g,loads:[...g.loads,mkLoad()]}));
  const removeLoad=(gid,lid)=>setW("groups",week.groups.map(g=>{if(g.id!==gid)return g;const ls=g.loads.filter(l=>l.id!==lid);return{...g,loads:ls.length?ls:[mkLoad()]};}));
  const moveLoad=(fromGid,toGid,lid,toPosition)=>{
    if(fromGid===toGid){
      // Reorder within same trailer
      const g=week.groups.find(g=>g.id===fromGid);
      if(!g)return;
      const load=g.loads.find(l=>l.id===lid);
      if(!load)return;
      const others=g.loads.filter(l=>l.id!==lid);
      others.splice(toPosition,0,load);
      setW("groups",week.groups.map(gr=>gr.id!==fromGid?gr:{...gr,loads:others}));
    } else {
      // Move to different trailer
      let movedLoad=null;
      const newGroups=week.groups.map(gr=>{
        if(gr.id===fromGid){
          const ls=gr.loads.filter(l=>l.id!==lid);
          movedLoad=gr.loads.find(l=>l.id===lid);
          return{...gr,loads:ls.length?ls:[mkLoad()]};
        }
        return gr;
      });
      if(!movedLoad)return;
      setW("groups",newGroups.map(gr=>{
        if(gr.id!==toGid)return gr;
        const ls=[...gr.loads];
        ls.splice(toPosition,0,movedLoad);
        return{...gr,loads:ls};
      }));
    }
  };
  const addGroup=()=>setW("groups",[...week.groups,mkGroup()]);
  const removeGroup=gid=>{if(week.groups.length>1)setW("groups",week.groups.filter(g=>g.id!==gid));};
  const updSub=(sec,id,f,v)=>setW(sec,(week[sec]||[]).map(r=>r.id!==id?r:{...r,[f]:v}));
  const addSub=(sec,mk)=>setW(sec,[...(week[sec]||[]),mk()]);
  const removeSub=(sec,id)=>setW(sec,(week[sec]||[]).filter(r=>r.id!==id));
  // Shared carry-forward builder — used by both the manual "+ Add Week" button
  // and the Friday auto-create prompt, so they behave identically.
  // Safety check: compare what the previous week had OPEN against what the
  // carry-forward actually produced. Returns a warning string if a meaningful
  // amount was dropped, or "" if everything looks fine.
  const carryForwardWarnings=(counts)=>{
    const lastWk=weeks[Math.min(activeWeek,weeks.length-1)]||weeks[0]||{};
    // Count OPEN items in the previous week (things that SHOULD carry).
    let openOTR=0;
    (lastWk.groups||[]).forEach(g=>{
      const hasReal=(g.loads||[]).some(l=>(l.sr||"").trim()||(l.broker||"").trim());
      if(!hasReal)return;
      const gs=(g.groupStatus||"").trim();
      if(gs==="Delivered"||gs==="Completed"||gs==="Paid"){
        const anyOpen=(g.loads||[]).some(l=>{
          const real=(l.sr||"").trim()||(l.broker||"").trim();
          return real&&(l.status||"").trim()!=="Delivered";
        });
        if(anyOpen)openOTR++;
      }else openOTR++;
    });
    const openLocal=(lastWk.localDeliveries||[]).filter(r=>r.status!=="Delivered").length;
    const openXdock=(lastWk.crossdockDrops||[]).filter(r=>!["Delivered","Paid","Completed"].includes(r.status||"")).length;
    const openAcc=(lastWk.accessorials||[]).filter(r=>r.status!=="Paid").length;

    const lines=[];
    if(openOTR>counts.otr) lines.push("• OTR trailers: "+counts.otr+" carried, but "+openOTR+" looked unfinished ("+(openOTR-counts.otr)+" not carried)");
    if(openLocal>counts.local) lines.push("• Local deliveries: "+counts.local+" carried of "+openLocal+" open");
    if(openXdock>counts.xdock) lines.push("• Crossdock: "+counts.xdock+" carried of "+openXdock+" open");
    if(openAcc>counts.acc) lines.push("• Accessorials: "+counts.acc+" carried of "+openAcc+" open");
    if(!lines.length)return "";
    return "Heads up — the new week carried fewer items than the previous week had open:\n\n"
      +lines.join("\n")
      +"\n\nYour original loads are NOT deleted — they stay in the previous week. "
      +"But you may want to check before continuing.\n\nCreate the week anyway?";
  };

  const buildCarriedWeek=(label)=>{
    // Source week = the week the user is currently viewing. The weeks array is
    // NOT in chronological order (new weeks get appended), so weeks[length-1] is
    // unreliable — it can point at an old week and carry nothing. Using the
    // active week is unambiguous: it's the week in front of the user.
    const lastWk=weeks[Math.min(activeWeek,weeks.length-1)]||weeks[0]||{};
    const DONE=["Delivered","Paid","Completed"];
    // A load counts as "real" (not a blank placeholder) if ANY meaningful field
    // is filled — not just route/broker. A planned load might only have a
    // pickup date or a driver so far, and that still must carry forward.
    const loadHasContent=(l)=>{
      if(!l)return false;
      const f=["sr","broker","pickup","delivery","product","pallets","weight","rate","driver","truck","trailer","status","notes"];
      return f.some(k=>((l[k]||"")+"").trim()!=="");
    };
    const carryXdock=(lastWk.crossdockDrops||[]).filter(r=>!DONE.includes(r.status||"")).map(r=>({...r,id:uid(),carriedFrom:lastWk.label||"prev"}));
    const carryAcc=(lastWk.accessorials||[]).filter(r=>r.status!=="Paid").map(r=>({...r,id:uid(),carriedFrom:lastWk.label||"prev"}));
    // Carry forward every OTR group that is NOT fully finished. Finished = status
    // Delivered/Completed AND every real load delivered. Everything else carries.
    const carryOTR=(lastWk.groups||[]).filter(g=>{
      const gs=(g.groupStatus||"").trim();
      const realLoads=(g.loads||[]).filter(loadHasContent);
      if(realLoads.length===0)return false; // genuinely empty placeholder group
      if(DONE.includes(gs)){
        // a Delivered group still carries if any real load is not yet delivered
        return realLoads.some(l=>(l.status||"").trim()!=="Delivered");
      }
      return true; // Pending / blank / In Transit / Loaded / Issue / Dispatched — carry
    }).map(g=>({...g,id:uid(),carriedFrom:lastWk.label||"prev"}));
    const carryLocal=(lastWk.localDeliveries||[]).filter(r=>r.status!=="Delivered").map(r=>({...r,id:uid(),carriedFrom:lastWk.label||"prev"}));
    const newWk={...mkWeek(label),crossdockDrops:carryXdock,accessorials:carryAcc,groups:[mkGroup(),...carryOTR],localDeliveries:carryLocal};
    const carried=[carryOTR.length&&carryOTR.length+" OTR",carryLocal.length&&carryLocal.length+" local",carryXdock.length&&carryXdock.length+" crossdock",carryAcc.length&&carryAcc.length+" accessorials"].filter(Boolean);
    return {newWk,carried,counts:{otr:carryOTR.length,local:carryLocal.length,xdock:carryXdock.length,acc:carryAcc.length}};
  };
  const addWeek=()=>{
    const last=weeks[Math.min(activeWeek,weeks.length-1)]||weeks[0]||{};
    const l=prompt("Week label (e.g. 3.30.2026 - 4.6.2026)",suggestNextWeekLabel(last.label));
    if(!l)return;
    const {newWk,carried,counts}=buildCarriedWeek(l);
    const warn=carryForwardWarnings(counts);
    if(warn&&!confirm(warn))return; // user cancelled
    setWeeksAndSave(p=>[...p,newWk]);
    setActiveWeek(weeks.length);
    if(carried.length)alert("Carried to new week: "+carried.join(", "));
    else alert("New week created. (Nothing needed carrying forward.)");
  };
  const removeWeek=i=>{if(weeks.length<=1){alert("Cannot remove last week.");return;}if(!confirm("Remove this week?"))return;setWeeksAndSave(p=>p.filter((_,j)=>j!==i));setActiveWeek(0);};

  const TH=(bg,ex={})=>({padding:"4px 2px",fontSize:"9px",fontWeight:"600",background:bg||"#1a2e50",color:"#fff",border:"1px solid rgba(255,255,255,0.15)",whiteSpace:"nowrap",textAlign:"center",position:"sticky",top:0,zIndex:5,...ex});
  const TD=(bg,ex={})=>({padding:"2px 3px",border:"1px solid #c7d9f0",background:bg||"transparent",verticalAlign:"middle",fontSize:"11px",fontWeight:"500",...ex});
  const TDc=(bg,ex={})=>({padding:"0px 3px",border:"1px solid #c7d9f0",background:bg||"transparent",verticalAlign:"middle",fontSize:"11px",fontWeight:"500",lineHeight:"1",...ex});
  const IN=(ex={})=>({width:"100%",border:"none",background:"transparent",fontSize:"11px",fontWeight:"600",padding:"1px",color:"inherit",fontFamily:"inherit",outline:"none",boxSizing:"border-box",...ex});
  const CELL=(bg,ex={})=>({padding:"4px 6px",border:"1px solid #e2e8f0",background:bg||"#fff",verticalAlign:"middle",fontSize:"11px",...ex});
  const INCEL=(ex={})=>({width:"100%",border:"none",background:"transparent",fontSize:"11px",padding:"1px 2px",color:"#111",fontFamily:"inherit",outline:"none",...ex});

  if(!appMode)return <LoginScreen dispatchers={dispatchers} onLogin={(mode,disp)=>{
    setAppMode(mode);setCurrentDispatcher(disp);
    // Generate session token = sha256(role + pin + timestamp) — sent to Sheets for server-side filtering
    hashPin(mode+(disp?disp.pin:"")+Date.now()).then(function(tok){sessionToken.current=tok.slice(0,16);});
    // Dispatchers go straight to the board; admins go to dashboard
    if(mode==="dispatcher"){setActiveTab("weeks");localStorage.setItem("fcbv2_lastTab","weeks");}
    else if(mode==="admin"){const lastTab=localStorage.getItem("fcbv2_lastTab")||"dashboard";setActiveTab(lastTab);}
    const entry={name:mode==="dispatcher"&&disp?disp.name:mode==="admin"?"Admin":"Viewer",role:mode,ts:new Date().toLocaleString("en-US",{month:"2-digit",day:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true})};
    setLoginLog(prev=>{const next=[entry,...prev].slice(0,200);localStorage.setItem("fcbv2_loginlog",JSON.stringify(next));return next;});
  }}/>;

  if(loading)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0f1f3d",flexDirection:"column",gap:"16px"}}>
      <div className="spinning" style={{fontSize:"32px"}}>↻</div>
      <div style={{color:"#fff",fontSize:"14px",fontWeight:"600"}}>Loading from Google Sheets...</div>
      <div style={{color:"rgba(255,255,255,0.4)",fontSize:"11px"}}>This is the live data. One moment.</div>
    </div>
  );

  return(
  <div style={{fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",padding:"12px"}} onClick={()=>setShowHdrMenu(false)}>

    {/* ── FLAG PICKER OVERLAY — floats above everything when a load's ⏳ is open ── */}
    {renderFlagPickerOverlay()}

    {/* ── TOAST NOTIFICATIONS — bottom-right stack. Click to act, × to dismiss ── */}
    {toasts.length>0&&(
      <div style={{position:"fixed",bottom:"20px",right:"20px",zIndex:9998,display:"flex",flexDirection:"column",gap:"8px",maxWidth:"360px"}}>
        {toasts.map(t=>{
          const isFill=t.kind==="addr-fill";
          const border=isFill?"#86efac":"#fcd34d";
          const accent=isFill?"#059669":"#f59e0b";
          const textColor=isFill?"#14532d":"#451a03";
          const icon=isFill?"✓":"⚠️";
          return(
            <div key={t.id} onClick={()=>{
              if(t.kind==="addr-miss"){setAddrEntryFor({gid:t.gid,lid:t.lid});}
              setToasts(prev=>prev.filter(x=>x.id!==t.id));
            }}
              style={{background:"#fff",border:"1px solid "+border,borderLeft:"4px solid "+accent,borderRadius:"8px",padding:"10px 12px",boxShadow:"0 4px 12px rgba(0,0,0,.15)",cursor:t.kind==="addr-miss"?"pointer":"default",display:"flex",alignItems:"flex-start",gap:"10px"}}>
              <span style={{fontSize:"18px",lineHeight:1,flexShrink:0,color:accent}}>{icon}</span>
              <div style={{flex:1,fontSize:"12px",color:textColor,lineHeight:"1.4"}}>{t.msg}</div>
              <button onClick={e=>{e.stopPropagation();setToasts(prev=>prev.filter(x=>x.id!==t.id));}}
                style={{background:"none",border:"none",color:"#94a3b8",cursor:"pointer",fontSize:"14px",padding:"0 2px",lineHeight:1,flexShrink:0}}>×</button>
            </div>
          );
        })}
      </div>
    )}

    {/* ── MANUAL ADDRESS ENTRY MODAL ── */}
    {addrEntryFor&&(()=>{
      // Search across ALL live weeks — NOT just current — because Insights buckets
      // can reference loads from any week. Prior version was broken here.
      const found=findLoadAcrossLiveWeeks(addrEntryFor.gid,addrEntryFor.lid);
      if(!found){setAddrEntryFor(null);return null;}
      const l=found.load;
      const{s:sCity}=parseSR(l.sr||"");
      const siblings=computeAddrSiblings(l,addrEntryFor.gid,addrEntryFor.lid);
      // Track which siblings are selected. Default: same-broker siblings pre-checked.
      // Initial state derived from siblings; user can toggle any.
      const initialSelected=addrEntryFor.selected||siblings.filter(s=>s.sameBroker).map(s=>s.gid+":"+s.lid);
      const selectedKeys=new Set(initialSelected);
      const selectionCount=selectedKeys.size;
      return(
        <div onClick={()=>setAddrEntryFor(null)}
          style={{position:"fixed",inset:0,background:"rgba(15,31,61,.45)",zIndex:9997,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
          <div onClick={e=>e.stopPropagation()}
            style={{background:"#fff",borderRadius:"10px",boxShadow:"0 12px 36px rgba(0,0,0,.3)",padding:"18px 20px",maxWidth:"560px",width:"100%",maxHeight:"85vh",display:"flex",flexDirection:"column"}}>
            <div style={{fontSize:"14px",fontWeight:"800",color:"#0f1f3d",marginBottom:"4px"}}>Enter shipper address</div>
            <div style={{fontSize:"11px",color:"#64748b",marginBottom:"12px",lineHeight:"1.4"}}>
              <strong>{sCity||"(unknown city)"}</strong>{l.broker?<> · {l.broker}</>:null} · {found.week.label||"current week"}
              {found.isArchived&&<span style={{marginLeft:"6px",fontSize:"9px",background:"#ede9fe",color:"#5b21b6",padding:"1px 6px",borderRadius:"3px",fontWeight:"700"}}>ARCHIVED</span>}
            </div>
            <input
              autoFocus
              type="text"
              defaultValue={l.shipperAddr||""}
              placeholder="e.g. 1208 N SCHMIDT RD"
              onKeyDown={e=>{
                if(e.key==="Enter"){
                  const selected=siblings.filter(s=>selectedKeys.has(s.gid+":"+s.lid));
                  saveManualShipperAddr(addrEntryFor.gid,addrEntryFor.lid,e.currentTarget.value,selected);
                }
                else if(e.key==="Escape"){setAddrEntryFor(null);}
              }}
              id="manualAddrInput"
              style={{width:"100%",padding:"10px 12px",border:"2px solid #cbd5e1",borderRadius:"6px",fontSize:"14px",fontFamily:"inherit",outline:"none",marginBottom:"14px"}}
            />

            {/* Sibling multi-select */}
            {siblings.length>0&&(
              <>
                <div style={{fontSize:"11px",fontWeight:"700",color:"#475569",marginBottom:"6px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:"8px",flexWrap:"wrap"}}>
                  <span>Also apply to other {sCity} loads (same-broker pre-checked):</span>
                  <span style={{display:"flex",gap:"4px",flexShrink:0}}>
                    <button onClick={()=>{

{/* PLANNED SHIPMENTS */}

        {/* ════ LEFT PANEL ════ */}
        <div style={{flex:"3 1 0",minWidth:0,display:"flex",flexDirection:"column",gap:"8px"}}>

          {(()=>{
            // Build the ordered trailer list to render. Two modes:
            //   AUTO-SORT (default): ⏳ flagged trailers on top → multi-stop trailers
            //     sorted by earliest-first-stop delivery date → single-load trailers
            //     sorted by delivery date.
            //   MANUAL (active once user clicks any arrow): respects the saved per-week
            //     manualPlannedOrder array of group IDs. New trailers (not in the array)
            //     append to the bottom in their original order.
            const planned=pendingGroups.filter(g=>!g.isCombined);
            if(manualOrderActive){
              const manualIds=manualPlannedOrder[week.id]||[];
              const idxOf=id=>{const i=manualIds.indexOf(id);return i<0?9999:i;};
              return planned.slice().sort((a,b)=>{
                const ai=idxOf(a.id),bi=idxOf(b.id);
                if(ai!==bi)return ai-bi;
                return 0; // preserve original order for trailers not in manual list
              });
            }
            // AUTO-SORT — three tiers
            const tierOf=g=>{
              if(groupHasImportantLoad(g))return 0;   // VERY top: marked Important
              if(groupHasFlaggedLoad(g))return 1;     // next: waiting new appt
              if((g.loads||[]).length>1)return 2;     // multi-stop
              return 3;                                // single
            };
            // Sort key within a tier: earliest delivery date of the trailer
            const sortKey=g=>{
              const loads=g.loads||[];
              if(!loads.length)return Infinity;
              const ts=loads.map(l=>parseTS(l.delivery)).filter(t=>isFinite(t));
              return ts.length?Math.min(...ts):Infinity;
            };
            return planned.slice().sort((a,b)=>{
              const ta=tierOf(a),tb=tierOf(b);
              if(ta!==tb)return ta-tb;
              return sortKey(a)-sortKey(b);
            });
          })().map((group,gi,sortedArr)=>{
            const gsSt=GSS[group.groupStatus]||GSS["Pending"];
            const isClaimed=!!(group.securedAt&&group.groupDriver);
            const canEdit=isAdmin||!isClaimed;
            // ── Pending-pickup definition ─────────────────────────────────
            // A load is "pending pickup" when:
            //   1. Its status is NOT in pickedUpStatuses (i.e. truck hasn't grabbed it yet)
            //   2. No local truck OR local driver assigned to it yet
            //
            // Once a local is assigned, the dispatcher knows who's handling that load
            // and stops worrying about its urgency — even if the truck hasn't physically
            // arrived at the dock yet. (Per user spec: "as soon as local assigned, the
            // header should disappear.")
            const pickedUpStatuses=["Dock","Yard","Picked Up","Loaded","In Transit","Delivered"];
            const isLoadPending=l=>(
              !pickedUpStatuses.includes(l.status||"")
              &&!(l.localTruck&&String(l.localTruck).trim())
              &&!(l.localDriver&&String(l.localDriver).trim())
            );
            const pendingPickupLoads=(group.loads||[]).filter(isLoadPending);
            const pendingCount=pendingPickupLoads.length;
            // Per-load urgency tag — returns {label,color} or null. Used on each load row.
            const loadUrgency=l=>{
              if(group.groupStatus==="Delivered")return null;
              if(!isLoadPending(l))return null;
              const ts=parseTS(l.pickup);
              if(!isFinite(ts))return null;
              const d=new Date(ts);
              const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());
              if(day.getTime()===today.getTime())return{label:"PU TODAY",color:"#ef4444"};
              if(day.getTime()===tomorrowDay.getTime())return{label:"TOMORROW",color:"#eab308"};
              return null;
            };
            // Keep these for downstream date logic that still references puDate/delDate
            const earliestPU=Math.min(...group.loads.map(l=>parseTS(l.pickup)));
            const puDate=isFinite(earliestPU)?new Date(earliestPU):null;
            const puDay=puDate?new Date(puDate.getFullYear(),puDate.getMonth(),puDate.getDate()):null;
            const earliestDel=Math.min(...group.loads.map(l=>parseTS(l.delivery)));
            const delDate=isFinite(earliestDel)?new Date(earliestDel):null;
            const delDay=delDate?new Date(delDate.getFullYear(),delDate.getMonth(),delDate.getDate()):null;
            const isDelivered=group.groupStatus==="Delivered";
            const statusDone=["Dispatched","Loaded","In Transit","Delivered","Driver assigned"].includes(group.groupStatus);
            // Trailer-level urgency replaced with pending-pickup count. Shown only when
            // there are still loads to pick up AND trailer not delivered.
            const trailerPendingTag=isDelivered||pendingCount===0?"":pendingCount+" pending pickup";
            // Legacy compatibility — some downstream code still reads urgTag/urgColor.
            // These now reflect the COUNT-style trailer banner, not the old date-based pill.
            const urgTag=trailerPendingTag;
            const urgColor="#3b82f6";
            const hasDriver=!!(group.groupDriver&&group.groupDriver.trim());
            const route=(group.loads||[]).map(l=>parseSR(l.sr||"").r).filter(Boolean).join(" → ");
            const isMultiStop=(group.loads||[]).length>1;

            // ═══ COMPACT VIEW: dense one-row-per-load layout. ═══
            // The user chose Cards or Compact in the header toggle. In Compact mode, each load
            // renders as a tight horizontal row. Click ✏️ to expand THIS group back to the full
            // card (only one group expanded at a time — tracked by expandedCompactGroup state).
            const isExpandedInCompact=expandedCompactGroup===group.id;
            if(plannedView==="compact"&&!isExpandedInCompact){
              // Grid columns (tight): T# + ⏳ toggle | Route | PU | DEL | Wt | Plt | L Truck | L Driver | Trailer | Rate | Broker+# | 📍 | Status | ✏️ ×
              const gColTpl="52px minmax(170px,2fr) 100px 100px 50px 30px 50px 65px 55px 65px minmax(100px,1fr) 120px 80px 24px";
              // Reschedule/Important flag indicators now live in the inline IIFE below.
              return(
                <div key={group.id} style={{background:"#ffffff",border:"1px solid #64748b",borderRadius:"6px",overflow:"hidden",borderLeft:`4px solid ${gsSt.tc||"#64748b"}`,marginBottom:"6px",boxShadow:"0 1px 2px rgba(15,31,61,.1)"}}>
                  {/* TRAILER HEADER STRIP — keeps OTR Drv/Truck/Trailer/status/dollar visible */}
                  <div style={{display:"flex",alignItems:"center",gap:"8px",padding:"4px 9px",background:"rgba(30,58,138,.06)",borderBottom:"1px solid #e5edf5",fontSize:"11px",flexWrap:"wrap"}}>
                    {/* Trailer-level up/down arrows — admin only, switches to manual-order mode on first click */}
                    {isAdmin&&sortedArr.length>1&&(
                      <span style={{display:"flex",flexDirection:"column",gap:"0",marginRight:"-3px",flexShrink:0}}>

                        <button onClick={e=>{e.stopPropagation();movePlannedTrailer(sortedArr,group.id,"down");}}

                          style={{background:"transparent",border:"none",color:gi===sortedArr.length-1?"#cbd5e1":"#64748b",cursor:gi===sortedArr.length-1?"default":"pointer",fontSize:"10px",padding:"0 2px",lineHeight:"1"}}>▼</button>

                    {(()=>{

                    {isMultiStop&&<span style={{fontSize:"9px",color:"#64748b",fontWeight:"600"}}>{(group.loads||[]).length} stops</span>}
                    {(()=>{
                      const totalGross=(group.loads||[]).reduce((s,l)=>s+(parseFloat(l.rate)||0),0);
                      if(totalGross<=0)return null;
                      // Total local charge across all loads — same per-load formula as Cards view.
                      const totalLocal=(group.loads||[]).reduce((s,l)=>{
                        if(l.manualLocalCharge!==""&&l.manualLocalCharge!=null)return s+(parseFloat(l.manualLocalCharge)||0);
                        const{s:shipper}=parseSR(l.sr||"");
                        const am=cityMiles(shipper);
                        const um=(l.manualPickupMi!==""&&l.manualPickupMi!=null)?parseFloat(l.manualPickupMi):am;
                        const lc=um!=null?localCharge(um):null;
                        return s+(lc||0);
                      },0);
                      const net=totalGross-totalLocal;
                      return(<>
                        <span style={{fontSize:"11px",color:"#059669",fontWeight:"700"}}>${totalGross.toLocaleString()}</span>
                        {totalLocal>0&&<span style={{fontSize:"10px",color:"#b45309",fontWeight:"700"}}>−${Math.round(totalLocal).toLocaleString()}</span>}
                        {totalLocal>0&&<span style={{fontSize:"11px",color:"#0f1f3d",fontWeight:"800"}}>= ${Math.round(net).toLocaleString()}</span>}
                      </>);
                    })()}
                    {/* Miles + RPM — same values shown when the card is expanded.
                        Miles use manual override > calculated > auto fallback (matches expanded card). */}
                    {(()=>{
                      const miles=group.tripMiles!==""&&group.tripMiles!=null?Math.round(parseFloat(group.tripMiles)):group.calcTripMi?Math.round(group.calcTripMi):group.autoTripMi?Math.round(group.autoTripMi):null;
                      if(!miles)return null;
                      return <span style={{fontSize:"10px",color:"#475569",fontWeight:"600",background:"#f1f5f9",padding:"1px 6px",borderRadius:"3px",flexShrink:0}}>{miles.toLocaleString()} mi</span>;
                    })()}
                    {group.rpm!=null&&<span style={{fontSize:"10px",fontWeight:"800",background:rpmBg(group.rpm),color:rpmFg(group.rpm),padding:"1px 6px",borderRadius:"3px",flexShrink:0}}>${group.rpm}/mi</span>}
                    <span style={{fontSize:"10px",color:"#64748b",flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>

                    </span>
                    {urgTag&&!isDelivered&&<span style={{fontSize:"9px",fontWeight:"700",color:"#fff",background:urgColor,padding:"1px 6px",borderRadius:"3px",flexShrink:0}}>{urgTag}</span>}

                    {isAdmin&&!group.isCombined&&isMultiStop&&<button onClick={e=>{e.stopPropagation();setGroup(group.id,"isCombined",true);}} style={{background:"#7c3aed",color:"#fff",border:"none",borderRadius:"4px",padding:"1px 8px",fontSize:"9px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>→ Combined</button>}
                    <button onClick={e=>{e.stopPropagation();setExpandedCompactGroup(group.id);}} title="Expand for editing" style={{background:"#e0e7ff",color:"#3730a3",border:"1px solid #c7d2fe",borderRadius:"4px",padding:"1px 7px",fontSize:"11px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>✏️</button>

                    <span style={{padding:"0 4px",borderRight:"1px solid #cbd5e1",textAlign:"center"}}>PU</span>
                    <span style={{padding:"0 4px",borderRight:"1px solid #cbd5e1",textAlign:"center"}}>DEL</span>
                    <span style={{padding:"0 4px",borderRight:"1px solid #cbd5e1",textAlign:"center"}}>Wt</span>

                    <span style={{padding:"0 4px",borderRight:"1px solid #cbd5e1",textAlign:"center"}}>Status</span>
