                    const sr=parseSR(load.sr||"");
                    // Show only the per-load status (no group fallback) so loads without their own
                    // status don't visually inherit a misleading "Pending" from the trailer.
                    const rc=rowColor(load,today,tomorrowDay);
                    const liveTk=load.localTruck&&liveTrucks[load.localTruck];
                    const hidePill=STATUS_HIDE_PILL[load.status||""];
                    let liveShort=null;
                    if(liveTk&&liveTk.address&&!hidePill){
                      const parts=liveTk.address.split(",").map(s=>s.trim()).filter(Boolean);
                      liveShort=liveTk.address;
                      if(parts.length>=2){
                        const lastPart=parts[parts.length-1];
                        const state=lastPart.length<=2?lastPart:(parts[parts.length-2]||"");
                        const city=lastPart.length<=2?parts[parts.length-2]:parts[parts.length-3];
                        if(city&&state)liveShort=city+", "+state;
                        else liveShort=parts.slice(-2).join(", ");
                      }
                      if(liveShort.length>22)liveShort=liveShort.slice(0,20)+"…";
                    }
                    // Pickup date highlighting: red ONLY if pickup is strictly before today AND no progress
                    // has been made on this load yet. Any active status (Dispatched, Dock, Yard, Picked Up,
                    // Loaded, In Transit, Delivered) means the load isn't waiting on pickup — don't flag red.
                    const pd=parsePickupDate(load.pickup);
                    const inProgress=["Dispatched","Dock","Yard","Picked Up","Loaded","In Transit","Delivered"].includes(load.status||"");

                    let lnDisplay=load.loadNum;

                    // Shared cell styles. cellBase = centered (numbers, short fields). cellLeft = left-aligned (Route, Broker which have variable-length text).

                            style={{background:flagBtnBg,color:flagFg,border:`1px solid ${flagBorder}`,borderRadius:"3px",padding:"0 4px",fontSize:"10px",fontWeight:"700",cursor:"pointer",lineHeight:"1.4"}}>⏳</button>}

                        </span>
                        {/* Status cell with optional per-load urgency badge above it.

                          <span style={{fontSize:"10px",fontWeight:"700",color:rc.tc||"#1f2937",background:rc.barBg||"transparent",padding:"1px 5px",borderRadius:"3px",border:rc.barBg?"none":"1px solid #e2e8f0"}}>{load.status||"—"}</span>
                        </span>
                        <span style={{borderRight:"none"}}/>
                      </div>
                    );
                  })}
                </div>
              );

            return(
              <div key={group.id}

                onDragOver={e=>{if(dragLoad.current){e.preventDefault();e.stopPropagation();return;}e.preventDefault();setDragOverIdx(gi);}}
                onDragLeave={()=>setDragOverIdx(null)}
                onDrop={e=>{
                  // If dragging a LOAD → move it to this group

                    if(dl.fromGroupId!==group.id){

                      <button onClick={e=>{e.stopPropagation();movePlannedTrailer(sortedArr,group.id,"down");}}
                        disabled={gi===sortedArr.length-1}
                        title={gi===sortedArr.length-1?"Already at bottom":"Move down (switches to manual-order mode)"}
                        style={{background:"transparent",border:"none",color:gi===sortedArr.length-1?"rgba(255,255,255,.25)":"rgba(255,255,255,.7)",cursor:gi===sortedArr.length-1?"default":"pointer",fontSize:"10px",padding:"0 2px",lineHeight:"1"}}>▼</button>
                    </span>
                  )}
                  <span style={{background:"#2563eb",padding:"1px 8px",borderRadius:"4px",fontWeight:"700",flexShrink:0}}>T{gi+1}</span>
                  {(()=>{
                    if(!groupHasFlaggedLoad(group))return null;
                    const hasImportant=groupHasImportantLoad(group);
                    const tip=hasImportant?"One or more loads in this trailer marked Important":"One or more loads in this trailer need a new appointment";
                    const bg=hasImportant?"#fee2e2":"#fef3c7";
                    const fg=hasImportant?"#991b1b":"#92400e";
                    const bd=hasImportant?"#ef4444":"#fcd34d";
                    return <span title={tip} style={{fontSize:"10px",fontWeight:"700",color:fg,background:bg,border:`1px solid ${bd}`,padding:"1px 7px",borderRadius:"4px",flexShrink:0,cursor:"help"}}>⏳</span>;
                  })()}
                  {urgTag&&<span style={{fontSize:"10px",fontWeight:"800",color:"#fff",background:urgColor,padding:"2px 8px",borderRadius:"4px",flexShrink:0,letterSpacing:".02em"}}>{urgTag}</span>}
                  {/* In compact mode, this group is temporarily expanded — show a collapse button */}
                  {plannedView==="compact"&&isExpandedInCompact&&<button onClick={()=>setExpandedCompactGroup(null)} title="Collapse back to compact row" style={{background:"rgba(148,163,184,.25)",color:"#cbd5e1",border:"1px solid rgba(148,163,184,.4)",borderRadius:"4px",padding:"1px 8px",fontSize:"9px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>← Collapse</button>}
                  
                  {isAdmin&&<button onClick={()=>addLoad(group.id)} style={{background:"rgba(59,130,246,.25)",color:"#93c5fd",border:"1px solid rgba(59,130,246,.4)",borderRadius:"4px",padding:"1px 5px",fontSize:"9px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>+Load</button>}
                  {isAdmin&&<div

                    onDragLeave={e=>{e.preventDefault();e.stopPropagation();e.currentTarget.style.background="rgba(255,255,255,.05)";}}
                    onDrop={e=>{
                      e.preventDefault();e.stopPropagation();
                      e.currentTarget.style.background="rgba(255,255,255,.05)";
                      const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
                      if(!f){alert("No file detected. Try clicking the RC box to pick the file instead.");return;}
                      const okType=/pdf$/i.test(f.type)||/^image\//i.test(f.type)||/\.(pdf|png|jpe?g|webp)$/i.test(f.name||"");
                      if(!okType){alert("That doesn't look like a PDF or image. Rate-con must be a PDF or photo.");return;}
                      handleRateCon(f,group.id);
                    }}
                    onClick={()=>{const inp=document.createElement("input");inp.type="file";inp.accept=".pdf,image/*";inp.onchange=ev=>{const f=ev.target.files[0];if(f)handleRateCon(f,group.id);};inp.click();}}
                    title="Drop a rate confirmation PDF here, or click to pick one"
                    style={{display:"flex",alignItems:"center",gap:"3px",background:"rgba(255,255,255,.05)",border:"1px dashed rgba(255,255,255,.2)",borderRadius:"4px",padding:"1px 7px",cursor:"pointer",flexShrink:0}}>
                    {rcLoading[group.id]?<span style={{fontSize:"9px",color:"#fbbf24"}}>↻ Reading...</span>:<><span style={{fontSize:"10px"}}>📄</span><span style={{fontSize:"9px",color:"rgba(255,255,255,.5)"}}>RC</span></>}
                  </div>}
                  <div style={{display:"flex",alignItems:"center",gap:"3px",background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.1)",borderRadius:"4px",padding:"1px 5px",flexShrink:0}}>
                    <span style={{fontSize:"9px",color:"#93c5fd"}}>mi:</span>

                    {group.tripMiles!==""&&group.tripMiles!=null&&<button onClick={()=>setGroup(group.id,"tripMiles","")} style={{background:"none",border:"none",color:"#fb923c",cursor:"pointer",fontSize:"9px",padding:"0",lineHeight:1}}>↺</button>}
                  </div>
                  {(group.calcTripMi||group.autoTripMi)&&group.rpm!=null&&<span style={{fontSize:"9px",fontWeight:"800",background:rpmBg(group.rpm),color:rpmFg(group.rpm),padding:"1px 5px",borderRadius:"4px",flexShrink:0}}>${group.rpm}/mi</span>}

                  {isMultiStop&&<span style={{color:"#fbbf24",fontSize:"9px",flexShrink:0}}>{group.loads.length} stops</span>}
                  {/* OTR Driver — editable, removable */}
                  {isAdmin&&(

                            🚛 {group.groupDriver}{group.groupTruck&&<span style={{marginLeft:"3px",opacity:.7}}>·#{group.groupTruck}</span>}{group.groupTrailer&&<span style={{marginLeft:"3px",opacity:.6}}>/ {group.groupTrailer}</span>}
                          </span>
                          <button
                            title="Change or remove OTR driver"
                            onClick={e=>{e.stopPropagation();setGroup(group.id,"groupDriver","");}}

                          >✕</button>
                        </div>

                        <div style={{display:"flex",alignItems:"center",gap:"4px"}}>
                          <input

                            placeholder="Assign OTR driver..."
                            defaultValue=""
                            onBlur={e=>{
                              const v=e.target.value.trim();

                              // set group truck to match — unless the group already has that exact truck.

                              const truckForDriver=Object.keys(truckAssignments).find(tk=>(truckAssignments[tk]||"").toLowerCase()===v.toLowerCase());

                                updFields.groupTruck=truckForDriver;
                              }
                              setW("groups",week.groups.map(g=>g.id!==group.id?g:{...g,...updFields}));

                            }}
                            onKeyDown={e=>{
                              if(e.key!=="Enter")return;
                              const v=e.target.value.trim();
                              if(!v||!canEdit)return;
                              const updFields={groupDriver:v};
                              const truckForDriver=Object.keys(truckAssignments).find(tk=>(truckAssignments[tk]||"").toLowerCase()===v.toLowerCase());
                              if(truckForDriver&&group.groupTruck!==truckForDriver){
                                updFields.groupTruck=truckForDriver;
                              }
                              setW("groups",week.groups.map(g=>g.id!==group.id?g:{...g,...updFields}));
                              e.target.value="";
                            }}
                            onClick={e=>e.stopPropagation()}
                            disabled={!canEdit}
                            style={{fontSize:"9px",background:"rgba(134,239,172,.1)",border:"1px solid rgba(134,239,172,.3)",borderRadius:"4px",padding:"2px 6px",color:"#86efac",outline:"none",width:"120px",fontFamily:"inherit",opacity:canEdit?1:.5,cursor:canEdit?"text":"not-allowed"}}
                          />
                          <datalist id={`otr-quick-${group.id}`}>
                            {[...DRIVERS,...customDrivers].sort().map(d=>(<option key={d} value={d}/>))}
                          </datalist>
                        </div>
                      )}
                    </div>
                  )}
                  
                  {isAdmin&&<button onClick={()=>setGroup(group.id,"isCombined",true)} style={{background:"rgba(124,58,237,.3)",color:"#c4b5fd",border:"1px solid rgba(124,58,237,.5)",borderRadius:"4px",padding:"1px 6px",fontSize:"9px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>→ Combined</button>}
                  {isAdmin&&<input value={group.groupNotes||""} onChange={e=>setGroup(group.id,"groupNotes",e.target.value)} placeholder="Notes..." style={{background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",borderRadius:"4px",padding:"1px 5px",fontSize:"9px",color:"#e2e8f0",width:"100px",minWidth:"40px"}}/>}
                  {isAdmin&&week.groups.length>1&&<button onClick={()=>{if(window.confirm("Remove this trailer and all its loads?"))removeGroup(group.id);}} style={{background:"#7f1d1d",color:"#fca5a5",border:"1px solid #dc2626",borderRadius:"4px",padding:"1px 6px",fontSize:"9px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>✕</button>}
                </div>

                {/* ── COLUMN HEADERS ── */}
                <div style={{display:"grid",gridTemplateColumns:"16px minmax(0,1fr) 125px 125px 48px 24px 130px 55px 65px 78px 22px",gap:"10px",padding:"5px 12px",background:"#f1f5f9",borderBottom:"1px solid #e2e8f0",fontSize:"10px",fontWeight:"600",color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",alignItems:"center"}}>
                  <span/>
                  <span onClick={()=>setPlanSort(p=>p==="pickup"?"default":"pickup")} style={{cursor:"pointer",color:planSort==="pickup"?"#2563eb":"#64748b"}}>Route{planSort==="pickup"?" ▲":""}</span>
                  <span onClick={()=>setPlanSort(p=>p==="pickup"?"default":"pickup")} style={{cursor:"pointer",color:planSort==="pickup"?"#2563eb":"#64748b"}}>Pickup</span>
                  <span onClick={()=>setPlanSort(p=>p==="delivery"?"default":"delivery")} style={{cursor:"pointer",color:planSort==="delivery"?"#2563eb":"#64748b"}}>Delivery{planSort==="delivery"?" ▲":""}</span>
                  <span>Weight</span>
                  <span>Plt</span>
                  <span style={{fontStyle:"italic",color:"#374151"}}>Local Truck · Driver</span>
                  <span style={{fontStyle:"italic",color:"#374151"}}>Local Trailer</span>
                  <span style={{color:"#059669"}}>Rate $</span>
                  <span>Status</span>
                  <span/>
                </div>

                {/* ── LOAD ROWS ── */}
                {group.loads.map((load,li)=>{
                  const isExp=!!expandedLoads[load.id];
                  const srP=parseSR(load.sr||"");
                  const showBroker=canSeeBroker(group,load);
                  const ST={"Need to pickup":{bg:"#fee2e2",c:"#991b1b",bd:"#ef4444"},"Not set":{bg:"#f1f5f9",c:"#9ca3af",bd:"#e2e8f0"},"Tomorrow":{bg:"#ffedd5",c:"#9a3412",bd:"#f97316"},"Picked Up":{bg:"#fef9c3",c:"#713f12",bd:"#eab308"},"Dispatched":{bg:"#dbeafe",c:"#1e40af",bd:"#3b82f6"},"In Transit":{bg:"#ffedd5",c:"#9a3412",bd:"#f97316"},"Dock":{bg:"#fef9c3",c:"#713f12",bd:"#eab308"},"Yard":{bg:"#fef9c3",c:"#713f12",bd:"#eab308"},"Loaded":{bg:"#dcfce7",c:"#14532d",bd:"#22c55e"}};
                  // Compute effective status — auto-infer when empty based on pickup date
                  const pd2=parsePickupDate(load.pickup);const pt2=pd2?pd2.getTime():null;
                  const isToday2=pt2===today.getTime();
                  const isTomorrow2=pt2===tomorrowDay.getTime();
                  const isPast2=pt2&&pt2<today.getTime();
                  // Effective status for display
                  // Override "Need to pickup" to "Tomorrow" if pickup is actually tomorrow
                  const rawSt = load.status || (isPast2||isToday2?"Need to pickup":isTomorrow2?"Tomorrow":"");
                  const effectiveSt = (rawSt==="Need to pickup"&&isTomorrow2) ? "Tomorrow" : rawSt;
                  let sp;if(effectiveSt){sp=ST[effectiveSt]||{bg:"#fee2e2",c:"#991b1b",bd:"#ef4444"};}else{sp={bg:"#f1f5f9",c:"#9ca3af",bd:"#e2e8f0"};}
                  const otrDriver=group.groupDriver||"";
                  const localDriver=load.driver||"";

                  const loadFlag=getLoadFlag(load,group);
                  const flagged=!!loadFlag;
                  const cardRowBg=loadFlag==="important"?"#fee2e2":loadFlag==="reschedule"?"#fef9c3":isExp?"#eff6ff":li%2===0?"#fff":"#f8fafc";
                  const cardRowBorder=isExp?"3px solid #3b82f6":loadFlag==="important"?"3px solid #ef4444":loadFlag==="reschedule"?"3px solid #eab308":"3px solid transparent";

                  return(
                    <Fragment key={load.id}>
                      {/* COLLAPSED ROW — status badge visible, OTR drv + truck + trailer */}
                      <div
                        id={`load-${load.id}`}
                        onClick={()=>toggleLoadExpand(load.id)}
                        onDragOver={e=>{if(!dragLoad.current)return;e.preventDefault();e.currentTarget.style.boxShadow="inset 0 -3px 0 #3b82f6";}}
                        onDragLeave={e=>{e.currentTarget.style.boxShadow="";}}
                        onDrop={e=>{e.preventDefault();e.currentTarget.style.boxShadow="";if(!dragLoad.current||!isAdmin)return;const dl=dragLoad.current;dragLoad.current=null;moveLoad(dl.fromGroupId,group.id,dl.loadId,li);}}
                        style={{display:"grid",gridTemplateColumns:"16px minmax(0,1fr) 125px 125px 48px 24px 130px 55px 65px 78px 22px 22px",gap:"10px",padding:"7px 12px",alignItems:"center",fontSize:"12px",background:cardRowBg,borderBottom:"1px solid #e5edf5",cursor:"pointer",transition:"background .1s",borderLeft:cardRowBorder}}
                      >
                        {/* Stop dot */}
                        <div style={{width:"18px",height:"18px",borderRadius:"50%",background:dupLoadIds.has(load.id)?"#fbcfe8":isExp?"#bfdbfe":isAdmin?"#c7d2fe":"#e2e8f0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",fontWeight:"700",color:dupLoadIds.has(load.id)?"#9d174d":isExp?"#1e40af":isAdmin?"#4338ca":"#64748b",flexShrink:0,cursor:isAdmin?"grab":"default",userSelect:"none"}} draggable={isAdmin} onDragStart={e=>{if(!isAdmin)return;e.stopPropagation();dragLoad.current={loadId:load.id,fromGroupId:group.id};dragGroupIdx.current=null;e.dataTransfer.effectAllowed="move";const row=e.currentTarget.closest("[id='load-"+load.id+"']");if(row){row.style.opacity="0.5";row.style.outline="2px solid #3b82f6";}}} onDragEnd={e=>{e.stopPropagation();const row=document.getElementById("load-"+load.id);if(row){row.style.opacity="1";row.style.outline="";}dragLoad.current=null;dragGroupIdx.current=null;}} title={dupLoadIds.has(load.id)?"⚠ Possible duplicate — matches another load this week":"Drag to combine with another trailer"}>{load.stop||li+1}</div>

                        {/* Route — shipper / receiver. Tiny 📍 next to city = address captured (hover for full text). */}
                        <div style={{minWidth:0}}>
                          {isAdmin?(<>
                            <div style={{display:"flex",alignItems:"center",gap:"3px",minWidth:0}}>
                              <input key={load.id+"s"} defaultValue={srP.s} onBlur={e=>{const v=e.target.value;if(v!==srP.s){setLoad(group.id,load.id,"sr",v+" - "+parseSR(load.sr||"").r);trackField("sr");}}} onClick={e=>e.stopPropagation()} style={{flex:1,minWidth:0,border:"none",background:"transparent",fontSize:"10px",color:"#94a3b8",padding:0,outline:"none",fontFamily:"inherit",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} placeholder="Shipper"/>
                              {load.shipperAddr
                                ?<span title={load.shipperAddr+(load.shipperCo?" — "+load.shipperCo:"")} style={{fontSize:"9px",color:"#059669",cursor:"help",flexShrink:0,opacity:.6}}>📍</span>
                                :<button onClick={e=>{e.stopPropagation();setAddrEntryFor({gid:group.id,lid:load.id});}}
                                  title="Shipper address missing — click to enter manually"
                                  style={{fontSize:"9px",color:"#b45309",background:"#fef3c7",border:"1px solid #fcd34d",borderRadius:"3px",padding:"0 4px",cursor:"pointer",fontWeight:"700",lineHeight:1.3,flexShrink:0}}>⚠️</button>}
                            </div>
                            <div style={{display:"flex",alignItems:"center",gap:"3px",minWidth:0}}>
                              <input key={load.id+"r"} defaultValue={srP.r} onBlur={e=>{const v=e.target.value;if(v!==srP.r){setLoad(group.id,load.id,"sr",parseSR(load.sr||"").s+" - "+v);trackField("sr");}}} onClick={e=>e.stopPropagation()} style={{flex:1,minWidth:0,border:"none",background:"transparent",fontSize:"12px",fontWeight:"600",color:"#0f1f3d",padding:0,outline:"none",fontFamily:"inherit",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} placeholder="Receiver"/>
                              {load.receiverAddr&&<span title={load.receiverAddr+(load.receiverCo?" — "+load.receiverCo:"")} style={{fontSize:"9px",color:"#0891b2",cursor:"help",flexShrink:0,opacity:.6}}>📍</span>}
                            </div>
                          </>):(<>
                            <div style={{display:"flex",alignItems:"center",gap:"3px",minWidth:0}}>
                              <span style={{flex:1,minWidth:0,fontSize:"10px",color:"#94a3b8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{srP.s||"—"}</span>
                              {load.shipperAddr&&<span title={load.shipperAddr} style={{fontSize:"9px",color:"#059669",cursor:"help",flexShrink:0,opacity:.6}}>📍</span>}
                            </div>
                            <div style={{display:"flex",alignItems:"center",gap:"3px",minWidth:0}}>
                              <span style={{flex:1,minWidth:0,fontSize:"12px",fontWeight:"600",color:"#0f1f3d",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{srP.r||"—"}</span>
                              {load.receiverAddr&&<span title={load.receiverAddr} style={{fontSize:"9px",color:"#0891b2",cursor:"help",flexShrink:0,opacity:.6}}>📍</span>}
                            </div>
                          </>)}
                        </div>

                        {/* Pickup */}
                        <span style={{fontSize:"12px",color:"#475569",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                          {isAdmin?<input key={load.id+"pu"} defaultValue={load.pickup} onBlur={e=>{if(e.target.value!==load.pickup){setLoad(group.id,load.id,"pickup",e.target.value);trackField("pickup");}}} onClick={e=>e.stopPropagation()} style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:"4px",background:"#f8fafc",fontSize:"12px",color:"#475569",padding:"2px 4px",outline:"none",fontFamily:"inherit"}} placeholder="Date"/>:load.pickup||"—"}
                        </span>

                        {/* Delivery */}
                        <span style={{fontSize:"12px",color:"#475569",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                          {isAdmin?<input key={load.id+"dl"} defaultValue={load.delivery} onBlur={e=>{if(e.target.value!==load.delivery){setLoad(group.id,load.id,"delivery",e.target.value);trackField("delivery");}}} onClick={e=>e.stopPropagation()} style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:"4px",background:"#f8fafc",fontSize:"12px",color:"#475569",padding:"2px 4px",outline:"none",fontFamily:"inherit"}} placeholder="Date"/>:load.delivery||"—"}
                        </span>

                        {/* Weight */}
                        <span style={{fontSize:"12px",color:"#374151",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                          {isAdmin?<input key={load.id+"w"} defaultValue={load.weight} onBlur={e=>{if(e.target.value!==load.weight)setLoad(group.id,load.id,"weight",e.target.value);}} onClick={e=>e.stopPropagation()} style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:"4px",background:"#f8fafc",fontSize:"12px",color:"#374151",padding:"2px 4px",outline:"none",fontFamily:"inherit"}} placeholder="lbs"/>:load.weight||"—"}
                        </span>

                        {/* Pallets */}
                        <span style={{fontSize:"12px",color:"#374151",textAlign:"center"}}>
                          {isAdmin?<input key={load.id+"pal"} defaultValue={load.pallets} onBlur={e=>{if(e.target.value!==load.pallets)setLoad(group.id,load.id,"pallets",e.target.value);}} onClick={e=>e.stopPropagation()} style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:"4px",background:"#f8fafc",fontSize:"12px",color:"#374151",padding:"2px 4px",outline:"none",fontFamily:"inherit",textAlign:"center"}} placeholder="—"/>:load.pallets||"—"}
                        </span>

                        {/* Local Truck + Driver + Location — merged into one column */}
                        <div style={{minWidth:0,overflow:"hidden",display:"flex",flexDirection:"column",gap:"2px"}} onClick={e=>e.stopPropagation()}>
                          {/* Row 1: Truck dropdown + Driver dropdown side by side */}
                          <div style={{display:"flex",gap:"3px",alignItems:"center"}}>
                            {isAdmin?(
                              <select
                                value={load.localTruck||""}
                                onChange={e=>{
                                  const tk=e.target.value;
                                  const drv=tk?truckAssignments[tk]||"":"";
                                  const curSt=load.status||"";
                                  const furtherSt=["Dispatched","Dock","Yard","Picked Up","In Transit","Loaded","Delivered"];
                                  const updates={localTruck:tk,driver:drv};
                                  if(drv&&!furtherSt.includes(curSt))updates.status="Dispatched";
                                  setLoadFields(group.id,load.id,updates);
                                  trackField("localTruck");
                                }}
                                title={load.localTruck?"Truck #"+load.localTruck:"Pick a truck"}
                                style={{width:"58px",flexShrink:0,border:"1px solid #e2e8f0",borderRadius:"4px",background:"#f8fafc",fontSize:"11px",color:load.localTruck?"#374151":"#94a3b8",padding:"2px 2px",outline:"none",fontFamily:"inherit",cursor:"pointer"}}
                              >
                                <option value="">—</option>
                                {allTrucks.map(t=>(<option key={t} value={t}>#{t}</option>))}
                              </select>
                            ):<span style={{fontSize:"11px",color:load.localTruck?"#374151":"#94a3b8",flexShrink:0,width:"40px"}}>{load.localTruck?"#"+load.localTruck:"—"}</span>}
                            {isAdmin?(
                              <select
                                value={load.driver||""}
                                onChange={e=>{
                                  const newDriver=e.target.value;
                                  const curSt=load.status||"";
                                  const furtherSt=["Dispatched","Dock","Yard","Picked Up","In Transit","Loaded","Delivered"];
                                  const updates={driver:newDriver};
                                  if(newDriver&&!furtherSt.includes(curSt))updates.status="Dispatched";
                                  setLoadFields(group.id,load.id,updates);
                                  trackField("driver");
                                }}
                                title={load.driver||"Pick a driver"}
                                style={{flex:1,minWidth:0,border:"1px solid #e2e8f0",borderRadius:"4px",background:"#f8fafc",fontSize:"11px",fontStyle:"italic",color:load.driver?"#374151":"#94a3b8",padding:"2px 2px",outline:"none",fontFamily:"inherit",cursor:"pointer",overflow:"hidden",textOverflow:"ellipsis"}}
                              >
                                <option value="">—</option>
                                {[...DRIVERS,...customDrivers].sort().map(d=>(<option key={d} value={d}>{firstName(d)}</option>))}
                              </select>
                            ):<div title={load.driver||""} style={{fontSize:"11px",fontStyle:"italic",color:load.driver?"#374151":"#94a3b8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1,minWidth:0}}>{firstName(load.driver)||"—"}</div>}
                          </div>
                          {/* Row 2: Live location pill — only when GPS available AND status isn't a "hide" status */}
                          {(()=>{
                            if(STATUS_HIDE_PILL[load.status||""])return null;
                            const tk=load.localTruck&&liveTrucks[load.localTruck];
                            if(!tk||!tk.address)return null;
                            // Compact "City, ST"
                            const parts=tk.address.split(",").map(s=>s.trim()).filter(Boolean);
                            let short=tk.address;
                            if(parts.length>=2){
                              const lastPart=parts[parts.length-1];
                              const state=lastPart.length<=2?lastPart:(parts[parts.length-2]||"");
                              const city=lastPart.length<=2?parts[parts.length-2]:parts[parts.length-3];
                              if(city&&state)short=city+", "+state;
                              else short=parts.slice(-2).join(", ");
                            }
                            if(short.length>22)short=short.slice(0,20)+"…";
                            const tip=tk.address+" — "+liveAgo(tk.asOf)+" (truck #"+load.localTruck+")";
                            return(
                              <span title={tip} style={{fontSize:"9px",fontWeight:"700",color:"#a16207",background:"#fef3c7",border:"1px solid #fcd34d",padding:"1px 5px",borderRadius:"3px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",cursor:"help",lineHeight:1.3}}>
                                📍 {short}
                              </span>
                            );
                          })()}
                        </div>
                        {/* Local Trailer — own column, searchable via datalist */}
                        <div style={{minWidth:0}} onClick={e=>e.stopPropagation()}>
                          {isAdmin?(
                            <>
                              <input
                                key={`ltrailer-${load.id}-${load.localTrailer||""}`}
                                list={`ltrailer-${load.id}`}
                                defaultValue={load.localTrailer||""}
                                onBlur={e=>{
                                  const val=e.target.value.trim();
                                  const allTrailers=[...TRAILER_NUMBERS,...customTrailers].filter((v,i,a)=>a.indexOf(v)===i);
                                  const matched=allTrailers.find(t=>t===val||"#"+t===val||"T"+t===val);
                                  const final=matched||val;
                                  if(final!==load.localTrailer){setLoad(group.id,load.id,"localTrailer",final);trackField("localTrailer");}
                                }}
                                placeholder="Search trailer..."
                                style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:"4px",background:"#f8fafc",fontSize:"11px",color:"#7c3aed",padding:"2px 4px",outline:"none",fontFamily:"inherit"}}
                              />
                              <datalist id={`ltrailer-${load.id}`}>
                                {[...TRAILER_NUMBERS,...customTrailers].filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(t=>(<option key={t} value={t}/>))}
                              </datalist>
                            </>
                          ):<span style={{fontSize:"11px",color:load.localTrailer?"#7c3aed":"#94a3b8"}}>{load.localTrailer?load.localTrailer:"—"}</span>}
                        </div>

                        

                        {/* RATE — editable inline */}
                        <div style={{minWidth:0}} onClick={e=>e.stopPropagation()}>
                          {isAdmin?(
                            <div style={{display:"flex",alignItems:"center",gap:"2px"}}>
                              <span style={{fontSize:"10px",color:"#059669",fontWeight:"700"}}>$</span>
                              <input
                                key={load.id+"rate"}
                                defaultValue={load.rate||""}
                                type="number"
                                onBlur={e=>{if(e.target.value!==String(load.rate||"")){setLoad(group.id,load.id,"rate",e.target.value);trackField("rate");}}}
                                onClick={e=>e.stopPropagation()}
                                placeholder="0"
                                style={{width:"100%",border:"none",background:"transparent",fontSize:"11px",fontWeight:"700",color:"#059669",padding:0,outline:"none",fontFamily:"inherit"}}
                              />
                            </div>
                          ):(
                            <span style={{fontSize:"11px",fontWeight:"700",color:(parseFloat(load.rate)||0)>0?"#059669":"#94a3b8"}}>
                              {(parseFloat(load.rate)||0)>0?"$"+(parseFloat(load.rate)).toLocaleString():"—"}
                            </span>
                          )}
                        </div>

                        {/* STATUS badge — click to expand for editing. Per-load urgency
                            badge (PU TODAY / TOMORROW) stacks above when relevant. */}
                        <div style={{position:"relative",display:"flex",flexDirection:"column",alignItems:"center",gap:"2px"}} onClick={e=>e.stopPropagation()}>
                          {(()=>{const u=loadUrgency(load);return u?<span style={{fontSize:"8px",fontWeight:"800",color:"#fff",background:u.color,padding:"1px 5px",borderRadius:"3px",letterSpacing:".02em",pointerEvents:"none"}}>{u.label}</span>:null;})()}
                          <div style={{position:"relative",width:"100%",textAlign:"center"}}>
                            <select value={load.status||""} onChange={e=>{setLoad(group.id,load.id,"status",e.target.value);trackField("status");}} style={{position:"absolute",inset:0,opacity:0,cursor:isAdmin?"pointer":"default",width:"100%",height:"100%",zIndex:2}} disabled={!isAdmin}>
                              <option value="">— Not set —</option>{LOAD_STATUSES.map(s=>(<option key={s}>{s}</option>))}
                            </select>
                            <span style={{display:"inline-flex",alignItems:"center",gap:"4px",fontSize:"10px",fontWeight:"700",padding:"3px 7px",borderRadius:"4px",background:sp.bg,color:sp.c,border:`1.5px solid ${sp.bd}`,whiteSpace:"nowrap",userSelect:"none",pointerEvents:"none"}}>
                              <span style={{width:"6px",height:"6px",borderRadius:"50%",background:sp.bd,flexShrink:0}}/>
                              {effectiveSt||"Not set"}
                            </span>
                          </div>
                        </div>

                        {/* ⏳ Per-load flag picker — admin only. Opens a popup with options. */}
                        {isAdmin?(()=>{
                          const btnBg=loadFlag==="important"?"#fca5a5":loadFlag==="reschedule"?"#fbbf24":"transparent";
                          const btnFg=loadFlag==="important"?"#991b1b":loadFlag==="reschedule"?"#92400e":"#cbd5e1";
                          const btnBorder=loadFlag==="important"?"#ef4444":loadFlag==="reschedule"?"#d97706":"transparent";
                          return(
                            <button onClick={e=>openFlagPicker(e,group.id,load.id)}
                              title="Click to set flag (Waiting new appt / Important / Clear)"
                              style={{background:btnBg,color:btnFg,border:`1px solid ${btnBorder}`,borderRadius:"4px",padding:"1px 4px",fontSize:"12px",cursor:"pointer",lineHeight:1}}>⏳</button>

                      {/* EXPAND PANEL — broker, load#, commodity, rate, trailer#, quick buttons */}

                              <div style={{fontSize:"9px",fontWeight:"600",color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",marginBottom:"2px"}}>Load #</div>
                              {isAdmin?<input defaultValue={load.broker&&load.broker.includes("&")?load.broker.split("&")[1]?.trim():""} onBlur={e=>{const broker=load.broker?load.broker.split("&")[0].trim():"";setLoad(group.id,load.id,"broker",broker+(e.target.value.trim()?" & "+e.target.value.trim():""));trackField("broker");}} style={{width:"100%",border:"none",borderBottom:"1px solid #bfdbfe",background:"transparent",fontSize:"12px",fontWeight:"600",color:"#0f1f3d",outline:"none",fontFamily:"inherit"}} placeholder="Load #"/>
                              :<div style={{fontSize:"12px",fontWeight:"600",color:"#0f1f3d"}}>{load.broker&&load.broker.includes("&")?load.broker.split("&")[1]?.trim():"—"}</div>}
                            </div></>)}
                            <div>
                              <div style={{fontSize:"9px",fontWeight:"600",color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",marginBottom:"2px"}}>Commodity</div>

                              :<div style={{fontSize:"12px",fontWeight:"600",color:"#0f1f3d"}}>{load.product||"—"}</div>}
                            </div>
                            {isAdmin&&<div>
                              <div style={{fontSize:"9px",fontWeight:"600",color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",marginBottom:"2px"}}>Rate ($)</div>
                              <div style={{display:"flex",alignItems:"center",gap:"2px"}}><span style={{fontSize:"11px",color:"#64748b"}}>$</span><input value={load.rate||""} type="number" onChange={e=>{setLoad(group.id,load.id,"rate",e.target.value);trackField("rate");}} style={{border:"none",borderBottom:"1px solid #bfdbfe",background:"transparent",fontSize:"12px",fontWeight:"700",color:"#059669",outline:"none",fontFamily:"inherit",width:"80px"}} placeholder="0"/></div>
                            </div>}
                            <div>
                              <div style={{fontSize:"9px",fontWeight:"600",color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",marginBottom:"2px"}}>Trailer #</div>
                              {isAdmin?<select value={load.trailer||""} onChange={e=>{setLoad(group.id,load.id,"trailer",e.target.value);trackField("trailer");}} style={{border:"none",borderBottom:"1px solid #bfdbfe",background:"transparent",fontSize:"12px",fontWeight:"600",color:"#7c3aed",outline:"none",fontFamily:"inherit",cursor:"pointer"}}>
                                <option value="">—</option>{[...TRAILER_NUMBERS,...customTrailers].filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(t=>(<option key={t} value={t}>#{t}</option>))}

                                  <span style={{fontSize:"11px",color:"#64748b"}}>$</span>
                                  <input
                                    type="number"
                                    value={load.manualLocalCharge!==""&&load.manualLocalCharge!=null?load.manualLocalCharge:""}
                                    placeholder={(()=>{const{s:shipper}=parseSR(load.sr||"");const am=cityMiles(shipper);const um=(load.manualPickupMi!==""&&load.manualPickupMi!=null)?parseFloat(load.manualPickupMi):am;return um!=null?String(localCharge(um)||0):"auto";})()}
                                    onChange={e=>setLoad(group.id,load.id,"manualLocalCharge",e.target.value===""?"":e.target.value)}
                                    style={{border:"none",borderBottom:"1px solid #bfdbfe",background:"transparent",fontSize:"12px",fontWeight:"700",color:"#b45309",outline:"none",fontFamily:"inherit",width:"70px"}}

                                  }
                                </div>

                                <div style={{fontSize:"12px",fontWeight:"700",color:"#b45309"}}>
                                  {load.manualLocalCharge!==""&&load.manualLocalCharge!=null
                                    ?"$"+parseFloat(load.manualLocalCharge).toLocaleString()
                                    :(()=>{const{s:shipper}=parseSR(load.sr||"");const am=cityMiles(shipper);const um=(load.manualPickupMi!==""&&load.manualPickupMi!=null)?parseFloat(load.manualPickupMi):am;const lc=um!=null?localCharge(um):null;return lc!=null?"$"+lc.toLocaleString():"—";})()
                                  }
                                </div>
                              )}
                            </div>
                          </div>
                          {/* Action buttons — no status here, status badge is on the row */}

                            <button onClick={e=>{e.stopPropagation();setPhotoModal({...load,groupId:group.id});}} style={{background:(load.photos||[]).length>0?"#eff6ff":"#f8fafc",border:`1px solid ${(load.photos||[]).length>0?"#3b82f6":"#d1d5db"}`,color:(load.photos||[]).length>0?"#2563eb":"#9ca3af",borderRadius:"4px",padding:"2px 8px",fontSize:"10px",cursor:"pointer"}}>📷{(load.photos||[]).length>0?" "+((load.photos||[]).length):" Photos"}</button>
                            <button onClick={e=>{e.stopPropagation();setLoadDetailId({loadId:load.id,weekId:week.id});}} style={{background:"#f8fafc",border:"1px solid #d1d5db",color:"#374151",borderRadius:"4px",padding:"2px 8px",fontSize:"10px",cursor:"pointer"}}>📋 Detail</button>
                            <button onClick={e=>{e.stopPropagation();if(window.confirm("Delete this load?"))removeLoad(group.id,load.id);}} style={{background:"#fee2e2",border:"1px solid #fca5a5",color:"#dc2626",borderRadius:"4px",padding:"2px 8px",fontSize:"10px",cursor:"pointer"}}>✕ Delete</button>
                          </div>}
                        </div>
                      )}
                    </Fragment>
                  );
                })}
              </div>
            );
          })}
          {isAdmin&&<button onClick={addGroup} style={{background:"#2563eb",color:"#fff",border:"none",borderRadius:"6px",padding:"5px 14px",fontSize:"11px",fontWeight:"600",cursor:"pointer",alignSelf:"flex-start",marginTop:"2px"}}>+ Add Trailer</button>}
        </div>

        {/* ════ RIGHT PANEL — Combined Loads ════ */}
        {(()=>{
          const combined=(pendingGroups||[]).filter(g=>g.isCombined);
          const hasMulti=(pendingGroups||[]).some(g=>!g.isCombined&&(g.loads||[]).length>1);
          if(!combined.length&&!hasMulti)return null;
          return(
            <div style={{flex:"1 1 0",minWidth:"260px",background:"#fff",border:"1px solid #e2e8f0",borderRadius:"8px",overflow:"hidden",alignSelf:"flex-start"}}>

                <span style={{background:"rgba(255,255,255,.15)",color:"#fff",fontSize:"10px",padding:"1px 6px",borderRadius:"10px"}}>{combined.length}</span>
                <span style={{marginLeft:"auto",fontSize:"9px",color:"rgba(255,255,255,.4)"}}>Multi-stop</span>
              </div>
              <div style={{padding:"8px",display:"flex",flexDirection:"column",gap:"6px"}}>
                {combined.length===0&&<div style={{fontSize:"11px",color:"#94a3b8",textAlign:"center",padding:"14px 8px",border:"1px dashed #e2e8f0",borderRadius:"6px",lineHeight:"1.5"}}>No combined loads.<br/><span style={{fontSize:"10px"}}>Click → Combined on<br/>any multi-stop trailer.</span></div>}
                {[...combined].sort((a,b)=>{
                  const ORDER={Preplanned:0,"Not dispatched":1,Loaded:2,Future:3,Ready:4};
                  return (ORDER[a.combinedStatus||"Preplanned"]||0)-(ORDER[b.combinedStatus||"Preplanned"]||0);
                }).map((group)=>{
                  const gGross=(group.loads||[]).reduce((s,l)=>s+(parseFloat(l.rate)||0),0);
                  const gLoc=(group.loads||[]).reduce((s,l)=>{
                    if(l.manualLocalCharge!==""&&l.manualLocalCharge!=null)return s+(parseFloat(l.manualLocalCharge)||0);
                    const sr2=parseSR(l.sr||"");const am2=cityMiles(sr2.s);
                    const um2=(l.manualPickupMi!==""&&l.manualPickupMi!=null)?parseFloat(l.manualPickupMi):am2;
                    return s+(um2!=null?localCharge(um2)||0:0);
                  },0);
                  const gNet=Math.round(gGross-gLoc);
                  // Lock claimed groups for non-admins — only admin can modify after claim
                  const isClaimed=!!(group.securedAt&&group.groupDriver);
                  const canEdit=isAdmin||!isClaimed;
                  const gi=(week.groups||[]).indexOf(group);
                  const COMBINED_STATUSES=["Preplanned","Future","Not dispatched","Loaded","Ready"];
                  const cSt=group.combinedStatus||"Preplanned";
                  const cStStyle={Preplanned:{bg:"#f1f5f9",c:"#475569",bd:"#94a3b8"},Future:{bg:"#f5f3ff",c:"#5b21b6",bd:"#a78bfa"},"Not dispatched":{bg:"#fef9c3",c:"#713f12",bd:"#eab308"},Loaded:{bg:"#dcfce7",c:"#14532d",bd:"#22c55e"},Ready:{bg:"#dcfce7",c:"#14532d",bd:"#22c55e"}}[cSt]||{bg:"#f1f5f9",c:"#475569",bd:"#94a3b8"};
                  return(
                    <div key={group.id} style={{background:cSt==="Ready"?"#f0fdf4":cSt==="Not dispatched"?"#fffbeb":cSt==="Future"?"#faf5ff":"#f8fafc",border:"1px solid #e2e8f0",borderRadius:"7px",padding:"9px 10px",borderLeft:`3px solid ${cStStyle.bd}`}}>
                      {/* Header row: T# · stops · urgency tag */}
                      <div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"5px",flexWrap:"wrap"}}>
                        <span style={{fontSize:"12px",fontWeight:"700",color:"#0f1f3d"}}>T{gi+1} · {(group.loads||[]).length} stops</span>
                        {isClaimed&&!isAdmin&&<span style={{fontSize:"9px",fontWeight:"700",color:"#059669",background:"#f0fdf4",border:"1px solid #bbf7d0",padding:"2px 7px",borderRadius:"4px"}}>🔒 Claimed</span>}
                        <span style={{fontSize:"11px",fontWeight:"700",color:"#059669",marginLeft:"auto"}} title="Net after local expenses">${gNet.toLocaleString()}</span>
                      </div>
                      {/* No Driver warning bar */}
                      {!group.groupDriver&&(
                        <div style={{background:"#fee2e2",border:"1px solid #fca5a5",borderRadius:"5px",padding:"4px 10px",marginBottom:"7px",display:"flex",alignItems:"center",gap:"6px"}}>
                          <span style={{fontSize:"13px"}}>⚠️</span>
                          <span style={{fontSize:"11px",fontWeight:"700",color:"#b91c1c",letterSpacing:".01em"}}>NO DRIVER ASSIGNED</span>
                        </div>
                      )}
                      {/* OTR Driver + Truck + Trailer — editable inline, COMPACT one-row layout */}
                      {isAdmin?(
                        <div style={{display:"flex",flexDirection:"column",gap:"4px",marginBottom:"5px",padding:"5px 6px",background:"rgba(255,255,255,.7)",border:"1px solid #e2e8f0",borderRadius:"6px"}}>
                          <div style={{display:"flex",gap:"5px",alignItems:"center"}}>
                            <input
                                list={`otr-drv-${group.id}`}
                                defaultValue={group.groupDriver||""}
                                placeholder="OTR driver..."
                                onBlur={e=>{
                                  const val=e.target.value.trim();
                                  const all=[...DRIVERS,...customDrivers];
                                  const matched=all.find(d=>d.toLowerCase()===val.toLowerCase());
                                  const final=matched||val;
                                  if(final===group.groupDriver)return;
                                  // Reverse auto-fill: if this driver has a truck assignment in the
                                  // equipment list, set the OTR group truck to match — UNLESS the
                                  // group already has a truck that's also assigned to this driver.
                                  const updFields={groupDriver:final||""};
                                  if(final){
                                    const truckForDriver=Object.keys(truckAssignments).find(tk=>(truckAssignments[tk]||"").toLowerCase()===final.toLowerCase());
                                    if(truckForDriver&&group.groupTruck!==truckForDriver){
                                      updFields.groupTruck=truckForDriver;
                                    }
                                  }
                                  setW("groups",week.groups.map(g=>g.id!==group.id?g:{...g,...updFields}));
                                }}
                                style={{flex:"2 1 0",minWidth:"90px",border:"1px solid #bfdbfe",borderRadius:"5px",padding:"3px 6px",fontSize:"11px",fontWeight:"600",color:group.groupDriver?"#0369a1":"#374151",background:"#fff",outline:"none",fontStyle:"italic"}}
                              />
                              <datalist id={`otr-drv-${group.id}`}>
                                {[...DRIVERS,...customDrivers].sort().map(d=>(<option key={d} value={d}/>))}
                              </datalist>

                              {[...TRUCK_NUMBERS,...customTrucks].filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(t=>(<option key={t} value={t}>#{t}</option>))}
                            </select>
                            {/* Mismatch warning: if both driver and truck are set and equipment list disagrees */}
                            {(()=>{
                              if(!group.groupTruck||!group.groupDriver)return null;
                              const expected=truckAssignments[group.groupTruck];
                              if(!expected)return null;
                              if(expected.toLowerCase()===group.groupDriver.toLowerCase())return null;
                              return(<span title={`Equipment list says truck #${group.groupTruck} is assigned to ${expected}, not ${group.groupDriver}. Click the driver field to auto-fix.`} style={{fontSize:"12px",color:"#f59e0b",cursor:"help",flexShrink:0}}>⚠️</span>);
                            })()}
                            <select value={group.groupTrailer||""} onChange={e=>{if(canEdit)setGroup(group.id,"groupTrailer",e.target.value);}} disabled={!canEdit}
                              style={{flex:"1 1 0",minWidth:"68px",border:"1px solid #ede9fe",borderRadius:"5px",padding:"3px 4px",fontSize:"11px",fontWeight:"600",color:group.groupTrailer?"#7c3aed":"#94a3b8",background:"#fff",cursor:"pointer",outline:"none"}}>
                              <option value="">Trailer</option>
                              {[...TRAILER_NUMBERS,...customTrailers].filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(t=>(<option key={t} value={t}>#{t}</option>))}
                            </select>
                          </div>
                          {/* Live OTR truck location pill — only renders when GPS available. */}
                          {(()=>{
                            const tk=group.groupTruck&&liveTrucks[group.groupTruck];
                            if(!tk||!tk.address)return null;
                            const parts=tk.address.split(",").map(s=>s.trim()).filter(Boolean);
                            let short=tk.address;
                            if(parts.length>=2){
                              const lastPart=parts[parts.length-1];
                              const state=lastPart.length<=2?lastPart:(parts[parts.length-2]||"");
                              const city=lastPart.length<=2?parts[parts.length-2]:parts[parts.length-3];
                              if(city&&state)short=city+", "+state;
                              else short=parts.slice(-2).join(", ");
                            }
                            if(short.length>32)short=short.slice(0,30)+"…";
                            const tip=tk.address+" — "+liveAgo(tk.asOf)+" (truck #"+group.groupTruck+")";
                            return(
                              <div title={tip} style={{fontSize:"10px",fontWeight:"700",color:"#a16207",background:"#fef3c7",border:"1px solid #fcd34d",padding:"2px 7px",borderRadius:"4px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",cursor:"help",alignSelf:"flex-start"}}>
                                📍 {short}
                              </div>
                            );
                          })()}
                        </div>
                      ):(
                        <div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"5px",flexWrap:"wrap"}}>
                          <span style={{fontSize:"10px",fontWeight:"600",color:group.groupDriver?"#0369a1":"#ef4444",fontStyle:"italic"}}>{group.groupDriver||"No OTR driver"}</span>
                          {group.groupTruck&&<span style={{fontSize:"10px",color:"#475569",background:"#f1f5f9",padding:"1px 5px",borderRadius:"4px",fontWeight:"600"}}>🚚#{group.groupTruck}</span>}
                          {group.groupTrailer&&<span style={{fontSize:"10px",color:"#7c3aed",background:"#faf5ff",padding:"1px 5px",borderRadius:"4px",fontWeight:"600"}}>{group.groupTrailer}</span>}
                          {/* OTR truck location — refreshed every 60s. Note: in Combined we always
                              show the pill regardless of load status, because the OTR truck is in
                              transit TO this trailer; that's exactly what you want to know. */}
                          {(()=>{
                            const tk=group.groupTruck&&liveTrucks[group.groupTruck];
                            if(!tk||!tk.address)return null;
                            const parts=tk.address.split(",").map(s=>s.trim()).filter(Boolean);
                            let short=tk.address;
                            if(parts.length>=2){
                              const lastPart=parts[parts.length-1];
                              const state=lastPart.length<=2?lastPart:(parts[parts.length-2]||"");
                              const city=lastPart.length<=2?parts[parts.length-2]:parts[parts.length-3];
                              if(city&&state)short=city+", "+state;
                              else short=parts.slice(-2).join(", ");
                            }
                            if(short.length>26)short=short.slice(0,24)+"…";
                            const tip=tk.address+" — "+liveAgo(tk.asOf)+" (truck #"+group.groupTruck+")";
                            return(
                              <span title={tip} style={{fontSize:"10px",fontWeight:"700",color:"#a16207",background:"#fef3c7",border:"1px solid #fcd34d",padding:"1px 6px",borderRadius:"4px",whiteSpace:"nowrap",cursor:"help"}}>
                                📍 {short}
                              </span>
                            );
                          })()}
                        </div>
                      )}
                      {/* Status selector: Preplanned / Dispatched / Loaded */}
                      <div style={{marginBottom:"7px"}}>
                        <div style={{position:"relative",display:"inline-block"}}>
                          <select value={cSt} onChange={e=>{
                            if(!isAdmin)return;

                            if(nSt==="Ready"){
                              setW("groups",week.groups.map(g=>g.id!==group.id?g:{...g,groupStatus:"In Transit",isCombined:false,combinedStatus:"Ready"}));
                            } else {
                              setGroup(group.id,"combinedStatus",nSt);
                            }
                          }} style={{position:"absolute",inset:0,opacity:0,cursor:isAdmin?"pointer":"default",width:"100%",height:"100%",zIndex:2}} disabled={!isAdmin}>
                            {COMBINED_STATUSES.map(s=>(<option key={s} value={s}>{s}</option>))}
