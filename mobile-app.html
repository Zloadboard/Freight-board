<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Z Board"/>
<meta name="theme-color" content="#0f1f3d"/>
<link rel="manifest" href="manifest.json"/>
<title>Z Board</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --navy:#0f1f3d; --navy2:#1a2e50; --navy3:#1e3a5f;
  --bg:#f0f4f8; --card:#fff; --line:#e2e8f0; --line2:#f1f5f9;
  --ink:#0f1f3d; --ink2:#475569; --ink3:#64748b; --ink4:#94a3b8;
  --sky:#38bdf8; --blue:#2563eb; --green:#15803d; --green2:#22c55e;
  --amber:#b45309; --amberbg:#fef3c7; --red:#b91c1c; --redbg:#fee2e2;
  --violet:#7c3aed; --violetbg:#ede9fe;
  --topbar:52px; --botbar:58px;
}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}

/* ══ TOP BAR ══ */
.top{
  position:fixed;top:0;left:0;right:0;z-index:300;background:var(--navy);
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 8px rgba(0,0,0,.28);
}
.top-in{height:var(--topbar);display:flex;align-items:center;gap:10px;padding:0 12px;}
.back{
  width:34px;height:34px;flex-shrink:0;border:none;background:rgba(255,255,255,.1);
  color:#fff;border-radius:10px;font-size:19px;line-height:1;cursor:pointer;
  display:none;align-items:center;justify-content:center;
}
.back.on{display:flex;}
.top-txt{flex:1;min-width:0;}
.top-t{color:#fff;font-size:15px;font-weight:800;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-s{color:rgba(255,255,255,.45);font-size:10px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-act{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green2);flex-shrink:0;}
.dot.load{background:#f59e0b;animation:pul 1s infinite;}
.dot.err{background:#ef4444;}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.35}}
.ibtn{
  width:34px;height:34px;border:none;background:rgba(255,255,255,.1);color:#fff;
  border-radius:10px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}

/* ══ OFFLINE / STALE BANNER ══ */
.banner{
  display:none;padding:7px 14px;font-size:11px;font-weight:700;
  align-items:center;gap:8px;
}
.banner.on{display:flex;}
.banner.warn{background:var(--amberbg);color:#78350f;border-bottom:1px solid #fcd34d;}
.banner.bad{background:var(--redbg);color:var(--red);border-bottom:1px solid #fca5a5;}
.banner button{
  margin-left:auto;border:none;background:rgba(0,0,0,.1);color:inherit;
  padding:3px 10px;border-radius:6px;font-size:10px;font-weight:800;cursor:pointer;flex-shrink:0;
}

/* ══ SCREEN STACK ══ */
.wrap{
  padding-top:calc(var(--topbar) + env(safe-area-inset-top));
  padding-bottom:calc(var(--botbar) + env(safe-area-inset-bottom));
  min-height:100%;
}
.scr{display:none;padding:12px;}
.scr.on{display:block;}
.scr-pad0{padding:0;}

/* ══ HUB TILES ══ */
.hub-hd{padding:4px 2px 12px;}
.hub-hd h1{font-size:21px;font-weight:900;letter-spacing:-.02em;}
.hub-hd p{font-size:12px;color:var(--ink3);margin-top:2px;}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tile{
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:13px 12px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:2px;min-height:96px;
  box-shadow:0 1px 3px rgba(15,31,61,.06);position:relative;overflow:hidden;
}
.tile:active{transform:scale(.975);}
.tile-ic{font-size:21px;line-height:1;margin-bottom:5px;}
.tile-t{font-size:13px;font-weight:800;color:var(--ink);line-height:1.2;}
.tile-v{font-size:17px;font-weight:900;margin-top:3px;line-height:1.1;}
.tile-s{font-size:10px;color:var(--ink4);font-weight:600;line-height:1.3;}
.tile-wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:10px;}
.tile-wide .tile-ic{margin:0;font-size:18px;}
.tile-wide .tile-t{flex:1;}
.tile-chev{color:var(--ink4);font-size:15px;flex-shrink:0;}
.tile-bad{
  position:absolute;top:9px;right:9px;font-size:9px;font-weight:800;
  padding:2px 6px;border-radius:99px;background:var(--redbg);color:var(--red);
}

/* ══ SECTION GROUP ROWS (drill-in lists) ══ */
.grp{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  margin-bottom:9px;overflow:hidden;box-shadow:0 1px 2px rgba(15,31,61,.05);
}
.grp-row{
  display:flex;align-items:center;gap:10px;padding:12px 13px;cursor:pointer;width:100%;
  border:none;background:none;text-align:left;font-family:inherit;
}
.grp-row:active{background:var(--line2);}
.grp-ic{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
}
.grp-mid{flex:1;min-width:0;}
.grp-t{font-size:13px;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.grp-s{font-size:10.5px;color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.grp-rt{text-align:right;flex-shrink:0;}
.grp-n{font-size:14px;font-weight:900;color:var(--green);}
.grp-ns{font-size:9.5px;color:var(--ink4);font-weight:600;}

/* ══ SUB TABS ══ */
.stabs{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:calc(var(--topbar) + env(safe-area-inset-top));z-index:120;
}
.stabs::-webkit-scrollbar{display:none;}
.stab{
  border:1.5px solid var(--line);background:var(--card);color:var(--ink3);
  padding:6px 13px;border-radius:99px;font-size:11.5px;font-weight:800;
  white-space:nowrap;cursor:pointer;flex-shrink:0;font-family:inherit;
}
.stab.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.stab-n{opacity:.55;margin-left:4px;font-weight:700;}

/* ══ CARDS / DETAIL ══ */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(15,31,61,.05);
}
.card-hd{background:var(--navy);padding:9px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.card-hd.nodrv{background:var(--redbg);}
.card-bd{padding:11px 12px;}
.pill{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;flex-shrink:0;}
.p-truck{color:#fff;background:rgba(255,255,255,.15);}
.p-trl{color:#c4b5fd;background:rgba(167,139,250,.2);}
.p-drv{font-size:11.5px;font-weight:700;color:#86efac;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.p-nodrv{font-size:10.5px;font-weight:800;color:var(--red);flex:1;}
.p-mi{font-size:9.5px;color:rgba(255,255,255,.5);background:rgba(255,255,255,.08);}
.p-live{font-size:9.5px;font-weight:700;color:#fde047;background:rgba(234,179,8,.16);border:1px solid rgba(234,179,8,.36);padding:2px 6px;border-radius:5px;white-space:nowrap;}
.p-live.lt{color:#a16207;background:var(--amberbg);border-color:#fcd34d;}
/* On the pale "no driver" header the white-on-navy pills are unreadable. */
.card-hd.nodrv .pill.p-mi{color:var(--ink2);background:rgba(0,0,0,.07);}
.card-hd.nodrv .pill.p-truck{color:var(--ink);background:rgba(0,0,0,.07);}
.card-hd.nodrv .pill.p-trl{color:#5b21b6;background:rgba(124,58,237,.12);}

.fin{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#f8fafc;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.fin-i{display:flex;align-items:baseline;gap:4px;}
.fin-l{font-size:9px;color:var(--ink3);font-weight:800;text-transform:uppercase;letter-spacing:.03em;}
.fin-v{font-size:13px;font-weight:800;}
.fin-sep{color:var(--ink4);font-weight:700;}
.fin-net{margin-left:auto;background:#f0fdf4;border:1.5px solid var(--green2);border-radius:8px;padding:3px 9px;display:flex;align-items:baseline;gap:4px;}
.fin-net b{color:var(--green);font-size:15px;font-weight:900;}

.stop{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line2);}
.stop:last-child{border-bottom:none;}
.stop-n{
  width:19px;height:19px;border-radius:50%;background:#e0e7ff;color:#3730a3;
  display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:800;flex-shrink:0;margin-top:1px;
}
.stop-m{flex:1;min-width:0;}
.stop-c{font-size:13px;font-weight:700;color:var(--ink);}
.stop-r{font-size:11px;color:var(--ink3);margin-top:1px;}
.stop-d{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;}
.tag{font-size:9.5px;padding:2px 6px;border-radius:4px;background:var(--line2);color:var(--ink2);font-weight:600;}
.tag-pu{background:#e0f2fe;color:#0369a1;}
.badge{font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;flex-shrink:0;white-space:nowrap;}
.b-disp{background:#dbeafe;color:#1e40af;}
.b-dock{background:#fef9c3;color:#713f12;}
.b-need{background:var(--redbg);color:#991b1b;}
.b-load{background:#dcfce7;color:#14532d;}
.b-del{background:#dcfce7;color:#065f46;}

/* ══ KPI GRID ══ */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;}
.kpi-l{font-size:9.5px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:5px;}
.kpi-v{font-size:19px;font-weight:900;margin-top:5px;line-height:1.1;}
.kpi-d{font-size:10px;font-weight:700;margin-top:3px;}
.up{color:#16a34a;}.dn{color:#dc2626;}.flat{color:var(--ink4);}

/* ══ FORM BITS ══ */
.fld{margin-bottom:11px;}
.fld label{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px;}
.inp{
  width:100%;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 12px;
  font-size:14px;font-family:inherit;color:var(--ink);background:var(--card);outline:none;
}
.inp:focus{border-color:var(--blue);}
.btn{
  border:none;border-radius:10px;padding:11px 16px;font-size:13.5px;font-weight:800;
  cursor:pointer;font-family:inherit;background:var(--blue);color:#fff;
}
.btn:active{opacity:.85;}
.btn[disabled]{background:#93c5fd;}
.btn-g{background:var(--green);}
.btn-o{background:var(--card);border:1.5px solid var(--line);color:var(--ink2);}
.row{display:flex;gap:8px;align-items:flex-end;}
.row>*{flex:1;}
.row .btn{flex:0 0 auto;}

/* ══ NOTE BOXES ══ */
.note{border-radius:10px;padding:10px 12px;font-size:11.5px;line-height:1.55;margin-bottom:10px;}
.note-i{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;}
.note-w{background:#fffbeb;border:1px solid #fde68a;color:#92400e;}
.note-e{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;}
.note b{font-weight:800;}

.sec-t{font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 8px;}
.empty{text-align:center;padding:38px 20px;color:var(--ink4);}
.empty-i{font-size:34px;margin-bottom:8px;opacity:.5;}
.empty-t{font-size:13px;font-weight:700;}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin:32px auto;}
@keyframes sp{to{transform:rotate(360deg)}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);}
.kv:last-child{border-bottom:none;}
.kv-k{font-size:11.5px;color:var(--ink3);font-weight:600;}
.kv-v{font-size:12.5px;font-weight:700;text-align:right;}
.mono{font-variant-numeric:tabular-nums;}
.cp{cursor:pointer;user-select:all;}
.cp[data-copied="1"]{background:#dcfce7!important;color:var(--green)!important;}

/* ══ BOTTOM NAV ══ */
.bot{
  position:fixed;bottom:0;left:0;right:0;z-index:300;background:var(--navy);
  border-top:1px solid rgba(255,255,255,.08);display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
.bot-b{
  flex:1;border:none;background:none;color:rgba(255,255,255,.42);
  height:var(--botbar);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:9px;font-weight:800;cursor:pointer;font-family:inherit;
}
.bot-b.on{color:var(--sky);}
.bot-i{font-size:18px;line-height:1;}

/* ══ LOGIN ══ */
.login{
  position:fixed;inset:0;background:var(--navy);z-index:900;
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;
}
.login.on{display:flex;}
.login-l{font-size:46px;margin-bottom:10px;}
.login-t{color:#fff;font-size:21px;font-weight:900;}
.login-s{color:rgba(255,255,255,.42);font-size:12px;margin:4px 0 26px;text-align:center;max-width:280px;line-height:1.5;}
.login-c{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:24px 22px;width:100%;max-width:330px;}
.login-c label{color:rgba(255,255,255,.55);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:9px;}
.pin{
  width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);
  border-radius:12px;padding:14px;color:#fff;font-size:20px;font-family:inherit;
  outline:none;text-align:center;letter-spacing:.24em;margin-bottom:13px;
}
.pin:focus{border-color:var(--blue);}
.login-c .btn{width:100%;margin-bottom:9px;}
.login-e{color:#fca5a5;font-size:11.5px;text-align:center;margin-top:8px;min-height:15px;line-height:1.4;}
</style>
</head>
<body>
<!-- ══ TOP BAR ══ -->
<div class="top">
  <div class="top-in">
    <button class="back" id="back" onclick="goBack()">‹</button>
    <div class="top-txt">
      <div class="top-t" id="top-t">Z Board</div>
      <div class="top-s" id="top-s">Starting…</div>
    </div>
    <div class="top-act">
      <div class="dot load" id="dot"></div>
      <button class="ibtn" onclick="refreshData(true)" title="Refresh">↻</button>
    </div>
  </div>
  <div class="banner" id="banner"><span id="banner-t"></span><button onclick="refreshData(true)">Retry</button></div>
</div>

<!-- ══ LOGIN ══ -->
<div class="login" id="login">
  <div class="login-l">🔐</div>
  <div class="login-t">Z Board</div>
  <div class="login-s">Admin or dispatcher PIN. Checked on the server — the PIN is never stored on this phone.</div>
  <div class="login-c">
    <label for="pin">PIN</label>
    <input class="pin" type="password" id="pin" inputmode="numeric" maxlength="20" placeholder="••••" oninput="clrErr()"/>
    <button class="btn" id="login-btn" onclick="attemptLogin()">Sign in</button>
    <button class="btn btn-o" id="login-cancel" onclick="hideLogin()" style="display:none">Cancel</button>
    <div class="login-e" id="login-e"></div>
  </div>
</div>

<!-- ══ SCREENS ══ -->
<div class="wrap">
  <div class="scr" id="s-hub"></div>
  <div class="scr scr-pad0" id="s-board"></div>
  <div class="scr" id="s-trailer"></div>
  <div class="scr" id="s-week"></div>
  <div class="scr" id="s-drivers"></div>
  <div class="scr" id="s-driver"></div>
  <div class="scr" id="s-trucks"></div>
  <div class="scr" id="s-routes"></div>
  <div class="scr" id="s-milecheck"></div>
  <div class="scr" id="s-brokers"></div>
  <div class="scr" id="s-market"></div>
  <div class="scr" id="s-xdock"></div>
  <div class="scr" id="s-payroll"></div>
  <div class="scr" id="s-search"></div>
  <div class="scr" id="s-settings"></div>
</div>

<!-- ══ BOTTOM NAV ══ -->
<div class="bot">
  <button class="bot-b on" id="nav-hub" onclick="go('hub')"><span class="bot-i">▦</span>Home</button>
  <button class="bot-b" id="nav-board" onclick="go('board')"><span class="bot-i">▤</span>Board</button>
  <button class="bot-b" id="nav-search" onclick="go('search')"><span class="bot-i">⌕</span>Search</button>
  <button class="bot-b" id="nav-settings" onclick="go('settings')"><span class="bot-i">⚙</span>More</button>
</div>

/* cityMiles — FIX (item 2, verified 2026-09-28, 44,944 lookups).
   The old fuzzy branch returned the FIRST overlapping key, so twelve typed
   names took another place's mileage. Two were inside the 250-mile local
   radius, which fired a local charge that should not exist:
     "Troy, MI"     -> key "east troy"     70 mi -> $350 phantom charge
     "Buffalo, OK"  -> key "buffalo grove" 38 mi -> $300 phantom charge
   Now the longest matching key wins, and a fuzzy match may not cross a
   state line. A bare key's state is recorded nowhere, so when a state was
   typed only a key carrying that same state can be trusted; no match falls
   through to the miss log rather than guessing. Swept over every table name
   x all 50 states: 0 cases where null became a number. */

  var zm=String(s).match(/\b(\d{5})\b/);if(zm&&ZIPDIST[zm[1]])return ZIPDIST[zm[1]].miles;
  var c=String(s).split(",")[0].trim().toLowerCase();
  var st=(String(s).split(",")[1]||"").trim().toLowerCase().replace(/[^a-z]/g,"").slice(0,2);
  if(st&&DIST_OVERRIDES[c+" "+st]!==undefined)return DIST_OVERRIDES[c+" "+st];
  if(DIST_OVERRIDES[c]!==undefined)return DIST_OVERRIDES[c];
  if(st&&DIST[c+" "+st]!==undefined)return DIST[c+" "+st];
  if(DIST[c]!==undefined)return DIST[c];

  for(var k in DIST)if(Object.prototype.hasOwnProperty.call(DIST,k)&&(c.indexOf(k)>=0||k.indexOf(c)>=0)&&k.length>4)cand.push(k);

/* ── week roll-up ────────────────────────────────────────────────── */
function weekTotals(w){
  var gs=(w&&w.groups)||[],lds=gs.reduce(function(a,g){return a.concat(g.loads||[]);},[]);
  var gross=lds.reduce(function(s,l){return s+(parseFloat(l.rate)||0);},0);
  var loc=0,noMile=0;
  gs.forEach(function(g){var cg=calcGroup(g);loc+=cg.loc;if(groupMiles(g)<=0&&(g.loads||[]).length)noMile++;});
  var acc=((w&&w.accessorials)||[]).reduce(function(s,a){return s+(parseFloat(a.amount)||0);},0);
  var mi=gs.reduce(function(s,g){return s+groupMiles(g);},0);
  var net=gross-loc+acc;
  return {gross:gross,loc:loc,acc:acc,net:net,mi:Math.round(mi),
    rpm:mi>0?Math.round((net/mi)*100)/100:0,
    loads:lds.length,trailers:gs.length,
    localDel:((w&&w.localDeliveries)||[]).length,
    noDriver:gs.filter(function(g){return !(g.groupDriver&&String(g.groupDriver).trim());}).length,
    noMile:noMile};
}

function copyIt(el,txt){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt);
    else{var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);}
    el.setAttribute("data-copied","1");var o=el.textContent;el.textContent="✓ "+txt;
    setTimeout(function(){el.removeAttribute("data-copied");el.textContent=o;},1100);
  }catch(e){}
}

/* Claim — re-reads the sheet and changes only this trailer, so the save
   uploads what the server already had rather than this phone's copy. */
function claimTrailer(id){
  var inp=document.getElementById("claim-name"),btn=document.getElementById("claim-btn");
  var name=(inp?inp.value:"").trim();
  if(!name){if(inp)inp.focus();return;}
  if(!sessTok()){showLogin("Sign in to claim");return;}
  btn.disabled=true;btn.textContent="Claiming…";
  function done(m){btn.disabled=false;btn.textContent="Claim";if(m)alert(m);}
  sheetsLoad("viewer").then(function(d){
    if(isAuthReq(d)){setSessTok("");done();showLogin("Session expired — sign in again");return;}
    if(!d||Array.isArray(d)||!Array.isArray(d.weeks)){done("Could not read the board. Nothing was claimed.");return;}
    var tgt=null;
    d.weeks.forEach(function(w){(w.groups||[]).forEach(function(g){if(String(g.id)===String(id))tgt=g;});});
    if(!tgt){done("This trailer is no longer on the board.");refreshData();return;}
    var held=String(tgt.groupDriver||"").trim();
    if(held&&held.toLowerCase()!==name.toLowerCase()){done("Already claimed by "+held+".");refreshData();return;}
    tgt.groupDriver=name;tgt.securedBy=name;tgt.securedAt=Date.now();
    return sheetsSave(d).then(function(){
      applyData(d);done();
      setTimeout(function(){refreshData();},2500);
    });
  }).catch(function(){done("No connection — nothing was claimed.");});
}

function kpi(ic,lbl,val,cur,prev,col,rev){
  var d=prev>0?Math.round((cur-prev)/prev*100):(cur>0?100:0);
  var good=rev?d<0:d>0;
  var cls=d===0?"flat":(good?"up":"dn");
  var arrow=d===0?"■":(d>0?"▲":"▼");
  return '<div class="kpi"><div class="kpi-l"><span>'+ic+'</span>'+esc(lbl)+'</div>'+
    '<div class="kpi-v" style="color:'+(col||"var(--ink)")+'">'+val+'</div>'+
    '<div class="kpi-d '+cls+'">'+arrow+' '+Math.abs(d)+'% vs prev</div></div>';
}

/* ── DRIVERS ─────────────────────────────────────────────────────── */
/* Net and miles are split across a trailer's drivers rather than credited
   whole to each, which is what made the Drivers page total above actual
   weekly revenue on the desktop board. */
function driverRows(){
  var m={};
  groups().forEach(function(g){
    var cg=calcGroup(g),mi=groupMiles(g);
    var names={};
    if(g.groupDriver&&String(g.groupDriver).trim())names[String(g.groupDriver).trim()]=1;
    (g.loads||[]).forEach(function(l){if(l.driver&&String(l.driver).trim())names[String(l.driver).trim()]=1;});
    var ks=Object.keys(names);
    if(!ks.length)return;
    var share=1/ks.length;
    ks.forEach(function(n){
      if(!m[n])m[n]={name:n,net:0,mi:0,trailers:0,loads:0,local:!!LOCAL_DRV[n]};
      m[n].net+=(cg.gross-cg.loc)*share;
      m[n].mi+=mi*share;
      m[n].trailers+=1;
      m[n].loads+=(g.loads||[]).length*share;
    });
  });
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return b.net-a.net;});
}
function rDrivers(){
  var rows=driverRows();
  setSub(rows.length+" with loads · "+(wk().label||""));

    rows.forEach(function(d){

        '<div class="grp-ic" style="background:var(--violetbg);color:var(--violet)">'+esc(d.name.charAt(0))+'</div>'+
        '<div class="grp-mid"><div class="grp-t">'+esc(d.name)+(d.local?' <span style="color:var(--ink4);font-weight:600">local</span>':'')+'</div>'+
        '<div class="grp-s">'+d.trailers+' trailer'+(d.trailers===1?"":"s")+' · '+nf(d.mi)+' mi</div></div>'+
        '<div class="grp-rt"><div class="grp-n">'+money(d.net)+'</div>'+
        '<div class="grp-ns">'+(d.mi>0?("$"+(Math.round(d.net/d.mi*100)/100)+"/mi"):"—")+'</div></div>'+
        '<span class="tile-chev">›</span></button></div>';
    });
  }
  document.getElementById("s-drivers").innerHTML=h;
}

function doMile(){

function doLeg(){

/* ── MILEAGE DATA CHECK ──────────────────────────────────────────── */
/* This screen did not exist in either board. It lists every place where the
   two mileage tables disagree, worst first, and says which ones change money
   rather than only an RPM denominator. Nothing here is guessed. */
function rMileCheck(){
  var places={};
  for(var z in ZIPDIST){var e=ZIPDIST[z];places[e.city+", "+e.state]={city:e.city,st:e.state,zip:e.miles,z:z};}
  var rows=[],unres=[];
  Object.keys(places).forEach(function(k){
    var p=places[k],nm=cityMiles(k);
    if(nm==null){unres.push(k);return;}
    if(nm===p.zip)return;
    var lcN=localCharge(nm),lcZ=localCharge(p.zip);
    rows.push({k:k,zip:p.zip,nm:nm,gap:Math.abs(nm-p.zip),lcN:lcN,lcZ:lcZ,money:lcN!==lcZ});
  });
  rows.sort(function(a,b){return (b.money-a.money)||(b.gap-a.gap);});
  var moneyRows=rows.filter(function(r){return r.money;});
  setSub(rows.length+" disagree · "+moneyRows.length+" move money");
  var h='<div class="kpis"><div class="kpi"><div class="kpi-l">Disagreements</div><div class="kpi-v">'+rows.length+'</div>'+
    '<div class="kpi-d flat">of '+Object.keys(places).length+' places</div></div>'+
    '<div class="kpi"><div class="kpi-l">Change a charge</div><div class="kpi-v" style="color:var(--red)">'+moneyRows.length+'</div>'+
    '<div class="kpi-d flat">real money</div></div></div>';
  h+='<div class="note note-w">The board carries <b>two</b> mileage tables — one by city name, one by ZIP. '+
    'ZIP wins when a dispatcher types one. Where they disagree, the same load prices differently depending on what was typed. '+
    '<b>No figure here is a recommendation</b> — the right mileage is the one you actually run.</div>';
  if(moneyRows.length){
    h+='<div class="sec-t">These change the local charge</div>';
    moneyRows.forEach(function(r){
      h+='<div class="card"><div class="card-bd">'+
        '<div class="grp-t" style="margin-bottom:6px">'+esc(r.k)+'</div>'+
        kv("By city name",nf(r.nm)+' mi → '+(r.lcN==null?"<b>no charge</b>":"<b>"+money(r.lcN)+"</b>"))+
        kv("By ZIP",nf(r.zip)+' mi → '+(r.lcZ==null?"<b>no charge</b>":"<b>"+money(r.lcZ)+"</b>"))+
        kv("Gap",nf(r.gap)+" mi")+
        '</div></div>';
    });
  }
  var other=rows.filter(function(r){return !r.money;});
  if(other.length){
    h+='<div class="sec-t">RPM denominator only · '+other.length+'</div>';
    h+='<div class="card"><div class="card-bd">';
    other.slice(0,80).forEach(function(r){
      h+='<div class="kv"><span class="kv-k">'+esc(r.k)+'</span><span class="kv-v mono">'+nf(r.nm)+' / '+nf(r.zip)+'</span></div>';
    });
    if(other.length>80)h+='<div class="grp-s" style="padding-top:8px">+ '+(other.length-80)+' more</div>';
    h+='</div></div>';
  }
  if(unres.length){
    h+='<div class="sec-t">No name-table entry at all · '+unres.length+'</div>';
    h+='<div class="note note-w">Typing the city name for these gets <b>nothing</b>. Typing the ZIP works.</div>';
    h+='<div class="card"><div class="card-bd">';
    unres.slice(0,60).forEach(function(k){
      h+='<div class="kv"><span class="kv-k">'+esc(k)+'</span><span class="kv-v mono">ZIP '+nf(places[k].zip)+' mi</span></div>';
    });
    if(unres.length>60)h+='<div class="grp-s" style="padding-top:8px">+ '+(unres.length-60)+' more</div>';
    h+='</div></div>';
  }
  var miss=Object.keys(DIST_MISS_LOG);
  if(miss.length){
    h+='<div class="sec-t">Missing this session · '+miss.length+'</div>';
    h+='<div class="card"><div class="card-bd">';
    miss.forEach(function(k){var m=DIST_MISS_LOG[k];
      h+='<div class="kv"><span class="kv-k">'+esc(m.city)+'</span><span class="kv-v mono">'+
        (m.estimated!=null?("~"+nf(m.estimated)+" mi est"):"no estimate")+'</span></div>';});
    h+='</div></div>';
  }
  document.getElementById("s-milecheck").innerHTML=h;
}

  ["R30","Gulf Coast (PADD 3)","Gulf"],["R40","Rocky Mountain (PADD 4)","Rockies"],["R50","West Coast (PADD 5)","West"],["SCA","California","Calif."]];

function pickRegion(c){localStorage.setItem("fcbv2_fscRegion",c);rMarket();}
function loadDiesel(){
  dieselState="loading";renderDiesel();
  fetch(baseUrl()+"?action=diesel",{redirect:"follow"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(j){if(!j.ok)throw new Error(j.message||j.error||"no data");diesel=j;dieselState="ok";})
    .catch(function(e){dieselErr=e.message||String(e);dieselState="err";})
    .then(function(){renderDiesel();doFsc();});
}
function selRegion(){
  if(!diesel||!diesel.regions)return null;
  var c=localStorage.getItem("fcbv2_fscRegion")||"R20",by={};
  diesel.regions.forEach(function(r){by[r.code]=r;});
  return by[c]||by.NUS||null;
}
function renderDiesel(){
  var z=document.getElementById("dz");if(!z)return;
  if(dieselState==="loading"){z.innerHTML='<div class="spin"></div>';return;}
  if(dieselState==="err"){z.innerHTML='<div class="note note-e"><b>Diesel prices unavailable.</b> '+esc(dieselErr)+
    '<br>Check EIA_API_KEY in Apps Script → Project Settings → Script Properties, and that a new deployment version was published.</div>'+
    '<button class="btn btn-o" style="width:100%;margin-top:8px" onclick="loadDiesel()">Retry</button>';return;}
  var s=selRegion();
  if(!s){z.innerHTML='<div class="note note-w">The feed connected but returned no regions.</div>';return;}
  var lbl=(MKT_REGIONS.filter(function(r){return r.code===s.code;})[0]||[])[1]||s.code;
  var nm=MKT_REGIONS.filter(function(r){return r[0]===s.code;})[0];

    '<div class="grp-s">'+esc(nm?nm[1]:s.code)+
    (typeof s.change==="number"&&isFinite(s.change)?(' · <span class="'+(s.change>0?"dn":"up")+'">'+(s.change>0?"▲":"▼")+" "+Math.abs(s.change).toFixed(3)+' vs prior week</span>'):"")+'</div>'+

function doFsc(){

}

  h+= rows.length?rows.map(function(d){
    return '<div class="grp"><button class="grp-row" onclick="openDriver(\''+esc(d.name)+'\')">'+
      '<div class="grp-ic" style="background:#dcfce7;color:var(--green)">'+esc(d.name.charAt(0))+'</div>'+
      '<div class="grp-mid"><div class="grp-t">'+esc(d.name)+'</div>'+
      '<div class="grp-s">'+nf(d.mi)+' mi · '+d.trailers+' trailer'+(d.trailers===1?"":"s")+'</div></div>'+
      '<div class="grp-rt"><div class="grp-n">'+money(d.net)+'</div></div>'+
      '<span class="tile-chev">›</span></button></div>';
  }).join(""):empty("💵","No OTR drivers this week");
  h+='<div class="note note-i" style="margin-top:14px"><b>Still outstanding:</b> re-import Board 2026.xlsx on the '+
    'desktop Payroll tab so the <code>8312026-962026</code> and <code>972026-9132026</code> tabs re-key and your 10% populates. '+
    'That needs the desktop board carrying <code>parseCompact</code>.</div>';
  document.getElementById("s-payroll").innerHTML=h;
}

/* ── SEARCH ──────────────────────────────────────────────────────── */
var searchT=null;
function rSearch(){
  setSub("loads, cities, drivers, brokers");
  document.getElementById("s-search").innerHTML=
    '<div class="fld"><input class="inp" id="sq" placeholder="Search every week…" autocomplete="off" oninput="debSearch()"></div>'+
    '<div id="sres"></div>';
  var i=document.getElementById("sq");if(i)i.focus();
}
function debSearch(){clearTimeout(searchT);searchT=setTimeout(doSearch,180);}
function doSearch(){
  var q=((document.getElementById("sq")||{}).value||"").trim().toLowerCase();
  var o=document.getElementById("sres");if(!o)return;
  if(q.length<2){o.innerHTML='<div class="grp-s" style="padding:4px 2px">Type at least two characters.</div>';return;}
  var out=[];
  weeks.forEach(function(w,wi){
    (w.groups||[]).forEach(function(g){
      var gh=((g.groupDriver||"")+" "+(g.groupTruck||"")+" "+(g.groupTrailer||"")).toLowerCase();
      (g.loads||[]).forEach(function(l){
        var hay=((l.sr||"")+" "+(l.broker||"")+" "+(l.loadNum||"")+" "+(l.status||"")+" "+
          (l.pickup||"")+" "+(l.delivery||"")+" "+gh).toLowerCase();
        if(hay.indexOf(q)>=0)out.push({w:w.label||("Week "+(wi+1)),wi:wi,g:g,l:l});
      });
    });
  });
  if(!out.length){o.innerHTML=empty("⌕",'No results for "'+esc(q)+'"');return;}
  var h='<div class="grp-s" style="padding:2px 2px 8px">'+out.length+' result'+(out.length===1?"":"s")+'</div>';
  out.slice(0,120).forEach(function(r){
    var sr=parseSR(r.l.sr||"");
    h+='<div class="grp"><button class="grp-row" onclick="jump('+r.wi+',\''+esc(String(r.g.id))+'\')">'+
      '<div class="grp-ic" style="background:#e0e7ff;color:#3730a3">'+(isCombined(r.g)?"🔄":isOTR(r.g)?"🚛":"📋")+'</div>'+
      '<div class="grp-mid"><div class="grp-t">'+esc(sr.r||sr.s||"—")+'</div>'+
      '<div class="grp-s">'+esc([sr.s,r.g.groupDriver,r.l.delivery,r.w].filter(Boolean).join(" · "))+'</div></div>'+
      (r.l.rate?'<div class="grp-rt"><div class="grp-n">'+money(parseFloat(r.l.rate)||0)+'</div></div>':'')+
      '<span class="tile-chev">›</span></button></div>';
  });
  if(out.length>120)h+='<div class="grp-s" style="padding:8px 2px">Showing the first 120.</div>';
  o.innerHTML=h;
}
function jump(wi,gid){wkIdx=wi;openTrailer(gid);}

/* ── SETTINGS ────────────────────────────────────────────────────── */
function rSettings(){
  setSub(roleFromTok()||"not signed in");
  var c=readCache();
  var h='<div class="card"><div class="card-bd">'+
    kv("Signed in as",esc(roleFromTok()||"—"))+
    kv("Board synced",cachedAt?esc(ago(cachedAt)):"never")+
    kv("Weeks loaded",String(weeks.length))+
    kv("Trucks reporting",String(Object.keys(liveTrucks).length))+
    '</div></div>';
  h+='<div class="sec-t">Data tables</div><div class="card"><div class="card-bd">'+
    kv("City mileages (DIST)","534")+kv("Coordinates (CITYLL)","130")+kv("ZIP mileages (ZIPDIST)","515")+
    kv("Local charge radius",LOCAL_MAX_MI+" mi")+
    '</div></div>';
  h+='<div class="sec-t">Screens</div>';
  [["milecheck","📏","Mileage data check"],["routes","🧭","Routes & mileage"],["xdock","🏢","Crossdocks"],
   ["payroll","💵","Payroll"],["brokers","🔎","Broker check"],["market","⛽","Market & fuel"],["trucks","📍","Tracking"]]
   .forEach(function(x){h+='<div class="grp"><button class="grp-row" onclick="go(\''+x[0]+'\')">'+
     '<div class="grp-ic" style="background:var(--line2);color:var(--ink2)">'+x[1]+'</div>'+
     '<div class="grp-mid"><div class="grp-t">'+x[2]+'</div></div><span class="tile-chev">›</span></button></div>';});
  h+='<div class="sec-t">Connection</div>';
  h+='<div class="card"><div class="card-bd">'+
    '<div class="fld"><label>Apps Script /exec URL</label>'+
    '<input class="inp" id="cx-url" value="'+esc(baseUrl())+'" spellcheck="false" autocapitalize="off"></div>'+
    '<div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="testConn()">Test connection</button>'+
    '<button class="btn btn-o" style="flex:1" onclick="saveUrl()">Save URL</button></div>'+
    '<div id="cx-out">'+(lastErr?('<div class="note note-e" style="margin-top:10px"><b>Last error</b><br>'+esc(lastErr)+'</div>'):'')+'</div>'+
    '<div class="note note-i" style="margin-top:10px">This must be the <b>same /exec URL your desktop board uses</b>. '+
    'Redeploying Apps Script creates a new URL — if you redeployed after this app was built, paste the current one here. '+
    'Open board.html on a computer, View Source, and search for <code>AKfycb</code> to find it.</div>'+
    '</div></div>';
  h+='<div class="sec-t">Session</div>';
  h+='<button class="btn btn-o" style="width:100%;margin-bottom:9px" onclick="refreshData(true)">Refresh now</button>';
  h+='<button class="btn" style="width:100%;background:var(--red)" onclick="signOut()">Sign out</button>';
  h+='<div class="note note-i" style="margin-top:14px">Signing out clears this phone\'s cached copy of the board, so a shared phone does not keep showing loads.</div>';
  document.getElementById("s-settings").innerHTML=h;
}

function empty(ic,t){return '<div class="empty"><div class="empty-i">'+ic+'</div><div class="empty-t">'+esc(t)+'</div></div>';}

/* Connection test — reports what actually came back, rather than a single
   catch-all "could not reach". A CORS or DNS failure surfaces in JS only as
   "Failed to fetch" with no detail, so that case is named explicitly. */
function saveUrl(){
  var v=(document.getElementById("cx-url").value||"").trim();
  if(!v){localStorage.removeItem("fcbv2_sheetsUrl");}
  else localStorage.setItem("fcbv2_sheetsUrl",v);
  document.getElementById("cx-out").innerHTML='<div class="note note-i" style="margin-top:10px">Saved. Testing…</div>';
  testConn();
}
function testConn(){
  var o=document.getElementById("cx-out");
  var u=(document.getElementById("cx-url").value||"").trim()||baseUrl();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/.test(u)){
    o.innerHTML='<div class="note note-w" style="margin-top:10px"><b>That does not look like an /exec URL.</b> '+
      'It should start https://script.google.com/macros/s/… and end in /exec — not /dev.</div>';
    return;
  }
  o.innerHTML='<div class="spin"></div>';
  var t0=Date.now();
  fetch(withTok(u+"?action=session"),{redirect:"follow"})
    .then(function(r){return r.text().then(function(txt){return {ok:r.ok,status:r.status,txt:txt};});})
    .then(function(r){
      var ms=Date.now()-t0,j=null;
      try{j=JSON.parse(r.txt);}catch(e){}
      var h='<div class="note '+(r.ok?"note-i":"note-e")+'" style="margin-top:10px">'+
        '<b>HTTP '+r.status+'</b> in '+ms+' ms</div>';
      if(j){
        h+='<div style="margin-top:4px">';
        h+=kv("Server reachable","yes");
        if("enforced" in j)h+=kv("Auth enforced",String(j.enforced));
        if("session" in j)h+=kv("Session",j.session?"valid":"none / expired");
        if(j.error)h+=kv("Error",esc(String(j.error)));
        h+='</div>';
        if(j.session===null&&j.enforced)h+='<div class="note note-w" style="margin-top:8px">The endpoint is fine — this phone just has no valid session. Sign out and sign in again.</div>';
      } else {
        h+='<div class="note note-w" style="margin-top:8px"><b>Reached it, but the reply was not JSON.</b> '+
          'That usually means the URL points at a deployment that no longer exists, or Apps Script returned its sign-in page. First 200 characters:<br><code>'+
          esc(r.txt.slice(0,200))+'</code></div>';
      }
      o.innerHTML=h;
    })
    .catch(function(e){
      o.innerHTML='<div class="note note-e" style="margin-top:10px"><b>The request never completed.</b><br>'+
        esc((e&&e.message)||String(e))+
        '<br><br>In a browser that means one of: no internet, the deployment URL is wrong or deleted, or Apps Script is not set to '+
        '<b>“Who has access: Anyone”</b>. A deployment set to “Only myself” fails exactly like this from a phone.</div>';
    });
}

/* ── AUTH ────────────────────────────────────────────────────────── */
function showLogin(msg){
  document.getElementById("login").classList.add("on");
  document.getElementById("login-cancel").style.display=sessTok()?"block":"none";
  document.getElementById("login-e").textContent=msg||"";
  setTimeout(function(){var p=document.getElementById("pin");if(p)p.focus();},120);
}
function hideLogin(){
  document.getElementById("login").classList.remove("on");
  document.getElementById("pin").value="";
  document.getElementById("login-e").textContent="";
}
function clrErr(){document.getElementById("login-e").textContent="";}
var loginBusy=false;
function attemptLogin(){
  var pin=(document.getElementById("pin").value||"").trim();
  if(!pin||loginBusy)return;
  loginBusy=true;
  var e=document.getElementById("login-e"),b=document.getElementById("login-btn");
  e.textContent="Checking…";b.disabled=true;
  fetch(baseUrl()+"?action=login&pin="+encodeURIComponent(pin),{redirect:"follow"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(j){
      if(j&&j.ok&&j.token){
        var role=String(j.token).split(".")[0];
        if(role!=="admin"&&role!=="dispatcher"){
          e.textContent="That PIN is not an admin or dispatcher PIN.";
          document.getElementById("pin").value="";return;
        }
        setSessTok(j.token);hideLogin();refreshData(true);return;
      }
      e.textContent="Incorrect PIN — try again";
      document.getElementById("pin").value="";
    })
    .catch(function(){e.textContent="Could not reach the board — check your connection and try again";})
    .then(function(){loginBusy=false;b.disabled=false;});
}
function signOut(){
  setSessTok("");clearCache();
  weeks=[];liveTrucks={};cachedAt=0;
  stack=[{s:"hub"}];paint();
  setDot("err");setSub("Signed out");
  showLogin();
}

/* ── DATA ────────────────────────────────────────────────────────── */
function setDot(s){document.getElementById("dot").className="dot"+(s==="loading"?" load":s==="err"?" err":"");}
/* The top bar is fixed, and the banner sits inside it, so the banner's
   height has to be added to the scroll area's top padding or it covers the
   first heading on every screen. Measured rather than hard-coded — the
   banner wraps to two lines on a narrow phone. */
function syncTopPad(){
  var top=document.querySelector(".top"),w=document.querySelector(".wrap");
  if(top&&w)w.style.paddingTop=top.offsetHeight+"px";
}
function banner(kind,txt){
  var b=document.getElementById("banner");
  if(!kind){b.className="banner";}
  else{b.className="banner on "+kind;document.getElementById("banner-t").textContent=txt;}
  syncTopPad();
}
window.addEventListener("resize",syncTopPad);
window.addEventListener("orientationchange",function(){setTimeout(syncTopPad,150);});
function applyData(d){
  var raw=Array.isArray(d)?d:(d.weeks||[]);
  weeks=raw.map(function(w){
    var o={};for(var k in w)o[k]=w[k];
    o.groups=(w.groups||[]).map(function(g){
      var q={};for(var k2 in g)q[k2]=g[k2];
      q.loads=(g.loads||[]).map(function(l){var c={};for(var k3 in l)c[k3]=l[k3];delete c.photos;delete c.tripPrice;return c;});
      return q;
    });
    return o;
  });
  cachedAt=Date.now();
  writeCache(weeks);
  wkIdx=Math.min(wkIdx,Math.max(0,weeks.length-1));
}
function refreshData(manual){
  if(!sessTok()){setDot("err");setSub("Sign in to load the board");showLogin();return;}
  setDot("loading");if(manual)setSub("Syncing…");
  fetch(withTok(baseUrl()+"?action=samsaraLocations"),{redirect:"follow"})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j&&j.ok&&Array.isArray(j.trucks)){
        var m={};
        j.trucks.forEach(function(t){if(t.number)m[t.number]={address:t.address||"",lat:t.lat,lng:t.lng,asOf:t.asOf||Date.now(),name:t.name};});
        liveTrucks=m;
        if(cur().s==="trucks"||cur().s==="hub")paint();
      }
    }).catch(function(){});
  sheetsLoad("viewer").then(function(d){
    if(isAuthReq(d)){
      setSessTok("");setDot("err");
      lastErr="Apps Script refused the session token (auth_required).";
      banner("bad","Session expired");
      showLogin("Session expired — sign in again");return;
    }
    if(!d||(!Array.isArray(d)&&!Array.isArray(d.weeks))){
      var peek="";try{peek=JSON.stringify(d).slice(0,180);}catch(e2){peek=String(d).slice(0,180);}
      throw new Error("Reached the server, but it did not return week data. It replied: "+peek);
    }
    // A failure here is a bug in THIS app, not a network problem. Reporting
    // both as "could not reach the board" is what made the first fault
    // impossible to diagnose from the phone.
    try{ applyData(d); }
    catch(e3){ throw new Error("The board loaded but could not be read: "+(e3&&e3.message||e3)); }
    setDot("ok");lastErr="";banner(null);
    try{ paint(); }
    catch(e4){ banner("warn","Board loaded, but a screen failed to draw — "+(e4&&e4.message||e4)); }
  }).catch(function(e){
    setDot("err");
    lastErr=(e&&e.message)||String(e);
    var c=readCache();
    if(!weeks.length&&c){weeks=c.weeks;cachedAt=c.at||0;wkIdx=Math.min(wkIdx,Math.max(0,weeks.length-1));}
    if(!navigator.onLine)banner("bad","Offline — showing the last board this phone loaded");
    else banner("warn","Could not reach the board — tap More → Connection"+(cachedAt?(" · copy from "+ago(cachedAt)):""));
    try{ paint(); }catch(e5){}
  });
}
window.addEventListener("online",function(){refreshData();});
window.addEventListener("offline",function(){banner("bad","Offline — showing the last board this phone loaded");});
document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshData();});
document.getElementById("pin").addEventListener("keydown",function(e){if(e.key==="Enter")attemptLogin();});

/* ── INIT ────────────────────────────────────────────────────────── */
(function init(){
  try{history.pushState(null,"","");}catch(e){}
  var c=readCache();
  if(sessTok()&&c){weeks=c.weeks;cachedAt=c.at||0;}
  else if(!sessTok())clearCache();
  paint();
  syncTopPad();
  if(sessTok())refreshData(true);else showLogin();
  setInterval(function(){if(!document.hidden)refreshData();},60000);
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
