function Header({ data, session, saveStatus, lastSync, search, setSearch, onAddLoad, onLogout, onImportFromFreight, onSwitchWeek, onNewWeek, onArchiveWeek, onDeleteWeek, storageSize, online }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const saveLbl =
    saveStatus === "saving" ? "Saving…" :
    saveStatus === "saved"  ? "Saved " + timeAgo(lastSync) :
    saveStatus === "error"  ? "Save failed" :
    "Synced";

  // Storage warning thresholds — measured against the biggest single week,
  // which is what hits the 50KB Sheets cell cap (post-multi-cell upgrade).
  // Pre-upgrade, the cap applies to total; for that case we factor it in too.
  const watermark = Math.max(storageSize.biggestWeek, storageSize.total);
  const sizeKb = (watermark / 1024).toFixed(1);
  const sizeLevel =
    watermark > 42000 ? "critical" :
    watermark > 32000 ? "warning"  :
    watermark > 20000 ? "info"     : null;
  const sizeColors = {
    critical: { bg: "rgba(248,113,113,.25)", color: "#fecaca" },
    warning:  { bg: "rgba(251,191,36,.22)",  color: "#fcd34d" },
    info:     { bg: "rgba(255,255,255,.08)", color: "rgba(255,255,255,.65)" }
  };
  const sizeTitle = sizeLevel === "critical"
    ? "Approaching the 50KB Sheets cell limit. Archive old weeks to free space, or upgrade the Apps Script for per-week storage."
    : sizeLevel === "warning"
    ? "Data is getting large. Largest week: " + (storageSize.biggestWeek/1024).toFixed(1) + " KB" + (storageSize.biggestWeekLabel ? " (" + storageSize.biggestWeekLabel + ")" : "") + "."
    : "Storage usage. Largest week: " + (storageSize.biggestWeek/1024).toFixed(1) + " KB · total: " + (storageSize.total/1024).toFixed(1) + " KB.";

  const weeks = (data && data.weeks) || [];
  const activeWeeks   = weeks.filter(w => !w.archived);
  const archivedWeeks = weeks.filter(w =>  w.archived);

  return (
    <div className="clb-header">
      <div className="clb-title">
        Contracted Lanes
        <small>Consolidation Board</small>
      </div>

      <select className="clb-search" value={data.currentWeekId}
              onChange={e => onSwitchWeek(e.target.value)}
              style={{ width: 220, fontWeight: 600 }}
              title="Switch week">
        {activeWeeks.map(w => (
          <option key={w.id} value={w.id} style={{ color: "#000" }}>
            {w.label} ({w.loads.length})
          </option>
        ))}
        {archivedWeeks.length > 0 && <option disabled style={{ color: "#666" }}>──── archived ────</option>}
        {archivedWeeks.map(w => (
          <option key={w.id} value={w.id} style={{ color: "#000" }}>
            📦 {w.label} ({w.loads.length})
          </option>
        ))}
      </select>

      {!online && (
        <span className="clb-save" style={{ background: "rgba(248,113,113,.25)", color: "#fecaca" }}>
          ⚠ Offline
        </span>
      )}
      <span className={"clb-save clb-save--" + saveStatus}>● {saveLbl}</span>
      {sizeLevel && (
        <span className="clb-save" style={sizeColors[sizeLevel]} title={sizeTitle}>
          {sizeKb} KB
        </span>
      )}

      <input className="clb-search" placeholder="Search loads…" value={search} onChange={e => setSearch(e.target.value)} />
      <button className="clb-btn" onClick={onAddLoad}>+ Add Load</button>
      {session && (
        <span className="clb-save"
              style={ session.role === "admin"
                ? { background:"rgba(99,102,241,.28)", color:"#e0e7ff" }
                : { background:"rgba(148,163,184,.28)", color:"#e2e8f0" } }
              title={ session.role === "admin"
                ? "Signed in as Admin — you can release claimed loads"
                : "Signed in as Viewer / Dispatcher" }>
          {session.role === "admin" ? "🔑" : "👤"} {session.name}
        </span>
      )}
      <div style={{ position: "relative" }}>
        <button className="clb-btn clb-btn--ghost" onClick={() => setMenuOpen(o => !o)}>⋯</button>
        {menuOpen && (
          <div style={{
            position:"absolute", right:0, top:"calc(100% + 6px)",
            background:"#fff", color:"#0f172a",
            border:"1px solid #e2e8f0", borderRadius:8,
            boxShadow:"0 8px 24px rgba(15,23,42,.15)",
            padding:"4px 0", minWidth:260, zIndex:10
          }}>
            <button onClick={() => { setMenuOpen(false); onNewWeek(); }}
                    style={{ display:"block", width:"100%", textAlign:"left", padding:"8px 12px", background:"none", border:"none", fontSize:13, fontWeight:600 }}>
              + Start new week
            </button>
            <button onClick={() => { setMenuOpen(false); onArchiveWeek(); }}
                    style={{ display:"block", width:"100%", textAlign:"left", padding:"8px 12px", background:"none", border:"none", fontSize:13 }}>
              📦 Archive current week
            </button>
            {session && session.role === "admin" && (
              <button onClick={() => { setMenuOpen(false); onDeleteWeek(); }}
                      style={{ display:"block", width:"100%", textAlign:"left", padding:"8px 12px", background:"none", border:"none", fontSize:13, color:"#dc2626" }}>
                🗑 Delete current week
              </button>
            )}
            <div style={{ height:1, background:"#f1f5f9", margin:"4px 0" }} />
            <button onClick={() => { setMenuOpen(false); onImportFromFreight(); }}
                    style={{ display:"block", width:"100%", textAlign:"left", padding:"8px 12px", background:"none", border:"none", fontSize:13 }}>
              ⬇ Import drivers/trucks from Freight Board
            </button>
            <div style={{ height:1, background:"#f1f5f9", margin:"4px 0" }} />
            <button onClick={() => { setMenuOpen(false); onLogout(); }}
                    style={{ display:"block", width:"100%", textAlign:"left", padding:"8px 12px", background:"none", border:"none", fontSize:13, color:"#dc2626" }}>
              Log out
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function SummaryBar({ data, today, tomorrow, buckets }) {
  const cur = getCurrentWeek(data);
  const loads = cur ? cur.loads : [];
  const counts = useMemo(() => {
    const c = { total: loads.length, totalRate: 0 };
    buckets.forEach(b => c[b.key] = 0);
    loads.forEach(l => {
      const k = getBucket(l, today, tomorrow);
      c[k] = (c[k] || 0) + 1;
      c.totalRate += parseFloat(l.rate) || 0;
    });
    return c;
  }, [loads, today, tomorrow, buckets]);

  return (
    <div className="clb-summary">
      <div className="clb-chip clb-chip--accent" style={{ "--accent":"#1e293b" }}>
        <span className="clb-chip__val">{counts.total}</span>
        <span className="clb-chip__lbl">Total loads</span>
      </div>
      <div className="clb-chip clb-chip--accent" style={{ "--accent":"#059669" }}>
        <span className="clb-chip__val">{formatRate(counts.totalRate)}</span>
        <span className="clb-chip__lbl">Total revenue</span>
      </div>
      {buckets.filter(b => counts[b.key] > 0).map(b => (
        <div key={b.key} className="clb-chip clb-chip--accent" style={{ "--accent": b.color }}>
          <span className="clb-chip__val">{counts[b.key]}</span>
          <span className="clb-chip__lbl">{b.label}</span>
        </div>
      ))}
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================

function App() {
  const [data,        setData]        = useState(null);
  const [session,     setSession]     = useState(null);   // { role:"viewer"|"admin", name }
  const [saveStatus,  setSaveStatus]  = useState("idle");
  const [lastSync,    setLastSync]    = useState(0);
  const [expandedIds, setExpandedIds] = useState(() => new Set());
  const [search,      setSearch]      = useState("");
  const [loadError,   setLoadError]   = useState("");

  const allDrivers = useMemo(() => {
    const set = new Set(DRIVERS);
    (data && data.customDrivers || []).forEach(d => set.add(d));
    return Array.from(set).sort();
  }, [data && data.customDrivers]);

  const allTrucks = useMemo(() => {
    const set = new Set(TRUCK_NUMBERS);
    (data && data.customTrucks || []).forEach(t => set.add(t));
    return Array.from(set).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  }, [data && data.customTrucks]);

  // ---- Duplicate-load# detection ----
  // Builds a Map keyed by lowercase-trimmed loadNum across ALL weeks.
  // A new entry conflicts if it matches a different load's id.
  const loadNumIndex = useMemo(() => {
    const m = new Map();
    if (!data) return m;
    for (const w of (data.weeks || [])) {
      for (const l of (w.loads || [])) {
        const ln = String(l.loadNum || "").trim().toLowerCase();
        if (!ln) continue;
        // Keep the first occurrence; later duplicates are themselves the conflicts.
        if (!m.has(ln)) m.set(ln, { id: l.id, weekLabel: w.label, broker: l.broker || "" });
      }
    }
    return m;
  }, [data]);

  const checkDuplicate = useCallback((loadId, loadNum) => {
    const ln = String(loadNum || "").trim().toLowerCase();
    if (!ln) return null;
    const hit = loadNumIndex.get(ln);
    return (hit && hit.id !== loadId) ? hit : null;
  }, [loadNumIndex]);

  // ---- Initial load ----
  useEffect(() => {
    let dead = false;
    apiLoad()
      .then(d => {
        if (dead) return;
        setData(normalizeData(d));
        // Restore a previous Viewer/Admin session for this device
        try {
          const raw = localStorage.getItem(STORAGE.session);
          if (raw) {
            const s = JSON.parse(raw);
            if (s && (s.role === "viewer" || s.role === "admin") && s.name) {
              setSession(s);
            }
          }
        } catch (e) {}
      })
      .catch(e => {
        if (!dead) setLoadError("Could not reach backend: " + e.message);
      });
    return () => { dead = true; };
  }, []);

  // ---- Polling: refresh from server every N seconds ----
  // Merges server data with local instead of replacing it wholesale, so a
  // poll never reverts a local edit that hasn't finished saving yet.
  useEffect(() => {
    if (!data || !session) return;
    const timer = setInterval(async () => {
      const active = document.activeElement;
      if (active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return;
      if (saveStatus === "saving") return;
      try {
        const fresh  = await apiLoad();
        const merged = mergeClientData(fresh, dataRef.current);
        if (JSON.stringify(merged) !== JSON.stringify(dataRef.current)) {
          setData(merged);
        }
      } catch (e) { /* swallow — periodic poll */ }
    }, POLL_INTERVAL_MS);
    return () => clearInterval(timer);
  }, [session, saveStatus]);

  // ---- Debounced save ----
  const saveTimerRef = useRef(null);
  const dataRef      = useRef(data);
  dataRef.current = data;

  const persist = useCallback(() => {
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(async () => {
      const snapshot = { ...dataRef.current, updatedAt: Date.now() };
      setSaveStatus("saving");
      try {
        const resp = await apiSave(snapshot);
        // Server returns the merged result. Merge it with our current local
        // state (which may have changed during the round-trip) so nothing
        // is lost in either direction.
        if (resp && resp.data) {
          setData(mergeClientData(resp.data, dataRef.current));
        }
        setSaveStatus("saved");
        setLastSync(Date.now());
      } catch (e) {
        setSaveStatus("error");
        console.error("Save failed:", e);
      }
    }, SAVE_DEBOUNCE_MS);
  }, []);

  const mutate = useCallback((next) => {
    setData({ ...next, updatedAt: Date.now() });
    persist();
  }, [persist]);

  // ---- Load mutations (operate on the current week's loads array) ----
  const onLoadChange = useCallback((updatedLoad) => {
    mutate(updateCurrentWeekLoads(dataRef.current, loads =>
      loads.map(l => l.id === updatedLoad.id ? { ...updatedLoad, updatedAt: Date.now() } : l)
    ));
  }, [mutate]);

  const onLoadDelete = useCallback((id) => {
    const cur = dataRef.current;
    const withoutLoad = updateCurrentWeekLoads(cur, loads => loads.filter(l => l.id !== id));
    // Record a tombstone — without it, another user's concurrent save (which
    // still has this load) would resurrect it on the next merge.
    const tombstones = (cur.tombstones || []).filter(t => t.id !== id)
      .concat([{ id, at: Date.now() }]);
    mutate({ ...withoutLoad, tombstones });
  }, [mutate]);

  const onAddLoad = useCallback(() => {
    const now = Date.now();
    const newLoad = {
      id: uid(),
      broker: "",
      loadNum: "",
      lane: "",
      status: "Need to Drop",
      rate: "",
      otrDriver: "",
      otrTruck: "",
      trailer: "",
      truck: "",
      notes: "",
      waitingUpdate: false,
      claimedBy: "",
      claimedAt: 0,
      pickups:    [{ location:"", datetime:"", commodity:"", weight:"", pallets:"", notes:"" }],
      deliveries: [{ location:"", datetime:"", notes:"" }],
      rateConUrl: "",
      rateConName: "",
      photos: [],
      createdAt: now,
      updatedAt: now
    };
    mutate(updateCurrentWeekLoads(dataRef.current, loads => [newLoad, ...loads]));
    setExpandedIds(prev => {
      const next = new Set(prev);
      next.add(newLoad.id);
      return next;
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, [mutate]);

  // ---- Week mutations ----
  const switchWeek = useCallback((weekId) => {
    if (!weekId) return;
    const cur = dataRef.current;
    if (!cur.weeks.find(w => w.id === weekId)) return;
    mutate({ ...cur, currentWeekId: weekId });
    setExpandedIds(new Set());   // collapse cards when switching weeks
  }, [mutate]);

  const createNewWeek = useCallback(() => {
    const defaultLabel = "Week of " + new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
    const label = window.prompt("Label for the new week:", defaultLabel);
    if (!label || !label.trim()) return;

    const cur = dataRef.current;
    const curWeek = getCurrentWeek(cur);
    const carry = curWeek && curWeek.loads.some(l => l.status !== "Delivered")
      ? window.confirm("Carry forward any non-Delivered loads from the current week into the new week?")
      : false;

    let updatedWeeks = cur.weeks.slice();
    let newWeekLoads = [];
    if (carry && curWeek) {
      const incomplete = curWeek.loads.filter(l => l.status !== "Delivered");
      const completed  = curWeek.loads.filter(l => l.status === "Delivered");
      // Strip ids so duplicates don't collide between weeks
      newWeekLoads = incomplete.map(l => ({ ...l, id: uid(), createdAt: Date.now(), updatedAt: Date.now() }));
      updatedWeeks = updatedWeeks.map(w => w.id !== curWeek.id ? w : { ...w, loads: completed });
    }

    const newWeek = {
      id: uid("wk"),
      label: label.trim(),
      startDate: "",
      createdAt: Date.now(),
      archived: false,
      loads: newWeekLoads
    };
    mutate({
      ...cur,
      weeks: [...updatedWeeks, newWeek],
      currentWeekId: newWeek.id
    });
    setExpandedIds(new Set());
  }, [mutate]);

  const archiveCurrentWeek = useCallback(() => {
    const cur = dataRef.current;
    const curWeek = getCurrentWeek(cur);
    if (!curWeek) return;
    if (cur.weeks.length < 2) {
      window.alert("Can't archive the only week. Create a new week first.");
      return;
    }
    if (!window.confirm("Archive week \"" + curWeek.label + "\"?\n\nIt stays accessible from the dropdown (with a 📦 icon) but won't be the default view.")) return;
    const updatedWeeks = cur.weeks.map(w => w.id !== curWeek.id ? w : { ...w, archived: true });
    const nextActive = updatedWeeks.find(w => !w.archived) || updatedWeeks[0];
    mutate({ ...cur, weeks: updatedWeeks, currentWeekId: nextActive.id });
  }, [mutate]);

  const deleteCurrentWeek = useCallback(() => {
    const cur = dataRef.current;
    const curWeek = getCurrentWeek(cur);
    if (!curWeek) return;
    if (cur.weeks.length < 2) {
      window.alert("Can't delete the only week. Create another week first, then delete this one.");
      return;
    }
    const n = (curWeek.loads || []).length;
    if (!window.confirm(
      "Permanently DELETE week \"" + curWeek.label + "\"?\n\n" +
      "This removes the week and all " + n + " load" + (n === 1 ? "" : "s") +
      " in it. This cannot be undone.\n\nUse Archive instead if you just want it out of the way."
    )) return;
    const updatedWeeks = cur.weeks.filter(w => w.id !== curWeek.id);
    const nextActive   = updatedWeeks.find(w => !w.archived) || updatedWeeks[0];
    // Tombstone the week id so the merge doesn't resurrect it from another
    // user's stale copy (same mechanism used for deleted loads).
    const tombstones = (cur.tombstones || []).filter(t => t.id !== curWeek.id)
      .concat([{ id: curWeek.id, at: Date.now() }]);
    mutate({ ...cur, weeks: updatedWeeks, currentWeekId: nextActive.id, tombstones });
  }, [mutate]);

  // ---- Auth handlers ----
  const handleLogin = (sess) => {
    try { localStorage.setItem(STORAGE.session, JSON.stringify(sess)); } catch (e) {}
    setSession(sess);
  };

  const logout = () => {
    try { localStorage.removeItem(STORAGE.session); } catch (e) {}
    setSession(null);
  };

  // ---- One-click import of drivers/trucks/assignments from the freight board ----
  const importFromFreight = useCallback(async () => {
    if (!window.confirm(
      "Import drivers, trucks, and the driver→truck assignment map from your Freight Board?\n\n" +
      "This MERGES with what's already here:\n" +
      "  • New drivers/trucks are added\n" +
      "  • Existing truck→driver assignments will be OVERWRITTEN by the freight board's version\n\n" +
      "Your loads on this board are NOT affected."
    )) return;

    setSaveStatus("saving");
    try {
      const res = await fetch(FREIGHT_BOARD_URL, { redirect: "follow" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const fb = await res.json();
      // The freight board sometimes wraps things differently — handle both shapes
      const src = (fb && fb.data) ? fb.data : fb;
      const fbAssignments = (src && src.truckAssignments && typeof src.truckAssignments === "object") ? src.truckAssignments : null;
      const fbCustomDrivers = Array.isArray(src && src.customDrivers) ? src.customDrivers : null;
      const fbCustomTrucks  = Array.isArray(src && src.customTrucks)  ? src.customTrucks  : null;

      if (!fbAssignments && !fbCustomDrivers && !fbCustomTrucks) {
        throw new Error("Freight Board response had no recognizable drivers/trucks/assignments");
      }

      const cur = dataRef.current;
      const mergedDrivers = Array.from(new Set([...(cur.customDrivers || []), ...(fbCustomDrivers || [])]));
      const mergedTrucks  = Array.from(new Set([...(cur.customTrucks  || []), ...(fbCustomTrucks  || [])]));
      const mergedAssign  = { ...(cur.truckAssignments || {}), ...(fbAssignments || {}) };

      const next = {
        ...cur,
        customDrivers:    mergedDrivers,
        customTrucks:     mergedTrucks,
        truckAssignments: mergedAssign,
        updatedAt:        Date.now()
      };
      setData(next);
      await apiSave(next);
      setSaveStatus("saved");
      setLastSync(Date.now());

      const driverCount = fbCustomDrivers ? fbCustomDrivers.length : 0;
      const truckCount  = fbCustomTrucks  ? fbCustomTrucks.length  : 0;
      const assignCount = fbAssignments   ? Object.keys(fbAssignments).length : 0;
      window.alert("✓ Imported from Freight Board:\n" +
        "  • " + driverCount + " custom drivers\n" +
        "  • " + truckCount + " custom trucks\n" +
        "  • " + assignCount + " truck→driver assignments");
    } catch (err) {
      setSaveStatus("error");
      window.alert("Import failed: " + err.message);
    }
  }, []);

  // ---- Bucketing ----
  const today    = useMemo(() => todayMidnight(), []);
  const tomorrow = useMemo(() => { const t = new Date(today); t.setDate(t.getDate() + 1); return t; }, [today]);
  const buckets  = useMemo(() => buildBuckets(today), [today]);

  const bucketed = useMemo(() => {
    if (!data) return null;
    const cur = getCurrentWeek(data);
    const loads = cur ? cur.loads : [];
    const byKey = {};
    buckets.forEach(b => byKey[b.key] = []);
    loads.filter(l => loadMatchesSearch(l, search)).forEach(l => {
      const k = getBucket(l, today, tomorrow);
      (byKey[k] || (byKey[k] = [])).push(l);
    });
    // Sort within each bucket by earliest pickup date asc, then created asc.
    // Matches the bucketing anchor so cards inside "Today" are ordered by
    // their pickup time, not by some hidden delivery date.
    Object.keys(byKey).forEach(k => {
      byKey[k].sort((a, b) => {
        const da = (a.pickups || []).reduce((m, p) => {
          const dt = parseDateTime(p.datetime);
          return dt && (!m || dt < m) ? dt : m;
        }, null);
        const db = (b.pickups || []).reduce((m, p) => {
          const dt = parseDateTime(p.datetime);
          return dt && (!m || dt < m) ? dt : m;
        }, null);
        if (da && db) return da - db;
        if (da) return -1;
        if (db) return 1;
        return (a.createdAt || 0) - (b.createdAt || 0);
      });
    });
    return byKey;
  }, [data, search, today, tomorrow, buckets]);

  // ---- Online/offline detection ----
  const [online, setOnline] = useState(typeof navigator !== "undefined" ? navigator.onLine !== false : true);
  useEffect(() => {
    const up = () => setOnline(true);
    const down = () => setOnline(false);
    window.addEventListener("online",  up);
    window.addEventListener("offline", down);
    return () => {
      window.removeEventListener("online",  up);
      window.removeEventListener("offline", down);
    };
  }, []);

  // ---- Storage size monitor ----
  // Tracks both total payload AND the largest single week. With the current
  // (single-blob) Apps Script the 50KB cell limit applies to total. With the
  // multi-cell Apps Script (one row per week) the limit applies per week —
  // which is `biggestWeek` here. Showing both keeps the warning useful in
  // either deployment.
  const storageSize = useMemo(() => {
    const empty = { total: 0, biggestWeek: 0, biggestWeekLabel: "" };
    if (!data) return empty;
    try {
      const total = JSON.stringify(data).length;
      let biggestWeek = 0, biggestWeekLabel = "";
      (data.weeks || []).forEach(w => {
        const s = JSON.stringify(w).length;
        if (s > biggestWeek) { biggestWeek = s; biggestWeekLabel = w.label || ""; }
      });
      return { total, biggestWeek, biggestWeekLabel };
    } catch (e) { return empty; }
  }, [data]);

  // ---- Render ----
  if (loadError) {
    return (
      <div className="clb-auth">
        <div className="clb-auth__card">
          <h2 className="clb-auth__title">Connection error</h2>
          <p className="clb-auth__sub">{loadError}</p>
          <button className="clb-auth__btn" onClick={() => window.location.reload()}>Retry</button>
        </div>
      </div>
    );
  }
  if (!data) return <LoadingScreen msg="Loading board…" />;
  if (!session) return <RoleLogin onLogin={handleLogin} />;

  return (
    <div className="clb-app">
      <Header
        data={data}
        session={session}
        saveStatus={saveStatus}
        lastSync={lastSync}
        search={search}
        setSearch={setSearch}
        onAddLoad={onAddLoad}
        onLogout={logout}
        onImportFromFreight={importFromFreight}
        onSwitchWeek={switchWeek}
        onNewWeek={createNewWeek}
        onArchiveWeek={archiveCurrentWeek}
        onDeleteWeek={deleteCurrentWeek}
        storageSize={storageSize}
        online={online}
      />
      <SummaryBar data={data} today={today} tomorrow={tomorrow} buckets={buckets} />

      {(() => {
        const cur = getCurrentWeek(data);
        return cur && cur.loads.length === 0 && (
          <div className="clb-empty">
            No loads in <strong>{cur.label}</strong> yet. Click <strong>+ Add Load</strong> to create the first one.
          </div>
        );
      })()}

      {buckets.map(b => (
        <BucketSection
          key={b.key}
          bucket={b}
          loads={bucketed[b.key] || []}
          expandedIds={expandedIds}
          setExpanded={setExpandedIds}
          allDrivers={allDrivers}
          allTrucks={allTrucks}
          truckAssignments={data.truckAssignments || {}}
          checkDuplicate={checkDuplicate}
          role={session.role}
          userName={session.name}
          onChange={onLoadChange}
          onDelete={onLoadDelete}
        />
      ))}
    </div>
  );
}

// ============================================================
// ERROR BOUNDARY — last-resort defense against white screens
// ============================================================
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("Board error:", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div className="clb-auth">
          <div className="clb-auth__card">
            <h2 className="clb-auth__title">Something went wrong</h2>
            <p className="clb-auth__sub">
              The board hit an unexpected error. Your data on the Sheet is unaffected — reloading usually fixes it.
            </p>
            <pre style={{
              fontSize: 11, color: "#64748b",
              background: "#f8fafc", padding: 8, borderRadius: 6,
              overflow: "auto", maxHeight: 100, marginBottom: 12, whiteSpace: "pre-wrap"
            }}>
              {String((this.state.error && this.state.error.message) || this.state.error || "")}
            </pre>
            <button className="clb-auth__btn" onClick={() => window.location.reload()}>Reload</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
</body>
