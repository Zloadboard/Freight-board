<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e293b">
<title>Contracted Lanes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fafaf9;
    color: #0f172a;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  input:focus, textarea:focus, select:focus { outline: 2px solid #1e293b; outline-offset: -1px; }

  /* ---- App scaffold ---- */
  .clb-app { max-width: 1400px; margin: 0 auto; padding: 16px; }

  /* ---- Header ---- */
  .clb-header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 18px; margin-bottom: 14px;
    background: #0f172a; color: #fff;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(15,23,42,.18);
  }
  .clb-title {
    font-family: "Manrope", -apple-system, sans-serif;
    font-size: 19px; font-weight: 800; letter-spacing: -.02em;
    margin-right: auto;
  }
  .clb-title small {
    display: block; font-size: 10px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase;
    opacity: .55; margin-top: 2px;
  }
  .clb-search {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
    color: #fff; border-radius: 8px; padding: 7px 12px; width: 220px;
    font-size: 13px;
  }
  .clb-search::placeholder { color: rgba(255,255,255,.4); }
  .clb-btn {
    background: #fff; color: #0f172a; border: 1px solid #fff;
    border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700;
    transition: transform .08s;
  }
  .clb-btn:hover { transform: translateY(-1px); }
  .clb-btn:active { transform: translateY(0); }
  .clb-btn--ghost {
    background: transparent; color: #fff;
    border: 1px solid rgba(255,255,255,.2);
  }
  .clb-save {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.08); color: rgba(255,255,255,.75);
  }
  .clb-save--saving { background: rgba(251,191,36,.18); color: #fbbf24; }
  .clb-save--saved  { background: rgba(74,222,128,.15); color: #86efac; }
  .clb-save--error  { background: rgba(248,113,113,.18); color: #fca5a5; }

  /* ---- Summary chips ---- */
  .clb-summary {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px; margin-bottom: 14px;
  }
  .clb-chip {
    background: #fff; border: 1px solid #e7e5e4; border-radius: 12px;
    padding: 10px 14px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .clb-chip__val {
    font-family: "Manrope", sans-serif;
    font-size: 22px; font-weight: 800; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .clb-chip__lbl {
    font-size: 10px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: #64748b;
  }
  .clb-chip--accent { border-left: 4px solid var(--accent, #1e293b); }

  /* ---- Buckets ---- */
  .clb-bucket { margin-bottom: 18px; }
  .clb-bucket__head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--bucket-bg, #f1f5f9);
    border-left: 5px solid var(--bucket-color, #64748b);
    border-radius: 8px 8px 0 0;
  }
  .clb-bucket__name {
    font-family: "Manrope", sans-serif;
    font-size: 14px; font-weight: 800; letter-spacing: -.01em;
    color: var(--bucket-color, #64748b);
    text-transform: uppercase;
  }
  .clb-bucket__count {
    background: var(--bucket-color, #64748b); color: #fff;
    border-radius: 999px; padding: 2px 10px;
    font-size: 11px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .clb-bucket__total {
    margin-left: auto;
    font-size: 12px; font-weight: 700; color: #475569;
    font-variant-numeric: tabular-nums;
  }
  .clb-bucket__body {
    display: grid; gap: 10px;
    padding: 12px; background: #fff;
    border: 1px solid #e7e5e4; border-top: none;
    border-radius: 0 0 12px 12px;
  }

  /* ---- Card ---- */
  .clb-card {
    background: #fff; border: 1px solid #e7e5e4; border-radius: 10px;
    overflow: hidden;
    border-left: 4px solid var(--bucket-color, #64748b);
    transition: box-shadow .15s, border-color .15s;
  }
  .clb-card:hover { box-shadow: 0 4px 14px rgba(15,23,42,.08); }
  .clb-card--delivered { opacity: .62; }
  .clb-card--waiting {
    background: #fffbeb;
    box-shadow: inset 4px 0 0 #f59e0b;
  }
  .clb-card--waiting .clb-card__head {
    background: #fef3c7;
  }

  .clb-card__head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    cursor: pointer; user-select: none;
    flex-wrap: wrap;
  }
  .clb-card__head:hover { background: #fafaf9; }
  .clb-card__caret { font-size: 10px; color: #94a3b8; width: 10px; flex-shrink: 0; }
  .clb-card__broker {
    font-family: "Manrope", sans-serif;
    font-size: 13px; font-weight: 700; color: #0f172a;
  }
  .clb-card__loadnum {
    font-size: 11px; font-weight: 700;
    background: #e0e7ff; color: #3730a3;
    padding: 2px 8px; border-radius: 4px;
    font-variant-numeric: tabular-nums;
  }
  .clb-card__lane {
    flex: 1; min-width: 200px;
    font-size: 13px; font-weight: 600; color: #334155;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .clb-card__driver {
    font-size: 11px; font-weight: 600; color: #16a34a;
    background: #dcfce7; padding: 2px 8px; border-radius: 4px;
    white-space: nowrap;
  }
  .clb-card__trailer {
    font-size: 11px; font-weight: 700; color: #5b21b6;
    background: #ede9fe; padding: 2px 8px; border-radius: 4px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .clb-card__delivery-dt {
    font-size: 11px; font-weight: 600; color: #7c2d12;
    background: #fed7aa; padding: 2px 8px; border-radius: 4px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .clb-card__waiting {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 600;
    color: #94a3b8; background: transparent;
    border: 1px solid #e2e8f0;
    padding: 2px 7px; border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s, background .15s, border-color .15s;
    font-family: inherit;
  }
  .clb-card__waiting:hover {
    color: #475569; background: #f1f5f9; border-color: #cbd5e1;
  }
  .clb-card__waiting--on {
    color: #92400e; background: #fef3c7;
    border-color: #f59e0b;
    font-size: 11px;
  }
  .clb-card__waiting--on:hover {
    background: #fde68a;
  }
  /* ---- Claim ---- */
  .clb-card__claim {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 4px;
    white-space: nowrap; font-family: inherit;
    border: 1px solid transparent;
  }
  .clb-card__claim--free {
    color: #1d4ed8; background: #eff6ff; border-color: #bfdbfe;
    cursor: pointer; transition: background .15s;
  }
  .clb-card__claim--free:hover { background: #dbeafe; }
  .clb-card__claim--taken {
    color: #166534; background: #dcfce7; border-color: #86efac;
    font-size: 11px; cursor: default;
  }
  .clb-card__claim-x {
    border: none; background: rgba(22,101,52,.15);
    color: #166534; cursor: pointer;
    border-radius: 3px; font-size: 10px; font-weight: 700;
    width: 16px; height: 16px; line-height: 1; padding: 0;
    font-family: inherit;
  }
  .clb-card__claim-x:hover { background: rgba(22,101,52,.32); }
  .clb-card--claimed { border-left: 3px solid #22c55e; }
  .clb-card__rate {
    font-family: "Manrope", sans-serif;
    font-size: 14px; font-weight: 800; color: #059669;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .clb-card__status {
    font-size: 10px; font-weight: 800; text-transform: uppercase;
    padding: 3px 10px; border-radius: 4px;
    letter-spacing: .04em;
    white-space: nowrap;
  }
  .clb-card__body {
    border-top: 1px solid #f1f5f9;
    padding: 12px 14px 14px;
    background: #fafaf9;
  }

  /* ---- Fields ---- */
  .clb-row { display: grid; gap: 8px; margin-bottom: 10px; }
  .clb-row--2 { grid-template-columns: 1fr 1fr; }
  .clb-row--3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 560px) {
    .clb-row--2, .clb-row--3 { grid-template-columns: 1fr; }
  }
  .clb-field { display: flex; flex-direction: column; gap: 3px; }
  .clb-field__lbl {
    font-size: 9px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: #94a3b8;
  }
  .clb-field input, .clb-field textarea, .clb-field select {
    background: #fff; border: 1px solid #e2e8f0;
    border-radius: 6px; padding: 6px 9px;
    font-size: 12px; width: 100%;
    transition: border-color .12s;
  }
  .clb-field input:hover, .clb-field textarea:hover, .clb-field select:hover {
    border-color: #cbd5e1;
  }
  .clb-field textarea { resize: vertical; min-height: 38px; }

  /* ---- Stops ---- */
  .clb-stops { margin-bottom: 12px; }
  .clb-stops__head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .clb-stops__title {
    font-family: "Manrope", sans-serif;
    font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .08em; color: #0f172a;
  }
  .clb-stops__count {
    background: #f1f5f9; color: #475569;
    border-radius: 4px; padding: 1px 7px;
    font-size: 10px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .clb-stops__add {
    margin-left: auto;
    background: #f1f5f9; border: 1px dashed #cbd5e1; color: #475569;
    border-radius: 6px; padding: 3px 10px;
    font-size: 11px; font-weight: 600;
  }
  .clb-stops__add:hover { background: #e2e8f0; }
  .clb-stop {
    background: #fff; border: 1px solid #e7e5e4;
    border-radius: 8px; padding: 10px;
    margin-bottom: 6px;
    position: relative;
  }
  .clb-stop__num {
    position: absolute; top: 8px; left: -10px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--stop-color, #1e293b); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 2px 6px rgba(15,23,42,.2);
  }
  .clb-stop__del {
    position: absolute; top: 6px; right: 6px;
    background: transparent; border: none; color: #cbd5e1;
    font-size: 14px; padding: 2px 6px;
  }
  .clb-stop__del:hover { color: #dc2626; }
  .clb-stops--pickup .clb-stop { padding-left: 18px; }
  .clb-stops--delivery .clb-stop { padding-left: 18px; }

  /* ---- Actions row ---- */
  .clb-actions {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding-top: 10px; margin-top: 10px;
    border-top: 1px solid #e7e5e4;
  }
  .clb-actions__btn {
    background: #fff; border: 1px solid #e2e8f0; color: #334155;
    border-radius: 6px; padding: 5px 12px;
    font-size: 12px; font-weight: 600;
  }
  .clb-actions__btn:hover { background: #f8fafc; border-color: #cbd5e1; }
  .clb-actions__btn--danger:hover {
    background: #fef2f2; border-color: #fca5a5; color: #b91c1c;
  }
  .clb-actions__spacer { flex: 1; }

  /* ---- Rate con drop zone ---- */
  .clb-ratecon {
    border: 2px dashed #cbd5e1; border-radius: 8px;
    padding: 14px; text-align: center;
    background: #fafaf9; color: #64748b;
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .12s;
    margin-bottom: 10px;
  }
  .clb-ratecon:hover, .clb-ratecon--drag {
    border-color: #1e293b; background: #f1f5f9; color: #0f172a;
  }
  .clb-ratecon--uploaded {
    border-style: solid; border-color: #c7d2fe; background: #eef2ff;
    color: #3730a3; text-align: left;
    display: flex; align-items: center; gap: 10px;
  }
  .clb-ratecon--uploaded a { color: inherit; font-weight: 700; }
  .clb-ratecon--uploaded button {
    margin-left: auto;
    background: transparent; border: none; color: #6366f1;
    font-size: 16px; padding: 2px 6px;
  }
  .clb-ratecon--uploaded button:hover { color: #dc2626; }
  .clb-ratecon--uploading { color: #1e40af; border-color: #93c5fd; background: #eff6ff; cursor: wait; }

  /* ---- Photos ---- */
  .clb-photos { margin-bottom: 10px; }
  .clb-photos__title {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .clb-photos__title strong {
    font-family: "Manrope", sans-serif;
    font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .08em; color: #0f172a;
  }
  .clb-photos__add {
    background: #f1f5f9; border: 1px dashed #cbd5e1; color: #475569;
    border-radius: 6px; padding: 3px 10px;
    font-size: 11px; font-weight: 600;
  }
  .clb-photos__add:hover { background: #e2e8f0; }
  .clb-photos__grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 6px;
  }
  .clb-photo {
    position: relative; aspect-ratio: 1;
    border-radius: 6px; overflow: hidden;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
  }
  .clb-photo img { width: 100%; height: 100%; object-fit: cover; }
  .clb-photo__del {
    position: absolute; top: 2px; right: 2px;
    background: rgba(15,23,42,.7); color: #fff; border: none;
    width: 18px; height: 18px; border-radius: 50%;
    font-size: 10px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .clb-photo__del:hover { background: #dc2626; }
  .clb-photo--uploading { display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 10px; }

  /* ---- Empty state ---- */
  .clb-empty {
    padding: 40px 20px; text-align: center;
    background: #fff; border: 1px dashed #e2e8f0; border-radius: 12px;
    color: #94a3b8;
  }

  /* ---- Auth screens ---- */
  .clb-auth {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: #fafaf9;
  }
  .clb-auth__card {
    background: #fff; border-radius: 16px; padding: 32px;
    width: 100%; max-width: 360px;
    box-shadow: 0 12px 32px rgba(15,23,42,.08);
  }
  .clb-auth__title {
    font-family: "Manrope", sans-serif;
    font-size: 22px; font-weight: 800; letter-spacing: -.02em;
    margin: 0 0 6px;
  }
  .clb-auth__sub {
    font-size: 13px; color: #64748b; margin: 0 0 22px;
  }
  .clb-auth__input {
    width: 100%; padding: 12px 14px;
    border: 1px solid #e2e8f0; border-radius: 8px;
    font-size: 16px; letter-spacing: .15em; text-align: center;
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }
  .clb-auth__btn {
    width: 100%; padding: 12px;
    background: #1e293b; color: #fff;
    border: none; border-radius: 8px;
    font-size: 14px; font-weight: 700;
    transition: background .12s;
    margin-top: 8px;
  }
  .clb-auth__btn:hover { background: #0f172a; }
  .clb-auth__btn--ghost {
    background: #fff; color: #1e293b;
    border: 1px solid #cbd5e1;
  }
  .clb-auth__btn--ghost:hover { background: #f1f5f9; }
  .clb-auth__err {
    color: #dc2626; font-size: 12px; font-weight: 600;
    margin-top: 8px; text-align: center;
  }

  /* ---- Loading ---- */
  .clb-loading {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #64748b; font-size: 14px;
  }

  /* ---- Modal ---- */
  .clb-modal-bg {
    position: fixed; inset: 0;
    background: rgba(15,23,42,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .clb-modal {
    background: #fff; border-radius: 12px;
    max-width: 400px; width: 100%;
    padding: 24px;
  }
  .clb-modal h3 {
    font-family: "Manrope", sans-serif;
    margin: 0 0 6px; font-size: 18px; font-weight: 800;
  }
  .clb-modal p { margin: 0 0 16px; color: #64748b; font-size: 13px; }
  .clb-modal__row {
    display: flex; gap: 8px; justify-content: flex-end;
  }

  /* small screen adjustments */
  @media (max-width: 720px) {
    .clb-app { padding: 10px; }
    .clb-header { padding: 12px; gap: 10px; }
    .clb-search { width: 140px; }
    .clb-card__head { gap: 6px; }
    .clb-card__lane { min-width: 140px; font-size: 12px; }
    .clb-summary { gap: 6px; }
    .clb-chip { padding: 8px 10px; }
    .clb-chip__val { font-size: 18px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
/* ============================================================
   CONTRACTED LANES BOARD
   ============================================================

   Data shape (single JSON blob stored in B1 of ContractedLoads
   tab; structure managed here, not enforced by the script):

   data = {
     weeks: [
       {
         id:        "wk_<rand>",
         label:     "Week of May 12",
         startDate: "",                     // optional, free text
         createdAt: 1234567890,
         archived:  false,                  // archived weeks stay accessible via dropdown
         loads: [
           {
             id:        "load_<rand>",      // internal
             broker:    "RJW Logistics",    // free-text — pulled from rate con when possible
             loadNum:   "12345",
             lane:      "IL → GA",          // optional free text
             status:    "Need to Drop" | "Dispatched" | "Dropped at shipper" | "Yard" | "Enroute to Delivery" | "Delivered",
             rate:      2500,               // number
             waitingUpdate: false,          // when true, load lives in ⏳ Waiting Updated bucket regardless of date
             otrDriver: "Jeff Mecha",       // long-haul driver — shown on collapsed card
             otrTruck:  "519",              // long-haul truck # — auto-fills from truckAssignments
             trailer:   "53117",            // local trailer # — shown on collapsed card
             truck:     "519",              // local truck # — shown only when expanded
             notes:     "",
             waitingUpdate: false,          // when true → ⏳ highlight
             claimedBy: "",                 // dispatcher name who claimed it ("" = unclaimed)
             claimedAt: 0,                  // when it was claimed
             pickups:    [{ location, datetime, commodity, weight, pallets, notes }],
             deliveries: [{ location, datetime, notes }],
             rateConUrl:  "https://drive.google.com/...",
             rateConName: "RC_12345.pdf",
             photos: [{ id, url, thumbnailUrl, name, size, uploadedAt }],
             createdAt: 1234567890,
             updatedAt: 1234567890          // per-load — drives server/client merge
           }
         ]
       }
     ],
     currentWeekId:    "wk_<rand>",         // which week is currently being viewed/edited
     adminPin:         "1234",              // legacy field — no longer used (admin passcode is the ADMIN_PASSCODE constant)
     customDrivers:    ["..."],             // merged with DRIVERS for autocomplete
     customTrucks:     ["..."],             // merged with TRUCK_NUMBERS for autocomplete
     truckAssignments: { "519": "Jeff Mecha", ... },  // truck → driver; powers OTR Truck auto-fill
     tombstones:       [{ id, at }],        // deleted load ids — so a merge never resurrects them
     updatedAt:        1234567890           // top-level for change detection / poll comparison
   }

   STORAGE SHAPE NOTE: the entire `data` object is JSON-stringified into a
   single cell (B1 of the ContractedLoads tab). Sheets cells cap at ~50,000
   characters. The header surfaces a size badge once usage crosses ~20KB.
   At ~40KB it goes red — archive old weeks to free space.

   localStorage keys (all prefixed fcbc_):
     fcbc_auth_pin   — admin pin cached for skipping login on this device
   ============================================================ */

const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ============================================================

// Buckets are now built dynamically from today's date — see buildBuckets() below.
// Keys are stable: overdue, today, tomorrow, day2..day7, future, delivered.
// Labels for day2..day7 are weekday-name abbreviations with date ("Thu 5/14").
function buildBuckets(today) {
  const dayAbbrev = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const out = [
    { key: "overdue",  label: "Overdue",  color: "#dc2626", bg: "#fef2f2" },
    { key: "today",    label: "Today",    color: "#ca8a04", bg: "#fefce8" },
    { key: "tomorrow", label: "Tomorrow", color: "#ea580c", bg: "#fff7ed" }
  ];
  // Gradient of 6 colors for the next 6 days (after tomorrow), upcoming-not-urgent feel
  const dayPalette = [
    { color: "#0891b2", bg: "#ecfeff" }, // cyan
    { color: "#2563eb", bg: "#eff6ff" }, // blue
    { color: "#4f46e5", bg: "#eef2ff" }, // indigo
    { color: "#7c3aed", bg: "#f5f3ff" }, // violet
    { color: "#9333ea", bg: "#faf5ff" }, // purple
    { color: "#c026d3", bg: "#fdf4ff" }  // fuchsia
  ];
  for (let i = 2; i <= 7; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() + i);
    out.push({
      key:   "day" + i,
      label: dayAbbrev[d.getDay()] + " " + (d.getMonth() + 1) + "/" + d.getDate(),
      color: dayPalette[i - 2].color,
      bg:    dayPalette[i - 2].bg
    });
  }
  out.push({ key: "future",    label: "Future",    color: "#475569", bg: "#f8fafc" });
  out.push({ key: "delivered", label: "Delivered", color: "#16a34a", bg: "#f0fdf4" });
  return out;
}

const uid = (prefix="load") =>
  prefix + "_" + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);

function parseDateTime(s) {
  if (!s) return null;
  const m = String(s).match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if (!m) return null;
  const month = parseInt(m[1], 10) - 1;
  const day   = parseInt(m[2], 10);
  let year    = m[3] ? parseInt(m[3], 10) : new Date().getFullYear();
  if (year < 100) year += 2000;
  const d = new Date(year, month, day);
  d.setHours(0, 0, 0, 0);
  return d;
}

function todayMidnight() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function getBucket(load, today, tomorrow) {
  if (load.status === "Delivered") return "delivered";

  // Earliest pickup date is the urgency anchor (when the truck needs to be there).
  // Falls back to earliest delivery if no pickups have a date.
  let ref = null;
  (load.pickups || []).forEach(p => {
    const dt = parseDateTime(p && p.datetime);
    if (dt && (!ref || dt < ref)) ref = dt;
  });
  if (!ref) {
    (load.deliveries || []).forEach(d => {
      const dt = parseDateTime(d && d.datetime);
      if (dt && (!ref || dt < ref)) ref = dt;
    });
  }
  if (!ref) return "future";

  const DAY_MS = 86400000;
  const diff   = Math.round((ref.getTime() - today.getTime()) / DAY_MS);
  if (diff <  0) return "overdue";
  if (diff === 0) return "today";
  if (diff === 1) return "tomorrow";
  if (diff >= 2 && diff <= 7) return "day" + diff;
  return "future";
}

function summarizeLane(load) {
  const pickups    = (load.pickups    || []).map(p => p && p.location).filter(Boolean);
  const deliveries = (load.deliveries || []).map(d => d && d.location).filter(Boolean);
  const p = pickups.length    ? pickups.join(" · ")    : "—";
  const d = deliveries.length ? deliveries.join(" · ") : "—";
  return p + "  →  " + d;
}

function loadMatchesSearch(load, q) {
  if (!q) return true;
  q = q.trim().toLowerCase();
  if (!q) return true;
  const hay = [
    load.broker, load.loadNum, load.otrDriver, load.driver,
    load.trailer, load.truck, load.lane, load.notes,
    ...(load.pickups   || []).map(p => p && [p.location, p.commodity, p.notes].filter(Boolean).join(" ")),
    ...(load.deliveries|| []).map(d => d && [d.location, d.notes].filter(Boolean).join(" "))
  ].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q);
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload  = () => resolve(String(r.result).split(",")[1] || "");
    r.onerror = () => reject(new Error("File read failed"));
    r.readAsDataURL(file);
  });
}

function formatRate(n) {
  const v = parseFloat(n);
  if (!v || isNaN(v)) return "—";
  return "$" + v.toLocaleString();
}

function timeAgo(t) {
  if (!t) return "";
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 5)    return "just now";
  if (s < 60)   return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  return Math.round(s / 3600) + "h ago";
}

// Find a truck number assigned to a given driver in truckAssignments.
// Returns "" if no match or invalid inputs.
function findTruckForDriver(truckAssignments, driverName) {
  if (!driverName || !truckAssignments || typeof truckAssignments !== "object") return "";
  for (const [truck, drv] of Object.entries(truckAssignments)) {
    if (drv === driverName) return truck;
  }
  return "";
}

// True if a load has no user-visible content yet — used to decide whether
// to delete the card when a duplicate-detection abort happens on a freshly
// created load. We deliberately ignore createdAt/updatedAt/id.
function isEmptyLoad(l) {
  if (!l) return false;
  if (l.broker || l.loadNum || l.rate || l.notes) return false;
  if (l.otrDriver || l.otrTruck || l.trailer || l.truck) return false;
  if (l.rateConUrl) return false;
  if ((l.pickups    || []).some(p => p && (p.location || p.datetime || p.weight || p.pallets || p.commodity))) return false;
  if ((l.deliveries || []).some(d => d && (d.location || d.datetime))) return false;
  if ((l.photos     || []).length > 0) return false;
  return true;
}

// ============================================================
// DATA NORMALIZATION
// Single source of truth for the on-disk → in-memory shape transform.
// Handles all legacy migrations so the rest of the app never has to
// deal with "is data.loads still here?" questions.
// ============================================================

function migrateLoad(l) {
  if (!l) return l;
  let out = l;
  // Legacy `driver` field → `otrDriver`
  if (out.driver && !out.otrDriver) {
    const { driver, ...rest } = out;
    out = { ...rest, otrDriver: driver };
  }
  // Legacy status values → new ones
  if (out.status === "Need to Pickup" || out.status === "Need to pickup") {
    out = { ...out, status: "Need to Drop" };
  }
  if (out.status === "Loaded")         out = { ...out, status: "Dropped at shipper" };
  return out;
}

function normalizeData(raw) {
  const d = (raw && typeof raw === "object") ? raw : {};
  const out = {
    weeks:            Array.isArray(d.weeks) ? d.weeks.slice() : [],
    currentWeekId:    d.currentWeekId || "",
    adminPin:         d.adminPin || "",
    customDrivers:    Array.isArray(d.customDrivers) ? d.customDrivers : [],
    customTrucks:     Array.isArray(d.customTrucks)  ? d.customTrucks  : [],
    truckAssignments: (d.truckAssignments && typeof d.truckAssignments === "object") ? d.truckAssignments : {},
    tombstones:       Array.isArray(d.tombstones) ? d.tombstones.filter(t => t && t.id) : [],
    updatedAt:        d.updatedAt || 0
  };

  // Legacy: top-level `loads` → first week
  if (out.weeks.length === 0 && Array.isArray(d.loads) && d.loads.length > 0) {
    out.weeks.push({
      id: uid("wk"),
      label: "Current",
      startDate: "",
      createdAt: Date.now(),
      archived: false,
      loads: d.loads.map(migrateLoad)
    });
  }

  // Always have at least one week
  if (out.weeks.length === 0) {
    out.weeks.push({
      id: uid("wk"),
      label: "Week 1",
      startDate: "",
      createdAt: Date.now(),
      archived: false,
      loads: []
    });
  }

  // Ensure every week has the expected shape + migrate legacy fields
  out.weeks = out.weeks.map(w => ({
    id:         w.id || uid("wk"),
    label:      w.label || "Untitled week",
    startDate:  w.startDate || "",
    createdAt:  w.createdAt || 0,
    archived:   !!w.archived,
    loads:      Array.isArray(w.loads) ? w.loads.map(migrateLoad) : []
  }));

  // Make sure currentWeekId points at a real week — fall back to first non-archived, else first
  if (!out.weeks.find(w => w.id === out.currentWeekId)) {
    out.currentWeekId = (out.weeks.find(w => !w.archived) || out.weeks[0]).id;
  }

  return out;
}

// Merge two normalized data objects load-by-load. Loads present on both
// sides resolve to whichever has the newer `updatedAt`; loads on one side
// are kept; tombstoned loads are dropped. Used on poll and after every save
// so one user's changes never silently overwrite another's.
function mergeClientData(serverRaw, localRaw) {
  const server = normalizeData(serverRaw);
  const local  = normalizeData(localRaw);

  // Tombstones — union by id, keep the latest 'at'
  const tombAt = {};
  [].concat(server.tombstones, local.tombstones).forEach(t => {
    if (t && t.id) {
      const at = t.at || 0;
      if (!tombAt[t.id] || at > tombAt[t.id]) tombAt[t.id] = at;
    }
  });
  const tombstones = Object.keys(tombAt).map(id => ({ id, at: tombAt[id] }));
  const tombSet = {};
  tombstones.forEach(t => { tombSet[t.id] = true; });

  // Config — take whichever side was updated more recently
  const serverNewer = (server.updatedAt || 0) >= (local.updatedAt || 0);
  const cfg = serverNewer ? server : local;

  const out = {
    adminPin:         cfg.adminPin || "",
    customDrivers:    cfg.customDrivers || [],
    customTrucks:     cfg.customTrucks || [],
    truckAssignments: cfg.truckAssignments || {},
    // currentWeekId is effectively a per-device view choice — keep local's
    // so a poll never yanks the user to a week someone else selected.
    currentWeekId:    local.currentWeekId || server.currentWeekId || "",
    tombstones,
    updatedAt:        Math.max(server.updatedAt || 0, local.updatedAt || 0),
    weeks: []
  };

  // Weeks — union by id
  const sW = {}, lW = {}, weekIds = new Set();
  server.weeks.forEach(w => { sW[w.id] = w; weekIds.add(w.id); });
  local.weeks.forEach(w => { lW[w.id] = w; weekIds.add(w.id); });

  weekIds.forEach(wid => {
    if (tombSet[wid]) return;   // week was deleted — drop it
    const sw = sW[wid], lw = lW[wid];
    if (sw && lw) {
      const sL = {}, lL = {}, loadIds = new Set();
      (sw.loads || []).forEach(l => { if (l && l.id) { sL[l.id] = l; loadIds.add(l.id); } });
      (lw.loads || []).forEach(l => { if (l && l.id) { lL[l.id] = l; loadIds.add(l.id); } });
      const loads = [];
      loadIds.forEach(id => {
        if (tombSet[id]) return;
        const sl = sL[id], ll = lL[id];
        if (sl && ll) loads.push((ll.updatedAt || 0) >= (sl.updatedAt || 0) ? ll : sl);
        else          loads.push(ll || sl);
      });
      const meta = serverNewer ? sw : lw;
      out.weeks.push({
        id: wid, label: meta.label, startDate: meta.startDate || "",
        createdAt: meta.createdAt || 0, archived: !!meta.archived, loads
      });
    } else {
      const w = sw || lw;
      out.weeks.push({
        id: w.id, label: w.label, startDate: w.startDate || "",
        createdAt: w.createdAt || 0, archived: !!w.archived,
        loads: (w.loads || []).filter(l => l && l.id && !tombSet[l.id])
      });
    }
  });

  // If the viewed week was deleted (by anyone), fall back to a valid one
  if (out.weeks.length && !out.weeks.find(w => w.id === out.currentWeekId)) {
    out.currentWeekId = (out.weeks.find(w => !w.archived) || out.weeks[0]).id;
  }

  return out;
}

function getCurrentWeek(data) {
  if (!data || !Array.isArray(data.weeks) || !data.weeks.length) return null;
  return data.weeks.find(w => w.id === data.currentWeekId) || data.weeks[0];
}

// Apply a transformer function to the current week's loads array.
// Used by every mutation that touches loads.
function updateCurrentWeekLoads(data, transformer) {
  const curId = data.currentWeekId;
  return {
    ...data,
    weeks: data.weeks.map(w => w.id !== curId ? w : { ...w, loads: transformer(w.loads) })
  };
}

// ============================================================
// PDF TEXT EXTRACTION + RATE CON PARSER (Phase 2 v1)
// ============================================================
// Uses PDF.js to pull text out of the dropped rate con, then runs
// conservative regex heuristics to fill: broker, load #, first pickup
// (location + datetime), first delivery (location + datetime).
//
// Designed to be NON-DESTRUCTIVE — only fills fields that are currently
// empty on the load. User can always edit afterward. If the PDF is
// scanned (image-only) or encrypted, extraction silently fails and the
// upload behavior continues normally.
// ============================================================

// One-time PDF.js worker setup
if (typeof window !== "undefined" && window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
  window.pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

// Extract text from a PDF File object. Returns a single string with
// newlines preserved by y-position so labels and values stay on the
// same line (which the parser depends on).
async function extractPdfText(file) {
  if (!window.pdfjsLib) throw new Error("PDF library not available");
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    let lines = [];
    let curY = null;
    let curLine = [];
    for (const it of content.items) {
      const y = it.transform ? it.transform[5] : 0;
      if (curY === null || Math.abs(y - curY) > 2) {
        if (curLine.length) lines.push(curLine.join(" "));
        curLine = [it.str];
        curY = y;
      } else {
        curLine.push(it.str);
      }
    }
    if (curLine.length) lines.push(curLine.join(" "));
    out.push(lines.join("\n"));
  }
  return out.join("\n");
}

const RC_CITY_STATE = /\b([A-Z][A-Za-z.\-]+(?:\s+[A-Z][A-Za-z.\-]+){0,3}),\s*([A-Z]{2})\b(?!\w)/;
const RC_DATE       = /\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/;
const RC_PICKUP_HDR   = /\b(pick\s*up|pickup|shipper|origin)\b/i;
const RC_DELIVERY_HDR = /\b(delivery|deliver|consignee|receiver|destination|drop)\b/i;

// Time patterns, tried in priority order. Returns "8AM", "8:30AM", "08:00", or "0800"-style.
function extractTime(text) {
  // 12-hour with AM/PM: "8AM", "8:30 PM", "08:00AM"
  const m1 = text.match(/\b(\d{1,2})(?::(\d{2}))?\s*(AM|PM|am|pm)\b/);
  if (m1) {
    const h = m1[1], mm = m1[2] || "", ap = m1[3].toUpperCase();
    return h + (mm ? ":" + mm : "") + ap;
  }
  // 24-hour with colon: "13:30", "08:00"
  const m2 = text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
  if (m2) return m2[1] + ":" + m2[2];
  // 4-digit military time: "0800", "1430" — scoped to space/dash boundaries to avoid load #s
  const m3 = text.match(/(?:^|\s|[-,;:])([01]\d|2[0-3])([0-5]\d)(?=\s|$|[-,;])/);
  if (m3) return m3[1] + ":" + m3[2];
  return null;
}

function extractStopFromSection(section) {
  const out = {};
  const csM = section.match(RC_CITY_STATE);
  if (csM) out.location = csM[1] + ", " + csM[2];

  const dM = section.match(RC_DATE);
  const tStr = extractTime(section);
  if (dM || tStr) {
    let dt = "";
    if (dM)   dt += dM[1] + "/" + dM[2];
    if (tStr) dt += (dt ? " " : "") + tStr;
    out.datetime = dt.trim();
  }
  return (out.location || out.datetime) ? out : null;
}

// ============================================================
// RJW LOGISTICS — broker-specific parser
// Targets the structured LOAD SUMMARY and LOAD DETAILS sections
// instead of regex-guessing across the whole document. Multi-stop
// aware: outputs `allPickups` and `allDeliveries` arrays.
// ============================================================

// "LOCKPORT" → "Lockport". "NEW YORK" → "New York".
function rjwCapitalizeCity(s) {
  return String(s).trim().split(/\s+/).map(w =>
    w.length > 0 ? (w[0].toUpperCase() + w.slice(1).toLowerCase()) : w
  ).join(" ");
}

// "05/15/2026" → "5/15". Drops year and leading zeros to match how users type dates.
function rjwFormatDate(s) {
  const m = String(s).match(/(\d{1,2})\/(\d{1,2})/);
  if (!m) return String(s);
  return parseInt(m[1], 10) + "/" + parseInt(m[2], 10);
}

// "1600" → "4PM",  "0002" → "12:02AM",  "0830" → "8:30AM"
function rjwFormatTime(s) {
  const str = String(s).replace(/\D/g, "");
  if (str.length < 3) return String(s);
  const hh = parseInt(str.slice(0, str.length - 2), 10);
  const mm = parseInt(str.slice(-2), 10);
  if (isNaN(hh) || isNaN(mm)) return String(s);
  const ap = hh >= 12 ? "PM" : "AM";
  const h12 = hh === 0 ? 12 : (hh > 12 ? hh - 12 : hh);
  if (mm === 0) return h12 + ap;
  return h12 + ":" + String(mm).padStart(2, "0") + ap;
}

// Parse a single PU/SP/SO block from the LOAD DETAILS section.
// Extracts city/state and the date window (start + end). The datetime
// string is kept in the PDF's exact format: "MM/DD/YYYY HHMM - HHMM"
// (compact when same day) or "MM/DD/YYYY HHMM - MM/DD/YYYY HHMM".
function parseRJWStopBlock(content) {
  // City State ZIP: match a line like "LOCKPORT IL 60441"
  const cityM = content.match(/\b([A-Z][A-Z .\-&]*?[A-Z])\s+([A-Z]{2})\s+(\d{5})\b/);
  if (!cityM) return null;

  // Pull every "<MM/DD/YYYY> <HHMM>" pair in this block — windows have two.
  const dtRe = /(\d{1,2}\/\d{1,2}\/\d{2,4})\s+(\d{3,4})\b/g;
  const dts = [];
  let dm;
  while ((dm = dtRe.exec(content)) !== null) {
    dts.push({ date: dm[1], time: dm[2].padStart(4, "0") });
  }

  const stop = {
    location: rjwCapitalizeCity(cityM[1]) + ", " + cityM[2]
  };

  if (dts.length === 1) {
    stop.datetime = dts[0].date + " " + dts[0].time;
  } else if (dts.length >= 2) {
    const a = dts[0], b = dts[1];
    if (a.date === b.date && a.time === b.time) {
      // Window collapsed to a point (RJW sometimes lists the same time twice for "Live load")
      stop.datetime = a.date + " " + a.time;
    } else if (a.date === b.date) {
      // Same-day window: "05/15/2026 1600 - 2300"
      stop.datetime = a.date + " " + a.time + " - " + b.time;
    } else {
      // Multi-day window: "05/17/2026 0002 - 05/19/2026 2357"
      stop.datetime = a.date + " " + a.time + " - " + b.date + " " + b.time;
    }
  }
  return stop;
}

function parseRJW(rawText) {
  const result = { broker: "RJW Logistics" };
  if (!rawText) return result;

  // ---- Load number (M396863, etc.) ----
  // RJW formats: "Load # M396863" in header, "RJW Load Number: M396863" in summary
  const ldM = rawText.match(/RJW\s+Load\s+Number:\s*([A-Z]?\d{4,})/i)
           || rawText.match(/Load\s*#\s*([A-Z]?\d{4,})/i);
  if (ldM) result.loadNum = ldM[1];

  // ---- LOAD SUMMARY section ----
  // Contains canonical pickup city/state, delivery city/state, scheduled times,
  // total pay, weight, pieces. Bounded by "LOAD INSTRUCTIONS" or "LOAD DETAILS".
  const sumStart = rawText.indexOf("LOAD SUMMARY");
  const sumEnd   = sumStart >= 0
    ? (function() {
        const a = rawText.indexOf("LOAD INSTRUCTIONS", sumStart);
        const b = rawText.indexOf("LOAD DETAILS",      sumStart);
        const candidates = [a, b].filter(x => x > sumStart);
        return candidates.length ? Math.min.apply(null, candidates) : rawText.length;
      })()
    : -1;
  const summary = (sumStart >= 0) ? rawText.slice(sumStart, sumEnd) : "";

  if (summary) {
    // City State pattern within the summary — bounded so we only match valid pairs
    // e.g. "Pickup City: LOCKPORT IL    Scheduled Pickup: ..."
    const puCity = summary.match(/Pickup\s+City:\s*([A-Z][A-Z .\-&]*?)\s+([A-Z]{2})(?=\s|$)/i);
    const puDt   = summary.match(/Scheduled\s+Pickup:\s*(\d{1,2}\/\d{1,2}\/\d{2,4})\s+(\d{3,4})/i);
    if (puCity || puDt) {
      result.pickup = {};
      if (puCity) result.pickup.location = rjwCapitalizeCity(puCity[1]) + ", " + puCity[2];
      if (puDt)   result.pickup.datetime = rjwFormatDate(puDt[1]) + " " + rjwFormatTime(puDt[2]);
    }

    const dCity = summary.match(/Delivery\s+City:\s*([A-Z][A-Z .\-&]*?)\s+([A-Z]{2})(?=\s|$)/i);
    const dDt   = summary.match(/Scheduled\s+Delivery:\s*(\d{1,2}\/\d{1,2}\/\d{2,4})\s+(\d{3,4})/i);
    if (dCity || dDt) {
      result.delivery = {};
      if (dCity) result.delivery.location = rjwCapitalizeCity(dCity[1]) + ", " + dCity[2];
      if (dDt)   result.delivery.datetime = rjwFormatDate(dDt[1]) + " " + rjwFormatTime(dDt[2]);
    }

    const payM = summary.match(/Total\s+Carrier\s+Pay:\s*\$?\s*([\d,]+(?:\.\d+)?)/i);
    if (payM) {
      const v = parseFloat(payM[1].replace(/,/g, ""));
      if (!isNaN(v)) result.rate = Math.round(v).toString();
    }

    const wgtM = summary.match(/Weight\s*\(lbs\):\s*([\d,]+(?:\.\d+)?)/i);
    if (wgtM) {
      const w = parseFloat(wgtM[1].replace(/,/g, ""));
      if (!isNaN(w) && w >= 100 && w <= 80000) {
        if (!result.pickup) result.pickup = {};
        result.pickup.weight = Math.round(w).toString();
      }
    }

    // Pieces \ Spots: 5065 \ 0  →  pallets = 5065
    const pcsM = summary.match(/Pieces\s*\\?\s*Spots?:\s*(\d{1,5})\b/i);
    if (pcsM) {
      const n = parseInt(pcsM[1], 10);
      if (n >= 1 && n <= 99999) {
        if (!result.pickup) result.pickup = {};
        result.pickup.pallets = String(n);
      }
    }
  }

  // ---- LOAD DETAILS section — multi-stop ----
  const detStart = rawText.indexOf("LOAD DETAILS");
  const detEnd   = detStart >= 0
    ? (function() {
        const a = rawText.indexOf("CARRIER OFFER", detStart);
        const b = rawText.indexOf("OTHER IMPORTANT",   detStart);
        const candidates = [a, b].filter(x => x > detStart);
        return candidates.length ? Math.min.apply(null, candidates) : rawText.length;
      })()
    : -1;
  const details = (detStart >= 0) ? rawText.slice(detStart, detEnd) : "";

  if (details) {
    // Find each "PU Name:", "SP Name:", or "SO Name:" header and slice into blocks.
    const headerRe = /\b(PU|SP|SO)\s+Name:/g;
    const matches = [];
    let hm;
    while ((hm = headerRe.exec(details)) !== null) {
      matches.push({ type: hm[1], index: hm.index });
    }

    const pickups = [];
    const deliveries = [];
    for (let i = 0; i < matches.length; i++) {
      const start = matches[i].index;
      const end   = (i + 1 < matches.length) ? matches[i + 1].index : details.length;
      const block = details.slice(start, end);
      const stop  = parseRJWStopBlock(block);
      if (stop) {
        if (matches[i].type === "SO") deliveries.push(stop);
        else                          pickups.push(stop);   // PU or SP
      }
    }

    if (pickups.length    > 0) result.allPickups    = pickups;
    if (deliveries.length > 0) result.allDeliveries = deliveries;
  }

  return result;
}

function parseRateCon(rawText) {
  const result = {};
  if (!rawText) return result;
  const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const flat  = rawText.replace(/\s+/g, " ");

  // ---- Broker-specific parsers (precise, no letterhead-noise issues) ----
  // RJW Logistics is the primary broker for this board — use the structured
  // parser that reads LOAD SUMMARY / LOAD DETAILS sections directly.
  if (/RJW\s*Logistics/i.test(flat)) {
    return parseRJW(rawText);
  }

  // ---- Generic broker fallback (regex heuristics across whole doc) ----
  // ---- Broker ----
  // RJW Logistics is the primary broker in scope; other matches are bonus.
  if (/RJW\s*Logistics/i.test(flat))        result.broker = "RJW Logistics";
  else if (/Echo\s*Global/i.test(flat))     result.broker = "Echo Global";
  else if (/\bRXO\b/i.test(flat))           result.broker = "RXO";
  else if (/\bCoyote\b/i.test(flat))        result.broker = "Coyote";
  else if (/\bMolo\b/i.test(flat))          result.broker = "Molo";
  else if (/Total\s*Quality\s*Logistics|\bTQL\b/i.test(flat)) result.broker = "TQL";

  // ---- Load / order / reference number ----
  const loadPats = [
    /\b(?:Load|Order|Shipment|Confirmation)\s*(?:Number|#|No\.?|ID)\s*:?\s*([A-Z0-9][A-Z0-9_\-]{2,15})/i,
    /\b(?:Reference|Ref)\s*(?:Number|#|No\.?)?\s*:?\s*([A-Z0-9][A-Z0-9_\-]{2,15})/i,
    /\b(?:Load|Order)\s*#\s*:?\s*([A-Z0-9][A-Z0-9_\-]{2,15})/i
  ];
  for (const pat of loadPats) {
    const m = flat.match(pat);
    if (m && m[1]) {
      const v = m[1];
      // Reject if it's clearly a phone number or a date
      if (!/^\d{10}$/.test(v) && !/^\d{1,2}\/\d{1,2}/.test(v) && v.length >= 4) {
        result.loadNum = v;
        break;
      }
    }
  }

  // ---- Pickup / delivery sections ----
  // Scan lines to find header indices, then carve up the document.
  let pickupIdx = -1;
  let deliveryIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (pickupIdx < 0 && RC_PICKUP_HDR.test(lines[i]) && !RC_DELIVERY_HDR.test(lines[i])) pickupIdx = i;
    if (deliveryIdx < 0 && RC_DELIVERY_HDR.test(lines[i])) deliveryIdx = i;
    if (pickupIdx >= 0 && deliveryIdx >= 0) break;
  }

  // Pickup section runs from its header until the delivery header (or end)
  if (pickupIdx >= 0) {
    const end = deliveryIdx > pickupIdx ? deliveryIdx : lines.length;
    const section = lines.slice(pickupIdx, end).join("\n");
    const stop = extractStopFromSection(section);
    if (stop) result.pickup = stop;
  }
  if (deliveryIdx >= 0) {
    const section = lines.slice(deliveryIdx).join("\n");
    const stop = extractStopFromSection(section);
    if (stop) result.delivery = stop;
  }

  // ---- Rate / total amount ----
  // Take the largest dollar amount on the page as the rate; rate cons
  // sometimes list per-mile, fuel, total — total tends to be largest.
  const moneyMatches = [...flat.matchAll(/\$\s*([\d,]+(?:\.\d{2})?)/g)];
  if (moneyMatches.length) {
    const amounts = moneyMatches
      .map(m => parseFloat(m[1].replace(/,/g, "")))
      .filter(n => n >= 100 && n <= 100000);   // sanity bounds — ignore tiny line items and noise
    if (amounts.length) result.rate = Math.max(...amounts);
  }

  // ---- Weight (lbs), Pallets, Commodity ----
  // Cargo attributes are usually one-per-load; we attach them to the first pickup.
  if (!result.pickup) result.pickup = {};

  // Weight — try labeled first, then bare "<n> lbs"
  let weightVal = null;
  const wLabeled = flat.match(/\b(?:weight|wgt|gross\s*wt|total\s*weight)\s*:?\s*([\d,]+)\s*(?:lbs?|pounds|lb)?\b/i);
  const wBare    = flat.match(/\b([\d,]{4,7})\s*(?:lbs?|pounds)\b/i);
  const wRaw = (wLabeled && wLabeled[1]) || (wBare && wBare[1]);
  if (wRaw) {
    const w = parseInt(wRaw.replace(/,/g, ""), 10);
    if (w >= 100 && w <= 80000) weightVal = String(w);
  }
  if (weightVal) result.pickup.weight = weightVal;

  // Pallets — "10 pallets", "Pallets: 10", "10 skids", etc.
  const pLabeled = flat.match(/\b(?:pallets?|pallet\s*count|plt|skids?|pieces)\s*:?\s*(\d{1,3})\b/i);
  const pReverse = flat.match(/\b(\d{1,3})\s*(?:pallets?|skids?)\b/i);
  const pRaw = (pLabeled && pLabeled[1]) || (pReverse && pReverse[1]);
  if (pRaw) {
    const n = parseInt(pRaw, 10);
    if (n >= 1 && n <= 100) result.pickup.pallets = String(n);
  }

  // Commodity / product / description — short phrase after the label
  const cMatch = flat.match(/\b(?:commodity|product|description|item|freight)\s*:?\s*([A-Za-z][A-Za-z0-9 ,&'\/.\-]{2,60}?)(?:\s{2,}|$|[\|;]|\sweight|\spallets|\spcs|\splt)/i);
  if (cMatch && cMatch[1]) {
    const c = cMatch[1].trim();
    if (c.length >= 3) result.pickup.commodity = c;
  }

  // Discard the pickup placeholder if nothing actually got attached
  if (result.pickup && Object.keys(result.pickup).length === 0) {
    delete result.pickup;
  }

  return result;
}

// Merge parsed fields into a load. Single-stop fields fill only empty
// destination fields (preserves user input). Multi-stop arrays REPLACE
// the entire pickups/deliveries lists — used by the RJW parser, where
// the PDF is the authoritative source.
// Returns { merged, filledFields }.
function applyParsedToLoad(load, parsed) {
  const merged = { ...load };
  const filled = [];

  if (parsed.broker  && !merged.broker)  { merged.broker  = parsed.broker;  filled.push("Broker"); }
  if (parsed.loadNum && !merged.loadNum) { merged.loadNum = parsed.loadNum; filled.push("Load #"); }
  if (parsed.rate    && !parseFloat(merged.rate)) { merged.rate = String(parsed.rate); filled.push("Rate"); }

  // ----- Multi-stop pickups (RJW path) -----
  if (Array.isArray(parsed.allPickups) && parsed.allPickups.length > 0) {
    merged.pickups = parsed.allPickups.map(p => ({
      location:  p.location  || "",
      datetime:  p.datetime  || "",
      commodity: "",
      weight:    "",
      pallets:   "",
      notes:     ""
    }));
    // Attach load-wide cargo attributes (from LOAD SUMMARY) to the first pickup
    if (parsed.pickup && merged.pickups[0]) {
      if (parsed.pickup.weight)    { merged.pickups[0].weight    = parsed.pickup.weight;    filled.push("Weight"); }
      if (parsed.pickup.pallets)   { merged.pickups[0].pallets   = parsed.pickup.pallets;   filled.push("Pallets"); }
      if (parsed.pickup.commodity) { merged.pickups[0].commodity = parsed.pickup.commodity; filled.push("Commodity"); }
    }
    filled.push(merged.pickups.length + " pickup" + (merged.pickups.length > 1 ? "s" : ""));

  // ----- Single-pickup fallback (generic parser) -----
  } else if (parsed.pickup) {
    const pickups = (merged.pickups || []).slice();
    const emptyIdx = pickups.findIndex(p => !p.location && !p.datetime);
    const target = emptyIdx >= 0 ? emptyIdx : pickups.length;
    const base = pickups[target] || { location:"", datetime:"", commodity:"", weight:"", pallets:"", notes:"" };
    const next = { ...base };
    let touched = false;
    if (parsed.pickup.location  && !base.location)  { next.location  = parsed.pickup.location;  filled.push("Pickup location"); touched = true; }
    if (parsed.pickup.datetime  && !base.datetime)  { next.datetime  = parsed.pickup.datetime;  filled.push("Pickup time");     touched = true; }
    if (parsed.pickup.weight    && !base.weight)    { next.weight    = parsed.pickup.weight;    filled.push("Weight");          touched = true; }
    if (parsed.pickup.pallets   && !base.pallets)   { next.pallets   = parsed.pickup.pallets;   filled.push("Pallets");         touched = true; }
    if (parsed.pickup.commodity && !base.commodity) { next.commodity = parsed.pickup.commodity; filled.push("Commodity");       touched = true; }
    if (touched) {
      if (emptyIdx >= 0) pickups[target] = next; else pickups.push(next);
      merged.pickups = pickups;
    }
  }

  // ----- Multi-stop deliveries (RJW path) -----
  if (Array.isArray(parsed.allDeliveries) && parsed.allDeliveries.length > 0) {
    merged.deliveries = parsed.allDeliveries.map(d => ({
      location: d.location || "",
      datetime: d.datetime || "",
      notes:    ""
    }));
    filled.push(merged.deliveries.length + " deliver" + (merged.deliveries.length > 1 ? "ies" : "y"));

  // ----- Single-delivery fallback -----
  } else if (parsed.delivery) {
    const deliveries = (merged.deliveries || []).slice();
    const emptyIdx = deliveries.findIndex(d => !d.location && !d.datetime);
    const target = emptyIdx >= 0 ? emptyIdx : deliveries.length;
    const base = deliveries[target] || { location:"", datetime:"", notes:"" };
    const next = { ...base };
    let touched = false;
    if (parsed.delivery.location && !base.location) { next.location = parsed.delivery.location; filled.push("Delivery location"); touched = true; }
    if (parsed.delivery.datetime && !base.datetime) { next.datetime = parsed.delivery.datetime; filled.push("Delivery time");     touched = true; }
    if (touched) {
      if (emptyIdx >= 0) deliveries[target] = next; else deliveries.push(next);
      merged.deliveries = deliveries;
    }
  }

  return { merged, filledFields: filled };
}

// ============================================================
// API
// ============================================================

async function apiCall(payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "Request failed");
  return j;
}

async function apiLoad() {
  const res = await fetch(APPS_SCRIPT_URL + "?action=load");
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "Load failed");
  return j.data || {};
}

async function apiSave(data) {
  return apiCall({ action: "save", data });
}

async function apiUpload(file, kind) {
  const base64 = await fileToBase64(file);
  const j = await apiCall({
    action:   kind, // "uploadPhoto" or "uploadRateCon"
    data:     base64,
    mimeType: file.type || "application/octet-stream",
    filename: file.name
  });
  return j.file;
}

function LoadingScreen({ msg }) {
  return <div className="clb-loading">{msg || "Loading…"}</div>;
}

function RoleLogin({ onLogin }) {
  const [mode,  setMode]  = useState("choose");   // choose | viewer | admin
  const [name,  setName]  = useState("");
  const [code,  setCode]  = useState("");
  const [error, setError] = useState("");

  const enterViewer = () => {
    if (!name.trim()) { setError("Please enter your name"); return; }
    onLogin({ role: "viewer", name: name.trim() });
  };
  const enterAdmin = () => {
    if (code !== ADMIN_PASSCODE) { setError("Incorrect passcode"); setCode(""); return; }
    onLogin({ role: "admin", name: name.trim() || "Admin" });
  };

  return (
    <div className="clb-auth">
      <div className="clb-auth__card">
        <h2 className="clb-auth__title">Contracted Lanes</h2>

        {mode === "choose" && (
          <React.Fragment>
            <p className="clb-auth__sub">Choose how you want to sign in.</p>
            <button className="clb-auth__btn" onClick={() => { setMode("viewer"); setError(""); }}>
              Continue as Viewer / Dispatcher
            </button>
            <button className="clb-auth__btn clb-auth__btn--ghost" onClick={() => { setMode("admin"); setError(""); }}>
              Continue as Admin
            </button>
          </React.Fragment>
        )}

        {mode === "viewer" && (
          <React.Fragment>
            <p className="clb-auth__sub">Enter your name so loads you claim are tagged to you.</p>
            <input className="clb-auth__input" placeholder="Your name" value={name} autoFocus
                   onChange={e => { setName(e.target.value); setError(""); }}
                   onKeyDown={e => e.key === "Enter" && enterViewer()} />
            <button className="clb-auth__btn" onClick={enterViewer}>Enter board</button>
            <button className="clb-auth__btn clb-auth__btn--ghost" onClick={() => { setMode("choose"); setError(""); }}>
              Back
            </button>
          </React.Fragment>
        )}

        {mode === "admin" && (
          <React.Fragment>
            <p className="clb-auth__sub">Enter the admin passcode.</p>
            <input className="clb-auth__input" placeholder="Your name (optional)" value={name}
                   onChange={e => setName(e.target.value)} />
            <input className="clb-auth__input" type="password" inputMode="numeric"
                   placeholder="Admin passcode" value={code} autoFocus
                   onChange={e => { setCode(e.target.value); setError(""); }}
                   onKeyDown={e => e.key === "Enter" && enterAdmin()} />
            <button className="clb-auth__btn" onClick={enterAdmin}>Enter as Admin</button>
            <button className="clb-auth__btn clb-auth__btn--ghost" onClick={() => { setMode("choose"); setError(""); }}>
              Back
            </button>
          </React.Fragment>
        )}

        {error && <div className="clb-auth__err">{error}</div>}
      </div>
    </div>
  );
}

// ============================================================
// COMPONENTS — STOP EDITOR
// ============================================================

function StopRow({ stop, index, type, color, onChange, onRemove }) {
  const set = (field, value) => onChange({ ...stop, [field]: value });

  // Local pending value for the Date/Time input. Without this, every keystroke
  // updates load.datetime → triggers re-bucket → the card jumps between day
  // groups while you're still typing. We commit on blur or Enter instead, so
  // the card only moves when you've finished typing the date.
  const [pendingDt, setPendingDt] = useState(stop.datetime || "");
  useEffect(() => { setPendingDt(stop.datetime || ""); }, [stop.datetime]);
  const commitDt = () => {
    if (pendingDt !== (stop.datetime || "")) set("datetime", pendingDt);
  };

  return (
    <div className="clb-stop" style={{ "--stop-color": color }}>
      <div className="clb-stop__num">{index + 1}</div>
      <button className="clb-stop__del" onClick={onRemove} title="Remove stop">×</button>
      <div className="clb-row clb-row--2">
        <div className="clb-field">
          <span className="clb-field__lbl">Location</span>
          <input value={stop.location || ""} onChange={e => set("location", e.target.value)} placeholder="City, ST" />
        </div>
        <div className="clb-field">
          <span className="clb-field__lbl">Date / Time</span>
          <input value={pendingDt}
                 onChange={e => setPendingDt(e.target.value)}
                 onBlur={commitDt}
                 onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
                 placeholder="5/12 8AM or 05/15/2026 1200 - 2300" />
        </div>
      </div>
      {type === "pickup" && (
        <div className="clb-row clb-row--3">
          <div className="clb-field">
            <span className="clb-field__lbl">Commodity</span>
            <input value={stop.commodity || ""} onChange={e => set("commodity", e.target.value)} placeholder="Produce, dry, etc." />
          </div>
          <div className="clb-field">
            <span className="clb-field__lbl">Weight</span>
            <input value={stop.weight || ""} onChange={e => set("weight", e.target.value)} placeholder="lbs" />
          </div>
          <div className="clb-field">
            <span className="clb-field__lbl">Pallets</span>
            <input value={stop.pallets || ""} onChange={e => set("pallets", e.target.value)} placeholder="#" />
          </div>
        </div>
      )}
    </div>
  );
}

function StopList({ stops, type, color, onChange }) {
  const updateStop = (i, next) => {
    const arr = stops.slice();
    arr[i] = next;
    onChange(arr);
  };
  const removeStop = i => {
    if (stops.length <= 1) return;
    const arr = stops.slice();
    arr.splice(i, 1);
    onChange(arr);
  };
  const addStop = () => {
    const empty = type === "pickup"
      ? { location:"", datetime:"", commodity:"", weight:"", pallets:"", notes:"" }
      : { location:"", datetime:"", notes:"" };
    onChange([ ...stops, empty ]);
  };
  return (
    <div className={"clb-stops clb-stops--" + type}>
      <div className="clb-stops__head">
        <span className="clb-stops__title">{type === "pickup" ? "Pickups" : "Deliveries"}</span>
        <span className="clb-stops__count">{stops.length}</span>
        <button className="clb-stops__add" onClick={addStop}>+ Add stop</button>
      </div>
      {stops.map((s, i) => (
        <StopRow key={i} stop={s} index={i} type={type} color={color}
                 onChange={next => updateStop(i, next)}
                 onRemove={() => removeStop(i)} />
      ))}
    </div>
  );
}

function RateConSlot({ load, onChange, onDelete, checkDuplicate }) {
  const [busy, setBusy]   = useState(false);
  const [drag, setDrag]   = useState(false);
  const [note, setNote]   = useState("");   // banner message after parse
  const inputRef = useRef(null);

  // Auto-hide the parse note after a few seconds
  useEffect(() => {
    if (!note) return;
    const t = setTimeout(() => setNote(""), 6000);
    return () => clearTimeout(t);
  }, [note]);

  const handleFiles = async (files) => {
    if (!files || !files[0]) return;
    const f = files[0];
    if (f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)) {
      alert("Rate confirmations must be PDF files.");
      return;
    }
    setBusy(true);
    setNote("Reading PDF…");
    try {
      // 1. Parse text FIRST, locally, before touching the server. This lets
      //    us run the duplicate check without uploading a PDF that we may
      //    end up throwing away if the user cancels.
      let parsed = null;
      let parseError = null;
      try {
        const text = await extractPdfText(f);
        parsed = parseRateCon(text);
      } catch (e) {
        parseError = e;
        console.warn("Rate con auto-parse failed:", e);
      }

      // 2. Duplicate-loadNum check BEFORE upload. If user cancels, abort
      //    completely — don't upload, don't change the card. If the load
      //    we're dropping onto was an untouched blank card, delete it so
      //    the user sees no residue.
      if (parsed && parsed.loadNum && checkDuplicate) {
        const hit = checkDuplicate(load.id, parsed.loadNum);
        if (hit) {
          const proceed = window.confirm(
            "Load # " + parsed.loadNum + " already exists in \"" + hit.weekLabel + "\"" +
            (hit.broker ? " (broker: " + hit.broker + ")" : "") + ".\n\n" +
            "Add this duplicate load anyway?\n\n" +
            "Click Cancel to skip — nothing will be uploaded or changed."
          );
          if (!proceed) {
            setBusy(false);
            // If the destination card is completely empty (user just hit + Add Load
            // and dragged in a duplicate), remove the empty placeholder so they don't
            // have to manually delete it.
            if (isEmptyLoad(load) && typeof onDelete === "function") {
              onDelete(load.id);
            } else {
              setNote("✕ Skipped — Load #" + parsed.loadNum + " is already on the board.");
            }
            return;
          }
        }
      }

      // 3. Now upload (only after dup check has passed or wasn't needed)
      setNote("Uploading…");
      const uploaded = await apiUpload(f, "uploadRateCon");

      // 4. Compose the single load update with the upload + any parsed fields
      let next = { ...load, rateConUrl: uploaded.url, rateConName: uploaded.name };
      let filledFields = [];
      if (parsed) {
        const merged = applyParsedToLoad(next, parsed);
        next = merged.merged;
        filledFields = merged.filledFields;
      }
      onChange(next);

      // 5. Report what happened
      if (filledFields.length) {
        setNote("✓ Auto-filled " + filledFields.length + " field" + (filledFields.length === 1 ? "" : "s") + ": " + filledFields.join(", ") + ". Please review.");
      } else if (parseError) {
        setNote("Uploaded. Couldn't read text from this PDF (it may be a scan) — please fill fields manually.");
      } else {
        setNote("Uploaded. No fields matched known patterns — please fill manually.");
      }
    } catch (err) {
      alert("Upload failed: " + err.message);
    } finally {
      setBusy(false);
    }
  };

  const onDrop = e => {
    e.preventDefault();
    setDrag(false);
    handleFiles(e.dataTransfer.files);
  };

  return (
    <div>
      {load.rateConUrl ? (
        <div className="clb-ratecon clb-ratecon--uploaded">
          <span>📄</span>
          <a href={load.rateConUrl} target="_blank" rel="noopener noreferrer">
            {load.rateConName || "Rate confirmation"}
          </a>
          <button onClick={() => onChange({ ...load, rateConUrl: "", rateConName: "" })} title="Remove rate con">×</button>
        </div>
      ) : (
        <div
          className={"clb-ratecon" + (drag ? " clb-ratecon--drag" : "") + (busy ? " clb-ratecon--uploading" : "")}
          onClick={() => !busy && inputRef.current && inputRef.current.click()}
          onDragOver={e => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={onDrop}
        >
          {busy ? "Reading rate con…" : "📄  Drag rate con (PDF) here, or click to choose"}
          <input ref={inputRef} type="file" accept="application/pdf,.pdf"
                 style={{ display: "none" }}
                 onChange={e => handleFiles(e.target.files)} />
        </div>
      )}
      {note && (
        <div style={{
          fontSize: "11px", fontWeight: 600,
          color: note.startsWith("✓") ? "#15803d" : "#92400e",
          background: note.startsWith("✓") ? "#dcfce7" : "#fef3c7",
          border: "1px solid " + (note.startsWith("✓") ? "#86efac" : "#fcd34d"),
          padding: "6px 10px", borderRadius: "6px", marginBottom: "10px"
        }}>
          {note}
        </div>
      )}
    </div>
  );
}

function PhotosSlot({ load, onChange }) {
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);

  const photos = load.photos || [];

  const handleFiles = async (files) => {
    if (!files || !files.length) return;
    setBusy(true);
    try {
      const uploaded = [];
      for (const f of Array.from(files)) {
        const r = await apiUpload(f, "uploadPhoto");
        uploaded.push(r);
      }
      onChange({ ...load, photos: [ ...photos, ...uploaded ] });
    } catch (err) {
      alert("Upload failed: " + err.message);
    } finally {
      setBusy(false);
    }
  };

  const removePhoto = (id) => {
    if (!window.confirm("Remove this photo from the load? (The file stays in your Drive.)")) return;
    onChange({ ...load, photos: photos.filter(p => p.id !== id) });
  };

  return (
    <div className="clb-photos">
      <div className="clb-photos__title">
        <strong>Photos</strong>
        <span className="clb-stops__count">{photos.length}</span>
        <button className="clb-photos__add" onClick={() => inputRef.current && inputRef.current.click()} disabled={busy}>
          {busy ? "Uploading…" : "+ Add photos"}
        </button>
        <input ref={inputRef} type="file" accept="image/*" multiple
               style={{ display: "none" }}
               onChange={e => handleFiles(e.target.files)} />
      </div>
      {photos.length > 0 && (
        <div className="clb-photos__grid">
          {photos.map(p => (
            <div key={p.id} className="clb-photo">
              <a href={p.url} target="_blank" rel="noopener noreferrer">
                <img src={p.thumbnailUrl || p.url} alt={p.name || "photo"} loading="lazy" />
              </a>
              <button className="clb-photo__del" onClick={() => removePhoto(p.id)} title="Remove">×</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function LoadCard({ load, bucket, allDrivers, allTrucks, truckAssignments, checkDuplicate, role, userName, expanded, onToggle, onChange, onDelete }) {
  const [pendingDriver, setPendingDriver] = useState(load.otrDriver || "");
  useEffect(() => { setPendingDriver(load.otrDriver || ""); }, [load.otrDriver]);

  const update = (field, value) => onChange({ ...load, [field]: value });

  const updateStatus = (status) => onChange({ ...load, status });

  const claimLoad   = () => onChange({ ...load, claimedBy: userName || "Someone", claimedAt: Date.now() });
  const releaseLoad = () => onChange({ ...load, claimedBy: "", claimedAt: 0 });

  const updateOtrDriver = (otrDriver) => {
    const next = { ...load, otrDriver };
    // Auto-promote Need to Pickup → Dispatched once an OTR driver is assigned.
    if (otrDriver && (load.status || "Need to Drop") === "Need to Drop") {
      next.status = "Dispatched";
    }
    // Auto-fill OTR truck from truckAssignments — only if truck is currently empty
    // (so we never clobber a manually-entered truck #).
    const mt = findTruckForDriver(truckAssignments, otrDriver);
    if (mt && !next.otrTruck) next.otrTruck = mt;
    onChange(next);
  };

  const ss = STATUS_STYLES[load.status] || STATUS_STYLES["Need to Drop"];
  const bucketColor = bucket.color;
  const dup = checkDuplicate ? checkDuplicate(load.id, load.loadNum) : null;

  // OTR badge shows either "#519 · Jeff Mecha" or whichever pieces are present
  const otrBadge = (load.otrDriver || load.otrTruck) ? (
    <span className="clb-card__driver">
      🚛 {load.otrTruck ? "#" + load.otrTruck : ""}{load.otrTruck && load.otrDriver ? " · " : ""}{load.otrDriver || ""}
    </span>
  ) : null;

  return (
    <div className={"clb-card" +
                    (load.status === "Delivered" ? " clb-card--delivered" : "") +
                    (load.waitingUpdate ? " clb-card--waiting" : "") +
                    (load.claimedBy ? " clb-card--claimed" : "")}
         style={{ "--bucket-color": bucketColor }}>
      <div className="clb-card__head" onClick={onToggle}>
        <span className="clb-card__caret">{expanded ? "▼" : "▶"}</span>
        <button
          type="button"
          className={"clb-card__waiting" + (load.waitingUpdate ? " clb-card__waiting--on" : "")}
          onClick={e => { e.stopPropagation(); update("waitingUpdate", !load.waitingUpdate); }}
          title={load.waitingUpdate
            ? "Currently waiting for updated info — click to clear and return to the normal day bucket."
            : "Click to mark this load as waiting for updated info (rate, appt times, etc.). Marked loads group at the top of the board."}>
          {load.waitingUpdate ? "⏳ Waiting update" : "⏳ Mark waiting"}
        </button>
        {load.claimedBy ? (() => {
          const mine      = !!userName && load.claimedBy === userName;
          const canRelease = role === "admin" || mine;
          return (
            <span className="clb-card__claim clb-card__claim--taken"
                  title={"Claimed by " + load.claimedBy +
                         (canRelease ? " — click ✕ to release" : " — only the dispatcher who claimed it, or an admin, can release this")}>
              🙋 {load.claimedBy}{mine ? " (you)" : ""}
              {canRelease && (
                <button type="button" className="clb-card__claim-x"
                        onClick={e => { e.stopPropagation(); releaseLoad(); }}
                        title={mine ? "Release your claim — frees this load for others"
                                    : "Release this claim (admin)"}>✕</button>
              )}
            </span>
          );
        })() : (
          <button type="button" className="clb-card__claim clb-card__claim--free"
                  onClick={e => { e.stopPropagation(); claimLoad(); }}
                  title="Claim this load so other dispatchers know you're handling it">
            + Claim load
          </button>
        )}
        <span className="clb-card__broker">{load.broker || "—"}</span>
        {load.loadNum && <span className="clb-card__loadnum">#{load.loadNum}</span>}
        <span className="clb-card__lane">{summarizeLane(load)}</span>
        {(() => {
          const dts = (load.deliveries || []).map(d => d && d.datetime).filter(Boolean);
          return dts.length ? (
            <span className="clb-card__delivery-dt"
                  title={dts.length === 1 ? "Delivery window" : "Delivery windows"}>
              🏁 {dts.join(" · ")}
            </span>
          ) : null;
        })()}
        {load.trailer && <span className="clb-card__trailer">T{load.trailer}</span>}
        {otrBadge}
        {parseFloat(load.rate) > 0 && <span className="clb-card__rate">{formatRate(load.rate)}</span>}
        <span className="clb-card__status"
              style={{ background: ss.bg, color: ss.color, border: "1px solid " + ss.border }}>
          {load.status || "Need to Drop"}
        </span>
      </div>

      {expanded && (
        <div className="clb-card__body" onClick={e => e.stopPropagation()}>

          <div className="clb-row clb-row--3">
            <div className="clb-field">
              <span className="clb-field__lbl">Broker</span>
              <input value={load.broker || ""} onChange={e => update("broker", e.target.value)} placeholder="RJW Logistics, Echo, etc." />
            </div>
            <div className="clb-field">
              <span className="clb-field__lbl">Load #{dup && <span style={{ color:"#dc2626", marginLeft:6, fontWeight:700 }}>· duplicate</span>}</span>
              <input value={load.loadNum || ""} onChange={e => update("loadNum", e.target.value)} placeholder="12345"
                     style={dup ? { borderColor:"#dc2626", background:"#fef2f2" } : null} />
              {dup && (
                <div style={{ fontSize:10, color:"#b91c1c", fontWeight:600, marginTop:2, lineHeight:1.3 }}>
                  ⚠ Already exists in <strong>{dup.weekLabel}</strong>
                  {dup.broker ? <> (broker: {dup.broker})</> : null}
                </div>
              )}
            </div>
            <div className="clb-field">
              <span className="clb-field__lbl">Rate ($)</span>
              <input value={load.rate || ""} onChange={e => update("rate", e.target.value)} placeholder="0" inputMode="decimal" />
            </div>
          </div>

          {/* OTR row — driver + truck + status */}
          <div className="clb-row clb-row--3">
            <div className="clb-field">
              <span className="clb-field__lbl">OTR Driver</span>
              <input list={"clb-drivers-" + load.id}
                     value={pendingDriver}
                     onChange={e => setPendingDriver(e.target.value)}
                     onBlur={() => { if (pendingDriver !== (load.otrDriver || "")) updateOtrDriver(pendingDriver); }}
                     onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
                     placeholder="Assign driver" />
              <datalist id={"clb-drivers-" + load.id}>
                {allDrivers.map(d => <option key={d} value={d} />)}
              </datalist>
            </div>
            <div className="clb-field">
              <span className="clb-field__lbl">OTR Truck #</span>
              <input list={"clb-otrtrucks-" + load.id}
                     value={load.otrTruck || ""}
                     onChange={e => update("otrTruck", e.target.value)}
                     placeholder="e.g. 519" />
              <datalist id={"clb-otrtrucks-" + load.id}>
                {allTrucks.map(t => <option key={t} value={t} />)}
              </datalist>
            </div>
            <div className="clb-field">
              <span className="clb-field__lbl">Status</span>
              <select value={load.status || "Need to Drop"} onChange={e => updateStatus(e.target.value)}>
                {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          </div>

          {/* Local equipment row — trailer & truck */}
          <div className="clb-row clb-row--2">
            <div className="clb-field">
              <span className="clb-field__lbl">Trailer # (local)</span>
              <input value={load.trailer || ""} onChange={e => update("trailer", e.target.value)} placeholder="e.g. 53117" />
            </div>
            <div className="clb-field">
              <span className="clb-field__lbl">Truck # (local)</span>
              <input list={"clb-localtrucks-" + load.id}
                     value={load.truck || ""}
                     onChange={e => update("truck", e.target.value)}
                     placeholder="e.g. 463" />
              <datalist id={"clb-localtrucks-" + load.id}>
                {allTrucks.map(t => <option key={t} value={t} />)}
              </datalist>
            </div>
          </div>

          <RateConSlot load={load} onChange={onChange} onDelete={onDelete} checkDuplicate={checkDuplicate} />

          <StopList stops={load.pickups || []} type="pickup" color="#0f766e"
                    onChange={pickups => update("pickups", pickups)} />

          <StopList stops={load.deliveries || []} type="delivery" color="#7c2d12"
                    onChange={deliveries => update("deliveries", deliveries)} />

          <div className="clb-field">
            <span className="clb-field__lbl">Notes (load-wide)</span>
            <textarea value={load.notes || ""} onChange={e => update("notes", e.target.value)}
                      placeholder="Anything else worth noting on this load…" />
          </div>

          <PhotosSlot load={load} onChange={onChange} />

          <div className="clb-actions">
            <div className="clb-actions__spacer" />
            <button className="clb-actions__btn clb-actions__btn--danger" onClick={() => {
              if (window.confirm("Delete this load? This cannot be undone.")) onDelete(load.id);
            }}>Delete load</button>
          </div>
        </div>
      )}
    </div>
  );
}

function BucketSection({ bucket, loads, expandedIds, setExpanded, allDrivers, allTrucks, truckAssignments, checkDuplicate, role, userName, onChange, onDelete }) {
  if (!loads.length) return null;
  const total = loads.reduce((s, l) => s + (parseFloat(l.rate) || 0), 0);
  return (
    <div className="clb-bucket">
      <div className="clb-bucket__head" style={{ "--bucket-color": bucket.color, "--bucket-bg": bucket.bg }}>
        <span className="clb-bucket__name">{bucket.label}</span>
        <span className="clb-bucket__count">{loads.length}</span>
        {total > 0 && <span className="clb-bucket__total">{formatRate(total)}</span>}
      </div>
      <div className="clb-bucket__body">
        {loads.map(l => (
          <LoadCard
            key={l.id}
            load={l}
            bucket={bucket}
            allDrivers={allDrivers}
            allTrucks={allTrucks}
            truckAssignments={truckAssignments}
            checkDuplicate={checkDuplicate}
            role={role}
            userName={userName}
            expanded={expandedIds.has(l.id)}
            onToggle={() => setExpanded(prev => {
              const next = new Set(prev);
              if (next.has(l.id)) next.delete(l.id); else next.add(l.id);
              return next;
            })}
            onChange={onChange}
            onDelete={onDelete}
          />
        ))}
      </div>
    </div>
  );
}
