<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0f1f3d"/>
<title>Freight Board</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;padding-bottom:72px;}

/* HEADER */
.hdr{background:#0f1f3d;padding:12px 16px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.hdr-title{color:#fff;font-size:16px;font-weight:800;}
.hdr-sub{color:rgba(255,255,255,.4);font-size:10px;}
.hdr-right{display:flex;align-items:center;gap:8px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;}
.sync-dot.loading{background:#f59e0b;animation:pulse 1s infinite;}
.sync-dot.err{background:#ef4444;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.admin-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;}
.logout-btn{background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;}

/* OFFLINE / STALE BANNER — the sync dot alone was too small to notice on a phone
   in a truck, so a failed refresh looked exactly like a quiet one. */
.conn-banner{display:none;align-items:center;gap:8px;padding:8px 14px;font-size:11px;font-weight:700;}
.conn-banner.show{display:flex;}
.conn-offline{background:#7f1d1d;color:#fecaca;}
.conn-stale{background:#78350f;color:#fde68a;}
.conn-retry{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#0f1f3d;border-top:1px solid rgba(255,255,255,.08);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom);}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 8px;cursor:pointer;border:none;background:none;color:rgba(255,255,255,.4);font-size:9px;font-weight:700;gap:3px;}
.bnav-btn.active{color:#38bdf8;}
.bnav-icon{font-size:20px;}

/* SECTION CONTENT */
.section{display:none;padding:14px;}
.section.active{display:block;}

/* WEEK SELECTOR */
.week-scroll{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:14px;}
.week-scroll::-webkit-scrollbar{display:none;}
.week-chip{background:#fff;border:1.5px solid #e2e8f0;color:#475569;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer;flex-shrink:0;}
.week-chip.active{background:#0f1f3d;border-color:#0f1f3d;color:#fff;}

/* COMBINED CARD */
.ccard{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid #e2e8f0;}
.ccard-header{background:#0f1f3d;padding:10px 14px;display:flex;align-items:center;gap:8px;}
.ccard-header.no-driver{background:#fee2e2;}
.ccard-truck{font-size:11px;font-weight:800;color:#fff;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:5px;}
.ccard-trailer{font-size:11px;font-weight:800;color:#c4b5fd;background:rgba(167,139,250,.2);padding:2px 8px;border-radius:5px;}
.ccard-driver{font-size:12px;font-weight:700;color:#86efac;flex:1;}
.ccard-nodrv{font-size:11px;font-weight:800;color:#b91c1c;flex:1;}
.ccard-miles{font-size:10px;color:rgba(255,255,255,.5);background:rgba(255,255,255,.08);padding:2px 7px;border-radius:5px;}
.ccard-miles.est{color:#fde68a;background:rgba(252,211,77,.15);}

/* FINANCIAL BAR */
.fin-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;flex-wrap:wrap;gap:6px;}
.fin-item{display:flex;align-items:center;gap:4px;}
.fin-label{font-size:9px;color:#64748b;font-weight:700;text-transform:uppercase;}
.fin-val{font-size:13px;font-weight:800;}
.fin-gross{color:#0f1f3d;}
.fin-local{color:#b45309;}
.fin-net-wrap{background:#f0fdf4;border:1.5px solid #22c55e;border-radius:8px;padding:3px 10px;display:flex;align-items:center;gap:4px;}
.fin-net{color:#15803d;font-size:15px;font-weight:900;}
.fin-sep{color:#94a3b8;font-size:13px;font-weight:700;}

/* CLAIM BAR */
.claim-bar{background:linear-gradient(90deg,#fef3c7,#fde68a);border-bottom:2px solid #f59e0b;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.claim-label{font-size:11px;font-weight:700;color:#78350f;flex:1;min-width:100px;}
.claim-input{border:2px solid #f59e0b;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:#78350f;background:#fff;outline:none;flex:1;min-width:120px;max-width:180px;}
.claim-btn{background:#d97706;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;}
.claim-btn:disabled{opacity:.6;cursor:default;}
.claim-err{width:100%;font-size:11px;font-weight:700;color:#991b1b;}

/* STOP ROW */
.stops{padding:8px 14px;}
.stop-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9;}
.stop-row:last-child{border-bottom:none;}
.stop-num{width:18px;height:18px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#64748b;flex-shrink:0;margin-top:1px;}
.stop-info{flex:1;min-width:0;}
.stop-city{font-size:13px;font-weight:700;color:#0f1f3d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stop-dates{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;}
.stop-date{font-size:10px;color:#64748b;}
.stop-status{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;flex-shrink:0;white-space:nowrap;}

/* STATUS BADGE COLORS */
.st-dispatched{background:#dbeafe;color:#1e40af;}
.st-dock{background:#fef9c3;color:#713f12;}
.st-yard{background:#fef9c3;color:#713f12;}
.st-need{background:#fee2e2;color:#991b1b;}
.st-loaded{background:#dcfce7;color:#14532d;}
.st-delivered{background:#dcfce7;color:#065f46;}
.st-waiting{background:#fef3c7;color:#92400e;}
.st-xdock{background:#f3e8ff;color:#6b21a8;}

/* STATUS GROUP HEADER */
.status-group{margin-bottom:16px;}
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 12px;border-radius:14px;margin-bottom:8px;}
.status-dot{width:7px;height:7px;border-radius:50%;}

/* STAT CARDS (dashboard) */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e2e8f0;}
.stat-icon{font-size:20px;margin-bottom:4px;}
.stat-val{font-size:20px;font-weight:900;color:#0f1f3d;}
.stat-label{font-size:10px;color:#64748b;font-weight:600;margin-top:2px;}
.stat-sub{font-size:10px;color:#94a3b8;margin-top:1px;}

/* PLANNED ROW (admin only) */
.prow{background:#fff;border-radius:12px;margin-bottom:8px;overflow:hidden;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.prow-banner{background:#0f1f3d;padding:8px 14px;display:flex;align-items:center;gap:8px;}
.prow-banner-route{font-size:12px;font-weight:700;color:#93c5fd;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prow-banner-status{font-size:9px;font-weight:800;padding:2px 7px;border-radius:10px;}
.prow-details{padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;}
.prow-field{display:flex;flex-direction:column;gap:2px;}
.prow-field-label{font-size:9px;color:#94a3b8;font-weight:700;text-transform:uppercase;}
.prow-field-val{font-size:12px;font-weight:600;color:#374151;}

/* OTR CARD (admin) */
.otr-card{background:#1a0a2e;border:1px solid #4c1d95;border-radius:14px;overflow:hidden;margin-bottom:12px;}
.otr-card-hdr{padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.08);}
.otr-driver{font-size:13px;font-weight:700;color:#c4b5fd;flex:1;}
.otr-truck{font-size:10px;font-weight:700;color:rgba(255,255,255,.5);background:rgba(255,255,255,.08);padding:2px 7px;border-radius:4px;}
.otr-status-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;}
.otr-stop-row{padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;}
.otr-stop-city{font-size:12px;font-weight:600;color:#e2e8f0;flex:1;}
.otr-stop-del{font-size:10px;color:rgba(255,255,255,.4);}
/* Broker + load# meta line under each OTR stop. Load# is tappable to copy. */
.otr-stop-meta{width:100%;display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap;padding-left:26px;}
.otr-broker{font-size:10px;color:rgba(255,255,255,.55);font-weight:600;}
.otr-loadnum{font-size:10px;font-weight:700;color:#fde047;background:rgba(252,211,77,.1);border:1px solid rgba(252,211,77,.3);padding:2px 7px;border-radius:4px;cursor:pointer;user-select:all;transition:background .15s,color .15s;}
.otr-loadnum:active{background:rgba(252,211,77,.25);}
.otr-loadnum[data-copied="1"]{background:rgba(34,197,94,.18);color:#86efac;border-color:rgba(34,197,94,.5);}

/* PLANNED — trailer card pattern (mirrors Combined): a banner header followed by stop rows */
.ptrailer{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.ptrailer-hdr{padding:8px 12px;background:linear-gradient(90deg,#0f1f3d,#1e3a5f);color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;}
.ptrailer-tnum{background:#2563eb;color:#fff;font-weight:700;padding:1px 8px;border-radius:4px;font-size:10px;}
.ptrailer-stops{font-size:10px;color:rgba(255,255,255,.6);font-weight:600;}
.ptrailer-truck{font-size:10px;font-weight:700;color:rgba(255,255,255,.7);background:rgba(255,255,255,.1);padding:2px 7px;border-radius:4px;}
.ptrailer-trailer{font-size:10px;font-weight:700;color:rgba(255,255,255,.7);background:rgba(255,255,255,.1);padding:2px 7px;border-radius:4px;}
.ptrailer-gross{font-size:11px;color:#86efac;font-weight:800;margin-left:auto;}
.pstop{padding:10px 12px;border-bottom:1px solid #f1f5f9;}
.pstop:last-child{border-bottom:none;}
.pstop-banner{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.pstop-num{width:18px;height:18px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;}
.pstop-route{font-size:12px;font-weight:600;color:#0f1f3d;flex:1;min-width:0;}
.pstop-status{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0;}
.pstop-loadnum{font-size:10px;font-weight:700;color:#b45309;background:#fef3c7;border:1px solid #fcd34d;padding:2px 7px;border-radius:4px;cursor:pointer;user-select:all;transition:background .15s,color .15s;}
.pstop-loadnum:active{background:#fde68a;}
.pstop-loadnum[data-copied="1"]{background:#dcfce7;color:#15803d;border-color:#86efac;}
.pstop-broker{font-size:10px;color:#64748b;font-weight:600;}
.pstop-details{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;padding-left:26px;}

/* SAMSARA LIVE LOCATION PILL — yellow pill, used on OTR cards (dark bg), Combined cards (white bg), Planned rows (white bg) */
.live-pill{font-size:10px;font-weight:700;color:#a16207;background:#fef3c7;border:1px solid #fcd34d;padding:2px 7px;border-radius:4px;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;}
.live-pill.dark{color:#fcd34d;background:rgba(252,211,77,.12);border-color:rgba(252,211,77,.35);}

/* LOGIN OVERLAY */
.login-overlay{position:fixed;inset:0;background:#0f1f3d;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:24px;}
.login-logo{font-size:52px;margin-bottom:12px;}
.login-title{color:#fff;font-size:22px;font-weight:900;margin-bottom:4px;}
.login-sub{color:rgba(255,255,255,.4);font-size:12px;margin-bottom:32px;text-align:center;}
.login-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px 24px;width:100%;max-width:320px;}
.login-pin-label{color:rgba(255,255,255,.6);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.login-pin-input{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;padding:14px 16px;color:#fff;font-size:20px;font-family:inherit;outline:none;text-align:center;letter-spacing:.2em;margin-bottom:14px;}
.login-pin-input:focus{border-color:#3b82f6;}
.login-btn{width:100%;background:#3b82f6;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:10px;}
.login-btn:disabled{opacity:.6;cursor:default;}
.login-view-btn{width:100%;background:transparent;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;}
.login-err{color:#fca5a5;font-size:12px;text-align:center;margin-top:8px;}

/* LOADING */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:12px;}
.loading-spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:#94a3b8;font-weight:600;}

/* EMPTY STATE */
.empty{text-align:center;padding:40px 20px;color:#94a3b8;}
.empty-icon{font-size:40px;margin-bottom:10px;}
.empty-text{font-size:14px;font-weight:600;}

/* SECTION TITLE */
.section-title{font-size:18px;font-weight:800;color:#0f1f3d;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section-count{font-size:12px;font-weight:600;color:#64748b;background:#f1f5f9;padding:2px 9px;border-radius:10px;}

/* NAV TABS (admin sections) */
.nav-tabs{display:flex;gap:1px;background:rgba(255,255,255,.06);padding:0 0 8px;}
.nav-tab{flex:1;text-align:center;padding:8px 4px;color:rgba(255,255,255,.4);font-size:10px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;}
.nav-tab.active{color:#38bdf8;border-bottom-color:#38bdf8;}

/* SEARCH */
.search-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;}
.search-input{flex:1;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px 12px;font-size:13px;outline:none;background:#fff;font-family:inherit;}
.search-input:focus{border-color:#3b82f6;}
.search-clear{background:none;border:none;color:#94a3b8;font-size:18px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0;}
.search-result-card{background:#fff;border-radius:12px;margin-bottom:8px;overflow:hidden;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.search-result-hdr{background:#0f1f3d;padding:8px 12px;display:flex;align-items:center;gap:6px;}
.search-result-row{padding:8px 14px;border-top:1px solid #f1f5f9;display:flex;align-items:center;gap:8px;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-top">
    <div>
      <div class="hdr-title">🚛 Freight Board</div>
      <div class="hdr-sub" id="hdr-sub">Loading...</div>
    </div>
    <div class="hdr-right">
      <div class="sync-dot loading" id="sync-dot"></div>
      <button class="admin-btn" id="admin-toggle-btn" onclick="toggleAdminLogin()">🔐 Admin</button>
    </div>
  </div>
  <!-- Admin section nav tabs (hidden for viewer). Each tab carried a duplicated
       data-tab attribute; the second was silently dropped by the parser. -->
  <div class="nav-tabs" id="admin-nav" style="display:none;">
    <div class="nav-tab active" data-tab="dashboard" onclick="switchAdminTab('dashboard')">📊 Dashboard</div>
    <div class="nav-tab" data-tab="planned" onclick="switchAdminTab('planned')">📋 Planned</div>
    <div class="nav-tab" data-tab="combined" onclick="switchAdminTab('combined')">🔄 Combined</div>
    <div class="nav-tab" data-tab="otr" onclick="switchAdminTab('otr')">🚛 OTR</div>
  </div>
</div>

<!-- CONNECTION BANNER -->
<div class="conn-banner" id="conn-banner">
  <span id="conn-text"></span>
  <button class="conn-retry" onclick="refreshData()">Retry</button>
</div>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="login-overlay" style="display:none;">
  <div class="login-logo">🔐</div>
  <div class="login-title">Admin Access</div>
  <div class="login-sub">Enter your PIN to access the full board</div>
  <div class="login-card">
    <div class="login-pin-label">Admin PIN</div>
    <input class="login-pin-input" type="password" id="pin-input" maxlength="20" placeholder="••••" inputmode="numeric" autocomplete="off" oninput="clearLoginErr()"/>
    <button class="login-btn" id="login-submit" onclick="attemptLogin()">Unlock Board</button>
    <button class="login-view-btn" onclick="hideLoginOverlay()">Cancel — Stay as Viewer</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div style="padding-top:4px;">

  <!-- SEARCH BAR -->
  <div class="search-bar" id="search-bar-wrap">
    <input class="search-input" id="search-input" type="text" placeholder="🔍  Search loads, cities, drivers..." oninput="onSearch(this.value)" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="search-clear" id="search-clear-btn" onclick="clearSearch()" style="display:none;">✕</button>
  </div>
  <!-- SEARCH RESULTS (shown when searching) -->
  <div id="search-results" style="display:none;padding:10px 14px;"></div>

  <!-- WEEK SELECTOR -->
  <div style="padding:10px 14px 0;" id="week-selector-wrap">
    <div class="week-scroll" id="week-tabs"></div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div class="section active" id="sec-dashboard">
    <div id="dash-content">
      <div class="loading-screen"><div class="loading-spinner"></div><div class="loading-text">Loading board...</div></div>
    </div>
  </div>

  <!-- PLANNED SECTION (admin only) -->
  <div class="section" id="sec-planned">
    <div id="planned-content">
      <div class="loading-screen"><div class="loading-spinner"></div><div class="loading-text">Loading...</div></div>
    </div>
  </div>

  <!-- COMBINED SECTION (admin only) -->
  <div class="section" id="sec-combined">
    <div id="combined-content">
      <div class="loading-screen"><div class="loading-spinner"></div><div class="loading-text">Loading...</div></div>
    </div>
  </div>

  <!-- OTR SECTION (admin only) -->
  <div class="section" id="sec-otr">
    <div id="otr-content">
      <div class="loading-screen"><div class="loading-spinner"></div><div class="loading-text">Loading...</div></div>
    </div>
  </div>

</div>

<!-- BOTTOM NAV (viewer only) -->
<div class="bnav" id="viewer-nav">
  <button class="bnav-btn active" onclick="scrollToTop()">
    <div class="bnav-icon">📊</div>Dashboard
  </button>
  <button class="bnav-btn" onclick="refreshData()">
    <div class="bnav-icon">🔄</div>Refresh
  </button>
</div>

<script>
/* ─────────────────────────────────────────────────────────────────────────
   SHARED MILEAGE + PARSING LAYER — identical to board.html.
   The mobile board used to carry its own copy of these tables and helpers, and
   the two copies had drifted: mobile had a duplicate "lansing" key, no state
   disambiguation, a first-match fuzzy lookup, and a localCharge that billed
   $700 on a 900-mile load where the desktop billed nothing. The same trailer
   showed a different Net on a phone than on the desktop. Keep this block byte

// This board builds every row as an HTML string and assigns it with innerHTML,

function livePillFor(truckNum, status, darkBg) {

  //   "1234 Main St, Bensenville, IL 60106, USA"     <- typical
  //   "Bensenville, IL 60106"                         <- short
  //   "I-55 N, IL 60418, USA"                         <- highway, no city
  //   "IL, 60418"                                     <- state + zip only

  // immediately before it as the city (unless that segment looks like a street).

    document.getElementById('viewer-nav').style.display = 'flex';
    switchAdminTab('dashboard');
    renderAll();
  } else {
    showLoginOverlay();
  }
}

function showLoginOverlay() {
  document.getElementById('login-overlay').style.display = 'flex';
  setTimeout(function() { document.getElementById('pin-input').focus(); }, 100);
}

function hideLoginOverlay() {
  document.getElementById('login-overlay').style.display = 'none';
  document.getElementById('pin-input').value = '';
  document.getElementById('login-err').textContent = '';
  setLoginBusy(false);
}

function clearLoginErr() {
  document.getElementById('login-err').textContent = '';
}

function setLoginBusy(busy){
  var b=document.getElementById('login-submit');
  if(!b)return;
  b.disabled=!!busy;
  b.textContent=busy?'Checking…':'Unlock Board';
}

function loginFailed(msg){
  document.getElementById('login-err').textContent = msg || 'Incorrect PIN — try again';
  document.getElementById('pin-input').value = '';
  setLoginBusy(false);
}

// Ask the server first — it is the only party that can actually revoke a PIN.
// Fall back to the stored digest only when the server cannot be reached, which
// is a real situation on a phone and is labelled as such.
function attemptLogin() {
  var pin = document.getElementById('pin-input').value.trim();
  if (!pin) return;
  setLoginBusy(true);
  clearLoginErr();
  serverLogin(pin).then(function(j){
    if (j && j.ok && (j.role === 'admin' || j.role === 'dispatcher')) {
      rememberAdminPin(pin);
      loginSuccess();
      return;
    }
    if (j && j.enforced) { loginFailed(); return; }
    offlinePinCheck(pin);
  }).catch(function(){
    offlinePinCheck(pin);
  });
}

function offlinePinCheck(pin) {
  var storedHash = '';
  try { storedHash = localStorage.getItem(ADMIN_PIN_HASH_KEY) || ''; } catch (e) {}
  if (!storedHash) {
    loginFailed('Cannot reach the board right now — try again when you have signal');
    return;
  }
  hashPin(pin).then(function(h){
    if (h === storedHash) loginSuccess();
    else loginFailed('Incorrect PIN (offline check)');
  }).catch(function(){
    loginFailed('This browser cannot verify the PIN offline — open the board over https');
  });
}

function loginSuccess() {
  isAdmin = true;
  hideLoginOverlay();
  var btn = document.getElementById('admin-toggle-btn');
  btn.className = 'logout-btn';
  btn.textContent = '↩ Logout';
  btn.onclick = toggleAdminLogin;
  document.getElementById('admin-nav').style.display = 'flex';
  document.getElementById('viewer-nav').style.display = 'none';
  // Admin sees fields the viewer payload omits, so re-fetch under the new role.
  refreshData();
}

document.getElementById('pin-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') attemptLogin();
});

//     NAVIGATION
function switchAdminTab(tab) {
  activeAdminTab = tab;
  document.querySelectorAll('.nav-tab').forEach(function(t) {
    t.classList.toggle('active', t.getAttribute('data-tab') === tab);
  });
  showSection(tab);
  renderAll();
}

// Sections are shown and hidden by the .active class. Search used to hide them
// with inline style.display instead, which then fought the class — after a
// search the dashboard could come back with display:block on a section the
// class had hidden, leaving two sections stacked on screen. One mechanism only.
function showSection(tab) {
  document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
  var sec = document.getElementById('sec-' + tab);
  if (sec) sec.classList.add('active');
}

function scrollToTop() {

}

// Read every claim box before a re-render blows the DOM away, and put the text
// back afterwards. Without this the 60s auto-refresh erased a name mid-typing.
function captureClaimDrafts() {
  document.querySelectorAll('input[data-claim-for]').forEach(function(inp){
    claimDrafts[inp.getAttribute('data-claim-for')] = inp.value;
  });
}
function restoreClaimDrafts() {

//     HELPERS
function getWeek() {
  return weeks[activeWeekIdx] || {groups:[], localDeliveries:[], accessorials:[]};
}

function statusClass(st) {
  var m = {
    'Dispatched':'st-dispatched','Dock':'st-dock','Yard':'st-yard',
    'Need to pickup':'st-need','Need to Pickup':'st-need',
    'Loaded':'st-loaded','Delivered':'st-delivered','In Transit':'st-dispatched',
    // These two are in the desktop board's LOAD_STATUSES but had no styling here,
    // so a load waiting on an appointment or sitting at a crossdock rendered as
    // an unstyled grey chip that read as "no status".
    'Waiting Appt':'st-waiting','At Crossdock':'st-xdock'
  };
  return m[st] || '';
}

function getStopCss(st) {
  var c = {
    'Preplanned': {bg:'#f1f5f9',c:'#475569',bd:'#94a3b8'},
    'Future': {bg:'#f5f3ff',c:'#5b21b6',bd:'#a78bfa'},
    'Not dispatched': {bg:'#fef9c3',c:'#713f12',bd:'#eab308'},
    'Loaded': {bg:'#dcfce7',c:'#14532d',bd:'#22c55e'},
    'Ready': {bg:'#f0fdf4',c:'#065f46',bd:'#16a34a'}
  };
  return c[st] || c['Preplanned'];
}

// Local charge for a trailer. localCharge() returns null for anything beyond the
// local radius, meaning "not a local run — do not bill one", and null must not be
// added as 0 or as $700. This mobile board used to run its own copy of the tier
// table that charged $700 for a 900-mile load, so its Net column disagreed with
// the desktop board on the same trailer.
function calcLocCost(loads) {
  return loads.reduce(function(s, l) {
    if (l.manualLocalCharge !== '' && l.manualLocalCharge != null)
      return s + (parseFloat(l.manualLocalCharge) || 0);
    var sr = parseSR(l.sr || '');
    var am = cityMiles(sr.s);
    var um = (l.manualPickupMi !== '' && l.manualPickupMi != null) ? parseFloat(l.manualPickupMi) : am;
    var c = (um != null) ? localCharge(um) : null;
    return s + (c || 0);
  }, 0);
}

function getMiles(g) {
  if (g.tripMiles !== '' && g.tripMiles != null) {
    var m = parseFloat(g.tripMiles);
    if (!isNaN(m)) return Math.round(m);
  }
  var cg = calcGroupMiles(g);
  return cg != null ? Math.round(cg) : null;
}

// Trailer miles from the stop list: yard -> first receiver, then receiver to
// receiver. Previously the mobile board read g.calcTripMi / g.autoTripMi, which
// are computed fields that only exist on the desktop board's calcGroup output
// and are never stored on the sheet — so mobile showed no miles at all for any
// trailer whose mileage had not been typed by hand.
function calcGroupMiles(g) {
  var loads = sortByDelivery(g.loads || []);
  if (!loads.length) return null;
  var total = 0, complete = true, farthest = 0;
  loads.forEach(function(l, i) {
    var r = parseSR(l.sr || '').r;
    var rm = cityMiles(r);
    if (rm != null && rm > farthest) farthest = rm;
    if (l.stopMiles !== '' && l.stopMiles != null) {
      var manual = parseFloat(l.stopMiles);
      if (!isNaN(manual)) { total += manual; return; }
    }
    if (i === 0) {
      if (rm == null) { complete = false; return; }
      total += rm;
      return;
    }
    var prev = parseSR(loads[i-1].sr || '').r;
    var ic = interCityMi(prev, r);
    if (ic == null) { complete = false; return; }
    total += ic;
  });
  // A partial sum understates the trip, and an understated denominator makes the
  // rate per mile look better than it is. Fall back to the farthest receiver.
  if (!complete) return farthest > 0 ? Math.max(farthest, total) : (total > 0 ? total : null);
  return total > 0 ? total : (farthest || null);
}
function milesAreEstimated(g) {
  if (g.tripMiles !== '' && g.tripMiles != null && !isNaN(parseFloat(g.tripMiles))) return false;
  var loads = sortByDelivery(g.loads || []);
  for (var i = 0; i < loads.length; i++) {
    var r = parseSR(loads[i].sr || '').r;
    if (loads[i].stopMiles !== '' && loads[i].stopMiles != null && !isNaN(parseFloat(loads[i].stopMiles))) continue;
    if (i === 0) { if (cityMiles(r) == null) return true; continue; }
    if (interCityMi(parseSR(loads[i-1].sr || '').r, r) == null) return true;
  }
  return false;
}

// Sort by delivery date/time. This used to be `new Date(str.split(' ')[0])`,
// which parses "9/4/2026" in the browser's own way and silently returns NaN for
// the "M/D HH:MM" form the rate-con importer writes — so those loads sorted to
// wherever the comparator happened to leave them. parseTS is the same parser the
// desktop board sorts with, so both boards now number the stops identically.
function sortByDelivery(loads) {
  return loads.slice().sort(function(a, b) {
    var ta = parseTS(a.delivery || ''), tb = parseTS(b.delivery || '');
    if (ta !== tb) return ta < tb ? -1 : 1;
    return String(a.id).localeCompare(String(b.id), undefined, {numeric:true});
  });
}

// Broker fields are stored as "Broker Name & 12345".
function splitBroker(l) {
  var brokerName = '', loadNum = '';
  if (l.broker) {
    var parts = String(l.broker).split('&');
    brokerName = (parts[0] || '').trim();
    loadNum = (parts[1] || '').trim();
  }
  if (!loadNum && l.loadNum) loadNum = String(l.loadNum).trim();
  return {brokerName: brokerName, loadNum: loadNum};
}

//     COMBINED CARD
function renderCombinedCard(g) {
  var loads = g.loads || [];
  var sorted = sortByDelivery(loads);
  var gross = loads.reduce(function(s,l){ return s+(parseFloat(l.rate)||0); },0);
  var locCost = calcLocCost(loads);
  var net = Math.round(gross - locCost);
  var hasDriver = !!(g.groupDriver && String(g.groupDriver).trim());
  var mi = getMiles(g);
  var est = mi != null && milesAreEstimated(g);
  var inputId = 'claim-inp-' + g.id;

  var h = '<div class="ccard">';

  // Header
  h += '<div class="ccard-header' + (hasDriver ? '' : ' no-driver') + '">';
  if (hasDriver) {
    if (g.groupTruck) h += '<span class="ccard-truck">#' + esc(g.groupTruck) + '</span>';
    if (g.groupTrailer) h += '<span class="ccard-trailer">T' + esc(g.groupTrailer) + '</span>';
    h += '<span class="ccard-driver">' + esc(g.groupDriver) + '</span>';
  } else {
    h += '<span style="font-size:14px">⚠️</span><span class="ccard-nodrv">NO DRIVER ASSIGNED</span>';
  }
  if (mi) h += '<span class="ccard-miles' + (est ? ' est' : '') + '"' + (est ? ' title="Estimated — some legs have no mileage on file"' : '') + '>' + (est ? '~' : '') + mi.toLocaleString() + ' mi</span>';
  // Live location pill for the Combined card's OTR truck
  if (g.groupTruck) h += livePillFor(g.groupTruck, '', false);
  h += '</div>';

  // Financial bar
  h += '<div class="fin-bar">';
  h += '<div class="fin-item"><span class="fin-label">Gross</span><span class="fin-val fin-gross">$' + Math.round(gross).toLocaleString() + '</span></div>';
  h += '<span class="fin-sep">−</span>';
  h += '<div class="fin-item"><span class="fin-label">Local</span><span class="fin-val fin-local">$' + Math.round(locCost).toLocaleString() + '</span></div>';
  h += '<span class="fin-sep">=</span>';
  h += '<div class="fin-net-wrap"><span style="font-size:9px;color:#15803d;font-weight:700">Net</span><span class="fin-net">$' + net.toLocaleString() + '</span></div>';
  h += '</div>';

  // Claim bar
  if (!hasDriver) {
    h += '<div class="claim-bar">';
    h += '<span style="font-size:16px">🙋</span>';
    h += '<span class="claim-label">Available — enter name to claim:</span>';
    h += '<input class="claim-input" id="' + escAttr(inputId) + '" data-claim-for="' + escAttr(g.id) + '" type="text" placeholder="Your name..." maxlength="60">';
    h += '<button class="claim-btn" data-gid="' + escAttr(g.id) + '" data-inp="' + escAttr(inputId) + '" onclick="claimLoad(this)">✋ Claim</button>';
    h += '<div class="claim-err" id="claim-err-' + escAttr(g.id) + '"></div>';
    h += '</div>';
  }

  // Stops
  h += '<div class="stops">';
  sorted.forEach(function(l, li) {
    var sr = parseSR(l.sr || '');
    var dest = sr.r || sr.s || '—';
    var stCls = statusClass(l.status || '');
    h += '<div class="stop-row">';
    h += '<div class="stop-num">' + (li+1) + '</div>';
    h += '<div class="stop-info"><div class="stop-city">' + esc(dest) + '</div>';
    h += '<div class="stop-dates">';
    if (l.pickup) h += '<span class="stop-date">📤 ' + esc(l.pickup) + '</span>';
    if (l.delivery) h += '<span class="stop-date">📥 ' + esc(l.delivery) + '</span>';
    h += '</div></div>';
    // Per-load local truck pill (e.g. local driver for the pickup leg)
    if (l.localTruck) h += livePillFor(l.localTruck, l.status||'', false);
    if (l.status) h += '<span class="stop-status ' + stCls + '">' + esc(l.status) + '</span>';
    h += '</div>';
  });
  h += '</div></div>';
  return h;
}

//     CLAIM LOAD
// Sends only the claim, waits for the request, and reports honestly when it did
// not go out. The old version wrote localStorage, fired a whole-board upload it
// never awaited, and called .then() on a function that returned undefined — so
// the success path threw and the board never re-rendered.
function claimLoad(btn) {
  var groupId = btn.getAttribute('data-gid');
  var inputId = btn.getAttribute('data-inp');
  var errBox = document.getElementById('claim-err-' + groupId);
  var inp = document.getElementById(inputId);
  var name = (inp ? inp.value : '').trim();
  if (errBox) errBox.textContent = '';
  if (!name) { if (inp) inp.focus(); return; }

  var wkIdx = -1, grp = null;
  for (var i = 0; i < weeks.length; i++) {
    var found = (weeks[i].groups || []).filter(function(g) { return String(g.id) === String(groupId); })[0];
    if (found) { wkIdx = i; grp = found; break; }
  }
  if (wkIdx < 0) return;

  btn.disabled = true;
  btn.textContent = 'Claiming…';
  var now = Date.now();

  postAction({
    action: 'claimLoad',
    claimerName: name,
    weekId: weeks[wkIdx].id,
    groupId: grp.id,
    truckNum: grp.groupTruck || '',
    trailerNum: grp.groupTrailer || '',
    securedAt: now,
    savedAt: now
  }).then(function() {
    // Optimistic local update so the card updates immediately; the next refresh
    // replaces it with whatever the sheet actually recorded.
    weeks[wkIdx].groups = weeks[wkIdx].groups.map(function(g) {
      if (String(g.id) !== String(groupId)) return g;
      return Object.assign({}, g, {groupDriver: name, securedBy: name, securedAt: now});
    });
    delete claimDrafts[groupId];
    renderAll();
  }).catch(function(e) {
    btn.disabled = false;
    btn.textContent = '✋ Claim';
    if (errBox) errBox.textContent = 'Could not send — check your signal and try again.';
    console.warn('Claim did not reach Sheets', e);
  });
}

//     DASHBOARD
function renderDashboard() {
  var w = getWeek();
  var groups = w.groups || [];
  var loads = groups.reduce(function(a, g) { return a.concat(g.loads || []); }, []);
  var combined = groups.filter(function(g) { return g.isCombined; });
  var gross = loads.reduce(function(s,l){ return s+(parseFloat(l.rate)||0); },0);
  var locTotal = calcLocCost(loads);
  var net = Math.round(gross - locTotal);
  var mi = groups.reduce(function(s,g){ return s+(getMiles(g)||0); },0);
  var todayMs = new Date().setHours(0,0,0,0);
  var tomMs = todayMs + 86400000;
  var DONE = ['Picked Up','In Transit','Loaded','Delivered','At Crossdock'];
  var cToday = loads.filter(function(l) {
    var pd = parsePickupDate(l.pickup); return pd && pd.getTime()===todayMs && DONE.indexOf(l.status||'')<0;
  }).length;
  var cTom = loads.filter(function(l) {
    var pd = parsePickupDate(l.pickup); return pd && pd.getTime()===tomMs && DONE.indexOf(l.status||'')<0;
  }).length;

  var h = '';

  // Stats. Every one of these icons was an empty string in the previous build,
  // so the dashboard rendered a column of blank squares above the numbers.
  h += '<div class="stats-grid">';
  h += statCard('💰','$'+net.toLocaleString(),'Net Revenue','$'+Math.round(gross).toLocaleString()+' gross');
  h += statCard('📦',loads.length,'Total Loads',groups.length+' trailers');
  if (cToday>0) h += statCard('📅',cToday,'Picks Today','');
  if (cTom>0) h += statCard('🗓',cTom,'Picks Tomorrow','');
  if (mi>0) h += statCard('🛣',mi.toLocaleString()+' mi','Miles','');
  h += '</div>';

  // Combined loads
  h += '<div class="section-title">🔄 Combined Loads <span class="section-count">'+combined.length+'</span></div>';
  if (!combined.length) {
    h += '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No combined loads this week</div></div>';
  } else {
    var STATUS_ORDER = ['Preplanned','Not dispatched','Loaded','Future','Ready'];
    var byStatus = {};
    STATUS_ORDER.forEach(function(s){ byStatus[s]=[]; });
    combined.forEach(function(g){
      var st = g.combinedStatus||'Preplanned';
      if(!byStatus[st]) byStatus[st]=[];
      byStatus[st].push(g);
    });
    // Iterate over the known order first, then anything unexpected the sheet
    // contained — the old loop walked STATUS_ORDER only, so a trailer with a
    // status outside that list was silently dropped from the dashboard.
    var order = STATUS_ORDER.concat(Object.keys(byStatus).filter(function(k){ return STATUS_ORDER.indexOf(k)<0; }));
    order.forEach(function(st){
      if(!byStatus[st]||!byStatus[st].length) return;
      var sc = getStopCss(st);
      h += '<div class="status-group">';
      h += '<div class="status-badge" style="background:'+sc.bg+';color:'+sc.c+';border:1.5px solid '+sc.bd+'">';
      h += '<div class="status-dot" style="background:'+sc.bd+'"></div>'+esc(st);
      h += ' <span style="opacity:.6">'+byStatus[st].length+'</span></div>';
      byStatus[st].forEach(function(g){ h += renderCombinedCard(g); });
      h += '</div>';
    });
  }

  document.getElementById('dash-content').innerHTML = h;
}

function statCard(icon, val, label, sub) {
  return '<div class="stat-card"><div class="stat-icon">'+icon+'</div>'+
    '<div class="stat-val">'+esc(val)+'</div>'+
    '<div class="stat-label">'+esc(label)+'</div>'+
    (sub?'<div class="stat-sub">'+esc(sub)+'</div>':'')+
    '</div>';
}

//     PLANNED (admin)
function renderPlanned() {
  var w = getWeek();
  var groups = (w.groups||[]).filter(function(g){ return !g.isCombined && g.groupStatus!=='In Transit' && g.groupStatus!=='Delivered'; });
  var h = '<div class="section-title">📋 Planned Shipments <span class="section-count">'+groups.length+'</span></div>';
  if (!groups.length) {
    h += '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No planned loads this week</div></div>';
  } else {
    groups.forEach(function(g, gi){
      var loads = sortByDelivery(g.loads||[]);
      var stops = loads.length;
      var totalGross = loads.reduce(function(s,l){ return s+(parseFloat(l.rate)||0); }, 0);
      h += '<div class="ptrailer">';
      // Trailer banner — T# + stop count + truck/trailer (no driver name per spec) + total gross
      h += '<div class="ptrailer-hdr">';
      h += '<span class="ptrailer-tnum">T'+(gi+1)+'</span>';
      if (stops > 1) h += '<span class="ptrailer-stops">'+stops+' stops</span>';
      if (g.groupTruck) h += '<span class="ptrailer-truck">#'+esc(g.groupTruck)+'</span>';
      if (g.groupTrailer) h += '<span class="ptrailer-trailer">T'+esc(g.groupTrailer)+'</span>';
      // OTR truck live pill (group-level) — kept since this is the trailer's truck
      if (g.groupTruck) h += livePillFor(g.groupTruck, '', false);
      if (totalGross > 0) h += '<span class="ptrailer-gross">$'+Math.round(totalGross).toLocaleString()+'</span>';
      h += '</div>';
      // Per-load rows
      loads.forEach(function(l, li){
        var sr = parseSR(l.sr||'');
        var stCls = statusClass(l.status||'');
        var b = splitBroker(l);
        h += '<div class="pstop">';
        // Banner row: # | route | broker | load# (copy) | status
        h += '<div class="pstop-banner">';
        h += '<div class="pstop-num">'+(li+1)+'</div>';
        h += '<div class="pstop-route">'+esc(sr.s||'')+(sr.r?' → '+esc(sr.r):'')+'</div>';
        if (b.brokerName) h += '<span class="pstop-broker">'+esc(b.brokerName)+'</span>';
        if (b.loadNum) {
          h += '<span class="pstop-loadnum" onclick="copyLoadNum(this, \''+escJs(b.loadNum)+'\')" title="Tap to copy">#'+esc(b.loadNum)+'</span>';
        }
        if (l.status) h += '<span class="pstop-status '+stCls+'">'+esc(l.status)+'</span>';
        h += '</div>';
        // Details grid: pickup, delivery, weight, truck, trailer, rate.
        // NO driver name (per spec), NO local charge (per spec).
        h += '<div class="pstop-details">';
        if (l.pickup) h += fld('📤 Pickup', l.pickup);
        if (l.delivery) h += fld('📥 Delivery', l.delivery);
        if (l.weight) h += fld('⚖️ Weight', l.weight+' lbs');
        if (l.localTruck) h += fld('🚚 Truck', '#'+l.localTruck);
        if (l.localTrailer) h += fld('🚛 Trailer', l.localTrailer);
        var rate = parseFloat(l.rate)||0;
        if (rate > 0) h += fld('💵 Rate', '$'+rate.toLocaleString());
        h += '</div>';
        h += '</div>';
      });
      h += '</div>';
    });
  }
  document.getElementById('planned-content').innerHTML = h;
}

function fld(label, val) {
  return '<div class="prow-field"><div class="prow-field-label">'+esc(label)+'</div><div class="prow-field-val">'+esc(val)+'</div></div>';
}

// Tap-to-copy helper for load numbers. Visual flash on success via the
// data-copied attribute on the element (CSS handles the green flash).
function copyLoadNum(el, num) {
  if (!num) return;
  var orig = el.textContent;
  var flash = function(ok){
    el.setAttribute('data-copied', ok ? '1' : '0');
    el.textContent = (ok ? '✓ ' : '⚠ ') + num;
    setTimeout(function(){ el.removeAttribute('data-copied'); el.textContent = orig; }, 1100);
  };
  // navigator.clipboard is a promise and can reject (no permission, not a secure
  // context). The old version assumed it succeeded and flashed the tick either
  // way, so a driver could believe a load number was copied when it was not.
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(num).then(function(){ flash(true); }).catch(function(){ flash(legacyCopy(num)); });
      return;
    }
    flash(legacyCopy(num));
  } catch(e) { flash(false); }
}
function legacyCopy(num) {
  try {
    var ta = document.createElement('textarea');
    ta.value = num;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e) { return false; }
}

//     COMBINED (admin)
function renderCombined() {
  var w = getWeek();
  var combined = (w.groups||[]).filter(function(g){ return g.isCombined; });
  var h = '<div class="section-title">🔄 Combined Loads <span class="section-count">'+combined.length+'</span></div>';
  if (!combined.length) {
    h += '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No combined loads this week</div></div>';
  } else {
    combined.forEach(function(g){ h += renderCombinedCard(g); });
  }
  document.getElementById('combined-content').innerHTML = h;
}

//     OTR (admin)
function renderOTR() {
  var w = getWeek();
  var otr = (w.groups||[]).filter(function(g){ return g.groupStatus==='In Transit'||g.groupStatus==='Delivered'; });
  var h = '<div class="section-title">🚛 OTR <span class="section-count">'+otr.length+'</span></div>';
  if (!otr.length) {
    h += '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No OTR loads this week</div></div>';
  } else {
    var sColors = {
      'In Transit':{bg:'rgba(91,33,182,.15)',c:'#a78bfa',bd:'#7c3aed'},
      'Delivered':{bg:'rgba(22,101,52,.2)',c:'#86efac',bd:'#16a34a'}
    };
    otr.forEach(function(g){
      var loads = sortByDelivery(g.loads||[]);
      var sc = sColors[g.groupStatus]||sColors['In Transit'];
      var mi = getMiles(g);
      h += '<div class="otr-card">';
      h += '<div class="otr-card-hdr">';
      if (g.groupTruck) h += '<span class="otr-truck">#'+esc(g.groupTruck)+'</span>';
      h += '<span class="otr-driver">'+esc(g.groupDriver||'No driver')+'</span>';
      // Live location pill for the OTR truck — always show when GPS data exists.
      if (g.groupTruck) h += livePillFor(g.groupTruck, '', true);
      if (mi) h += '<span style="font-size:10px;color:rgba(255,255,255,.4);margin-right:4px">'+mi.toLocaleString()+' mi</span>';
      h += '<span class="otr-status-badge" style="background:'+sc.bg+';color:'+sc.c+';border:1px solid '+sc.bd+'">'+esc(g.groupStatus)+'</span>';
      h += '</div>';
      loads.forEach(function(l,li){
        var sr = parseSR(l.sr||'');
        var stCls = statusClass(l.status||'');
        var b = splitBroker(l);
        h += '<div class="otr-stop-row">';
        h += '<div style="width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:rgba(255,255,255,.5);flex-shrink:0">'+(li+1)+'</div>';
        h += '<div style="flex:1;min-width:0"><div class="otr-stop-city">'+esc(sr.r||sr.s||'—')+'</div>';
        if (l.delivery) h += '<div class="otr-stop-del">📥 '+esc(l.delivery)+'</div>';
        h += '</div>';
        // No per-stop local-truck pill — only the OTR truck pill at the top of the card.
        if (l.status) h += '<span class="stop-status '+stCls+'">'+esc(l.status)+'</span>';
        // Broker + tap-to-copy load# on a second line under the stop
        if (b.brokerName || b.loadNum) {
          h += '<div class="otr-stop-meta">';
          if (b.brokerName) h += '<span class="otr-broker">'+esc(b.brokerName)+'</span>';
          if (b.loadNum) {
            h += '<span class="otr-loadnum" onclick="copyLoadNum(this, \''+escJs(b.loadNum)+'\')" title="Tap to copy">#'+esc(b.loadNum)+'</span>';
          }
          h += '</div>';
        }
        h += '</div>';
      });
      h += '</div>';
    });
  }
  document.getElementById('otr-content').innerHTML = h;
}

//     DATA LOADING
function setSync(state) {
  var dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot'+(state==='loading'?' loading':state==='err'?' err':'');
}

// Say plainly when the board on screen is not the board in the sheet. The only
// previous signal was an 8-pixel dot.
function updateConnBanner() {
  var b = document.getElementById('conn-banner');
  var t = document.getElementById('conn-text');
  if (!b || !t) return;
  var ageMin = lastSyncAt ? Math.floor((Date.now() - lastSyncAt) / 60000) : null;
  if (navigator.onLine === false) {
    b.className = 'conn-banner show conn-offline';
    t.textContent = '📴 Offline — showing the last board loaded' + (ageMin != null ? ' (' + ageMin + ' min ago)' : '');
  } else if (!lastSyncOk && lastSyncAt) {
    b.className = 'conn-banner show conn-stale';
    t.textContent = '⚠ Could not reach the sheet — this board is ' + (ageMin || 0) + ' min old';
  } else if (!lastSyncOk && !lastSyncAt) {
    b.className = 'conn-banner show conn-stale';
    t.textContent = '⚠ Could not reach the sheet';
  } else {
    b.className = 'conn-banner';
  }
}
window.addEventListener('online', function(){ updateConnBanner(); refreshData(); });
window.addEventListener('offline', updateConnBanner);

var refreshInFlight = false;
function refreshData() {
  // Overlapping refreshes used to race: a slow response could land after a fast
  // one and put an older board back on screen.
  if (refreshInFlight) return;
  refreshInFlight = true;
  setSync('loading');
  document.getElementById('hdr-sub').textContent = 'Syncing...';

  // Samsara runs in parallel — non-blocking, failures are silent (the pills just
  // don't show) and don't affect the main sheet load.
  fetch(sheetsUrl() + '?action=samsaraLocations', {redirect:'follow'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j && j.ok && Array.isArray(j.trucks)) {
        var map = {};
        // Index by bare truck number (not full name like "020 - FOR SALE") to
        // match how the board references trucks. Mirrors desktop board.html.
        j.trucks.forEach(function(t){
          if (t.number) map[t.number] = {
            address: t.address || '', lat: t.lat, lng: t.lng,
            asOf: t.asOf || Date.now(), name: t.name
          };
        });
        liveTrucks = map;
        renderAll();
      }
    })
    .catch(function(){ /* silent — pills just won't show this cycle */ });

  // Ask for the role we actually hold. The viewer payload omits rate and broker
  // detail; requesting "viewer" while signed in as admin was why the admin tabs
  // could come back with fields missing.
  sheetsLoad(isAdmin ? 'admin' : 'viewer', sessionToken()).then(function(data){
    var raw = Array.isArray(data) ? data : (data.weeks||[]);
    weeks = raw.map(function(w){
      return Object.assign({},w,{groups:(w.groups||[]).map(function(g){
        return Object.assign({},g,{loads:(g.loads||[]).map(function(l){
          var c=Object.assign({},l); delete c.tripPrice; return c;
        })});
      })});
    });
    var payload = (typeof data === 'object' && !Array.isArray(data)) ? Object.assign({},data,{weeks:weeks}) : {weeks:weeks};
    // The board is cached so the app opens instantly and still works with no
    // signal — but the PINs are stripped out first. They used to be written
    // straight to localStorage on every device that loaded the board.
    try {
      var cache = Object.assign({}, payload);
      delete cache.adminPin; delete cache.viewerPin; delete cache.dispatchers;
      localStorage.setItem('fcbv2_localdata', JSON.stringify(cache));
    } catch(e) { /* quota — the board still works, it just won't be cached */ }
    if (data && data.adminPin) rememberAdminPin(data.adminPin);

    if (activeWeekIdx >= weeks.length) activeWeekIdx = 0;
    lastSyncAt = Date.now(); lastSyncOk = true;
    setSync('ok');
    document.getElementById('hdr-sub').textContent = weeks[activeWeekIdx] ? (weeks[activeWeekIdx].label||'Week 1') : 'No data';
    updateConnBanner();
    renderAll();
  }).catch(function(err){
    lastSyncOk = false;
    setSync('err');
    document.getElementById('hdr-sub').textContent = 'Could not connect to Sheets';
    console.warn('Sheet load failed', err);
    if (!weeks.length) {
      var local = localStorage.getItem('fcbv2_localdata');
      if (local) {
        try { var d=JSON.parse(local); weeks=Array.isArray(d)?d:(d.weeks||[]); }
        catch(e){ console.warn('Cached board is unreadable', e); }
      }
    }
    updateConnBanner();
    renderAll();
  }).then(function(){ refreshInFlight = false; }, function(){ refreshInFlight = false; });
}

//     SEARCH
var searchQuery = '';
var searchTimer = null;

// Debounced: the old handler re-scanned every load in every week and rebuilt the
// results list on each keystroke, which is visibly slow on a phone.
function onSearch(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){ applySearch(val); }, 180);
}

function applySearch(val) {
  searchQuery = (val || '').trim().toLowerCase();
  var clearBtn = document.getElementById('search-clear-btn');
  var resultsDiv = document.getElementById('search-results');
  var weekWrap = document.getElementById('week-selector-wrap');
  if (!searchQuery) { clearSearch(); return; }
  clearBtn.style.display = 'block';
  resultsDiv.style.display = 'block';
  weekWrap.style.display = 'none';
  document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
  renderSearchResults(searchQuery);
}

function clearSearch() {
  clearTimeout(searchTimer);
  searchQuery = '';
  var inp = document.getElementById('search-input');
  document.getElementById('search-clear-btn').style.display = 'none';
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('week-selector-wrap').style.display = 'block';
  if (inp) inp.value = '';
  showSection(isAdmin ? (activeAdminTab || 'dashboard') : 'dashboard');
}

function renderSearchResults(q) {
  var resultsDiv = document.getElementById('search-results');
  var matches = [];
  weeks.forEach(function(w) {
    (w.groups || []).forEach(function(g) {
      var gHay = ((g.groupDriver||'') + ' ' + (g.groupTruck||'') + ' ' + (g.groupTrailer||'')).toLowerCase();
      (g.loads || []).forEach(function(l) {
        var hay = (l.sr||'') + ' ' + (l.broker||'') + ' ' + (l.loadNum||'') + ' ' + (l.status||'') + ' ' + (l.pickup||'') + ' ' + (l.delivery||'') + ' ' + gHay;
        if (hay.toLowerCase().indexOf(q) >= 0) {
          var sr = parseSR(l.sr || '');
          matches.push({ week:w.label||'', truck:g.groupTruck||'', trailer:g.groupTrailer||'', driver:g.groupDriver||'', shipper:sr.s||'', receiver:sr.r||sr.s||'', pickup:l.pickup||'', delivery:l.delivery||'', status:l.status||'', rate:l.rate||'', broker:l.broker||'', isCombined:!!g.isCombined });
        }
      });
    });
    (w.localDeliveries || []).forEach(function(r) {
      var hay = ((r.destination||'') + ' ' + (r.driver||'') + ' ' + (r.broker||'') + ' ' + (r.truck||'')).toLowerCase();
      if (hay.indexOf(q) >= 0) {
        matches.push({ week:w.label||'', truck:r.truck||'', trailer:r.trailer||'', driver:r.driver||'', shipper:'Local pickup', receiver:r.destination||'', pickup:r.datetime||'', delivery:'', status:r.status||'', rate:r.amount||'', broker:r.broker||'', isLocal:true });
      }
    });
  });
  if (!matches.length) {
    resultsDiv.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">No results for "' + esc(q) + '"</div></div>';
    return;
  }
  var html = '<div style="font-size:11px;color:#64748b;font-weight:600;margin-bottom:8px;">' + matches.length + ' result' + (matches.length !== 1 ? 's' : '') + '</div>';
  matches.forEach(function(m) {
    var stCls = statusClass(m.status);
    var typeTag = m.isLocal
      ? '<span style="font-size:9px;background:#d1fae5;color:#065f46;padding:1px 5px;border-radius:3px;font-weight:700">LOCAL</span>'
      : m.isCombined
        ? '<span style="font-size:9px;background:#ede9fe;color:#5b21b6;padding:1px 5px;border-radius:3px;font-weight:700">COMBINED</span>'
        : '<span style="font-size:9px;background:#dbeafe;color:#1e40af;padding:1px 5px;border-radius:3px;font-weight:700">PLANNED</span>';
    html += '<div class="search-result-card">';
    html += '<div class="search-result-hdr">';
    if (m.truck) html += '<span style="font-size:10px;font-weight:800;color:#fff;background:rgba(255,255,255,.12);padding:2px 6px;border-radius:4px">#' + esc(m.truck) + '</span>';
    if (m.trailer) html += '<span style="font-size:10px;font-weight:800;color:#c4b5fd;background:rgba(167,139,250,.15);padding:2px 6px;border-radius:4px">T' + esc(m.trailer) + '</span>';
    html += '<span style="font-size:11px;font-weight:700;color:#86efac;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.driver || 'No driver') + '</span>';
    html += typeTag + '</div>';
    html += '<div style="padding:8px 12px">';
    html += '<div style="font-size:11px;color:#64748b;margin-bottom:1px">' + esc(m.shipper) + '</div>';
    html += '<div style="font-size:13px;font-weight:700;color:#0f1f3d;margin-bottom:6px">&#8594; ' + esc(m.receiver) + '</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">';
    if (m.pickup) html += '<span style="font-size:10px;color:#0369a1;background:#e0f2fe;padding:1px 6px;border-radius:3px">' + esc(m.pickup) + '</span>';
    if (m.delivery) html += '<span style="font-size:10px;color:#64748b;background:#f1f5f9;padding:1px 6px;border-radius:3px">' + esc(m.delivery) + '</span>';
    if (m.rate) html += '<span style="font-size:10px;font-weight:700;color:#059669">$' + (parseFloat(m.rate)||0).toLocaleString() + '</span>';
    if (m.status) html += '<span class="stop-status ' + stCls + '">' + esc(m.status) + '</span>';
    if (m.week) html += '<span style="font-size:9px;color:#94a3b8;margin-left:auto">' + esc(m.week) + '</span>';
    html += '</div>';
    if (m.broker) html += '<div style="font-size:10px;color:#94a3b8;margin-top:4px">' + esc(m.broker) + '</div>';
    html += '</div></div>';
  });
  resultsDiv.innerHTML = html;
}

//     INIT
(function init(){
  // Render immediately from the cache so the spinner is replaced right away,
  // then fetch fresh.
  var local = localStorage.getItem('fcbv2_localdata');
  if (local) {
    try { var d=JSON.parse(local); weeks=Array.isArray(d)?d:(d.weeks||[]); }
    catch(e){ console.warn('Cached board is unreadable', e); }
  }
  renderAll();
  refreshData();
  // Pause polling while the phone is in the background — a screen nobody is
  // looking at was firing a request every minute all day.
  setInterval(function(){ if (!document.hidden) refreshData(); }, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) refreshData(); });
})();

</script>
