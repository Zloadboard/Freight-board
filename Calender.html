<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Command Center</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E141F; --panel:#161E2D; --panel2:#1C2637; --line:#26324A;
  --ink:#E9EEF7; --mut:#8B96AB; --dim:#5B667C;
  --blue:#4C8DFF; --green:#3ECF8E; --violet:#B78CFF; --orange:#FF9F43;
  --red:#FF5C69; --amber:#FFC24B;
  --disp:'Barlow Condensed',sans-serif; --body:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
  --rad:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
input[type=checkbox]{width:auto;accent-color:var(--green);transform:scale(1.2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px 2px}
.brand small{display:block;font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.12em;color:var(--dim);margin-top:2px}
.brand .u{color:var(--amber)}
.navsec{margin-top:16px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--mut);font-weight:500;font-size:13.5px;text-align:left;width:100%}
.nav svg{width:17px;height:17px;flex:none}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav.on{background:var(--panel2);color:var(--ink);box-shadow:inset 3px 0 0 var(--amber)}
.railfoot{margin-top:auto;font-family:var(--mono);font-size:10px;color:var(--dim);padding:10px;line-height:1.7}
.main{padding:26px 30px 60px;min-width:0}
.vhead{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.vtitle{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.05em;text-transform:uppercase}
.vsub{color:var(--mut);font-size:13px;max-width:640px}
.today{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.06em}

/* ---------- shared ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.grid{display:grid;gap:14px}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.big{font-family:var(--mono);font-weight:600;font-size:26px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 14px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--blue);color:#fff}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
.pill{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pill.ok{color:var(--green);border-color:var(--green)}
.pill.warn{color:var(--amber);border-color:var(--amber)}
.pill.due{color:var(--red);border-color:var(--red)}
.mono{font-family:var(--mono)}
.mut{color:var(--mut)}
.right{text-align:right}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.acct-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;flex:none}

/* ---------- dashboard ---------- */
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi .big.red{color:var(--red)}.kpi .big.amber{color:var(--amber)}.kpi .big.green{color:var(--green)}
.duewrap{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}
@media(max-width:900px){.duewrap{grid-template-columns:1fr}}
.depart{display:flex;flex-direction:column;gap:0}
.depart .row{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px dashed var(--line);font-family:var(--mono);font-size:12.5px}
.depart .row:last-child{border-bottom:none}
.depart .d-when{width:86px;color:var(--amber)}
.depart .d-name{flex:1;font-family:var(--body);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.depart .d-amt{width:80px;text-align:right}
.dbar{display:grid;grid-template-columns:150px 1fr 84px;align-items:center;gap:10px;padding:6px 0;font-size:12.5px}
.dbar .track{background:var(--bg);border-radius:4px;height:14px;overflow:hidden}
.dbar .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--violet))}
.dbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}

/* ---------- calendar ---------- */
.calbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.calbar .mo{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;min-width:190px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto;font-size:12px;color:var(--mut)}
.legend span{display:flex;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;text-align:center;padding:4px 0}
.day{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;transition:border-color .12s, background .12s}
.day.out{opacity:.35}
.day.today{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.day.dropok{border-color:var(--green);background:#18251f}
.day .dn{font-family:var(--mono);font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.day .dn .tot{color:var(--dim)}
.day .addhit{flex:1;min-height:8px}
.chip{border-radius:6px;padding:3px 7px;font-size:11.5px;font-weight:500;color:#fff;display:flex;justify-content:space-between;gap:6px;cursor:grab;user-select:none;line-height:1.35;border-left:3px solid rgba(255,255,255,.55)}
.chip:active{cursor:grabbing}
.chip .a{font-family:var(--mono);font-size:10.5px;opacity:.9;white-space:nowrap}
.chip.dragging{opacity:.4}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- charges ---------- */
.sect{margin-bottom:18px}
.sect-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px 8px 0 0;font-weight:600}
.sect-h .sum{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--mut)}
.sect-b{border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;background:var(--panel)}
.chg{display:grid;grid-template-columns:1fr 92px 108px 92px 120px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.chg:last-child{border-bottom:none}
.chg .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chg .nm small{display:block;color:var(--dim);font-weight:400;font-size:11.5px}
.daybadge{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;display:inline-block}
.toggle{width:34px;height:19px;border-radius:11px;background:var(--line);position:relative;transition:background .15s;flex:none}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on::after{left:17px}
@media(max-width:760px){.chg{grid-template-columns:1fr 80px 90px;row-gap:6px}.chg .hidemob{display:none}}

/* ---------- debt ---------- */
.debt-row td{font-size:13px}
.prog{background:var(--bg);border-radius:4px;height:9px;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--green)}
.rankbdg{font-family:var(--mono);width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.rankbdg.hot{border-color:var(--red);color:var(--red)}

/* ---------- weekly ---------- */
.wk input{max-width:110px;font-family:var(--mono)}
.wk td{font-family:var(--mono);font-size:12.5px}
.wk .done{color:var(--green)}

/* ---------- settings/suggestions ---------- */
.frow{display:grid;grid-template-columns:220px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.frow:last-child{border-bottom:none}
.frow label{color:var(--mut);font-size:13px}
.acct-edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.acct-edit input[type=color]{width:38px;height:34px;padding:2px;border-radius:6px}
.sug{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:10px}
.sug.done{opacity:.5}
.sug.done .t{text-decoration:line-through}
.sug .t{font-weight:500}
.sug .d{color:var(--mut);font-size:12.5px;margin-top:3px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,9,16,.72);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.overlay.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:460px;padding:20px}
.modal h3{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
.mrow{margin-bottom:12px}
.mrow label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.m2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.mini button{font-family:var(--mono);font-size:12px;padding:7px 0;border:1px solid var(--line);border-radius:6px;color:var(--mut)}
.mini button:hover{border-color:var(--blue);color:#fff}
.mini button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.mini .lbl{font-size:9.5px;text-align:center;color:var(--dim);padding:3px 0;font-family:var(--mono)}
.mactions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;padding:7px;font-size:12.5px;color:var(--mut)}
.seg button.on{background:var(--panel2);color:#fff}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--green);color:var(--ink);border-radius:8px;padding:10px 18px;font-size:13px;z-index:99;display:none}

/* ---------- mobile ---------- */
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;gap:6px;padding:10px}
  .brand{display:none}.railfoot{display:none}
  .navsec{margin:0;flex-direction:row}
  .nav{white-space:nowrap;padding:7px 11px}
  .nav.on{box-shadow:inset 0 -3px 0 var(--amber)}
  .main{padding:16px 12px 60px}
  .day{min-height:76px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Money<br>Command <span class="u">Center</span><small>DISPATCH BOARD · VARASKA</small></div>
    <div class="navsec" id="nav"></div>
    <div class="railfoot">Data stays in this browser.<br>Export a backup from Settings.</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ================= DATA ================= */
const DEFAULTS = {
  settings:{ weeklyWage:5750, taxRate:25, familyWeekly:1000, trackerStart:'2026-07-07' },
  accounts:[
    {id:'boa',   name:'Personal BOA',      color:'#4C8DFF'},
    {id:'family',name:'Family Account',    color:'#3ECF8E'},
    {id:'just',  name:'Justina Account',   color:'#B78CFF'},
    {id:'biz',   name:'Business Checking', color:'#FF9F43'}
  ],
  charges:[
    {id:c(),name:'Mortgage',amount:2000,day:1,acct:'boa',cat:'Housing',auto:false,note:''},
    {id:c(),name:'HOA / Association',amount:350,day:1,acct:'boa',cat:'Housing',auto:false,note:'Confirm amount'},
    {id:c(),name:'Best Egg (car refi 27%)',amount:700,day:5,acct:'boa',cat:'Debt',auto:false,note:'Attack target #3'},
    {id:c(),name:"Melano's school",amount:1000,day:5,acct:'just',cat:'Family',auto:false,note:'Confirm vs weekly family $'},
    {id:c(),name:'IRS installment',amount:200,day:7,acct:'boa',cat:'Debt',auto:false,note:'NEVER miss'},
    {id:c(),name:'Car insurance',amount:300,day:10,acct:'boa',cat:'Insurance',auto:false,note:''},
    {id:c(),name:'Carvana (XT6 22%)',amount:1100,day:12,acct:'boa',cat:'Debt',auto:false,note:'Attack #4 — or sell XT6'},
    {id:c(),name:'Indigo / Concora min',amount:40,day:13,acct:'boa',cat:'Debt',auto:false,note:'Kill month 1'},
    {id:c(),name:'Internet — Xfinity',amount:150,day:15,acct:'boa',cat:'Utilities',auto:false,note:''},
    {id:c(),name:'Internet #2',amount:200,day:15,acct:'boa',cat:'Utilities',auto:false,note:'Verify duplicate?'},
    {id:c(),name:'Verizon phone',amount:275,day:15,acct:'boa',cat:'Utilities',auto:false,note:'Shop around'},
    {id:c(),name:'Health insurance',amount:800,day:15,acct:'boa',cat:'Insurance',auto:false,note:''},
    {id:c(),name:'Prescriptions',amount:1500,day:15,acct:'boa',cat:'Health',auto:false,note:'Ask 90-day / generics'},
    {id:c(),name:'Water',amount:100,day:18,acct:'boa',cat:'Utilities',auto:false,note:''},
    {id:c(),name:'Electricity',amount:200,day:20,acct:'boa',cat:'Utilities',auto:false,note:''},
    {id:c(),name:'AFS DMP payment',amount:1637,day:20,acct:'boa',cat:'Debt',auto:false,note:'$59.5K program — never bounce'},
    {id:c(),name:'Yendo min (30%)',amount:250,day:25,acct:'boa',cat:'Debt',auto:false,note:'Attack #1'},
    {id:c(),name:'Chase min',amount:210,day:25,acct:'boa',cat:'Debt',auto:false,note:'Attack #2'},
    {id:c(),name:'Milestone #1 min',amount:40,day:25,acct:'boa',cat:'Debt',auto:false,note:'Kill month 1'},
    {id:c(),name:'Milestone #2 min',amount:35,day:25,acct:'boa',cat:'Debt',auto:false,note:'Kill month 1'},
    {id:c(),name:'BofA Personal min',amount:25,day:25,acct:'boa',cat:'Debt',auto:false,note:'Kill month 1'},
    {id:c(),name:'BofA Business min',amount:55,day:25,acct:'biz',cat:'Debt',auto:false,note:'Kill month 1'},
    {id:c(),name:'Ally (Camry 7.4%)',amount:500,day:27,acct:'boa',cat:'Debt',auto:false,note:'Cheapest — minimum only'}
  ],
  debts:[
    {id:c(),name:'Milestone card #1',bal:400,orig:400,apr:35,min:40,rank:1,note:'Kill month 1 — then close'},
    {id:c(),name:'Milestone card #2',bal:350,orig:350,apr:35,min:35,rank:1,note:'Kill month 1 — then close'},
    {id:c(),name:'Indigo / Concora',bal:419,orig:419,apr:35,min:40,rank:1,note:'Kill month 1 — then close'},
    {id:c(),name:'BofA Personal',bal:150,orig:150,apr:25,min:25,rank:1,note:'Kill month 1 — keep open'},
    {id:c(),name:'BofA Business',bal:1800,orig:1800,apr:25,min:55,rank:1,note:'Kill month 1 — keep open'},
    {id:c(),name:'Yendo card',bal:7000,orig:7000,apr:30,min:250,rank:2,note:'Months 2-3'},
    {id:c(),name:'Chase card',bal:7000,orig:7000,apr:25,min:210,rank:3,note:'Months 3-4 (confirm APR)'},
    {id:c(),name:'Best Egg (car refi)',bal:20830,orig:20830,apr:27,min:700,rank:4,note:'Months 4-8'},
    {id:c(),name:'Carvana (Cadillac XT6)',bal:37100,orig:37100,apr:22,min:1100,rank:5,note:'Months 8-14 — or sell XT6'},
    {id:c(),name:'Ally (Camry)',bal:11600,orig:11600,apr:7.4,min:500,rank:6,note:'Minimum only — cheapest'},
    {id:c(),name:'AFS DMP (17 cards)',bal:59502,orig:59502,apr:0,min:1637,rank:7,note:'Reduced rates — payoff quotes after #1-5 die'}
  ],
  weeks:{},
  suggestions:[
    {id:c(),t:'Put the AFS $1,637 on ACH autopay (due 20th)',d:'4 bounced payments so far. Another bounce risks $59.5K of negotiated rates.',done:false},
    {id:c(),t:'Set the 3 recurring Wednesday transfers',d:'Tax savings, owner pay to Personal BOA, $1,000 to Family. Same amounts, every week — this builds loan-ready income history.',done:false},
    {id:c(),t:'One-time pass: real due dates + autopay for every biller',d:'Open each biller site once, set ACH autopay from Personal BOA, fix the due day on the Calendar here. Then never log in again.',done:false},
    {id:c(),t:'Call AFS 888-282-5494',d:'Get negotiated APR per account + ask about the duplicate Credit One ...1781.',done:false},
    {id:c(),t:'Book a CPA meeting',d:'Quarterly estimated taxes (Sep 15, Jan 15) + S-corp/payroll for W-2 income. Ends the IRS cycle.',done:false},
    {id:c(),t:'Month 1: kill the five small cards ($3,119)',d:'Milestone x2, Indigo, BofA x2. Then close the fee-heavy ones.',done:false},
    {id:c(),t:'Decide on the Cadillac XT6',d:'Get CarMax/Carvana offers. 22% on $37K is enormous — selling may beat keeping.',done:false},
    {id:c(),t:'Pause crypto / gold / stock buys until 20%+ debts are dead',d:'Paying off 30% debt is a guaranteed 30% return. Nothing beats it.',done:false},
    {id:c(),t:'Shop the phone plan + check the two internet bills',d:'$275 phone is high; two internet services may be a duplicate.',done:false}
  ]
};
function c(){ return 'x'+Math.random().toString(36).slice(2,9); }

/* ================= STATE / STORAGE ================= */
const store = (()=>{ try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return localStorage; }catch(e){ return null; } })();
let S;
function load(){
  if(store && store.getItem('mcc')){ try{ S = JSON.parse(store.getItem('mcc')); return; }catch(e){} }
  S = JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){ if(store) store.setItem('mcc', JSON.stringify(S)); }
load();

/* ================= HELPERS ================= */
const $ = s=>document.querySelector(s);
const fmt = n=>'$'+Math.round(n).toLocaleString('en-US');
const esc = s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const acct = id=>S.accounts.find(a=>a.id===id)||{name:'—',color:'#5B667C'};
const monthTotal = ()=>S.charges.reduce((t,x)=>t+(+x.amount||0),0);
function nextDue(day){
  const t=new Date(); t.setHours(0,0,0,0);
  let y=t.getFullYear(), m=t.getMonth();
  if(t.getDate()>day){ m++; if(m>11){m=0;y++;} }
  const last=new Date(y,m+1,0).getDate();
  return new Date(y,m,Math.min(day,last));
}
const daysLeft = day=>Math.round((nextDue(day)-new Date(new Date().setHours(0,0,0,0)))/86400000);
function attackBudget(){
  const w=S.settings.weeklyWage, tax=w*S.settings.taxRate/100, bills=monthTotal()/4.33, fam=S.settings.familyWeekly;
  return Math.round((w-tax-bills-fam)*4.33);
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2200); }

/* ================= NAV / ROUTER ================= */

/* ================= DASHBOARD ================= */
function rDash(){
  const due7=S.charges.filter(x=>daysLeft(x.day)<=7);
  const due7sum=due7.reduce((t,x)=>t+ +x.amount,0);
  const noAuto=S.charges.filter(x=>!x.auto).length;
  const debtTot=S.debts.reduce((t,d)=>t+ +d.bal,0);
  const intMo=S.debts.reduce((t,d)=>t+ d.bal*d.apr/100/12,0);
  const upcoming=[...S.charges].sort((a,b)=>daysLeft(a.day)-daysLeft(b.day)).slice(0,9);
  const maxBal=Math.max(...S.debts.map(d=>d.bal),1);
  const now=new Date();
  $('#main').innerHTML=`
  <div class="vhead">
    <div><div class="vtitle">Dashboard</div><div class="vsub">The whole operation at a glance. Numbers update from Calendar, Charges, Debt Attack and Settings.</div></div>
    <div class="today">${now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).toUpperCase()}</div>
  </div>
  <div class="grid kpis">
    <div class="card kpi"><div class="k">Due next 7 days</div><div class="big ${due7sum>0?'amber':''}">${fmt(due7sum)}</div><div class="mut mono" style="font-size:11px;margin-top:2px">${due7.length} payment${due7.length!==1?'s':''}</div></div>
    <div class="card kpi"><div class="k">Not on autopay</div><div class="big ${noAuto?'red':'green'}">${noAuto}</div><div class="mut mono" style="font-size:11px;margin-top:2px">goal: 0</div></div>
    <div class="card kpi"><div class="k">Monthly bills</div><div class="big">${fmt(monthTotal())}</div></div>
    <div class="card kpi"><div class="k">Total debt</div><div class="big">${fmt(debtTot)}</div></div>
    <div class="card kpi"><div class="k">Interest burned / mo</div><div class="big red">${fmt(intMo)}</div></div>
    <div class="card kpi"><div class="k">Attack budget / mo</div><div class="big green">${fmt(attackBudget())}</div></div>
  </div>
  <div class="duewrap">
    <div class="card"><div class="k" style="margin-bottom:8px">Next departures — upcoming payments</div>
      <div class="depart">${upcoming.map(x=>{
        const dl=daysLeft(x.day), a=acct(x.acct);
        const when = dl===0?'TODAY':dl===1?'TOMORROW':nextDue(x.day).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
        const pill = dl<=3?'due':dl<=7?'warn':'';
        return `<div class="row"><span class="d-when">${when}</span><span class="acct-dot" style="background:${a.color}"></span><span class="d-name">${esc(x.name)}</span><span class="pill ${pill}">${dl}d</span><span class="d-amt">${fmt(x.amount)}</span></div>`;}).join('')}
      </div>
    </div>
    <div class="card"><div class="k" style="margin-bottom:10px">Debt balances</div>
      ${[...S.debts].sort((a,b)=>b.bal-a.bal).map(d=>`
        <div class="dbar"><span class="nm">${esc(d.name)}</span><span class="track"><span class="fill" style="width:${Math.max(2,d.bal/maxBal*100)}%"></span></span><span class="mono right">${fmt(d.bal)}</span></div>`).join('')}
    </div>
  </div>`;
}

/* ================= CALENDAR ================= */
let calY=new Date().getFullYear(), calM=new Date().getMonth();
function rCal(){
  const first=new Date(calY,calM,1), lastD=new Date(calY,calM+1,0).getDate();
  const startDow=first.getDay();
  const prevLast=new Date(calY,calM,0).getDate();
  const today=new Date(); today.setHours(0,0,0,0);
  const cells=[];
  for(let i=startDow-1;i>=0;i--) cells.push({d:prevLast-i,out:true});
  for(let d=1;d<=lastD;d++) cells.push({d,out:false});
  while(cells.length%7) cells.push({d:cells.length- (startDow+lastD) +1,out:true});
  $('#main').innerHTML=`
  <div class="vhead"><div><div class="vtitle">Calendar</div><div class="vsub">Drag any charge to a different day to move its due date. Click a charge to edit it, click an empty day to add one there.</div></div>
  <button class="btn primary" onclick="openCharge()">+ Add charge</button></div>
  <div class="calbar">
    <button class="btn sm" onclick="calNav(-1)">◀</button>
    <span class="mo">${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</span>
    <button class="btn sm" onclick="calNav(1)">▶</button>
    <button class="btn sm" onclick="calY=new Date().getFullYear();calM=new Date().getMonth();render()">Today</button>
    <div class="legend">${S.accounts.map(a=>`<span><span class="acct-dot" style="background:${a.color}"></span>${esc(a.name)}</span>`).join('')}</div>
  </div>
  <div class="cal">
    ${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d=>`<div class="dow">${d}</div>`).join('')}
    ${cells.map(cell=>{
      if(cell.out) return `<div class="day out"><div class="dn">${cell.d}</div></div>`;
      const chs=S.charges.filter(x=>x.day===cell.d || (x.day>lastD && cell.d===lastD));
      const tot=chs.reduce((t,x)=>t+ +x.amount,0);
      const isToday = today.getFullYear()===calY && today.getMonth()===calM && today.getDate()===cell.d;
      return `<div class="day ${isToday?'today':''}" data-day="${cell.d}"
        ondragover="event.preventDefault();this.classList.add('dropok')"
        ondragleave="this.classList.remove('dropok')"
        ondrop="dropChip(event,${cell.d})">
        <div class="dn"><span>${cell.d}</span>${tot?`<span class="tot">${fmt(tot)}</span>`:''}</div>
        ${chs.map(x=>{const a=acct(x.acct);return `<div class="chip" draggable="true" style="background:${a.color}22;border-left-color:${a.color};color:var(--ink)"
          ondragstart="dragChip(event,'${x.id}')" ondragend="this.classList.remove('dragging')"
          onclick="openCharge('${x.id}')" title="${esc(x.name)} — ${esc(a.name)}">
          <span class="nm">${esc(x.name)}</span><span class="a">${fmt(x.amount)}</span></div>`;}).join('')}
        <div class="addhit" onclick="openCharge(null,${cell.d})"></div>
      </div>`;}).join('')}
  </div>`;
}
function calNav(n){ calM+=n; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} render(); }
let dragId=null;
function dragChip(e,id){ dragId=id; e.dataTransfer.setData('text/plain',id); e.target.classList.add('dragging'); }
function dropChip(e,day){
  e.preventDefault(); e.currentTarget.classList.remove('dropok');
  const id=e.dataTransfer.getData('text/plain')||dragId;
  const ch=S.charges.find(x=>x.id===id);
  if(ch && ch.day!==day){ ch.day=day; save(); render(); toast(`${ch.name} moved to day ${day}`); }
}

          <span class="k">Charge</span><span class="k">Amount</span><span class="k">Due</span><span class="k hidemob">Days left</span><span class="k hidemob">Autopay</span>

          <span class="mono">${fmt(x.amount)}</span>

          <span class="hidemob"><span class="pill ${dl<=3?'due':dl<=7?'warn':''}">${dl}d</span></span>
          <span class="hidemob"><span class="toggle ${x.auto?'on':''}" onclick="toggleAuto('${x.id}')" role="switch" aria-checked="${x.auto}" tabindex="0"></span></span>

function toggleAuto(id){ const x=S.charges.find(x=>x.id===id); x.auto=!x.auto; save(); render(); }

/* ================= CHARGE MODAL ================= */
let editId=null;
function openCharge(id=null, presetDay=null){
  editId=id;
  const x = id? S.charges.find(x=>x.id===id) : {name:'',amount:'',day:presetDay||1,acct:S.accounts[0].id,cat:'Utilities',auto:false,note:''};
  $('#modal').innerHTML=`
  <h3>${id?'Edit charge':'New charge'}</h3>
  <div class="mrow"><label>Name</label><input id="f-name" value="${esc(x.name)}" placeholder="e.g. Electricity"></div>
  <div class="m2">
    <div class="mrow"><label>Amount ($/month)</label><input id="f-amt" type="number" min="0" step="1" value="${x.amount}"></div>
    <div class="mrow"><label>Pays from account</label><select id="f-acct">${S.accounts.map(a=>`<option value="${a.id}" ${a.id===x.acct?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
  </div>
  <div class="m2">
    <div class="mrow"><label>Category</label><select id="f-cat">${['Housing','Utilities','Insurance','Health','Debt','Family','Other'].map(cg=>`<option ${cg===x.cat?'selected':''}>${cg}</option>`).join('')}</select></div>
    <div class="mrow"><label>Autopay set up?</label><select id="f-auto"><option value="0" ${!x.auto?'selected':''}>No</option><option value="1" ${x.auto?'selected':''}>Yes</option></select></div>
  </div>
  <div class="mrow"><label>Due day — pick from the calendar</label>
    <div class="mini">
      ${['S','M','T','W','T','F','S'].map(l=>`<span class="lbl">${l}</span>`).join('')}
      ${Array.from({length:31},(_,i)=>i+1).map(d=>`<button class="${d===+x.day?'sel':''}" onclick="pickDay(${d})" type="button">${d}</button>`).join('')}
    </div>
    <input type="hidden" id="f-day" value="${x.day}">
  </div>
  <div class="mrow"><label>Note</label><input id="f-note" value="${esc(x.note)}" placeholder="optional"></div>
  <div class="mactions">
    ${id?`<button class="btn danger" onclick="delCharge()">Delete</button>`:''}
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn primary" onclick="saveCharge()">${id?'Save changes':'Add charge'}</button>
  </div>`;
  $('#overlay').classList.add('open');
}
function pickDay(d){ $('#f-day').value=d; document.querySelectorAll('.mini button').forEach(b=>b.classList.toggle('sel', +b.textContent===d)); }
function saveCharge(){
  const data={ name:$('#f-name').value.trim()||'Untitled', amount:+$('#f-amt').value||0, day:Math.min(31,Math.max(1,+$('#f-day').value||1)),
    acct:$('#f-acct').value, cat:$('#f-cat').value, auto:$('#f-auto').value==='1', note:$('#f-note').value.trim() };
  if(editId){ Object.assign(S.charges.find(x=>x.id===editId), data); toast('Charge updated'); }
  else { S.charges.push({id:c(),...data}); toast('Charge added'); }
  save(); closeModal(); render();
}
function delCharge(){ S.charges=S.charges.filter(x=>x.id!==editId); save(); closeModal(); render(); toast('Charge deleted'); }
function closeModal(){ $('#overlay').classList.remove('open'); editId=null; }
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });

/* ================= DEBT ATTACK ================= */
function rDebt(){
  const sorted=[...S.debts].sort((a,b)=>a.rank-b.rank);
  const tot=S.debts.reduce((t,d)=>t+ +d.bal,0), totMin=S.debts.reduce((t,d)=>t+ +d.min,0), totInt=S.debts.reduce((t,d)=>t+ d.bal*d.apr/100/12,0);
  $('#main').innerHTML=`
  <div class="vhead"><div><div class="vtitle">Debt Attack</div><div class="vsub">Minimums on everything; the whole attack budget (${fmt(attackBudget())}/mo) goes to rank #1. When it dies, move down. Click a balance to update it after each payment.</div></div></div>
  <div class="card" style="overflow-x:auto">
  <table><thead><tr><th>#</th><th>Debt</th><th class="right">Balance</th><th class="right">APR</th><th class="right">Min/mo</th><th class="right">Interest/mo</th><th>Progress</th><th>Plan</th></tr></thead><tbody>
  ${sorted.map(d=>{
    const paid=Math.max(0,d.orig-d.bal), pct=d.orig? Math.min(100,paid/d.orig*100):0;
    return `<tr class="debt-row">
      <td><span class="rankbdg ${d.rank<=2?'hot':''}">${d.rank}</span></td>
      <td><b>${esc(d.name)}</b></td>
      <td class="right"><input type="number" value="${d.bal}" style="max-width:110px;text-align:right;font-family:var(--mono)" onchange="updDebt('${d.id}','bal',this.value)"></td>
      <td class="right mono">${d.apr? d.apr+'%':'—'}</td>
      <td class="right mono">${fmt(d.min)}</td>
      <td class="right mono" style="color:${d.bal*d.apr>0?'var(--red)':'var(--mut)'}">${d.apr?fmt(d.bal*d.apr/100/12):'—'}</td>
      <td><div class="prog" title="${Math.round(pct)}% paid"><i style="width:${pct}%"></i></div></td>
      <td class="mut" style="font-size:12px;max-width:220px">${esc(d.note)}</td></tr>`;}).join('')}
  </tbody><tfoot><tr>
    <td></td><td><b>TOTAL</b></td><td class="right mono"><b>${fmt(tot)}</b></td><td></td>
    <td class="right mono"><b>${fmt(totMin)}</b></td><td class="right mono" style="color:var(--red)"><b>${fmt(totInt)}</b></td><td></td><td></td>
  </tr></tfoot></table></div>
  <p class="mut" style="margin-top:12px;font-size:12.5px">Balances save automatically. When a balance hits $0, celebrate — then point the attack budget at the next rank.</p>`;
}
function updDebt(id,k,v){ const d=S.debts.find(d=>d.id===id); d[k]=+v||0; save(); rDebt(); }

/* ================= WEEKLY TRACKER ================= */
function tuesdays(n=52){
  const out=[]; let d=new Date(S.settings.trackerStart+'T00:00:00');
  for(let i=0;i<n;i++){ out.push(new Date(d)); d=new Date(d); d.setDate(d.getDate()+7); }
  return out;
}
function rWk(){
  const bills=Math.round(monthTotal()/4.33);
  const rows=tuesdays().map(d=>{
    const key=d.toISOString().slice(0,10);
    const w=S.weeks[key]||{};
    const wage=+w.wage||0, tax=Math.round(wage*S.settings.taxRate/100), fam=wage?S.settings.familyWeekly:0, b=wage?bills:0, left=wage? wage-tax-b-fam:0;
    return {key,d,w,wage,tax,b,fam,left};
  });
  const tot=rows.reduce((t,r)=>({wage:t.wage+r.wage,tax:t.tax+r.tax,b:t.b+r.b,fam:t.fam+r.fam,left:t.left+r.left}),{wage:0,tax:0,b:0,fam:0,left:0});
  $('#main').innerHTML=`
  <div class="vhead"><div><div class="vtitle">Weekly Tracker</div><div class="vsub">Every Tuesday: type the wage that landed. Tax (${S.settings.taxRate}%), bills (${fmt(bills)}) and family (${fmt(S.settings.familyWeekly)}) splits calculate themselves. Tick Done when the transfers are made.</div></div></div>
  <div class="card" style="overflow-x:auto">
  <table class="wk"><thead><tr><th>Week (Tue)</th><th class="right">Wage in</th><th class="right">Tax →</th><th class="right">Bills →</th><th class="right">Family →</th><th class="right">Left (attack)</th><th>Done</th><th>Note</th></tr></thead><tbody>
  ${rows.map(r=>`<tr>
    <td>${r.d.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit'})}</td>
    <td class="right"><input type="number" placeholder="—" value="${r.w.wage??''}" onchange="updWk('${r.key}','wage',this.value)"></td>
    <td class="right">${r.wage?fmt(r.tax):''}</td>
    <td class="right">${r.wage?fmt(r.b):''}</td>
    <td class="right">${r.wage?fmt(r.fam):''}</td>
    <td class="right" style="color:var(--green)">${r.wage?fmt(r.left):''}</td>
    <td><input type="checkbox" ${r.w.done?'checked':''} onchange="updWk('${r.key}','done',this.checked)"></td>
    <td><input placeholder="" value="${esc(r.w.note??'')}" onchange="updWk('${r.key}','note',this.value)" style="min-width:120px"></td>
  </tr>`).join('')}
  </tbody><tfoot><tr><td><b>TOTALS</b></td><td class="right"><b>${fmt(tot.wage)}</b></td><td class="right"><b>${fmt(tot.tax)}</b></td><td class="right"><b>${fmt(tot.b)}</b></td><td class="right"><b>${fmt(tot.fam)}</b></td><td class="right" style="color:var(--green)"><b>${fmt(tot.left)}</b></td><td></td><td></td></tr></tfoot></table></div>`;
}
function updWk(key,k,v){ S.weeks[key]=S.weeks[key]||{}; S.weeks[key][k]= k==='done'? v : (k==='wage'? v : v); save(); if(k!=='note') rWk(); }

function updSet(k,v){ S.settings[k]= k==='trackerStart'? v : +v; save(); rSet(); }
function updAcct(id,k,v){ acct(id)[k]=v; save(); render(); }
function addAcct(){ S.accounts.push({id:c(),name:'New account',color:'#8B96AB'}); save(); rSet(); }
function delAcct(id){ if(S.accounts.length<=1) return toast('Keep at least one account');
  S.accounts=S.accounts.filter(a=>a.id!==id);
  S.charges.forEach(x=>{ if(x.acct===id) x.acct=S.accounts[0].id; }); save(); rSet(); }
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='money-command-center-backup.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ S=JSON.parse(r.result); save(); render(); toast('Backup loaded'); }catch(e){ toast('That file is not a valid backup'); } };
  r.readAsText(f);
}

/* ================= SUGGESTIONS ================= */
function rSug(){
  const done=S.suggestions.filter(s=>s.done).length;
  $('#main').innerHTML=`
  <div class="vhead"><div><div class="vtitle">Suggestions</div><div class="vsub">The action plan, in order. ${done}/${S.suggestions.length} done.</div></div></div>
  ${S.suggestions.map(s=>`
    <div class="sug ${s.done?'done':''}">
      <input type="checkbox" ${s.done?'checked':''} onchange="S.suggestions.find(x=>x.id==='${s.id}').done=this.checked;save();rSug()" style="margin-top:3px">
      <div><div class="t">${esc(s.t)}</div><div class="d">${esc(s.d)}</div></div>
    </div>`).join('')}`;
}

/* ================= INIT ================= */
render();
</script>
