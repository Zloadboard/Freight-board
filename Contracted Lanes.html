<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e293b">
<title>Contracted Lanes</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="./Contracted Lanes_files/css2" rel="stylesheet">
<script src="./Contracted Lanes_files/pdf.min.js.download"></script>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fafaf9;
    color: #0f172a;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  input:focus, textarea:focus, select:focus { outline: 2px solid #1e293b; outline-offset: -1px; }

  /* ---- App scaffold ---- */
  .clb-app { max-width: 1400px; margin: 0 auto; padding: 16px; }

  /* ---- Header ---- */
  .clb-header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 18px; margin-bottom: 14px;
    background: #0f172a; color: #fff;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(15,23,42,.18);
  }
  .clb-title {
    font-family: "Manrope", -apple-system, sans-serif;
    font-size: 19px; font-weight: 800; letter-spacing: -.02em;
    margin-right: auto;
  }
  .clb-title small {
    display: block; font-size: 10px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase;
    opacity: .55; margin-top: 2px;
  }
  .clb-search {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
    color: #fff; border-radius: 8px; padding: 7px 12px; width: 220px;
    font-size: 13px;
  }
  .clb-search::placeholder { color: rgba(255,255,255,.4); }
  .clb-btn {
    background: #fff; color: #0f172a; border: 1px solid #fff;
    border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700;
    transition: transform .08s;
  }
  .clb-btn:hover { transform: translateY(-1px); }
  .clb-btn:active { transform: translateY(0); }
  .clb-btn--ghost {
    background: transparent; color: #fff;
    border: 1px solid rgba(255,255,255,.2);
  }
  .clb-save {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.08); color: rgba(255,255,255,.75);
  }
  .clb-save--saving { background: rgba(251,191,36,.18); color: #fbbf24; }
  .clb-save--saved  { background: rgba(74,222,128,.15); color: #86efac; }
  .clb-save--error  { background: rgba(248,113,113,.18); color: #fca5a5; }

  /* ---- Summary chips ---- */
  .clb-summary {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px; margin-bottom: 14px;
  }
  .clb-chip {
    background: #fff; border: 1px solid #e7e5e4; border-radius: 12px;
    padding: 10px 14px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .clb-chip__val {
    font-family: "Manrope", sans-serif;
    font-size: 22px; font-weight: 800; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .clb-chip__lbl {
    font-size: 10px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: #64748b;
  }
  .clb-chip--accent { border-left: 4px solid var(--accent, #1e293b); }

  /* ---- Buckets ---- */
  .clb-bucket { margin-bottom: 18px; }
  .clb-bucket__head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--bucket-bg, #f1f5f9);
    border-left: 5px solid var(--bucket-color, #64748b);
    border-radius: 8px 8px 0 0;
  }
  .clb-bucket__name {
    font-family: "Manrope", sans-serif;
    font-size: 14px; font-weight: 800; letter-spacing: -.01em;
    color: var(--bucket-color, #64748b);
    text-transform: uppercase;
  }
  .clb-bucket__count {
    background: var(--bucket-color, #64748b); color: #fff;
    border-radius: 999px; padding: 2px 10px;
    font-size: 11px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .clb-bucket__total {
    margin-left: auto;
    font-size: 12px; font-weight: 700; color: #475569;
    font-variant-numeric: tabular-nums;
  }
  .clb-bucket__body {
    display: grid; gap: 10px;
    padding: 12px; background: #fff;
    border: 1px solid #e7e5e4; border-top: none;
    border-radius: 0 0 12px 12px;
  }

  /* ---- Card ---- */
  .clb-card {
    background: #fff; border: 1px solid #e7e5e4; border-radius: 10px;
    overflow: hidden;
    border-left: 4px solid var(--bucket-color, #64748b);
    transition: box-shadow .15s, border-color .15s;
  }
  .clb-card:hover { box-shadow: 0 4px 14px rgba(15,23,42,.08); }
  .clb-card--delivered { opacity: .62; }

  .clb-card__head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    cursor: pointer; user-select: none;
    flex-wrap: wrap;
  }
  .clb-card__head:hover { background: #fafaf9; }
  .clb-card__caret { font-size: 10px; color: #94a3b8; width: 10px; flex-shrink: 0; }
  .clb-card__broker {
    font-family: "Manrope", sans-serif;
    font-size: 13px; font-weight: 700; color: #0f172a;
  }
  .clb-card__loadnum {
    font-size: 11px; font-weight: 700;
    background: #e0e7ff; color: #3730a3;
    padding: 2px 8px; border-radius: 4px;
    font-variant-numeric: tabular-nums;
  }
  .clb-card__lane {
    flex: 1; min-width: 200px;
    font-size: 13px; font-weight: 600; color: #334155;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .clb-card__driver {
    font-size: 11px; font-weight: 600; color: #16a34a;
    background: #dcfce7; padding: 2px 8px; border-radius: 4px;
    white-space: nowrap;
  }
  .clb-card__trailer {
    font-size: 11px; font-weight: 700; color: #5b21b6;
    background: #ede9fe; padding: 2px 8px; border-radius: 4px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .clb-card__rate {
    font-family: "Manrope", sans-serif;
    font-size: 14px; font-weight: 800; color: #059669;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .clb-card__status {
    font-size: 10px; font-weight: 800; text-transform: uppercase;
    padding: 3px 10px; border-radius: 4px;
    letter-spacing: .04em;
    white-space: nowrap;
  }
  .clb-card__body {
    border-top: 1px solid #f1f5f9;
    padding: 12px 14px 14px;
    background: #fafaf9;
  }

  /* ---- Fields ---- */
  .clb-row { display: grid; gap: 8px; margin-bottom: 10px; }
  .clb-row--2 { grid-template-columns: 1fr 1fr; }
  .clb-row--3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 560px) {
    .clb-row--2, .clb-row--3 { grid-template-columns: 1fr; }
  }
  .clb-field { display: flex; flex-direction: column; gap: 3px; }
  .clb-field__lbl {
    font-size: 9px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: #94a3b8;
  }
  .clb-field input, .clb-field textarea, .clb-field select {
    background: #fff; border: 1px solid #e2e8f0;
    border-radius: 6px; padding: 6px 9px;
    font-size: 12px; width: 100%;
    transition: border-color .12s;
  }
  .clb-field input:hover, .clb-field textarea:hover, .clb-field select:hover {
    border-color: #cbd5e1;
  }
  .clb-field textarea { resize: vertical; min-height: 38px; }

  /* ---- Stops ---- */
  .clb-stops { margin-bottom: 12px; }
  .clb-stops__head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .clb-stops__title {
    font-family: "Manrope", sans-serif;
    font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .08em; color: #0f172a;
  }
  .clb-stops__count {
    background: #f1f5f9; color: #475569;
    border-radius: 4px; padding: 1px 7px;
    font-size: 10px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .clb-stops__add {
    margin-left: auto;
    background: #f1f5f9; border: 1px dashed #cbd5e1; color: #475569;
    border-radius: 6px; padding: 3px 10px;
    font-size: 11px; font-weight: 600;
  }
  .clb-stops__add:hover { background: #e2e8f0; }
  .clb-stop {
    background: #fff; border: 1px solid #e7e5e4;
    border-radius: 8px; padding: 10px;
    margin-bottom: 6px;
    position: relative;
  }
  .clb-stop__num {
    position: absolute; top: 8px; left: -10px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--stop-color, #1e293b); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 2px 6px rgba(15,23,42,.2);
  }
  .clb-stop__del {
    position: absolute; top: 6px; right: 6px;
    background: transparent; border: none; color: #cbd5e1;
    font-size: 14px; padding: 2px 6px;
  }
  .clb-stop__del:hover { color: #dc2626; }
  .clb-stops--pickup .clb-stop { padding-left: 18px; }
  .clb-stops--delivery .clb-stop { padding-left: 18px; }

  /* ---- Actions row ---- */
  .clb-actions {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding-top: 10px; margin-top: 10px;
    border-top: 1px solid #e7e5e4;
  }
  .clb-actions__btn {
    background: #fff; border: 1px solid #e2e8f0; color: #334155;
    border-radius: 6px; padding: 5px 12px;
    font-size: 12px; font-weight: 600;
  }
  .clb-actions__btn:hover { background: #f8fafc; border-color: #cbd5e1; }
  .clb-actions__btn--danger:hover {
    background: #fef2f2; border-color: #fca5a5; color: #b91c1c;
  }
  .clb-actions__spacer { flex: 1; }

  /* ---- Rate con drop zone ---- */
  .clb-ratecon {
    border: 2px dashed #cbd5e1; border-radius: 8px;
    padding: 14px; text-align: center;
    background: #fafaf9; color: #64748b;
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .12s;
    margin-bottom: 10px;
  }
  .clb-ratecon:hover, .clb-ratecon--drag {
    border-color: #1e293b; background: #f1f5f9; color: #0f172a;
  }
  .clb-ratecon--uploaded {
    border-style: solid; border-color: #c7d2fe; background: #eef2ff;
    color: #3730a3; text-align: left;
    display: flex; align-items: center; gap: 10px;
  }
  .clb-ratecon--uploaded a { color: inherit; font-weight: 700; }
  .clb-ratecon--uploaded button {
    margin-left: auto;
    background: transparent; border: none; color: #6366f1;
    font-size: 16px; padding: 2px 6px;
  }
  .clb-ratecon--uploaded button:hover { color: #dc2626; }
  .clb-ratecon--uploading { color: #1e40af; border-color: #93c5fd; background: #eff6ff; cursor: wait; }

  /* ---- Photos ---- */
  .clb-photos { margin-bottom: 10px; }
  .clb-photos__title {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .clb-photos__title strong {
    font-family: "Manrope", sans-serif;
    font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .08em; color: #0f172a;
  }
  .clb-photos__add {
    background: #f1f5f9; border: 1px dashed #cbd5e1; color: #475569;
    border-radius: 6px; padding: 3px 10px;
    font-size: 11px; font-weight: 600;
  }
  .clb-photos__add:hover { background: #e2e8f0; }
  .clb-photos__grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 6px;
  }
  .clb-photo {
    position: relative; aspect-ratio: 1;
    border-radius: 6px; overflow: hidden;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
  }
  .clb-photo img { width: 100%; height: 100%; object-fit: cover; }
  .clb-photo__del {
    position: absolute; top: 2px; right: 2px;
    background: rgba(15,23,42,.7); color: #fff; border: none;
    width: 18px; height: 18px; border-radius: 50%;
    font-size: 10px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .clb-photo__del:hover { background: #dc2626; }
  .clb-photo--uploading { display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 10px; }

  /* ---- Empty state ---- */
  .clb-empty {
    padding: 40px 20px; text-align: center;
    background: #fff; border: 1px dashed #e2e8f0; border-radius: 12px;
    color: #94a3b8;
  }

  /* ---- Auth screens ---- */
  .clb-auth {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: #fafaf9;
  }
  .clb-auth__card {
    background: #fff; border-radius: 16px; padding: 32px;
    width: 100%; max-width: 360px;
    box-shadow: 0 12px 32px rgba(15,23,42,.08);
  }
  .clb-auth__title {
    font-family: "Manrope", sans-serif;
    font-size: 22px; font-weight: 800; letter-spacing: -.02em;
    margin: 0 0 6px;
  }
  .clb-auth__sub {
    font-size: 13px; color: #64748b; margin: 0 0 22px;
  }
  .clb-auth__input {
    width: 100%; padding: 12px 14px;
    border: 1px solid #e2e8f0; border-radius: 8px;
    font-size: 16px; letter-spacing: .15em; text-align: center;
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }
  .clb-auth__btn {
    width: 100%; padding: 12px;
    background: #1e293b; color: #fff;
    border: none; border-radius: 8px;
    font-size: 14px; font-weight: 700;
    transition: background .12s;
  }
  .clb-auth__btn:hover { background: #0f172a; }
  .clb-auth__err {
    color: #dc2626; font-size: 12px; font-weight: 600;
    margin-top: 8px; text-align: center;
  }

  /* ---- Loading ---- */
  .clb-loading {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #64748b; font-size: 14px;
  }

  /* ---- Modal ---- */
  .clb-modal-bg {
    position: fixed; inset: 0;
    background: rgba(15,23,42,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .clb-modal {
    background: #fff; border-radius: 12px;
    max-width: 400px; width: 100%;
    padding: 24px;
  }
  .clb-modal h3 {
    font-family: "Manrope", sans-serif;
    margin: 0 0 6px; font-size: 18px; font-weight: 800;
  }
  .clb-modal p { margin: 0 0 16px; color: #64748b; font-size: 13px; }
  .clb-modal__row {
    display: flex; gap: 8px; justify-content: flex-end;
  }

  /* small screen adjustments */
  @media (max-width: 720px) {
    .clb-app { padding: 10px; }
    .clb-header { padding: 12px; gap: 10px; }
    .clb-search { width: 140px; }
    .clb-card__head { gap: 6px; }
    .clb-card__lane { min-width: 140px; font-size: 12px; }
    .clb-summary { gap: 6px; }
    .clb-chip { padding: 8px 10px; }
    .clb-chip__val { font-size: 18px; }
  }
</style>

function parseDateTime(s) {
  if (!s) return null;
  const m = String(s).match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if (!m) return null;
  const month = parseInt(m[1], 10) - 1;
  const day   = parseInt(m[2], 10);
  let year    = m[3] ? parseInt(m[3], 10) : new Date().getFullYear();
  if (year < 100) year += 2000;
  const d = new Date(year, month, day);
  d.setHours(0, 0, 0, 0);
  return d;
}

    (load.pickups || []).forEach(p => {
      const dt = parseDateTime(p && p.datetime);
      if (dt && (!ref || dt > ref)) ref = dt;
    });
  }
  if (!ref) return "future";

  const t        = ref.getTime();
  const todayT   = today.getTime();
  const tmrT     = tomorrow.getTime();
  if (t <  todayT)  return "overdue";
  if (t === todayT) return "today";
  if (t === tmrT)   return "tomorrow";
  const weekEnd = new Date(today); weekEnd.setDate(weekEnd.getDate() + 7);
  if (t < weekEnd.getTime()) return "thisweek";
  return "future";
}

function summarizeLane(load) {
  const first = (load.pickups    || [])[0];
  const drops = load.deliveries  || [];
  const last  = drops[drops.length - 1];
  const a = (first && first.location) || "—";
  const b = (last  && last.location)  || "—";
  return a + "  →  " + b;
}

function loadMatchesSearch(load, q) {
  if (!q) return true;
  q = q.trim().toLowerCase();
  if (!q) return true;
  const hay = [
    load.broker, load.loadNum, load.otrDriver, load.driver,
    load.trailer, load.truck, load.lane, load.notes,
    ...(load.pickups   || []).map(p => p && [p.location, p.commodity, p.notes].filter(Boolean).join(" ")),
    ...(load.deliveries|| []).map(d => d && [d.location, d.notes].filter(Boolean).join(" "))
  ].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q);
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload  = () => resolve(String(r.result).split(",")[1] || "");
    r.onerror = () => reject(new Error("File read failed"));
    r.readAsDataURL(file);
  });
}

function formatRate(n) {
  const v = parseFloat(n);
  if (!v || isNaN(v)) return "—";
  return "$" + v.toLocaleString();
}

function timeAgo(t) {
  if (!t) return "";
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 5)    return "just now";
  if (s < 60)   return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  return Math.round(s / 3600) + "h ago";
}

// Find a truck number assigned to a given driver in truckAssignments.
// Returns "" if no match or invalid inputs.
function findTruckForDriver(truckAssignments, driverName) {
  if (!driverName || !truckAssignments || typeof truckAssignments !== "object") return "";
  for (const [truck, drv] of Object.entries(truckAssignments)) {
    if (drv === driverName) return truck;
  }
  return "";
}

// ============================================================
// DATA NORMALIZATION
// Single source of truth for the on-disk → in-memory shape transform.
// Handles all legacy migrations so the rest of the app never has to
// deal with "is data.loads still here?" questions.
// ============================================================

function migrateLoad(l) {
  // Legacy `driver` field → `otrDriver`
  if (l && l.driver && !l.otrDriver) {
    const { driver, ...rest } = l;
    return { ...rest, otrDriver: driver };
  }
  return l;
}

function normalizeData(raw) {
  const d = (raw && typeof raw === "object") ? raw : {};
  const out = {
    weeks:            Array.isArray(d.weeks) ? d.weeks.slice() : [],
    currentWeekId:    d.currentWeekId || "",
    adminPin:         d.adminPin || "",
    customDrivers:    Array.isArray(d.customDrivers) ? d.customDrivers : [],
    customTrucks:     Array.isArray(d.customTrucks)  ? d.customTrucks  : [],
    truckAssignments: (d.truckAssignments && typeof d.truckAssignments === "object") ? d.truckAssignments : {},
    updatedAt:        d.updatedAt || 0
  };

  // Legacy: top-level `loads` → first week
  if (out.weeks.length === 0 && Array.isArray(d.loads) && d.loads.length > 0) {
    out.weeks.push({
      id: uid("wk"),
      label: "Current",
      startDate: "",
      createdAt: Date.now(),
      archived: false,
      loads: d.loads.map(migrateLoad)
    });
  }

  // Always have at least one week
  if (out.weeks.length === 0) {
    out.weeks.push({
      id: uid("wk"),
      label: "Week 1",
      startDate: "",
      createdAt: Date.now(),
      archived: false,
      loads: []
    });
  }

  // Ensure every week has the expected shape + migrate legacy fields
  out.weeks = out.weeks.map(w => ({
    id:         w.id || uid("wk"),
    label:      w.label || "Untitled week",
    startDate:  w.startDate || "",
    createdAt:  w.createdAt || 0,
    archived:   !!w.archived,
    loads:      Array.isArray(w.loads) ? w.loads.map(migrateLoad) : []
  }));

  // Make sure currentWeekId points at a real week — fall back to first non-archived, else first
  if (!out.weeks.find(w => w.id === out.currentWeekId)) {
    out.currentWeekId = (out.weeks.find(w => !w.archived) || out.weeks[0]).id;
  }

  return out;
}

function getCurrentWeek(data) {
  if (!data || !Array.isArray(data.weeks) || !data.weeks.length) return null;
  return data.weeks.find(w => w.id === data.currentWeekId) || data.weeks[0];
}

// Apply a transformer function to the current week's loads array.
// Used by every mutation that touches loads.
function updateCurrentWeekLoads(data, transformer) {
  const curId = data.currentWeekId;
  return {
    ...data,
    weeks: data.weeks.map(w => w.id !== curId ? w : { ...w, loads: transformer(w.loads) })
  };
}

// ============================================================
// PDF TEXT EXTRACTION + RATE CON PARSER (Phase 2 v1)
// ============================================================
// Uses PDF.js to pull text out of the dropped rate con, then runs
// conservative regex heuristics to fill: broker, load #, first pickup
// (location + datetime), first delivery (location + datetime).
//
// Designed to be NON-DESTRUCTIVE — only fills fields that are currently
// empty on the load. User can always edit afterward. If the PDF is
// scanned (image-only) or encrypted, extraction silently fails and the
// upload behavior continues normally.
// ============================================================

// One-time PDF.js worker setup
if (typeof window !== "undefined" && window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
  window.pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

// Extract text from a PDF File object. Returns a single string with
// newlines preserved by y-position so labels and values stay on the
// same line (which the parser depends on).
async function extractPdfText(file) {
  if (!window.pdfjsLib) throw new Error("PDF library not available");
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    let lines = [];
    let curY = null;
    let curLine = [];
    for (const it of content.items) {
      const y = it.transform ? it.transform[5] : 0;
      if (curY === null || Math.abs(y - curY) > 2) {
        if (curLine.length) lines.push(curLine.join(" "));
        curLine = [it.str];
        curY = y;
      } else {
        curLine.push(it.str);
      }
    }
    if (curLine.length) lines.push(curLine.join(" "));
    out.push(lines.join("\n"));
  }
  return out.join("\n");
}

const RC_CITY_STATE = /\b([A-Z][A-Za-z.\-]+(?:\s+[A-Z][A-Za-z.\-]+){0,3}),\s*([A-Z]{2})\b(?!\w)/;
const RC_DATE       = /\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/;
const RC_PICKUP_HDR   = /\b(pick\s*up|pickup|shipper|origin)\b/i;
const RC_DELIVERY_HDR = /\b(delivery|deliver|consignee|receiver|destination|drop)\b/i;

// Time patterns, tried in priority order. Returns "8AM", "8:30AM", "08:00", or "0800"-style.
function extractTime(text) {
  // 12-hour with AM/PM: "8AM", "8:30 PM", "08:00AM"
  const m1 = text.match(/\b(\d{1,2})(?::(\d{2}))?\s*(AM|PM|am|pm)\b/);
  if (m1) {
    const h = m1[1], mm = m1[2] || "", ap = m1[3].toUpperCase();
    return h + (mm ? ":" + mm : "") + ap;
  }
  // 24-hour with colon: "13:30", "08:00"
  const m2 = text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
  if (m2) return m2[1] + ":" + m2[2];
  // 4-digit military time: "0800", "1430" — scoped to space/dash boundaries to avoid load #s
  const m3 = text.match(/(?:^|\s|[-,;:])([01]\d|2[0-3])([0-5]\d)(?=\s|$|[-,;])/);
  if (m3) return m3[1] + ":" + m3[2];
  return null;
}

function extractStopFromSection(section) {
  const out = {};
  const csM = section.match(RC_CITY_STATE);
  if (csM) out.location = csM[1] + ", " + csM[2];

  const dM = section.match(RC_DATE);
  const tStr = extractTime(section);
  if (dM || tStr) {
    let dt = "";
    if (dM)   dt += dM[1] + "/" + dM[2];
    if (tStr) dt += (dt ? " " : "") + tStr;
    out.datetime = dt.trim();
  }
  return (out.location || out.datetime) ? out : null;
}

function parseRateCon(rawText) {
  const result = {};
  if (!rawText) return result;
  const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const flat  = rawText.replace(/\s+/g, " ");

  // ---- Broker ----
  // RJW Logistics is the primary broker in scope; other matches are bonus.
  if (/RJW\s*Logistics/i.test(flat))        result.broker = "RJW Logistics";
  else if (/Echo\s*Global/i.test(flat))     result.broker = "Echo Global";
  else if (/\bRXO\b/i.test(flat))           result.broker = "RXO";
  else if (/\bCoyote\b/i.test(flat))        result.broker = "Coyote";
  else if (/\bMolo\b/i.test(flat))          result.broker = "Molo";
  else if (/Total\s*Quality\s*Logistics|\bTQL\b/i.test(flat)) result.broker = "TQL";

  // ---- Load / order / reference number ----
  const loadPats = [
    /\b(?:Load|Order|Shipment|Confirmation)\s*(?:Number|#|No\.?|ID)\s*:?\s*([A-Z0-9][A-Z0-9_\-]{2,15})/i,
    /\b(?:Reference|Ref)\s*(?:Number|#|No\.?)?\s*:?\s*([A-Z0-9][A-Z0-9_\-]{2,15})/i,
    /\b(?:Load|Order)\s*#\s*:?\s*([A-Z0-9][A-Z0-9_\-]{2,15})/i
  ];
  for (const pat of loadPats) {
    const m = flat.match(pat);
    if (m && m[1]) {
      const v = m[1];
      // Reject if it's clearly a phone number or a date
      if (!/^\d{10}$/.test(v) && !/^\d{1,2}\/\d{1,2}/.test(v) && v.length >= 4) {
        result.loadNum = v;
        break;
      }
    }
  }

  // ---- Pickup / delivery sections ----
  // Scan lines to find header indices, then carve up the document.
  let pickupIdx = -1;
  let deliveryIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (pickupIdx < 0 && RC_PICKUP_HDR.test(lines[i]) && !RC_DELIVERY_HDR.test(lines[i])) pickupIdx = i;
    if (deliveryIdx < 0 && RC_DELIVERY_HDR.test(lines[i])) deliveryIdx = i;
    if (pickupIdx >= 0 && deliveryIdx >= 0) break;
  }

  // Pickup section runs from its header until the delivery header (or end)
  if (pickupIdx >= 0) {
    const end = deliveryIdx > pickupIdx ? deliveryIdx : lines.length;
    const section = lines.slice(pickupIdx, end).join("\n");
    const stop = extractStopFromSection(section);
    if (stop) result.pickup = stop;
  }
  if (deliveryIdx >= 0) {
    const section = lines.slice(deliveryIdx).join("\n");
    const stop = extractStopFromSection(section);
    if (stop) result.delivery = stop;
  }

  // ---- Rate / total amount ----
  // Take the largest dollar amount on the page as the rate; rate cons
  // sometimes list per-mile, fuel, total — total tends to be largest.
  const moneyMatches = [...flat.matchAll(/\$\s*([\d,]+(?:\.\d{2})?)/g)];
  if (moneyMatches.length) {
    const amounts = moneyMatches
      .map(m => parseFloat(m[1].replace(/,/g, "")))
      .filter(n => n >= 100 && n <= 100000);   // sanity bounds — ignore tiny line items and noise
    if (amounts.length) result.rate = Math.max(...amounts);
  }

  // ---- Weight (lbs), Pallets, Commodity ----
  // Cargo attributes are usually one-per-load; we attach them to the first pickup.
  if (!result.pickup) result.pickup = {};

  // Weight — try labeled first, then bare "<n> lbs"
  let weightVal = null;
  const wLabeled = flat.match(/\b(?:weight|wgt|gross\s*wt|total\s*weight)\s*:?\s*([\d,]+)\s*(?:lbs?|pounds|lb)?\b/i);
  const wBare    = flat.match(/\b([\d,]{4,7})\s*(?:lbs?|pounds)\b/i);
  const wRaw = (wLabeled && wLabeled[1]) || (wBare && wBare[1]);
  if (wRaw) {
    const w = parseInt(wRaw.replace(/,/g, ""), 10);
    if (w >= 100 && w <= 80000) weightVal = String(w);
  }
  if (weightVal) result.pickup.weight = weightVal;

  // Pallets — "10 pallets", "Pallets: 10", "10 skids", etc.
  const pLabeled = flat.match(/\b(?:pallets?|pallet\s*count|plt|skids?|pieces)\s*:?\s*(\d{1,3})\b/i);
  const pReverse = flat.match(/\b(\d{1,3})\s*(?:pallets?|skids?)\b/i);
  const pRaw = (pLabeled && pLabeled[1]) || (pReverse && pReverse[1]);
  if (pRaw) {
    const n = parseInt(pRaw, 10);
    if (n >= 1 && n <= 100) result.pickup.pallets = String(n);
  }

  // Commodity / product / description — short phrase after the label
  const cMatch = flat.match(/\b(?:commodity|product|description|item|freight)\s*:?\s*([A-Za-z][A-Za-z0-9 ,&'\/.\-]{2,60}?)(?:\s{2,}|$|[\|;]|\sweight|\spallets|\spcs|\splt)/i);
  if (cMatch && cMatch[1]) {
    const c = cMatch[1].trim();
    if (c.length >= 3) result.pickup.commodity = c;
  }

  // Discard the pickup placeholder if nothing actually got attached
  if (result.pickup && Object.keys(result.pickup).length === 0) {
    delete result.pickup;
  }

  return result;
}

// Merge parsed fields into a load, NEVER overwriting non-empty fields.
// Returns { merged, filledFields } so the caller can report what happened.
function applyParsedToLoad(load, parsed) {
  const merged = { ...load };
  const filled = [];

  if (parsed.broker  && !merged.broker)  { merged.broker  = parsed.broker;  filled.push("Broker"); }
  if (parsed.loadNum && !merged.loadNum) { merged.loadNum = parsed.loadNum; filled.push("Load #"); }
  if (parsed.rate    && !parseFloat(merged.rate)) { merged.rate = String(parsed.rate); filled.push("Rate"); }

  if (parsed.pickup) {
    const pickups = (merged.pickups || []).slice();
    const emptyIdx = pickups.findIndex(p => !p.location && !p.datetime);
    const target = emptyIdx >= 0 ? emptyIdx : pickups.length;
    const base = pickups[target] || { location:"", datetime:"", commodity:"", weight:"", pallets:"", notes:"" };
    const next = { ...base };
    let touched = false;
    if (parsed.pickup.location  && !base.location)  { next.location  = parsed.pickup.location;  filled.push("Pickup location"); touched = true; }
    if (parsed.pickup.datetime  && !base.datetime)  { next.datetime  = parsed.pickup.datetime;  filled.push("Pickup time");     touched = true; }
    if (parsed.pickup.weight    && !base.weight)    { next.weight    = parsed.pickup.weight;    filled.push("Weight");          touched = true; }
    if (parsed.pickup.pallets   && !base.pallets)   { next.pallets   = parsed.pickup.pallets;   filled.push("Pallets");         touched = true; }
    if (parsed.pickup.commodity && !base.commodity) { next.commodity = parsed.pickup.commodity; filled.push("Commodity");       touched = true; }
    if (touched) {
      if (emptyIdx >= 0) pickups[target] = next; else pickups.push(next);
      merged.pickups = pickups;
    }
  }

  if (parsed.delivery) {
    const deliveries = (merged.deliveries || []).slice();
    const emptyIdx = deliveries.findIndex(d => !d.location && !d.datetime);
    const target = emptyIdx >= 0 ? emptyIdx : deliveries.length;
    const base = deliveries[target] || { location:"", datetime:"", notes:"" };
    const next = { ...base };
    let touched = false;
    if (parsed.delivery.location && !base.location) { next.location = parsed.delivery.location; filled.push("Delivery location"); touched = true; }
    if (parsed.delivery.datetime && !base.datetime) { next.datetime = parsed.delivery.datetime; filled.push("Delivery time");     touched = true; }
    if (touched) {
      if (emptyIdx >= 0) deliveries[target] = next; else deliveries.push(next);
      merged.deliveries = deliveries;
    }
  }

  return { merged, filledFields: filled };
}

// ============================================================
// API
// ============================================================

async function apiCall(payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "Request failed");
  return j;
}

async function apiLoad() {
  const res = await fetch(APPS_SCRIPT_URL + "?action=load");
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "Load failed");
  return j.data || {};
}

async function apiSave(data) {
  return apiCall({ action: "save", data });
}

async function apiUpload(file, kind) {
  const base64 = await fileToBase64(file);
  const j = await apiCall({
    action:   kind, // "uploadPhoto" or "uploadRateCon"
    data:     base64,
    mimeType: file.type || "application/octet-stream",
    filename: file.name
  });
  return j.file;
}

// COMPONENTS — AUTH
// ============================================================

function LoadingScreen({ msg }) {
  return <div className="clb-loading">{msg || "Loading…"}</div>;
}

function PinSetup({ onSetup }) {
  const [pin,    setPin]    = useState("");
  const [pin2,   setPin2]   = useState("");
  const [error,  setError]  = useState("");
  const [busy,   setBusy]   = useState(false);

  const submit = () => {
    setError("");
    if (pin.length < 4)       return setError("PIN must be at least 4 digits");
    if (pin !== pin2)         return setError("PINs do not match");
    setBusy(true);
    onSetup(pin).catch(e => { setError(e.message || "Failed"); setBusy(false); });
  };

  return (
    <div className="clb-auth">
      <div className="clb-auth__card">
        <h2 className="clb-auth__title">Welcome</h2>
        <p className="clb-auth__sub">Set up an admin PIN to protect this board. You can change it anytime.</p>
        <input className="clb-auth__input" type="password" inputMode="numeric"
               placeholder="New PIN" value={pin}  onChange={e => setPin(e.target.value)} autoFocus />
        <input className="clb-auth__input" type="password" inputMode="numeric"
               placeholder="Confirm PIN" value={pin2} onChange={e => setPin2(e.target.value)}
               onKeyDown={e => e.key === "Enter" && submit()} />
        <button className="clb-auth__btn" onClick={submit} disabled={busy}>
          {busy ? "Saving…" : "Create PIN"}
        </button>
        {error && <div className="clb-auth__err">{error}</div>}
      </div>
    </div>
  );
}

function PinLogin({ expected, onSuccess }) {
  const [pin,   setPin]   = useState("");
  const [error, setError] = useState("");

  const submit = () => {
    if (pin === expected) {
      try { localStorage.setItem(STORAGE.authPin, pin); } catch (e) {}
      onSuccess();
    } else {
      setError("Incorrect PIN");
      setPin("");
    }
  };

  return (
    <div className="clb-auth">
      <div className="clb-auth__card">
        <h2 className="clb-auth__title">Contracted Lanes</h2>
        <p className="clb-auth__sub">Enter admin PIN to continue.</p>
        <input className="clb-auth__input" type="password" inputMode="numeric"
               placeholder="••••" value={pin} autoFocus
               onChange={e => { setPin(e.target.value); setError(""); }}
               onKeyDown={e => e.key === "Enter" && submit()} />
        <button className="clb-auth__btn" onClick={submit}>Unlock</button>
        {error && <div className="clb-auth__err">{error}</div>}
      </div>
    </div>
  );
}

  return (
    <div className="clb-stop" style={{ "--stop-color": color }}>
      <div className="clb-stop__num">{index + 1}</div>
      <button className="clb-stop__del" onClick={onRemove} title="Remove stop">×</button>
      <div className="clb-row clb-row--2">
        <div className="clb-field">
          <span className="clb-field__lbl">Location</span>
          <input value={stop.location || ""} onChange={e => set("location", e.target.value)} placeholder="City, ST" />
        </div>
        <div className="clb-field">
          <span className="clb-field__lbl">Date / Time</span>
          <input value={stop.datetime || ""} onChange={e => set("datetime", e.target.value)} placeholder="5/12 8AM" />
        </div>
      </div>
      {type === "pickup" && (

        <input value={stop.notes || ""} onChange={e => set("notes", e.target.value)}
               placeholder={type === "pickup" ? "PO #, references, dock, etc." : "Appointment #, instructions, etc."} />

function StopList({ stops, type, color, onChange }) {
  const updateStop = (i, next) => {
    const arr = stops.slice();
    arr[i] = next;
    onChange(arr);
  };
  const removeStop = i => {
    if (stops.length <= 1) return;
    const arr = stops.slice();
    arr.splice(i, 1);
    onChange(arr);
  };
  const addStop = () => {
    const empty = type === "pickup"
      ? { location:"", datetime:"", commodity:"", weight:"", pallets:"", notes:"" }
      : { location:"", datetime:"", notes:"" };
    onChange([ ...stops, empty ]);
  };
  return (
    <div className={"clb-stops clb-stops--" + type}>
      <div className="clb-stops__head">
        <span className="clb-stops__title">{type === "pickup" ? "Pickups" : "Deliveries"}</span>
        <span className="clb-stops__count">{stops.length}</span>
        <button className="clb-stops__add" onClick={addStop}>+ Add stop</button>
      </div>
      {stops.map((s, i) => (
        <StopRow key={i} stop={s} index={i} type={type} color={color}
                 onChange={next => updateStop(i, next)}
                 onRemove={() => removeStop(i)} />
      ))}
    </div>
  );
}

function RateConSlot({ load, onChange }) {
  const [busy, setBusy]   = useState(false);
  const [drag, setDrag]   = useState(false);
  const [note, setNote]   = useState("");   // banner message after parse
  const inputRef = useRef(null);

  // Auto-hide the parse note after a few seconds
  useEffect(() => {
    if (!note) return;
    const t = setTimeout(() => setNote(""), 6000);
    return () => clearTimeout(t);
  }, [note]);

  const handleFiles = async (files) => {
    if (!files || !files[0]) return;
    const f = files[0];
    if (f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)) {
      alert("Rate confirmations must be PDF files.");
      return;
    }
    setBusy(true);
    setNote("");
    try {
      // 1. Upload to Drive first so we always have the file linked even if parsing fails
      const uploaded = await apiUpload(f, "uploadRateCon");

      // 2. Try to extract + parse in parallel-ish (still must await for safety)
      let parsed = null;
      let parseError = null;
      try {
        const text = await extractPdfText(f);
        parsed = parseRateCon(text);
      } catch (e) {
        parseError = e;
        console.warn("Rate con auto-parse failed:", e);
      }

      // 3. Compose a single load update with both the upload and any parsed fields
      let next = { ...load, rateConUrl: uploaded.url, rateConName: uploaded.name };
      let filledFields = [];
      if (parsed) {
        const merged = applyParsedToLoad(next, parsed);
        next = merged.merged;
        filledFields = merged.filledFields;
      }
      onChange(next);

      // 4. Report what happened
      if (filledFields.length) {
        setNote("✓ Auto-filled " + filledFields.length + " field" + (filledFields.length === 1 ? "" : "s") + ": " + filledFields.join(", ") + ". Please review.");
      } else if (parseError) {
        setNote("Uploaded. Couldn't read text from this PDF (it may be a scan) — please fill fields manually.");
      } else {
        setNote("Uploaded. No fields matched known patterns — please fill manually.");
      }
    } catch (err) {
      alert("Upload failed: " + err.message);
    } finally {
      setBusy(false);
    }
  };

  const onDrop = e => {
    e.preventDefault();
    setDrag(false);
    handleFiles(e.dataTransfer.files);
  };

  return (
    <div>
      {load.rateConUrl ? (
        <div className="clb-ratecon clb-ratecon--uploaded">
          <span>📄</span>
          <a href={load.rateConUrl} target="_blank" rel="noopener noreferrer">
            {load.rateConName || "Rate confirmation"}
          </a>
          <button onClick={() => onChange({ ...load, rateConUrl: "", rateConName: "" })} title="Remove rate con">×</button>
        </div>
      ) : (
        <div
          className={"clb-ratecon" + (drag ? " clb-ratecon--drag" : "") + (busy ? " clb-ratecon--uploading" : "")}
          onClick={() => !busy && inputRef.current && inputRef.current.click()}
          onDragOver={e => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={onDrop}
        >
          {busy ? "Reading rate con…" : "📄  Drag rate con (PDF) here, or click to choose"}
          <input ref={inputRef} type="file" accept="application/pdf,.pdf"
                 style={{ display: "none" }}
                 onChange={e => handleFiles(e.target.files)} />
        </div>
      )}
      {note && (
        <div style={{
          fontSize: "11px", fontWeight: 600,
          color: note.startsWith("✓") ? "#15803d" : "#92400e",
          background: note.startsWith("✓") ? "#dcfce7" : "#fef3c7",
          border: "1px solid " + (note.startsWith("✓") ? "#86efac" : "#fcd34d"),
          padding: "6px 10px", borderRadius: "6px", marginBottom: "10px"
        }}>
          {note}
        </div>
      )}
    </div>
  );
}

function PhotosSlot({ load, onChange }) {
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);

  const photos = load.photos || [];

  const handleFiles = async (files) => {
    if (!files || !files.length) return;
    setBusy(true);
    try {
      const uploaded = [];
      for (const f of Array.from(files)) {
        const r = await apiUpload(f, "uploadPhoto");
        uploaded.push(r);
      }
      onChange({ ...load, photos: [ ...photos, ...uploaded ] });
    } catch (err) {
      alert("Upload failed: " + err.message);
    } finally {
      setBusy(false);
    }
  };

  const removePhoto = (id) => {
    if (!window.confirm("Remove this photo from the load? (The file stays in your Drive.)")) return;
    onChange({ ...load, photos: photos.filter(p => p.id !== id) });
  };

  return (
    <div className="clb-photos">
      <div className="clb-photos__title">
        <strong>Photos</strong>
        <span className="clb-stops__count">{photos.length}</span>
        <button className="clb-photos__add" onClick={() => inputRef.current && inputRef.current.click()} disabled={busy}>
          {busy ? "Uploading…" : "+ Add photos"}
        </button>
        <input ref={inputRef} type="file" accept="image/*" multiple
               style={{ display: "none" }}
               onChange={e => handleFiles(e.target.files)} />
      </div>
      {photos.length > 0 && (
        <div className="clb-photos__grid">
          {photos.map(p => (
            <div key={p.id} className="clb-photo">
              <a href={p.url} target="_blank" rel="noopener noreferrer">
                <img src={p.thumbnailUrl || p.url} alt={p.name || "photo"} loading="lazy" />
              </a>
              <button className="clb-photo__del" onClick={() => removePhoto(p.id)} title="Remove">×</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function LoadCard({ load, bucket, allDrivers, allTrucks, truckAssignments, expanded, onToggle, onChange, onDelete }) {
  const [pendingDriver, setPendingDriver] = useState(load.otrDriver || "");
  useEffect(() => { setPendingDriver(load.otrDriver || ""); }, [load.otrDriver]);

  const update = (field, value) => onChange({ ...load, [field]: value });

  const updateStatus = (status) => onChange({ ...load, status });

  const updateOtrDriver = (otrDriver) => {
    const next = { ...load, otrDriver };
    // Auto-promote Need to Pickup → Dispatched once an OTR driver is assigned.
    if (otrDriver && (load.status || "Need to Pickup") === "Need to Pickup") {
      next.status = "Dispatched";
    }
    // Auto-fill OTR truck from truckAssignments — only if truck is currently empty
    // (so we never clobber a manually-entered truck #).
    const mt = findTruckForDriver(truckAssignments, otrDriver);
    if (mt && !next.otrTruck) next.otrTruck = mt;
    onChange(next);
  };

  const ss = STATUS_STYLES[load.status] || STATUS_STYLES["Need to Pickup"];
  const bucketColor = bucket.color;

  // OTR badge shows either "#519 · Jeff Mecha" or whichever pieces are present
  const otrBadge = (load.otrDriver || load.otrTruck) ? (
    <span className="clb-card__driver">
      🚛 {load.otrTruck ? "#" + load.otrTruck : ""}{load.otrTruck && load.otrDriver ? " · " : ""}{load.otrDriver || ""}
    </span>
  ) : null;

  return (
    <div className={"clb-card" + (load.status === "Delivered" ? " clb-card--delivered" : "")}
         style={{ "--bucket-color": bucketColor }}>
      <div className="clb-card__head" onClick={onToggle}>
        <span className="clb-card__caret">{expanded ? "▼" : "▶"}</span>
        <span className="clb-card__broker">{load.broker || "—"}</span>
        {load.loadNum && <span className="clb-card__loadnum">#{load.loadNum}</span>}
        <span className="clb-card__lane">{summarizeLane(load)}</span>
        {load.trailer && <span className="clb-card__trailer">T{load.trailer}</span>}
        {otrBadge}
        {parseFloat(load.rate) > 0 && <span className="clb-card__rate">{formatRate(load.rate)}</span>}
        <span className="clb-card__status"
              style={{ background: ss.bg, color: ss.color, border: "1px solid " + ss.border }}>
          {load.status || "Need to Pickup"}
        </span>
      </div>

      {expanded && (
        <div className="clb-card__body" onClick={e => e.stopPropagation()}>

          <div className="clb-row clb-row--3">
            <div className="clb-field">
              <span className="clb-field__lbl">Broker</span>
              <input value={load.broker || ""} onChange={e => update("broker", e.target.value)} placeholder="RJW Logistics, Echo, etc." />
            </div>
            <div className="clb-field">
              <span className="clb-field__lbl">Load #</span>
              <input value={load.loadNum || ""} onChange={e => update("loadNum", e.target.value)} placeholder="12345" />
            </div>
            <div className="clb-field">
              <span className="clb-field__lbl">Rate ($)</span>
              <input value={load.rate || ""} onChange={e => update("rate", e.target.value)} placeholder="0" inputMode="decimal" />
            </div>
          </div>

          {/* OTR row — driver + truck + status */}
          <div className="clb-row clb-row--3">
            <div className="clb-field">
              <span className="clb-field__lbl">OTR Driver</span>
              <input list={"clb-drivers-" + load.id}
                     value={pendingDriver}
                     onChange={e => setPendingDriver(e.target.value)}
                     onBlur={() => { if (pendingDriver !== (load.otrDriver || "")) updateOtrDriver(pendingDriver); }}
                     onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
                     placeholder="Assign driver" />
              <datalist id={"clb-drivers-" + load.id}>
                {allDrivers.map(d => <option key={d} value={d} />)}
              </datalist>
            </div>
            <div className="clb-field">
              <span className="clb-field__lbl">OTR Truck #</span>
              <input list={"clb-otrtrucks-" + load.id}
                     value={load.otrTruck || ""}
                     onChange={e => update("otrTruck", e.target.value)}
                     placeholder="e.g. 519" />
              <datalist id={"clb-otrtrucks-" + load.id}>
                {allTrucks.map(t => <option key={t} value={t} />)}
              </datalist>
            </div>
            <div className="clb-field">
              <span className="clb-field__lbl">Status</span>
              <select value={load.status || "Need to Pickup"} onChange={e => updateStatus(e.target.value)}>
                {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}

          </div>

          {/* Local equipment row — trailer & truck */}
          <div className="clb-row clb-row--2">
            <div className="clb-field">
              <span className="clb-field__lbl">Trailer # (local)</span>
              <input value={load.trailer || ""} onChange={e => update("trailer", e.target.value)} placeholder="e.g. 53117" />
            </div>

              <span className="clb-field__lbl">Truck # (local)</span>

                    onChange={deliveries => update("deliveries", deliveries)} />

            <span className="clb-field__lbl">Notes (load-wide)</span>

          <PhotosSlot load={load} onChange={onChange} />

          <div className="clb-actions">
            <div className="clb-actions__spacer" />
            <button className="clb-actions__btn clb-actions__btn--danger" onClick={() => {
              if (window.confirm("Delete this load? This cannot be undone.")) onDelete(load.id);
            }}>Delete load</button>
          </div>
        </div>
      )}
    </div>
  );
}

function BucketSection({ bucket, loads, expandedIds, setExpanded, allDrivers, allTrucks, truckAssignments, onChange, onDelete }) {
  if (!loads.length) return null;
  const total = loads.reduce((s, l) => s + (parseFloat(l.rate) || 0), 0);
  return (
    <div className="clb-bucket">
      <div className="clb-bucket__head" style={{ "--bucket-color": bucket.color, "--bucket-bg": bucket.bg }}>
        <span className="clb-bucket__name">{bucket.label}</span>
        <span className="clb-bucket__count">{loads.length}</span>
        {total > 0 && <span className="clb-bucket__total">{formatRate(total)}</span>}
      </div>
      <div className="clb-bucket__body">
        {loads.map(l => (
          <LoadCard
            key={l.id}
            load={l}
            bucket={bucket}
            allDrivers={allDrivers}
            allTrucks={allTrucks}
            truckAssignments={truckAssignments}
            expanded={expandedIds.has(l.id)}
            onToggle={() => setExpanded(prev => {
              const next = new Set(prev);
              if (next.has(l.id)) next.delete(l.id); else next.add(l.id);
              return next;
            })}
            onChange={onChange}
            onDelete={onDelete}
          />
        ))}
      </div>
    </div>
  );
}

      <span className={"clb-save clb-save--" + saveStatus}>● {saveLbl}</span>
      {sizeLevel && (
        <span className="clb-save" style={sizeColors[sizeLevel]}

function SummaryBar({ data, today, tomorrow }) {
  const cur = getCurrentWeek(data);
  const loads = cur ? cur.loads : [];
  const counts = useMemo(() => {
    const c = { total: loads.length, totalRate: 0 };
    BUCKETS.forEach(b => c[b.key] = 0);
    loads.forEach(l => {
      const k = getBucket(l, today, tomorrow);
      c[k] = (c[k] || 0) + 1;
      c.totalRate += parseFloat(l.rate) || 0;
    });
    return c;
  }, [loads, today, tomorrow]);

  return (
    <div className="clb-summary">
      <div className="clb-chip clb-chip--accent" style={{ "--accent":"#1e293b" }}>
        <span className="clb-chip__val">{counts.total}</span>
        <span className="clb-chip__lbl">Total loads</span>
      </div>
      <div className="clb-chip clb-chip--accent" style={{ "--accent":"#059669" }}>
        <span className="clb-chip__val">{formatRate(counts.totalRate)}</span>
        <span className="clb-chip__lbl">Total revenue</span>
      </div>
      {BUCKETS.filter(b => counts[b.key] > 0).map(b => (
        <div key={b.key} className="clb-chip clb-chip--accent" style={{ "--accent": b.color }}>
          <span className="clb-chip__val">{counts[b.key]}</span>
          <span className="clb-chip__lbl">{b.label}</span>
        </div>
      ))}
    </div>
  );
}

function ChangePinModal({ current, onCancel, onSave }) {
  const [oldP, setOld] = useState("");
  const [newP, setNew] = useState("");
  const [newP2, setNew2] = useState("");
  const [err, setErr] = useState("");

  const submit = () => {
    setErr("");
    if (oldP !== current)  return setErr("Current PIN is incorrect");
    if (newP.length < 4)   return setErr("New PIN must be at least 4 digits");
    if (newP !== newP2)    return setErr("New PINs do not match");
    onSave(newP);
  };

  return (
    <div className="clb-modal-bg" onClick={onCancel}>
      <div className="clb-modal" onClick={e => e.stopPropagation()}>
        <h3>Change admin PIN</h3>
        <p>This PIN is shared across all users of this board.</p>
        <input className="clb-auth__input" type="password" placeholder="Current PIN" value={oldP}  onChange={e => setOld(e.target.value)} autoFocus />
        <input className="clb-auth__input" type="password" placeholder="New PIN"     value={newP}  onChange={e => setNew(e.target.value)} />
        <input className="clb-auth__input" type="password" placeholder="Confirm new" value={newP2} onChange={e => setNew2(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} />
        {err && <div className="clb-auth__err">{err}</div>}
        <div className="clb-modal__row" style={{ marginTop: 14 }}>
          <button className="clb-actions__btn" onClick={onCancel}>Cancel</button>
          <button className="clb-auth__btn" style={{ width: "auto", padding: "8px 16px" }} onClick={submit}>Save</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [data,        setData]        = useState(null);
  const [authed,      setAuthed]      = useState(false);
  const [saveStatus,  setSaveStatus]  = useState("idle");
  const [lastSync,    setLastSync]    = useState(0);
  const [expandedIds, setExpandedIds] = useState(() => new Set());
  const [search,      setSearch]      = useState("");
  const [showPinModal, setShowPinModal] = useState(false);
  const [loadError,   setLoadError]   = useState("");

  const allDrivers = useMemo(() => {
    const set = new Set(DRIVERS);
    (data && data.customDrivers || []).forEach(d => set.add(d));
    return Array.from(set).sort();
  }, [data && data.customDrivers]);

  const allTrucks = useMemo(() => {
    const set = new Set(TRUCK_NUMBERS);
    (data && data.customTrucks || []).forEach(t => set.add(t));
    return Array.from(set).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  }, [data && data.customTrucks]);

  // ---- Initial load ----
  useEffect(() => {
    let dead = false;
    apiLoad()
      .then(d => {
        if (dead) return;
        const merged = normalizeData(d);
        setData(merged);
        // Auth check
        let stored = "";
        try { stored = localStorage.getItem(STORAGE.authPin) || ""; } catch (e) {}
        if (merged.adminPin && stored && stored === merged.adminPin) {
          setAuthed(true);
        }
      })
      .catch(e => {
        if (!dead) setLoadError("Could not reach backend: " + e.message);
      });
    return () => { dead = true; };
  }, []);

  // ---- Polling: refresh from server every N seconds ----
  // Skip if any input/textarea/select is focused, to avoid eating user input.
  useEffect(() => {
    if (!data || !authed) return;
    const timer = setInterval(async () => {
      const active = document.activeElement;
      if (active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return;
      if (saveStatus === "saving") return;
      try {
        const fresh = await apiLoad();
        const freshAt = fresh.updatedAt || 0;
        const localAt = data.updatedAt || 0;
        if (freshAt > localAt) {
          setData(normalizeData(fresh));
        }
      } catch (e) { /* swallow — periodic poll */ }
    }, POLL_INTERVAL_MS);
    return () => clearInterval(timer);
  }, [data && data.updatedAt, authed, saveStatus]);

  // ---- Debounced save ----
  const saveTimerRef = useRef(null);
  const dataRef      = useRef(data);
  dataRef.current = data;

  const persist = useCallback(() => {
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(async () => {
      const snapshot = { ...dataRef.current, updatedAt: Date.now() };
      setSaveStatus("saving");
      try {
        await apiSave(snapshot);
        setSaveStatus("saved");
        setLastSync(Date.now());
      } catch (e) {
        setSaveStatus("error");
        console.error("Save failed:", e);
      }
    }, SAVE_DEBOUNCE_MS);
  }, []);

  const mutate = useCallback((next) => {
    setData(next);
    persist();
  }, [persist]);

  // ---- Load mutations (operate on the current week's loads array) ----
  const onLoadChange = useCallback((updatedLoad) => {
    mutate(updateCurrentWeekLoads(dataRef.current, loads =>
      loads.map(l => l.id === updatedLoad.id ? { ...updatedLoad, updatedAt: Date.now() } : l)
    ));
  }, [mutate]);

  const onLoadDelete = useCallback((id) => {
    mutate(updateCurrentWeekLoads(dataRef.current, loads =>
      loads.filter(l => l.id !== id)
    ));
  }, [mutate]);

  const onAddLoad = useCallback(() => {
    const now = Date.now();
    const newLoad = {
      id: uid(),
      broker: "",
      loadNum: "",
      lane: "",
      status: "Need to Pickup",
      rate: "",
      otrDriver: "",
      otrTruck: "",
      trailer: "",
      truck: "",
      notes: "",
      pickups:    [{ location:"", datetime:"", commodity:"", weight:"", pallets:"", notes:"" }],
      deliveries: [{ location:"", datetime:"", notes:"" }],
      rateConUrl: "",
      rateConName: "",
      photos: [],
      createdAt: now,
      updatedAt: now
    };
    mutate(updateCurrentWeekLoads(dataRef.current, loads => [newLoad, ...loads]));
    setExpandedIds(prev => {
      const next = new Set(prev);
      next.add(newLoad.id);
      return next;
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, [mutate]);

  // ---- Week mutations ----
  const switchWeek = useCallback((weekId) => {
    if (!weekId) return;
    const cur = dataRef.current;
    if (!cur.weeks.find(w => w.id === weekId)) return;
    mutate({ ...cur, currentWeekId: weekId });
    setExpandedIds(new Set());   // collapse cards when switching weeks
  }, [mutate]);

  const createNewWeek = useCallback(() => {
    const defaultLabel = "Week of " + new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
    const label = window.prompt("Label for the new week:", defaultLabel);
    if (!label || !label.trim()) return;

    const cur = dataRef.current;
    const curWeek = getCurrentWeek(cur);
    const carry = curWeek && curWeek.loads.some(l => l.status !== "Delivered")
      ? window.confirm("Carry forward any non-Delivered loads from the current week into the new week?")
      : false;

    let updatedWeeks = cur.weeks.slice();
    let newWeekLoads = [];
    if (carry && curWeek) {
      const incomplete = curWeek.loads.filter(l => l.status !== "Delivered");
      const completed  = curWeek.loads.filter(l => l.status === "Delivered");
      // Strip ids so duplicates don't collide between weeks
      newWeekLoads = incomplete.map(l => ({ ...l, id: uid(), createdAt: Date.now(), updatedAt: Date.now() }));
      updatedWeeks = updatedWeeks.map(w => w.id !== curWeek.id ? w : { ...w, loads: completed });
    }

    const newWeek = {
      id: uid("wk"),
      label: label.trim(),
      startDate: "",
      createdAt: Date.now(),
      archived: false,
      loads: newWeekLoads
    };
    mutate({
      ...cur,
      weeks: [...updatedWeeks, newWeek],
      currentWeekId: newWeek.id
    });
    setExpandedIds(new Set());
  }, [mutate]);

  const archiveCurrentWeek = useCallback(() => {
    const cur = dataRef.current;
    const curWeek = getCurrentWeek(cur);
    if (!curWeek) return;
    if (cur.weeks.length < 2) {
      window.alert("Can't archive the only week. Create a new week first.");
      return;
    }
    if (!window.confirm("Archive week \"" + curWeek.label + "\"?\n\nIt stays accessible from the dropdown (with a 📦 icon) but won't be the default view.")) return;
    const updatedWeeks = cur.weeks.map(w => w.id !== curWeek.id ? w : { ...w, archived: true });
    const nextActive = updatedWeeks.find(w => !w.archived) || updatedWeeks[0];
    mutate({ ...cur, weeks: updatedWeeks, currentWeekId: nextActive.id });
  }, [mutate]);

  // ---- Auth handlers ----
  const setupPin = async (pin) => {
    const next = { ...dataRef.current, adminPin: pin, updatedAt: Date.now() };
    setSaveStatus("saving");
    await apiSave(next);
    setSaveStatus("saved");
    setLastSync(Date.now());
    setData(next);
    try { localStorage.setItem(STORAGE.authPin, pin); } catch (e) {}
    setAuthed(true);
  };

  const changePin = (newPin) => {
    const next = { ...dataRef.current, adminPin: newPin, updatedAt: Date.now() };
    setData(next);
    try { localStorage.setItem(STORAGE.authPin, newPin); } catch (e) {}
    setShowPinModal(false);
    persist();
  };

  const logout = () => {
    try { localStorage.removeItem(STORAGE.authPin); } catch (e) {}
    setAuthed(false);
  };

  // ---- One-click import of drivers/trucks/assignments from the freight board ----
  const importFromFreight = useCallback(async () => {
    if (!window.confirm(
      "Import drivers, trucks, and the driver→truck assignment map from your Freight Board?\n\n" +
      "This MERGES with what's already here:\n" +
      "  • New drivers/trucks are added\n" +
      "  • Existing truck→driver assignments will be OVERWRITTEN by the freight board's version\n\n" +
      "Your loads on this board are NOT affected."
    )) return;

    setSaveStatus("saving");
    try {
      const res = await fetch(FREIGHT_BOARD_URL, { redirect: "follow" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const fb = await res.json();
      // The freight board sometimes wraps things differently — handle both shapes
      const src = (fb && fb.data) ? fb.data : fb;
      const fbAssignments = (src && src.truckAssignments && typeof src.truckAssignments === "object") ? src.truckAssignments : null;
      const fbCustomDrivers = Array.isArray(src && src.customDrivers) ? src.customDrivers : null;
      const fbCustomTrucks  = Array.isArray(src && src.customTrucks)  ? src.customTrucks  : null;

      if (!fbAssignments && !fbCustomDrivers && !fbCustomTrucks) {
        throw new Error("Freight Board response had no recognizable drivers/trucks/assignments");
      }

      const cur = dataRef.current;
      const mergedDrivers = Array.from(new Set([...(cur.customDrivers || []), ...(fbCustomDrivers || [])]));
      const mergedTrucks  = Array.from(new Set([...(cur.customTrucks  || []), ...(fbCustomTrucks  || [])]));
      const mergedAssign  = { ...(cur.truckAssignments || {}), ...(fbAssignments || {}) };

      const next = {
        ...cur,
        customDrivers:    mergedDrivers,
        customTrucks:     mergedTrucks,
        truckAssignments: mergedAssign,
        updatedAt:        Date.now()
      };
      setData(next);
      await apiSave(next);
      setSaveStatus("saved");
      setLastSync(Date.now());

      const driverCount = fbCustomDrivers ? fbCustomDrivers.length : 0;
      const truckCount  = fbCustomTrucks  ? fbCustomTrucks.length  : 0;
      const assignCount = fbAssignments   ? Object.keys(fbAssignments).length : 0;
      window.alert("✓ Imported from Freight Board:\n" +
        "  • " + driverCount + " custom drivers\n" +
        "  • " + truckCount + " custom trucks\n" +
        "  • " + assignCount + " truck→driver assignments");
    } catch (err) {
      setSaveStatus("error");
      window.alert("Import failed: " + err.message);
    }
  }, []);

  // ---- Bucketing ----
  const today    = useMemo(() => todayMidnight(), []);
  const tomorrow = useMemo(() => { const t = new Date(today); t.setDate(t.getDate() + 1); return t; }, [today]);

  const bucketed = useMemo(() => {
    if (!data) return null;
    const cur = getCurrentWeek(data);
    const loads = cur ? cur.loads : [];
    const byKey = {};
    BUCKETS.forEach(b => byKey[b.key] = []);
    loads.filter(l => loadMatchesSearch(l, search)).forEach(l => {
      const k = getBucket(l, today, tomorrow);
      (byKey[k] || (byKey[k] = [])).push(l);
    });
    // Sort within each bucket by earliest delivery date asc, then created asc
    Object.keys(byKey).forEach(k => {
      byKey[k].sort((a, b) => {
        const da = (a.deliveries || []).reduce((m, d) => {
          const dt = parseDateTime(d.datetime);
          return dt && (!m || dt < m) ? dt : m;
        }, null);
        const db = (b.deliveries || []).reduce((m, d) => {
          const dt = parseDateTime(d.datetime);
          return dt && (!m || dt < m) ? dt : m;
        }, null);
        if (da && db) return da - db;
        if (da) return -1;
        if (db) return 1;
        return (a.createdAt || 0) - (b.createdAt || 0);
      });
    });
    return byKey;
  }, [data, search, today, tomorrow]);

  // ---- Online/offline detection ----
  const [online, setOnline] = useState(typeof navigator !== "undefined" ? navigator.onLine !== false : true);
  useEffect(() => {
    const up = () => setOnline(true);
    const down = () => setOnline(false);
    window.addEventListener("online",  up);
    window.addEventListener("offline", down);
    return () => {
      window.removeEventListener("online",  up);
      window.removeEventListener("offline", down);
    };
  }, []);

  // ---- Storage size monitor (the JSON blob that goes into a single Sheets cell) ----
  const storageSize = useMemo(() => {
    if (!data) return 0;
    try { return JSON.stringify(data).length; } catch (e) { return 0; }
  }, [data]);

  // ---- Render ----
  if (loadError) {
    return (
      <div className="clb-auth">
        <div className="clb-auth__card">
          <h2 className="clb-auth__title">Connection error</h2>
          <p className="clb-auth__sub">{loadError}</p>
          <button className="clb-auth__btn" onClick={() => window.location.reload()}>Retry</button>
        </div>
      </div>
    );
  }
  if (!data) return <LoadingScreen msg="Loading board…" />;
  if (!data.adminPin) return <PinSetup onSetup={setupPin} />;
  if (!authed) return <PinLogin expected={data.adminPin} onSuccess={() => setAuthed(true)} />;

  return (
    <div className="clb-app">
      <Header
        data={data}
        saveStatus={saveStatus}
        lastSync={lastSync}
        search={search}
        setSearch={setSearch}
        onAddLoad={onAddLoad}
        onLogout={logout}
        onChangePin={() => setShowPinModal(true)}
        onImportFromFreight={importFromFreight}
        onSwitchWeek={switchWeek}
        onNewWeek={createNewWeek}
        onArchiveWeek={archiveCurrentWeek}
        storageSize={storageSize}
        online={online}
      />
      <SummaryBar data={data} today={today} tomorrow={tomorrow} />

      {(() => {
        const cur = getCurrentWeek(data);
        return cur && cur.loads.length === 0 && (
          <div className="clb-empty">
            No loads in <strong>{cur.label}</strong> yet. Click <strong>+ Add Load</strong> to create the first one.
          </div>
        );
      })()}

      {BUCKETS.map(b => (
        <BucketSection
          key={b.key}
          bucket={b}
          loads={bucketed[b.key] || []}
          expandedIds={expandedIds}
          setExpanded={setExpandedIds}
          allDrivers={allDrivers}
          allTrucks={allTrucks}
          truckAssignments={data.truckAssignments || {}}
          onChange={onLoadChange}
          onDelete={onLoadDelete}
        />
      ))}

      {showPinModal && (
        <ChangePinModal
          current={data.adminPin}
          onCancel={() => setShowPinModal(false)}
          onSave={changePin}
        />
      )}
    </div>
  );
}

// ============================================================
// ERROR BOUNDARY — last-resort defense against white screens
// ============================================================
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("Board error:", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div className="clb-auth">
          <div className="clb-auth__card">
            <h2 className="clb-auth__title">Something went wrong</h2>
            <p className="clb-auth__sub">
              The board hit an unexpected error. Your data on the Sheet is unaffected — reloading usually fixes it.
            </p>
            <pre style={{
              fontSize: 11, color: "#64748b",
              background: "#f8fafc", padding: 8, borderRadius: 6,
              overflow: "auto", maxHeight: 100, marginBottom: 12, whiteSpace: "pre-wrap"
            }}>
              {String((this.state.error && this.state.error.message) || this.state.error || "")}
            </pre>
            <button className="clb-auth__btn" onClick={() => window.location.reload()}>Reload</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
