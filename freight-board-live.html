<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#1d2d3d"/>
<title>Freight Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f3;--text:#1d1f20;--muted:#5d5d60;--faint:#7a7a7d;--ghost:#98989b;
  --line:rgba(29,31,32,.22);--line-soft:rgba(29,31,32,.10);
  --accent:#5980a6;--accent-100:#eef6ff;--accent-200:#d6ebff;--accent-400:#94bce3;
  --accent-700:#416180;--accent-800:#2c455d;--accent-900:#1d2d3d;
  --h:'Barlow Condensed',system-ui,sans-serif;--b:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--b);overscroll-behavior-y:none}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(89,128,166,.25)}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* corner registration marks */
.bp{position:relative}
.bp>i{position:absolute;font:400 10px/1 monospace;color:var(--accent);font-style:normal}
.bp>i.tl{left:-4px;top:-6px}.bp>i.tr{right:-4px;top:-6px}
.bp>i.bl{left:-4px;bottom:-6px}.bp>i.br{right:-4px;bottom:-6px}

/* header */
.hdr{background:var(--accent-900);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;flex-shrink:0}
.hdr-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hdr-title{font:600 22px/1 var(--h);letter-spacing:.02em;text-transform:uppercase}
.hdr-sub{margin-top:3px;font:400 11px/1 var(--b);color:rgba(255,255,255,.5)}
.sync{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;height:30px;padding:0 10px;border-radius:2px;font:600 10px/1 var(--b);letter-spacing:.1em;text-transform:uppercase}
.sync.err{border-color:#94bce3;color:#d6ebff}
.weeks{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.week{flex-shrink:0;height:28px;padding:0 12px;border:1px solid rgba(255,255,255,.22);background:transparent;color:rgba(255,255,255,.7);font:600 10px/1 var(--b);letter-spacing:.1em;text-transform:uppercase;border-radius:2px}
.week.on{background:var(--accent);border-color:var(--accent-400);color:#fff}

/* scroll body */
#main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* totals + sheet switch */
.totals{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid rgba(29,31,32,.16)}
.tot{padding:12px 4px;text-align:center;border-right:1px solid var(--line-soft)}
.tot-v{font:600 19px/1 var(--h)}
.tot-l{margin-top:4px;font:600 8.5px/1 var(--b);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sheets{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid rgba(29,31,32,.16)}
.sheet{height:36px;border:none;border-right:1px solid var(--line-soft);background:transparent;color:var(--muted);font:600 10px/1 var(--b);letter-spacing:.1em;text-transform:uppercase}
.sheet.on{background:var(--accent-900);color:#fff}

.sec{display:flex;align-items:center;gap:8px;padding:18px 16px 8px}
.sec-l{font:600 11px/1 var(--b);letter-spacing:.14em;text-transform:uppercase}
.sec-rule{flex:1;height:1px;background:rgba(29,31,32,.16)}
.sec-c{font:600 11px/1 var(--b);color:var(--faint)}

/* trailer card */
.card{margin:0 16px 12px;border:1px solid var(--line);background:transparent}
.card:active{border-color:var(--accent)}
.card-hdr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(29,31,32,.14)}
.tr-tag{font:600 11px/1 var(--b);letter-spacing:.06em;color:#fff;background:var(--accent-900);padding:5px 7px;white-space:nowrap}
.drv{font:600 15px/1.15 var(--h);letter-spacing:.02em;text-transform:uppercase}
.drv.none{color:var(--accent-700)}
.rig{margin-top:2px;font:400 11px/1 var(--b);color:var(--faint)}
.metrics{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line-soft);background:#f5f5f8}
.metrics span{font:400 10.5px/1 var(--b);color:var(--muted)}
.live{display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid var(--line-soft);font:500 11px/1 var(--b);color:var(--accent-700)}
.load{padding:10px 12px;border-bottom:1px solid rgba(29,31,32,.08)}
.stop-k{font:600 9px/1 var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.lane{display:grid;grid-template-columns:14px 1fr;gap:0 8px;align-items:start}
.rail{display:flex;flex-direction:column;align-items:center;padding-top:5px}
.rail .a{width:7px;height:7px;border:1px solid var(--text)}
.rail .b{width:1px;flex:1;min-height:22px;background:rgba(29,31,32,.3)}
.rail .c{width:7px;height:7px;background:var(--accent)}
.city{font:600 14px/1.2 var(--h);letter-spacing:.02em;text-transform:uppercase}
.when{font:400 10px/1.4 var(--b);color:var(--faint)}
.freight{margin-top:8px;font:400 11px/1.4 var(--b);color:var(--muted)}
.localdrv{margin-top:3px;font:400 10px/1.4 var(--b);color:var(--ghost)}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.pill{font:500 10px/1 var(--b);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border:1px solid rgba(29,31,32,.2);color:var(--muted)}
.pill.num{border-color:rgba(89,128,166,.45);color:var(--accent-700);background:var(--accent-100);text-transform:none}
.pill.ok{border-color:var(--accent-400);background:var(--accent-100);color:var(--accent-800)}
.pill.rate{border:none;margin-left:auto}
.tag{font:600 9.5px/1 var(--b);letter-spacing:.12em;text-transform:uppercase;padding:5px 7px;white-space:nowrap;border:1px solid rgba(29,31,32,.28);color:var(--muted)}
.tag.solid{background:var(--accent);color:#fff;border:none}
.tag.soft{background:var(--accent-200);color:var(--accent-900);border-color:var(--accent-400)}
.tag.warn{color:#fff;border:none;background:repeating-linear-gradient(135deg,var(--accent-800),var(--accent-800) 3px,rgba(65,97,128,.19) 3px,rgba(65,97,128,.19) 6px)}
.rpm{font:600 10px/1 var(--b);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border:1px solid rgba(29,31,32,.2);color:var(--faint)}
.rpm.good{background:var(--accent);color:#fff;border:none}
.rpm.mid{border-color:var(--accent-400);background:var(--accent-100);color:var(--accent-800)}
.rpm.bad{color:#fff;border:none;background:repeating-linear-gradient(135deg,var(--accent-800),var(--accent-800) 3px,rgba(65,97,128,.19) 3px,rgba(65,97,128,.19) 6px)}

/* rows (local / crossdock / accessorial) */
.row{margin:16px 16px 0;border:1px solid var(--line);padding:11px 12px}
.row-t{display:flex;align-items:baseline;gap:8px}
.row-title{font:600 16px/1.1 var(--h);letter-spacing:.02em;text-transform:uppercase;flex:1}
.row-when{font:400 11px/1 var(--b);color:var(--faint)}
.row-meta{margin-top:6px;font:400 11.5px/1.5 var(--b);color:var(--muted)}

/* search */
.searchwrap{padding:14px 16px 10px;border-bottom:1px solid rgba(29,31,32,.14)}
.searchbox{display:flex;align-items:center;gap:8px;border:1px solid rgba(29,31,32,.28);height:44px;padding:0 10px}
.searchbox input{flex:1;border:none;background:transparent;font-size:15px;outline:none}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:28px;padding:0 10px;border:1px solid rgba(29,31,32,.24);background:transparent;color:var(--muted);font:600 10px/1 var(--b);letter-spacing:.08em;text-transform:uppercase;border-radius:2px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.barline{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.barline .l{font:600 10px/1 var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.linkbtn{border:none;background:transparent;font:600 10px/1 var(--b);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-700)}
.res{margin:0 16px 10px;border:1px solid var(--line);padding:11px 12px}
.res-t{display:flex;align-items:center;gap:8px}
.res-lane{font:600 14px/1.1 var(--h);letter-spacing:.02em;text-transform:uppercase;flex:1}

/* alerts */
.alert{padding:14px 16px;border-bottom:1px solid rgba(29,31,32,.12);display:flex;gap:10px;align-items:flex-start}
.alert.unread{background:var(--accent-100)}
.dot{width:8px;height:8px;margin-top:4px;flex-shrink:0;border:1px solid var(--accent);background:var(--accent)}
.alert.read .dot{background:transparent;border-color:rgba(29,31,32,.3)}
.a-kind{font:600 12px/1 var(--b);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.a-kind.hi{color:var(--accent-800)}
.a-time{margin-left:auto;font:400 10px/1 var(--b);color:var(--ghost)}
.a-title{margin-top:5px;font:600 15px/1.15 var(--h);letter-spacing:.02em;text-transform:uppercase}
.a-body{margin-top:3px;font:400 12px/1.45 var(--b);color:var(--muted)}

/* detail */
.dhead{padding:14px 16px 12px;border-bottom:1px solid rgba(29,31,32,.14)}
.back{display:flex;align-items:center;gap:6px;border:none;background:transparent;font:600 10px/1 var(--b);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-700);padding:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;border:1px solid rgba(29,31,32,.16)}
.stat{padding:9px 4px;text-align:center;border-right:1px solid var(--line-soft)}
.stat-v{font:600 16px/1 var(--h)}
.stat-l{margin-top:4px;font:600 8px/1 var(--b);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.stops{padding:0 16px}
.stoprow{display:grid;grid-template-columns:16px 1fr;gap:0 12px}
.stopmark{width:9px;height:9px;margin-top:3px;border:1px solid var(--text)}
.stopmark.del{background:var(--accent);border:none}
.stopline{width:1px;flex:1;background:rgba(29,31,32,.25)}

/* tab bar */
.tabs{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(29,31,32,.18);background:var(--bg);padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 6px;border:none;background:transparent;color:var(--ghost);border-top:2px solid transparent;margin-top:-1px;font:600 9px/1 var(--b);letter-spacing:.1em;text-transform:uppercase}
.tab.on{color:var(--accent-900);border-top-color:var(--accent)}
.badge{position:absolute;transform:translate(12px,-4px);background:var(--accent);color:#fff;font:600 9px/1 var(--b);padding:2px 4px}

/* gate */
.gate{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:60px 28px calc(env(safe-area-inset-bottom) + 28px)}
.mark{width:56px;height:56px;border:1px solid var(--text);display:flex;align-items:center;justify-content:center;margin-bottom:28px}
.gate h1{font:600 40px/.95 var(--h);letter-spacing:-.01em;text-transform:uppercase}
.gate p{margin-top:10px;font:400 14px/1.5 var(--b);color:var(--muted);max-width:260px}
.field{display:flex;flex-direction:column;gap:5px;margin-top:16px}
.field span{font:600 10px/1 var(--b);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input{height:46px;border:1px solid rgba(29,31,32,.28);background:transparent;border-radius:2px;padding:0 12px;font-size:16px}
.primary{position:relative;height:52px;border:none;background:var(--accent);color:#fff;font:600 15px/1 var(--b);letter-spacing:.08em;text-transform:uppercase;border-radius:2px;width:100%}
.primary:active{background:var(--accent-700)}
.primary>i{position:absolute;font:400 10px/1 monospace;color:rgba(255,255,255,.6);font-style:normal}
.primary>i.tl{left:5px;top:3px}.primary>i.tr{right:5px;top:3px}
.primary>i.bl{left:5px;bottom:3px}.primary>i.br{right:5px;bottom:3px}
.ghostbtn{height:44px;border:1px solid rgba(29,31,32,.28);background:transparent;font:600 12px/1 var(--b);letter-spacing:.1em;text-transform:uppercase;width:100%}
.empty{text-align:center;padding:56px 32px}
.empty-t{font:600 15px/1.2 var(--h);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty-s{margin-top:6px;font:400 12px/1.5 var(--b);color:var(--ghost)}
.foot{text-align:center;padding:20px 16px 28px;font:400 10px/1 var(--b);letter-spacing:.1em;text-transform:uppercase;color:var(--ghost)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ────────────────────────────────────────────────────────────────
   Freight Board — mobile viewer
   Reads the same Apps Script endpoint as board.html / mobile-board.html.
   Override the deployment with localStorage "fcbv2_sheetsUrl"; a private
   deployment token goes in "fcbv2_sheetsToken".
   ──────────────────────────────────────────────────────────────── */
var SHEETS_URL = localStorage.getItem("fcbv2_sheetsUrl") ||
  "https://script.google.com/macros/s/AKfycbwvzKkQR2jRUL6-pPHET8JxUbPgVgGdRMs3BjmKyCrsNgHqo3GhUTUUw-qky61e-FQfqQ/exec";
var RPM_MIN = parseFloat(localStorage.getItem("fcbv2_rpmMin") || "2.5");
var HUB = "Romeoville, IL";
var STATUS_HIDE_PILL = {Yard:1, Dock:1, Loaded:1, Delivered:1};
var GROUP_ORDER = ["In Transit","Loaded","Driver assigned","Pending","Issue","Delivered"];
var FILTERS = ["Need to pickup","Dispatched","Dock","Yard","Loaded","Delivered","No driver","Multi-stop"];

var S = {
  view: localStorage.getItem("fcbv2_dispatcher") ? "app" : "gate",
  tab: "board", sheet: "otr", week: 0, sel: null,
  q: "", filters: [], read: JSON.parse(localStorage.getItem("fcbv2_readAlerts") || "[]"),
  weeks: [], live: {}, sync: "loading", lastSync: "", who: localStorage.getItem("fcbv2_dispatcher") || ""
};

/* ── data helpers ─────────────────────────────────────────────── */
function parseSR(sr){ var p = String(sr || "").split(" - "); return {s:(p[0]||"").trim(), r:(p[1]||"").trim()}; }
function brokerOf(b){ return b ? String(b).split("&")[0].trim() : ""; }
function loadNumOf(l){ if (l.loadNum) return l.loadNum; var b = l.broker || ""; return b.indexOf("&") >= 0 ? (b.split("&")[1] || "").trim() : ""; }
function money(n){ n = parseFloat(n) || 0; return "$" + n.toLocaleString(undefined, {maximumFractionDigits:0}); }
function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmtWeight(w){
  if (w == null || w === "") return "";
  var s = String(w).trim();
  if (/[a-z]/i.test(s)) return s;
  var n = parseFloat(s.replace(/,/g, ""));
  return isNaN(n) ? s : n.toLocaleString() + " lb";
}
function freightLine(l){
  return [l.product, l.pallets ? l.pallets + " pallets" : "", fmtWeight(l.weight)].filter(Boolean).join(" · ");
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function groupLabel(g){
  if (g.groupTrailer) return "Trailer " + g.groupTrailer;
  var l = (g.loads || [])[0] || {}, sr = parseSR(l.sr), n = loadNumOf(l);
  if (sr.r) return (sr.s || HUB) + " → " + sr.r;
  return n ? "Load #" + n : "Unidentified trailer";
}
function groupGross(g){ return (g.loads || []).reduce(function(a,l){ return a + num(l.rate); }, 0); }
function groupLocal(g){ return (g.loads || []).reduce(function(a,l){ return a + num(l.manualLocalCharge); }, 0); }
function groupMiles(g){ return num(g.tripMiles) || null; }
function groupRpm(g){
  var mi = groupMiles(g);
  if (!mi) return null;
  return +((groupGross(g) - groupLocal(g)) / mi).toFixed(2);
}
function rpmClass(v){ return v == null ? "" : v >= 3 ? " good" : v < RPM_MIN ? " bad" : " mid"; }
function statusTag(st){
  if (!st) return "tag";
  if (st === "Pending" || st === "Need to pickup" || st === "Issue") return "tag warn";
  if (st === "In Transit" || st === "Dispatched") return "tag solid";
  if (st === "Delivered" || st === "Loaded" || st === "Approved") return "tag soft";
  return "tag";
}
function week(){ return S.weeks[S.week] || {label:"", groups:[], localDeliveries:[], crossdockDrops:[], accessorials:[]}; }
function groups(){ return (week().groups || []).filter(function(g){ return (g.loads || []).length; }); }
function liveFor(g){
  var t = S.live[String(g.groupTruck || "").trim()];
  if (!t || !t.address || STATUS_HIDE_PILL[g.groupStatus]) return "";
  return "Truck " + g.groupTruck + " · " + shortAddr(t.address) + (t.ago ? " · " + t.ago : "");
}
function shortAddr(a){
  var parts = String(a).split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  if (parts.length && /^(USA|United States|US)$/i.test(parts[parts.length-1])) parts.pop();
  for (var i = parts.length - 1; i >= 0; i--){
    var m = parts[i].match(/^([A-Z]{2})\b/);
    if (m) return (i >= 1 && !/^\d|\b(St|Rd|Ave|Blvd|Hwy|Pkwy|Dr|Ln|Way)\b/i.test(parts[i-1]) ? parts[i-1] + ", " : "") + m[1];
  }
  return parts[0] || "";
}
function ago(ts){
  if (!ts) return "";
  var m = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  if (isNaN(m)) return "";
  return m < 1 ? "just now" : m < 60 ? m + " min ago" : Math.round(m/60) + " h ago";
}

/* ── fetch ────────────────────────────────────────────────────── */
function pull(){
  S.sync = "loading"; paint();
  var headers = {};
  var token = localStorage.getItem("fcbv2_sheetsToken") || "";
  if (token) headers["X-App-Token"] = token;
  var url = (localStorage.getItem("fcbv2_sheetsUrl") || SHEETS_URL);
  fetch(url + (url.indexOf("?") >= 0 ? "&" : "?") + "role=viewer", {redirect:"follow", headers:headers})
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(d){
      var w = Array.isArray(d) ? d : (d.weeks || []);
      S.weeks = w;
      if (S.week >= w.length) S.week = Math.max(0, w.length - 1);
      S.sync = w.length ? "ok" : "empty";
      S.lastSync = new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
      try { localStorage.setItem("fcbv2_cache", JSON.stringify(w)); } catch(e){}
      paint();
    })
    .catch(function(){
      var c = localStorage.getItem("fcbv2_cache");
      if (c && !S.weeks.length) { try { S.weeks = JSON.parse(c); } catch(e){} }
      S.sync = "err"; paint();
    });
  fetch(url + (url.indexOf("?") >= 0 ? "&" : "?") + "action=samsaraLocations", {redirect:"follow"})
    .then(function(r){ return r.json(); })
    .then(function(j){
      var raw = j && (j.trucks || j), map = {};
      if (Array.isArray(raw)){
        raw.forEach(function(t){
          var key = String((t && (t.number || t.name)) || "").trim();
          if (!key) return;
          t.ago = ago(t.asOf);
          map[key] = t;
        });
      } else if (raw && typeof raw === "object"){
        Object.keys(raw).forEach(function(k){ if (raw[k]){ raw[k].ago = ago(raw[k].asOf); map[String(k).trim()] = raw[k]; } });
      }
      S.live = map; paint();
    })
    .catch(function(){});
}

/* ── derived: alerts ──────────────────────────────────────────── */
function alerts(){
  var out = [];
  groups().forEach(function(g){
    var tr = g.groupTrailer || "—";
    if (!g.groupDriver) out.push({id:"nd" + (g.groupTrailer || (g.loads[0] && loadNumOf(g.loads[0])) || tr), kind:"Exception", hi:true,
      title:groupLabel(g) + " · no OTR driver",
      body:((g.loads[0] && parseSR(g.loads[0].sr).r) || "") + " · " + money(groupGross(g)) + (groupMiles(g) ? " over " + groupMiles(g) + " mi" : "")});
    var rpm = groupRpm(g);
    if (rpm != null && rpm < RPM_MIN) out.push({id:"rpm" + tr, kind:"RPM", hi:true,
      title:groupLabel(g) + " below " + RPM_MIN.toFixed(2),
      body:(g.groupDriver || "Unassigned") + " · " + money(groupGross(g)) + " over " + groupMiles(g) + " mi · RPM " + rpm.toFixed(2)});
  });
  // Live positions live on the cards; alert only when a rolling truck's fix has gone stale.
  var seen = {};
  groups().forEach(function(g){
    var t = String(g.groupTruck || "").trim(), tk = S.live[t];
    if (!t || seen[t] || !tk || !tk.address || STATUS_HIDE_PILL[g.groupStatus]) return;
    var mins = tk.asOf ? Math.round((Date.now() - new Date(tk.asOf).getTime()) / 60000) : null;
    if (mins == null || mins < 180) return;
    seen[t] = 1;
    out.push({id:"stale" + t + (tk.asOf || ""), kind:"Location", hi:true,
      title:"Truck " + t + " · no fix in " + Math.round(mins/60) + " h",
      body:(g.groupDriver || "Unassigned") + " · last seen " + shortAddr(tk.address) + (tk.ago ? " · " + tk.ago : "")});
  });
  out.push({id:"sync" + S.lastSync, kind:"Sync", title:"Sheet sync " + (S.sync === "ok" ? "complete" : "failed"),
    body:S.sync === "ok" ? groups().length + " trailers, " + groups().reduce(function(a,g){ return a + g.loads.length; }, 0) + " loads updated." : "Could not reach the dispatch sheet. Showing the last cached board."});
  return out;
}

/* ── render ───────────────────────────────────────────────────── */
function bp(){ return '<i class="tl">+</i><i class="tr">+</i><i class="bl">+</i><i class="br">+</i>'; }
var ICON = {
  board:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  alerts:'<path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 01-3.4 0"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="3"/>',

function svg(k, size){ return '<svg width="' + (size||21) + '" height="' + (size||21) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + ICON[k] + '</svg>'; }

function loadHtml(g, l, i){
  var sr = parseSR(l.sr), n = loadNumOf(l), rolling = g.groupStatus === "In Transit" || g.groupStatus === "Delivered";
  var localDrv = (l.driver || "").trim();

  return '<div class="load">' +
    (g.loads.length > 1 ? '<div class="stop-k">Stop ' + (i+1) + ' of ' + g.loads.length + '</div>' : '') +
    '<div class="lane"><div class="rail"><span class="a"></span><span class="b"></span><span class="c"></span></div><div>' +
      '<div class="city">' + esc(sr.s || HUB) + '</div>' +
      (l.pickup ? '<div class="when">PU ' + esc(l.pickup) + '</div>' : '') +
      '<div class="city" style="margin-top:8px">' + esc(sr.r) + '</div>' +
      (l.delivery ? '<div class="when">DEL ' + esc(l.delivery) + '</div>' : '') +
    '</div></div>' +
    (lineHtml ? '<div class="freight">' + esc(lineHtml) + '</div>' : '') +
    (localDrv && !rolling ? '<div class="localdrv">Local pickup: ' + esc(localDrv) + (l.truck ? " · truck #" + esc(l.truck) : "") + '</div>' : '') +
    '<div class="pills">' +
      (brokerOf(l.broker) ? '<span class="pill">' + esc(brokerOf(l.broker)) + '</span>' : '') +

      (l.status ? '<span class="pill' + (l.status === "Delivered" || l.status === "Loaded" ? " ok" : "") + '">' + esc(l.status) + '</span>' : '') +
      (num(l.rate) ? '<span class="pill rate">' + money(l.rate) + '</span>' : '') +
    '</div></div>';
}

function cardHtml(g, idx){
  var rpm = groupRpm(g), mi = groupMiles(g), lv = liveFor(g);
  return '<div class="card bp" data-open="' + idx + '">' + bp() +
    '<div class="card-hdr">' +
      '<span class="tr-tag">TR ' + esc(g.groupTrailer || "—") + '</span>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="drv' + (g.groupDriver ? '' : ' none') + '">' + esc(g.groupDriver || "No OTR driver") + '</div>' +
        '<div class="rig">' + (g.groupDriver ? "OTR · Truck #" + esc(g.groupTruck || "—") : "OTR unassigned") + ' · ' + g.loads.length + ' stop' + (g.loads.length > 1 ? 's' : '') + '</div>' +
      '</div>' +

    '</div>' +

function boardHtml(){
  var gs = groups(), all = gs.reduce(function(a,g){ return a.concat(g.loads); }, []);
  var gross = all.reduce(function(a,l){ return a + num(l.rate); }, 0);
  var h = '<div class="totals">' + [
    ["Trailers", gs.length], ["Loads", all.length],
    ["Rolling", gs.filter(function(g){ return g.groupStatus === "In Transit"; }).length],
    ["Done", gs.filter(function(g){ return g.groupStatus === "Delivered"; }).length],
    ["Gross", "$" + (gross/1000).toFixed(1) + "k"]
  ].map(function(t){ return '<div class="tot"><div class="tot-v">' + t[1] + '</div><div class="tot-l">' + t[0] + '</div></div>'; }).join("") + '</div>';

  h += '<div class="sheets">' + [["otr","OTR"],["local","Local"],["xdock","Crossdock"],["acc","Access."]]
    .map(function(s){ return '<button class="sheet' + (S.sheet === s[0] ? " on" : "") + '" data-sheet="' + s[0] + '">' + s[1] + '</button>'; }).join("") + '</div>';

  if (S.sheet === "otr"){
    var any = false;
    GROUP_ORDER.forEach(function(st){
      var list = gs.filter(function(g){ return (g.groupStatus || "Pending") === st; });
      if (!list.length) return;
      any = true;
      h += '<div class="sec"><span class="sec-l">' + st + '</span><span class="sec-rule"></span><span class="sec-c">' + list.length + '</span></div>';

    var rest = gs.filter(function(g){ return GROUP_ORDER.indexOf(g.groupStatus || "Pending") < 0; });
    if (rest.length){
      any = true;

      rest.forEach(function(g){ h += cardHtml(g, gs.indexOf(g)); });
    }
    if (!any) h += emptyHtml("No trailers this week", "Loads entered on the desk board appear here.");
  } else {
    var w = week(), rows = [];
    if (S.sheet === "local") rows = (w.localDeliveries || []).map(function(r){
      return {title:r.destination || "—", when:r.datetime || "", status:r.status,
        meta:[r.driver, r.truck ? "Truck #" + r.truck : "", r.trailer ? "Trailer #" + r.trailer : "", r.broker, r.loadNum ? "#" + r.loadNum : ""].filter(Boolean).join(" · "), tag:"Local delivery"};
    });
    if (S.sheet === "xdock") rows = (w.crossdockDrops || []).map(function(r){
      return {title:r.location || "—", when:r.datetime || "", status:r.status,
        meta:[r.driver, r.truck ? "Truck #" + r.truck : "", r.trailer ? "Trailer #" + r.trailer : "", r.broker, r.loadNum ? "#" + r.loadNum : ""].filter(Boolean).join(" · "), tag:"Crossdock drop"};
    });
    if (S.sheet === "acc") rows = (w.accessorials || []).map(function(r){
      return {title:(r.type || "Accessorial") + " · " + money(r.amount), when:[r.broker, r.loadNum ? "#" + r.loadNum : ""].filter(Boolean).join(" "),
        status:r.status, meta:r.notes || "", tag:"Accessorial"};
    });
    h += rows.length ? rows.map(function(r){
      return '<div class="row bp">' + bp() +
        '<div class="row-t"><span class="row-title">' + esc(r.title) + '</span><span class="row-when">' + esc(r.when) + '</span></div>' +
        (r.meta ? '<div class="row-meta">' + esc(r.meta) + '</div>' : '') +
        '<div class="pills">' + (r.status ? '<span class="pill' + (r.status === "Delivered" || r.status === "Loaded" ? " ok" : "") + '">' + esc(r.status) + '</span>' : '') +
        '<span class="pill">' + r.tag + '</span></div></div>';
    }).join("") : emptyHtml("Nothing on this sheet", "This week has no rows here yet.");
  }
  h += '<div class="foot">' + (S.lastSync ? "Sheet sync " + S.lastSync + " · auto every 60s" : "Waiting for the dispatch sheet") + '</div>';
  return h;

function emptyHtml(t, s){ return '<div class="empty"><div class="empty-t">' + t + '</div><div class="empty-s">' + s + '</div></div>'; }

function searchHtml(){
  var q = S.q.trim().toLowerCase(), gs = groups(), res = [];
  gs.forEach(function(g){
    g.loads.forEach(function(l){
      var n = loadNumOf(l);
      var hay = [g.groupDriver, g.groupTrailer, g.groupTruck, l.sr, l.broker, n, l.product, l.driver].join(" ").toLowerCase();
      if (q && hay.indexOf(q) < 0) return;
      if (S.filters.length){
        var ok = S.filters.some(function(f){
          return f === "No driver" ? !g.groupDriver : f === "Multi-stop" ? g.loads.length > 1 : (l.status === f || g.groupStatus === f);
        });
        if (!ok) return;
      }
      var sr = parseSR(l.sr);
      res.push({idx:gs.indexOf(g), tr:g.groupTrailer, lane:(sr.s || HUB) + " → " + sr.r, rate:money(l.rate),
        meta:[(g.groupDriver || "No OTR driver"), brokerOf(l.broker) + (n ? " #" + n : ""), l.status, l.pickup ? "PU " + l.pickup : ""].filter(Boolean).join(" · ")});
    });
  });
  var h = '<div class="searchwrap"><div class="searchbox">' + svg("search", 15) +
    '<input id="q" type="text" value="' + esc(S.q) + '" placeholder="Loads, cities, drivers, load #" autocomplete="off" autocorrect="off" spellcheck="false">' +
    (S.q ? '<button class="linkbtn" data-clearq="1" style="font-size:16px">×</button>' : '') + '</div>' +
    '<div class="chips">' + FILTERS.map(function(f){

    }).join("") + '</div></div>' +
    '<div class="barline"><span class="l">' + res.length + ' load' + (res.length === 1 ? '' : 's') + '</span><button class="linkbtn" data-reset="1">Reset</button></div>';

      '<div class="row-meta">' + esc(r.meta) + '</div></div>';

function paint(){
  var app = document.getElementById("app");
  if (S.view === "gate"){ app.innerHTML = gateHtml(); return; }
  var titles = {board:"Freight Board", search:"Search", alerts:"Alerts", profile:"Dispatcher"};
  var gs = groups();
  var sub = S.sel != null ? ((gs[S.sel] && gs[S.sel].loads.length) || 0) + " loads"
    : S.tab === "board" ? (week().label || "This week") + " · " + gs.length + " trailers"
    : S.tab === "alerts" ? alerts().filter(function(a){ return S.read.indexOf(a.id) < 0; }).length + " unread"
    : S.tab === "search" ? "All open loads" : "Romeoville, IL";
  var syncLabel = S.sync === "loading" ? "Syncing" : S.sync === "err" ? "Offline" : S.sync === "empty" ? "No data" : "Live";
  var unread = alerts().filter(function(a){ return S.read.indexOf(a.id) < 0; }).length;

  var h = '<div class="hdr"><div class="hdr-row"><div>' +
    '<div class="hdr-title">' + (S.sel != null ? "Trailer " + esc((gs[S.sel] || {}).groupTrailer || "") : titles[S.tab]) + '</div>' +
    '<div class="hdr-sub">' + esc(sub) + '</div></div>' +
    '<button class="sync' + (S.sync === "err" ? " err" : "") + '" data-refresh="1">' + svg("refresh", 13) + syncLabel + '</button></div>';
  if (S.tab === "board" && S.sel == null && S.weeks.length > 1){
    h += '<div class="weeks">' + S.weeks.map(function(w, i){
      return '<button class="week' + (S.week === i ? " on" : "") + '" data-week="' + i + '">' + esc(w.label || ("Week " + (i+1))) + '</button>';
    }).join("") + '</div>';
  }
  h += '</div><div id="main">';
  h += S.sel != null ? detailHtml()
    : S.tab === "board" ? (S.weeks.length ? boardHtml() : emptyHtml(S.sync === "err" ? "Cannot reach the sheet" : "Loading the board", S.sync === "err" ? "Check the connection, then hit the sync button." : "Pulling this week from the dispatch sheet."))
    : S.tab === "search" ? searchHtml()
    : S.tab === "alerts" ? alertsHtml() : profileHtml();
  h += '</div><div class="tabs">' + [["board","Board"],["search","Search"],["alerts","Alerts"],["profile","Me"]].map(function(t){
    return '<button class="tab' + (S.tab === t[0] && S.sel == null ? " on" : "") + '" data-tab="' + t[0] + '">' +
      '<span style="position:relative">' + svg(t[0] === "profile" ? "profile" : t[0]) +
      (t[0] === "alerts" && unread ? '<span class="badge">' + unread + '</span>' : '') + '</span>' + t[1] + '</button>';
  }).join("") + '</div>';
  app.innerHTML = h;
}

/* ── events ───────────────────────────────────────────────────── */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-tab],[data-sheet],[data-week],[data-open],[data-back],[data-refresh],[data-chip],[data-reset],[data-clearq],[data-alert],[data-markall],[data-enter],[data-signout],[data-seturl]");
  if (!t) return;
  var d = t.dataset;
  if (d.enter != null){
    var who = (document.getElementById("who") || {}).value || "";
    var tok = (document.getElementById("tok") || {}).value || "";
    if (!who.trim()) return;
    localStorage.setItem("fcbv2_dispatcher", who.trim());
    if (tok) localStorage.setItem("fcbv2_sheetsToken", tok);
    S.who = who.trim(); S.view = "app"; paint(); pull(); return;
  }
  if (d.signout != null){ localStorage.removeItem("fcbv2_dispatcher"); S.view = "gate"; S.who = ""; paint(); return; }
  if (d.seturl != null){
    var u = prompt("Apps Script deployment URL", localStorage.getItem("fcbv2_sheetsUrl") || SHEETS_URL);
    if (u){ localStorage.setItem("fcbv2_sheetsUrl", u.trim()); pull(); }
    return;
  }
  if (d.tab){ S.tab = d.tab; S.sel = null; paint(); return; }
  if (d.sheet){ S.sheet = d.sheet; paint(); return; }
  if (d.week){ S.week = +d.week; paint(); return; }
  if (d.open != null){ S.sel = +d.open; paint(); document.getElementById("main").scrollTop = 0; return; }
  if (d.back != null){ S.sel = null; paint(); return; }
  if (d.refresh != null){ pull(); return; }
  if (d.chip){
    var i = S.filters.indexOf(d.chip);
    if (i >= 0) S.filters.splice(i, 1); else S.filters.push(d.chip);
    paint(); return;
  }
  if (d.reset != null){ S.filters = []; S.q = ""; paint(); return; }
  if (d.clearq != null){ S.q = ""; paint(); return; }
  if (d.alert){ if (S.read.indexOf(d.alert) < 0){ S.read.push(d.alert); localStorage.setItem("fcbv2_readAlerts", JSON.stringify(S.read)); paint(); } return; }
  if (d.markall != null){ S.read = alerts().map(function(a){ return a.id; }); localStorage.setItem("fcbv2_readAlerts", JSON.stringify(S.read)); paint(); return; }
});

document.addEventListener("input", function(e){
  if (e.target.id === "q"){
    S.q = e.target.value;
    var pos = e.target.selectionStart;
    paint();
    var el = document.getElementById("q");
    if (el){ el.focus(); try { el.setSelectionRange(pos, pos); } catch(err){} }
  }
});

var cached = localStorage.getItem("fcbv2_cache");
if (cached){ try { S.weeks = JSON.parse(cached) || []; } catch(e){} }
paint();
if (S.view === "app") pull();
setInterval(function(){ if (S.view === "app" && document.visibilityState === "visible") pull(); }, 60000);
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible" && S.view === "app") pull(); });
</script>
</body>
</html>
